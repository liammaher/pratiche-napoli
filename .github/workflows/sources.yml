name: Sources

# Every night, re-fetch the official pages and forms the procedures cite and
# keep one issue listing what changed or stopped answering; close it when
# everything is back as recorded. A run that couldn't reach most addresses
# fails instead, leaving the issue as it is.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time, so two runs can't each open an issue.
concurrency:
  group: sources
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check sources
        run: npm run -s check:sources -- --out report.md

      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Fonti da ricontrollare
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -s report.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file report.md
            else
              gh issue create --title "$TITLE" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Al controllo di oggi nessun modulo è cambiato e tutte le pagine controllate rispondono (quelle con un certificato che il controllo non riesce a verificare restano da guardare a mano)."
          fi
