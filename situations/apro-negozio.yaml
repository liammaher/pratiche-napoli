schema_version: 0
id: apro-negozio
headline: "Aprire un negozio a Napoli: tutte le pratiche"
aka: [aprire un negozio, licenza commerciale, aprire un'attività commerciale]
updated: 2026-10-26
intro: >-
  Le pratiche che può incontrare chi apre a Napoli un negozio di vicinato come ditta
  individuale. Alcune riguardano solo i negozi di alimenti o certe attività: ogni pratica dice
  a chi si applica. Scadenze e fonti sono nelle pagine delle singole pratiche.
steps:
  - procedure: napoli/camera-di-commercio/iscrizione-impresa-individuale-comunica
    when: Iscrivere la ditta al Registro Imprese della Camera di Commercio, aprendo anche la partita IVA
  - procedure: italia/inps/iscrizione-gestione-artigiani-commercianti
    when: L'iscrizione all'INPS come commerciante e i contributi
  - procedure: italia/inail/autoliquidazione
    when: L'assicurazione INAIL e il premio di ogni anno, per chi deve averla
  - procedure: napoli/camera-di-commercio/pec-domicilio-digitale-impresa
    when: La PEC dell'impresa
  - procedure: napoli/comune/scia-esercizio-vicinato
    when: La SCIA al Comune per aprire il negozio
  - procedure: napoli/comune/subingresso-attivita-commerciale
    when: Se rilevi un negozio già avviato, il subingresso al posto della nuova apertura
  - procedure: napoli/asl-napoli-1/registrazione-attivita-alimentare
    when: Solo per i negozi di alimenti, la registrazione sanitaria
  - procedure: napoli/asl-napoli-1/attestato-alimentarista
    when: Solo per chi lavora con gli alimenti, la formazione (l'ex libretto sanitario)
  - procedure: napoli/vigili-del-fuoco/scia-prevenzione-incendi
    when: La prevenzione incendi, se il negozio è tra le attività soggette
  - procedure: napoli/comune/insegna-esercizio
    when: L'insegna
  - procedure: napoli/comune/tari-iscrizione-non-domestica
    when: La TARI del negozio
  - procedure: napoli/camera-di-commercio/diritto-annuale
    when: Il diritto annuale alla Camera di Commercio, ogni anno
