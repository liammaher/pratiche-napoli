schema_version: 0
id: sue-napoli-adempimenti
title: "SUE di Napoli: gli adempimenti su un titolo edilizio già presentato (inizio e fine lavori, agibilità, proroghe, volture, direttore dei lavori, impresa)"
updated: 2026-11-04
intro: >-
  Da che cosa si presenta su un titolo edilizio già presentato o rilasciato (una CILA, una SCIA, un
  permesso di costruire) alla pratica dello Sportello Unico per l'Edilizia di Napoli: la
  comunicazione di inizio o di fine lavori, la segnalazione di agibilità, la proroga dei termini
  (ordinaria, dell'art. 15 DPR 380/2001, o straordinaria, dell'art. 10-septies D.L. 21/2022), la
  voltura o il cambio d'intestazione, il nuovo direttore dei lavori, l'impresa esecutrice, la
  dichiarazione di avvenuto utilizzo delle terre e rocce da scavo. Con la proroga dei termini la
  pratica porta ciò che tiene efficace l'autorizzazione paesaggistica dei lavori (la sua proroga,
  il suo rinnovo o una nuova autorizzazione); con l'inizio dei lavori di un permesso la
  dichiarazione di utilizzo delle terre e rocce, se non è andata con il permesso; con la fine dei
  lavori o l'agibilità la dichiarazione di avvenuto utilizzo, se l'utilizzo è finito. Il titolo
  per nuovi lavori è nella tabella sue-napoli. I casi che la libreria non copre sono rifiutati,
  con il motivo.
facts:
  adempimento:
    type: choice
    question: "Che cosa si presenta sul titolo edilizio già presentato o rilasciato?"
    values:
      inizio_lavori: "La comunicazione di inizio dei lavori"
      fine_lavori: "La comunicazione di fine dei lavori"
      agibilita: "La segnalazione certificata di agibilità (art. 24 DPR 380/2001)"
      proroga_inizio: "La proroga del termine di inizio dei lavori"
      proroga_fine: "La proroga del termine di ultimazione dei lavori"
      intestatario: "Il titolo a un nuovo intestatario (chi ha acquistato l'immobile o vi è subentrato): voltura o cambio d'intestazione"
      direttore_lavori: "Il nuovo direttore dei lavori"
      impresa: "L'impresa esecutrice: la prima nominata, o una in più accanto alla precedente"
      cambio_impresa: "La nuova impresa esecutrice al posto della precedente, cessata o sostituita"
      dau: "La dichiarazione di avvenuto utilizzo delle terre e rocce da scavo (D.A.U.), da sola"
  titolo_tipo:
    type: choice
    question: "Qual è il titolo dei lavori?"
    values:
      permesso_di_costruire: "Un permesso di costruire"
      scia: "Una SCIA, anche alternativa al permesso di costruire"
      dia: "Una DIA"
      cila: "Una CILA"
      variante: "Una variante"
      autorizzazione_paesaggistica: "Un'autorizzazione paesaggistica, senza titolo edilizio"
  proroga:
    type: choice
    question: "Quale proroga?"
    values:
      ordinaria: >-
        Ordinaria (art. 15 c. 2 DPR 380/2001): la si chiede al Comune prima della scadenza, per fatti
        estranei alla volontà del titolare, la mole dell'opera o difficoltà tecniche emerse dopo
        l'inizio dei lavori
      straordinaria: >-
        Straordinaria (art. 10-septies D.L. 21/2022), comunicata ora per la prima volta, prima che il
        termine scada
      integrativa: >-
        L'integrazione di una proroga straordinaria già comunicata in una misura più breve (uno o due
        anni, trenta o trentasei mesi), per avvalersi dei quarantotto mesi
    how: >-
      La proroga straordinaria è di quarantotto mesi per i permessi di costruire e le SCIA rilasciati
      o formati fino al 31 dicembre 2025, se il termine non è già decorso e il titolo non contrasta
      con nuovi strumenti urbanistici o piani di tutela (art. 10-septies c. 1 a D.L. 21/2022, nel
      testo del D.L. 200/2025).
  paesaggistica:
    type: choice
    question: "Con il nuovo termine dei lavori, che cosa serve alla loro autorizzazione paesaggistica?"
    values:
      "no": >-
        Niente: i lavori non sono in un'area tutelata o non la chiedono, o la loro autorizzazione
        resta efficace oltre il nuovo termine
      proroga: >-
        La sua proroga (art. 10-septies D.L. 21/2022): è ancora efficace ma scade prima del nuovo
        termine, e i lavori non contrastano con piani o provvedimenti di tutela sopravvenuti
      rinnovo: >-
        Il suo rinnovo (art. 7 D.P.R. 31/2017): è scaduta da non più di un anno, con i lavori non
        eseguiti o eseguiti in parte e il progetto quello autorizzato o con variazioni di lieve entità
      semplificata: >-
        Una nuova autorizzazione semplificata (lavori dell'Allegato B del D.P.R. 31/2017): è scaduta
        da più di un anno
      ordinaria: >-
        Una nuova autorizzazione ordinaria (art. 146 D.Lgs. 42/2004): è scaduta da più di un anno, o
        il progetto cambia in modo non lieve, anche con il rinnovo (art. 7 c. 2 D.P.R. 31/2017)
    how: >-
      L'autorizzazione vale cinque anni dall'efficacia del titolo edilizio, più un anno per finire i
      lavori iniziati (art. 146 c. 4 D.Lgs. 42/2004).
  dichiarazione_utilizzo:
    type: yes_no
    question: >-
      Le terre e rocce scavate escono dal cantiere come sottoprodotti (cantiere fino a 6.000 m³, o più
      grande per opere senza VIA né AIA), e la dichiarazione di utilizzo non è andata con il permesso?
  dau:
    type: yes_no
    question: >-
      L'utilizzo delle terre e rocce da scavo come sottoprodotti è finito, e la dichiarazione di
      avvenuto utilizzo (D.A.U.) non è ancora stata presentata?
rules:
  # --- Inizio dei lavori ---
  - id: inizio-lavori
    when: {adempimento: [inizio_lavori], titolo_tipo: [permesso_di_costruire]}
    then:
      role: main
      procedure: napoli/comune/inizio-lavori-pdc
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Comunicazione inizio lavori"}
    cites:
      - {procedure: napoli/comune/inizio-lavori-pdc, source: dpr380-art15}
      - {procedure: napoli/comune/inizio-lavori-pdc, source: portale-sue-operazioni}
    status: verified
  - id: inizio-lavori-altro-titolo
    when: {adempimento: [inizio_lavori], titolo_tipo: [scia, dia, cila, variante, autorizzazione_paesaggistica]}
    then: {refuse: "Sul SUE la comunicazione di inizio lavori è quella del permesso di costruire, che fissa il termine di inizio (art. 15 DPR 380/2001); la libreria non la copre per gli altri titoli, che dichiarano l'inizio dei lavori nella pratica stessa: va chiesto al SUE."}
    cites:
      - {procedure: napoli/comune/inizio-lavori-pdc, source: dpr380-art15}
      - {procedure: napoli/comune/inizio-lavori-pdc, source: portale-sue-operazioni}
    status: verified
  # Lettura, per un architetto (sue-pairs.yaml del runner, dichiarazione-with-start): la dichiarazione
  # di utilizzo va almeno 15 giorni prima degli scavi (art. 21 D.P.R. 120/2017), e i lavori del
  # permesso iniziano con la comunicazione: quella non presentata con il permesso va con l'inizio dei
  # lavori. La legge non chiede che vadano insieme.
  - id: inizio-lavori-dichiarazione-utilizzo
    when: {adempimento: [inizio_lavori], titolo_tipo: [permesso_di_costruire], dichiarazione_utilizzo: true}
    then:
      role: also
      procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017 (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)"}
    cites:
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art21}
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: portale-sue-operazioni}
      - {procedure: napoli/comune/inizio-lavori-pdc, source: dpr380-art15}
    status: verified
  - id: inizio-lavori-avvenuto-utilizzo
    when: {adempimento: [inizio_lavori], titolo_tipo: [permesso_di_costruire], dichiarazione_utilizzo: true}
    then: {role: apart, procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre, regime: comunicazione}
    cites:
      - {procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre, source: dpr120-art7}
    status: verified

  # --- Fine dei lavori e agibilità ---
  - id: fine-lavori
    when: {adempimento: [fine_lavori]}
    then:
      role: main
      procedure: napoli/comune/fine-lavori
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Comunicazione di fine lavori"}
    cites:
      - {procedure: napoli/comune/fine-lavori, source: portale-sue-operazioni}
      - {procedure: napoli/comune/fine-lavori, source: cila-note}
    status: verified
  - id: agibilita
    when: {adempimento: [agibilita]}
    then:
      role: main
      procedure: napoli/comune/agibilita
      regime: scia
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Segnalazione Certificata per l'Agibilità"}
    cites:
      - {procedure: napoli/comune/agibilita, source: dpr380-art24}
      - {procedure: napoli/comune/agibilita, source: portale-sue-operazioni}
    status: verified
  # Lettura, per un architetto (sue-pairs.yaml, dau-at-the-end): la dichiarazione di avvenuto utilizzo è
  # dovuta a utilizzo finito (art. 7 D.P.R. 120/2017), e la fine dei lavori o l'agibilità è la pratica
  # di quel momento. La legge non chiede che vadano insieme.
  - id: fine-lavori-avvenuto-utilizzo
    when: {adempimento: [fine_lavori, agibilita], dau: true}
    then: &dau-also
      role: also
      procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Dichiarazione di avvenuto utilizzo (D.A.U.) ai sensi dell'art. 7 del DPR n. 120/2017"}
    cites:
      - {procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre, source: dpr120-art7}
      - {procedure: napoli/comune/fine-lavori, source: dpr380-art23}
      - {procedure: napoli/comune/agibilita, source: dpr380-art24}
    status: verified
  - id: avvenuto-utilizzo
    when: {adempimento: [dau]}
    then:
      role: main
      procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Dichiarazione di avvenuto utilizzo (D.A.U.) ai sensi dell'art. 7 del DPR n. 120/2017"}
    cites:
      - {procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre, source: dpr120-art7}
      - {procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre, source: portale-sue-operazioni}
    status: verified

  # --- Proroghe dei termini ---
  - id: proroga-inizio-ordinaria
    when: {adempimento: [proroga_inizio], proroga: [ordinaria], titolo_tipo: [permesso_di_costruire, dia]}
    then:
      role: main
      procedure: napoli/comune/proroga-inizio-lavori
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Proroga inizio lavori"}
    cites:
      - {procedure: napoli/comune/proroga-inizio-lavori, source: dpr380-art15}
      - {procedure: napoli/comune/proroga-inizio-lavori, source: portale-sue-operazioni}
    status: verified
  - id: proroga-fine-ordinaria
    when: {adempimento: [proroga_fine], proroga: [ordinaria], titolo_tipo: [permesso_di_costruire, dia]}
    then:
      role: main
      procedure: napoli/comune/proroga-fine-lavori
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Proroga fine lavori"}
    cites:
      - {procedure: napoli/comune/proroga-fine-lavori, source: dpr380-art15}
      - {procedure: napoli/comune/proroga-fine-lavori, source: portale-sue-operazioni}
    status: verified
  - id: proroga-ordinaria-altro-titolo
    when: {adempimento: [proroga_inizio, proroga_fine], proroga: [ordinaria], titolo_tipo: [scia, cila, variante, autorizzazione_paesaggistica]}
    then: {refuse: "La proroga ordinaria dell'art. 15 c. 2 DPR 380/2001 è dei termini del permesso di costruire (sul SUE anche della DIA): per gli altri titoli la libreria non la copre, e va chiesto al SUE. La proroga straordinaria dell'art. 10-septies D.L. 21/2022 vale anche per le SCIA."}
    cites:
      - {procedure: napoli/comune/proroga-fine-lavori, source: dpr380-art15}
      - {procedure: napoli/comune/proroga-ultimazione-lavori-10-septies, source: dl21-art10septies}
    status: verified
  - id: proroga-inizio-straordinaria
    when: {adempimento: [proroga_inizio], proroga: [straordinaria]}
    then: {refuse: "Sul SUE di Napoli, per l'inizio dei lavori, c'è solo la comunicazione integrativa di una proroga straordinaria già comunicata: con quale operazione si fa la prima comunicazione della proroga dell'art. 10-septies va chiesto al SUE."}
    cites:
      - {procedure: napoli/comune/proroga-straordinaria-inizio-lavori, source: portale-sue-operazioni}
      - {procedure: napoli/comune/proroga-straordinaria-inizio-lavori, source: proroga-pagina}
    status: verified
  - id: proroga-inizio-integrativa
    when: {adempimento: [proroga_inizio], proroga: [integrativa], titolo_tipo: [permesso_di_costruire, scia]}
    then:
      role: main
      procedure: napoli/comune/proroga-straordinaria-inizio-lavori
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Comunicazione integrativa proroga straordinaria trenta mesi inizio lavori (art. 10 septies, Legge 51/2022)"}
    cites:
      - {procedure: napoli/comune/proroga-straordinaria-inizio-lavori, source: dl21-art10septies}
      - {procedure: napoli/comune/proroga-straordinaria-inizio-lavori, source: proroga-pagina}
      - {procedure: napoli/comune/proroga-straordinaria-inizio-lavori, source: portale-sue-operazioni}
    status: verified
  - id: proroga-fine-straordinaria
    when: {adempimento: [proroga_fine], proroga: [straordinaria], titolo_tipo: [permesso_di_costruire, scia]}
    then:
      role: main
      procedure: napoli/comune/proroga-ultimazione-lavori-10-septies
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Proroga del termine di ultimazione lavori (art. 10 septies, Legge 51/2022)"}
    cites:
      - {procedure: napoli/comune/proroga-ultimazione-lavori-10-septies, source: dl21-art10septies}
      - {procedure: napoli/comune/proroga-ultimazione-lavori-10-septies, source: portale-sue-operazioni}
    status: verified
  - id: proroga-fine-integrativa
    when: {adempimento: [proroga_fine], proroga: [integrativa], titolo_tipo: [permesso_di_costruire, scia, autorizzazione_paesaggistica]}
    then:
      role: main
      procedure: napoli/comune/proroga-straordinaria-ultimazione-lavori
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Comunicazione integrativa proroga straordinaria trenta mesi ultimazione lavori (art. 10 septies, Legge 51/2022)"}
    cites:
      - {procedure: napoli/comune/proroga-straordinaria-ultimazione-lavori, source: dl21-art10septies}
      - {procedure: napoli/comune/proroga-straordinaria-ultimazione-lavori, source: proroga-pagina}
      - {procedure: napoli/comune/proroga-straordinaria-ultimazione-lavori, source: portale-sue-operazioni}
    status: verified
  - id: proroga-straordinaria-altro-titolo
    when: {adempimento: [proroga_inizio, proroga_fine], proroga: [straordinaria, integrativa], titolo_tipo: [dia, cila, variante]}
    then: {refuse: "La proroga straordinaria dell'art. 10-septies D.L. 21/2022 è dei termini dei permessi di costruire e delle SCIA (e delle autorizzazioni paesaggistiche): per questo titolo la libreria non la copre, e va chiesto al SUE."}
    cites:
      - {procedure: napoli/comune/proroga-ultimazione-lavori-10-septies, source: dl21-art10septies}
    status: verified
  - id: proroga-straordinaria-paesaggistica
    when: {adempimento: [proroga_inizio, proroga_fine], proroga: [straordinaria], titolo_tipo: [autorizzazione_paesaggistica]}
    then: {refuse: "La prima proroga di un'autorizzazione paesaggistica per lavori senza titolo edilizio si comunica con la sua operazione: è nella tabella sue-napoli (lavori di edilizia libera, con l'autorizzazione da prorogare)."}
    cites:
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: dl21-art10septies}
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: portale-sue-operazioni}
    status: verified
  - id: proroga-inizio-integrativa-paesaggistica
    when: {adempimento: [proroga_inizio], proroga: [integrativa], titolo_tipo: [autorizzazione_paesaggistica]}
    then: {refuse: "L'autorizzazione paesaggistica ha un termine di efficacia, non uno di inizio dei lavori: la sua comunicazione integrativa è quella dell'ultimazione."}
    cites:
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: dlgs42-art146}
    status: verified
  # Lettura, per un architetto (sue-pairs.yaml, authorization-keeps-pace): l'autorizzazione paesaggistica
  # vale cinque anni dall'efficacia del titolo edilizio (art. 146 c. 4 D.Lgs. 42/2004), e la proroga dei
  # termini del titolo non la proroga: quando il nuovo termine dei lavori ne supera la scadenza, la
  # proroga del titolo porta la sua proroga, il suo rinnovo o una nuova autorizzazione. La legge non
  # chiede che vadano insieme.
  - id: proroga-con-proroga-paesaggistica
    when: {adempimento: [proroga_inizio, proroga_fine], titolo_tipo: &titolo-edilizio [permesso_di_costruire, scia, dia], paesaggistica: [proroga]}
    then:
      role: also
      procedure: napoli/comune/proroga-autorizzazione-paesaggistica
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Proroga autorizzazione paesaggistica (art. 10 septies, Legge 51/2022 - Comune)"}
    cites:
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: dlgs42-art146}
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: dl21-art10septies}
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: portale-sue-operazioni}
    status: verified
  - id: proroga-con-rinnovo-paesaggistica
    when: {adempimento: [proroga_inizio, proroga_fine], titolo_tipo: *titolo-edilizio, paesaggistica: [rinnovo]}
    then:
      role: also
      procedure: napoli/comune/rinnovo-autorizzazione-paesaggistica-semplificata
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Rinnovo Autorizzazione Paesaggistica Semplificata  (DPR 31/2017 - Comune)"}
    cites:
      - {procedure: napoli/comune/rinnovo-autorizzazione-paesaggistica-semplificata, source: dlgs42-art146}
      - {procedure: napoli/comune/rinnovo-autorizzazione-paesaggistica-semplificata, source: dpr31-art7}
      - {procedure: napoli/comune/rinnovo-autorizzazione-paesaggistica-semplificata, source: portale-sue-operazioni}
    status: verified
  - id: proroga-con-paesaggistica-semplificata
    when: {adempimento: [proroga_inizio, proroga_fine], titolo_tipo: *titolo-edilizio, paesaggistica: [semplificata]}
    then:
      role: also
      procedure: napoli/comune/autorizzazione-paesaggistica-semplificata
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Autorizzazione paesaggistica semplificata (DPR 31/2017 - Comune)"}
    cites:
      - {procedure: napoli/comune/autorizzazione-paesaggistica-semplificata, source: dpr31-art3}
      - {procedure: napoli/comune/autorizzazione-paesaggistica-semplificata, source: portale-sue-operazioni}
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: dlgs42-art146}
    status: verified
  - id: proroga-con-paesaggistica-ordinaria
    when: {adempimento: [proroga_inizio, proroga_fine], titolo_tipo: *titolo-edilizio, paesaggistica: [ordinaria]}
    then:
      role: also
      procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Autorizzazione paesaggistica ordinaria (art.146 del D.Lgs 42/2004 - Comune)"}
    cites:
      - {procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria, source: dlgs42-art146}
      - {procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria, source: portale-sue-operazioni}
    status: verified

  # --- Intestatario, direttore dei lavori, impresa ---
  - id: voltura-permesso
    when: {adempimento: [intestatario], titolo_tipo: [permesso_di_costruire]}
    then:
      role: main
      procedure: napoli/comune/voltura-permesso-di-costruire
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Voltura intestazione Permesso di costruire"}
    cites:
      - {procedure: napoli/comune/voltura-permesso-di-costruire, source: dpr380-art11}
      - {procedure: napoli/comune/voltura-permesso-di-costruire, source: portale-sue-operazioni}
    status: verified
  - id: cambio-intestazione
    when: {adempimento: [intestatario], titolo_tipo: [scia, dia, cila]}
    then:
      role: main
      procedure: napoli/comune/cambio-intestazione-cila-scia
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Cambio intestazione CIA / SCIA / DIA"}
    cites:
      - {procedure: napoli/comune/cambio-intestazione-cila-scia, source: portale-sue-operazioni}
    status: verified
  - id: intestatario-altro-titolo
