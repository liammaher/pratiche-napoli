        map: { ask: "Per attività di categoria B o C: data e protocollo del parere favorevole sul progetto (anche più di uno)" }
      - label: "oppure: alla documentazione tecnica di progetto di cui alla asseverazione allegata (per attività di cat. A)"
        map: { ask: "L'attività è di categoria A (nessuna valutazione del progetto)?" }
