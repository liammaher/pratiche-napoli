      - label: "oppure: alla documentazione tecnica di cui alla asseverazione allegata (cat. A, B, C, modifiche ex art. 4 c. 6 DPR 151/2011 senza aggravio)"
        map: { ask: "Si tratta di una modifica che non aggrava le condizioni di sicurezza preesistenti?" }
      - label: Sigla del responsabile dell'attività (pagina 1)
        map: { blank_with_reason: Sigla del responsabile dell'attività; solo la persona. }
      # SEGNALA
      - label: "Segnala l'inizio dell'esercizio dell'attività di: tipo di attività (albergo, scuola, etc.) – in caso di SCIA parziale i riferimenti pertinenti"
        map: { ask: "Tipo di attività come la descrive il tecnico (per esempio negozio, albergo, centrale termica) ed eventuale lotto o stralcio se SCIA parziale" }
