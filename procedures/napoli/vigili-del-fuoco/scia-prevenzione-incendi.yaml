schema_version: 0
id: napoli/vigili-del-fuoco/scia-prevenzione-incendi
title: Prevenzione incendi – valutazione del progetto, SCIA antincendio e rinnovo periodico (Vigili del Fuoco di Napoli, tramite SUAP)
headline: "Pratica antincendio per negozi, locali e alberghi a Napoli: SCIA ai Vigili del Fuoco"
aka: [CPI, certificato prevenzione incendi, rinnovo CPI, SCIA VVF, parere di conformità antincendio]
updated: 2026-10-26
summary: >-
  Un'attività che rientra nell'elenco dell'Allegato I del D.P.R. 151/2011 (per esempio un negozio
  con più di 400 mq lordi, un albergo o affittacamere con più di 25 posti letto, un locale di
  trattenimento con più di 100 persone, una centrale termica oltre 116 kW) deve presentare ai
  Vigili del Fuoco una SCIA antincendio prima di iniziare, preparata da un tecnico abilitato; per
  le categorie B e C serve prima l'approvazione del progetto. A Napoli le imprese la presentano
  tramite il SUAP, e ogni 5 anni va presentata l'attestazione di rinnovo periodico.
ente:
  name: Corpo Nazionale dei Vigili del Fuoco – Comando Provinciale di Napoli
  office: Ufficio Prevenzione Incendi (le pratiche delle imprese arrivano tramite il SUAP del Comune di Napoli)
applies_to:
  events: [open, renovate]
  audience: [business]
  sectors:
    - commercio al dettaglio e all'ingrosso
    - somministrazione di alimenti e bevande e locali di trattenimento
    - strutture ricettive
    - laboratori, officine e attività artigiane
  conditions:
    - text: >-
        La procedura vale solo per le attività elencate nell'Allegato I del D.P.R. 151/2011,
        divise nelle categorie A, B e C secondo dimensione e rischio. Un'attività non in elenco non
        presenta questa SCIA, ma resta soggetta alle regole generali di sicurezza antincendio dei
        luoghi di lavoro (vedi pitfalls).
      status: verified
      source: dpr151-art2
    - text: >-
        Attività 69 – locali di esposizione e/o vendita all'ingrosso o al dettaglio con superficie
        lorda superiore a 400 mq comprensiva di servizi e depositi: categoria A fino a 600 mq, B
        oltre 600 e fino a 1.500 mq, C oltre 1.500 mq. Sono escluse le manifestazioni temporanee.
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Attività 66 – alberghi, pensioni, motel, residenze turistico-alberghiere, studentati,
        ostelli, bed & breakfast, dormitori, case per ferie e simili con oltre 25 posti letto:
        categoria A fino a 50 posti letto, B oltre 50 e fino a 100, C oltre 100.
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Un B&B familiare della L.R. Campania 5/2001 ha al massimo 8 posti letto (scheda
        napoli/comune/avvio-bed-and-breakfast), quindi da solo resta sotto la soglia dei 25 posti
        letto dell'attività 66.
      status: unverified
    - text: >-
        Attività 65 – locali di spettacolo e di trattenimento in genere, impianti e centri sportivi,
        palestre, pubblici o privati, con capienza superiore a 100 persone oppure superficie lorda
        in pianta al chiuso superiore a 200 mq: categoria B fino a 200 persone, C oltre 200
        persone. Sono escluse le manifestazioni temporanee.
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Per stabilire se un ristorante o un bar rientra nell'attività 65, il testo coordinato dei
        Vigili del Fuoco rinvia alla circolare n. 36 dell'11/12/1985 (punto 9), che non è stata
        letta qui: farlo valutare al tecnico o chiedere al Comando.
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Attività 74 – impianti per la produzione di calore alimentati a combustibile solido, liquido
        o gassoso con potenzialità superiore a 116 kW: categoria A fino a 350 kW, B oltre 350 e
        fino a 700 kW, C oltre 700 kW.
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Se le apparecchiature di cottura a gas di una cucina (ristorante, bar, panificio) contano
        come "impianto per la produzione di calore" e come si somma la potenza di più apparecchi è
        materia di circolari e chiarimenti ministeriali che il testo coordinato cita (circ. 52 del
        20/11/1982 punto 5; circ. 36 dell'11/12/1985 punto 9; chiarimento del 13/07/2010), non
        dell'elenco stesso: la soglia di 116 kW per le cucine va confermata dal tecnico o dal
        Comando.
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Altre voci che possono riguardare piccole imprese: 49 (gruppi elettrogeni e cogenerazione
        oltre 25 kW: A fino a 350 kW, B fino a 700 kW, C oltre); 75 (autorimesse oltre 300 mq
        coperti: A fino a 1.000 mq, B fino a 3.000 mq, C oltre); 70 (depositi oltre 1.000 mq lordi
        con più di 5.000 kg di merci e materiali combustibili: B fino a 3.000 mq, C oltre); 72
        (edifici tutelati dal D.Lgs. 42/2004 aperti al pubblico che contengono musei, biblioteche,
        mostre o una qualsiasi altra attività dell'Allegato: sempre C); 3 (depositi e rivendite di
        gas infiammabili in recipienti mobili, per il GPL da 75 kg: A depositi di GPL fino a 300 kg,
        B rivendite e depositi oltre 300 kg fino a 1.000 kg, C oltre 1.000 kg).
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Numero, sottoclasse e categoria esatti di ogni attività (necessari anche per calcolare il
        versamento) si ricavano dall'Allegato I del D.P.R. 151/2011 e dall'Allegato III del D.M.
        7 agosto 2012: li individua il tecnico abilitato.
      status: verified
      source: vvf-testo-coordinato
legal_basis:
  - text: "D.P.R. 1 agosto 2011, n. 151: art. 2 (attività soggette e categorie A, B, C) e Allegato I (elenco)."
    status: verified
    source: dpr151-art2
  - text: D.P.R. 151/2011, art. 3 (valutazione dei progetti per le categorie B e C).
    status: verified
    source: dpr151-art3
  - text: D.P.R. 151/2011, art. 4 (SCIA antincendio e controlli del Comando).
    status: verified
    source: dpr151-art4
  - text: D.P.R. 151/2011, art. 5 (attestazione di rinnovo periodico di conformità antincendio).
    status: verified
    source: dpr151-art5
  - text: D.P.R. 151/2011, art. 6 (obblighi di manutenzione, informazione e registro dei controlli).
    status: verified
    source: dpr151-art6
  - text: D.P.R. 151/2011, art. 10 (raccordo con il SUAP e il D.P.R. 160/2010).
    status: verified
    source: dpr151-art10
  - text: >-
      D.M. Interno 7 agosto 2012 (contenuto delle istanze, documentazione da allegare, sottoclassi,
      presentazione tramite SUAP), nel testo coordinato pubblicato dai Vigili del Fuoco.
    status: verified
    source: vvf-testo-coordinato
  - text: D.Lgs. 8 marzo 2006, n. 139, artt. 16 (procedure), 20 (sanzioni) e 23 (oneri dei servizi).
    status: verified
    source: dlgs139-art16
  - text: >-
      D.M. Interno 2 marzo 2012 come modificato dal D.M. 11 ottobre 2024 (tariffe orarie dei
      servizi a pagamento dei Vigili del Fuoco).
    status: verified
    source: dm-tariffe-2024
deadline:
  rules:
    - text: >-
        La SCIA va presentata prima di iniziare l'esercizio dell'attività. Il Comando verifica la
        completezza formale e ne rilascia ricevuta.
      status: verified
      source: dpr151-art4
    - text: >-
        Categorie B e C: prima dei lavori serve la valutazione del progetto. Il Comando può chiedere
        integrazioni entro 30 giorni e si pronuncia entro 60 giorni dalla documentazione completa.
      status: verified
      source: dpr151-art3
    - text: >-
        Dopo la SCIA, entro 60 giorni il Comando effettua i controlli con visite tecniche (per le
        categorie A e B anche a campione). Se mancano i requisiti vieta la prosecuzione, salvo che
        l'interessato si metta in regola entro 45 giorni. Per la categoria C la visita c'è sempre e,
        se l'esito è positivo, il certificato di prevenzione incendi arriva entro 15 giorni dalla
        visita.
      status: verified
      source: dpr151-art4
    - text: >-
        Rinnovo periodico ogni 5 anni, contati dalla data di presentazione della prima SCIA (10 anni
        per le attività 6, 7, 8, 64, 71, 72 e 77). Chi ha ancora un vecchio certificato di
        prevenzione incendi fa il rinnovo alla sua scadenza.
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Modifiche che aggravano il rischio, nuova destinazione dei locali, cambi di lavorazione o di
        strutture: vanno rifatte le procedure (nuova valutazione del progetto per B e C e nuova
        SCIA).
      status: verified
      source: dpr151-art4
  lateness:
    text: >-
      Il titolare di un'attività soggetta che omette la SCIA o la richiesta di rinnovo periodico è
      punito con l'arresto fino a un anno o con l'ammenda da 258 a 2.582 euro (art. 20, c. 1, D.Lgs.
      139/2006); il prefetto può sospendere l'attività fino all'adempimento (art. 20, c. 3). Chi
      attesta il falso nelle certificazioni rischia la reclusione (art. 20, c. 2). Per il caso
      concreto chiedere al Comando o a un legale: qui non si stima nulla.
    status: verified
    source: dlgs139-art20
cost:
  text: >-
    Il versamento ai Vigili del Fuoco dipende dall'attività e dalla categoria: si moltiplicano le
    ore fissate dalla tabella ministeriale per la tariffa oraria (63 euro l'ora per l'esame
    progetto, 68 euro per il sopralluogo); l'importo esatto lo dà il modulo di calcolo sul sito dei
    Vigili del Fuoco e si paga con pagoPA. Se la pratica passa dal SUAP di Napoli si aggiungono i
    diritti d'istruttoria (20 euro per la parte antincendio, o la riga combinata della tabella
    2026). Il compenso del tecnico abilitato non è compreso.
  status: verified
  source: dm-tariffe-2024
duration:
  text: >-
    Con la SCIA si inizia appena è presentata, con la ricevuta; il Comando ha 60 giorni per i
    controlli (per la categoria C la visita c'è sempre, e il certificato di prevenzione incendi
    arriva entro 15 giorni dalla visita con esito positivo). Per le categorie B e C, prima dei
    lavori, il parere sul progetto arriva entro 60 giorni dalla documentazione completa.
  status: verified
  source: dpr151-art4
appointment:
  text: >-
    Non serve per presentare: le istanze sono solo telematiche (tramite il SUAP o su PRINCE).
    L'Ufficio Prevenzione Incendi del Comando di Napoli (Via Leopoldo Tarantini 1) riceve per
    consulenze su appuntamento il martedì 9–12, il giovedì 14–16 e il venerdì 9–12; la pagina non
    dice come prenotare e indica il telefono 081 2595290.
  status: verified
  source: vvf-napoli
channels:
  - type: portal
    name: impresainungiorno – SUAP del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: info-diritti
    notes: >-
      Le istanze di prevenzione incendi che rientrano nell'ambito del SUAP si presentano al SUAP,
      che le trasmette al Comando (D.M. 7/8/2012, art. 10). A Napoli impresainungiorno è l'unico
      canale telematico delle pratiche SUAP; la SCIA antincendio si aggiunge di solito alla
      pratica dell'attività (SCIA unica).
  - type: portal
    name: PRINCE – Portale di servizi di prevenzione incendi dei Vigili del Fuoco
    url: https://prevenzioneonline.vigilfuoco.it/prevenzione-online/login
    auth: [spid]
    source: vvf-prince
    notes: >-
      Il Comando di Napoli accetta le istanze solo per via telematica o con inserimento diretto su
      PRINCE. Accesso con SPID; le istanze si associano tramite codice fiscale (anche del
      professionista). Assistenza tecnica: prince@vigilfuoco.it.
  - type: pec
    address: com.prev.napoli@cert.vigilfuoco.it
    receipt: legal
    source: vvf-napoli
    notes: PEC dell'Ufficio Prevenzione Incendi del Comando di Napoli.
  - type: desk
    name: Comando VVF di Napoli – Ufficio Prevenzione Incendi
    address: Via Leopoldo Tarantini 1, Napoli
    hours: martedì 9:00–12:00, giovedì 14:00–16:00, venerdì 9:00–12:00
    booking: Su appuntamento.
    source: vvf-napoli
    notes: Solo consulenze sugli aspetti di competenza dell'ufficio; le istanze sono telematiche.
  - type: phone
    address: 081 2595290
    source: vvf-napoli
  - type: desk
    name: Servizio SUAP del Comune di Napoli
    address: Piazza Cavour 42, II piano, Napoli
    source: info-diritti
    notes: Informazioni sulla pratica SUAP; telefono indicato dal SUAP 081 7953054.
payment:
  method: pagopa
  calculator_url: https://www.vigilfuoco.it/documentiat/preventivi
  notes:
    - text: >-
        Il servizio dei Vigili del Fuoco è a pagamento (art. 23 D.Lgs. 139/2006): l'onere è
        stabilito su base oraria o forfettaria dal decreto del Ministro dell'interno.
      status: verified
      source: dlgs139-art23
    - text: >-
        Come si calcola: si individuano le attività (numero, sottoclasse, categoria), si ricava dalla
        tabella ministeriale il numero di ore fissato per il servizio richiesto (valutazione
        progetto, SCIA, rinnovo, deroga…) e lo si moltiplica per la tariffa oraria. Per deroghe e
        rinnovi si usa la tariffa dell'esame progetto. Le ore sono nella tabella della circolare n.
        13061/2011 riportata nel testo coordinato VVF.
      status: verified
      source: vvf-testo-coordinato
    - text: >-
        Tariffe orarie del D.M. 11 ottobre 2024 (G.U. del 23 ottobre 2024, in vigore dal giorno
        successivo alla pubblicazione): esame progetto 63,00 euro l'ora, sopralluogo 68,00 euro l'ora. Una prestazione sotto l'ora
        si paga come un'ora intera; oltre l'ora, le frazioni da 30 minuti in su contano come un'ora
        intera, quelle sotto i 30 minuti non si contano. Sono a carico del richiedente anche le
        eventuali indennità di trasferta.
      status: verified
      source: dm-tariffe-2024
    - text: >-
        L'importo esatto non è calcolato qui: usare il modulo "Importo di una richiesta di
        prevenzione incendi" sul sito dei Vigili del Fuoco o farlo calcolare al tecnico. La
        piattaforma PRINCE è già adeguata alle tariffe del D.M. 11 ottobre 2024.
      status: verified
      source: vvf-prince
    - text: >-
        Il Comando di Napoli chiede di pagare con pagoPA sulla piattaforma dei Vigili del Fuoco
        (pagopa.vigilfuoco.it), con accesso previa registrazione o SPID; l'attestato si allega alla
        SCIA.
      status: verified
      source: vvf-napoli
    - text: >-
        Diritti d'istruttoria del SUAP di Napoli (tabella in vigore dall'11 giugno 2026), colonna
        apertura: prevenzione incendi come procedimento a sé (S211) 20,00 euro. Righe già
        combinate: vicinato non alimentare + prevenzione incendi 120,00 euro (S2); vicinato
        alimentare + notifica + prevenzione incendi 140,00 euro (S5); strutture ricettive + notifica
        sanitaria + prevenzione incendi 240,00 euro (S96); panifici + notifica sanitaria +
        prevenzione incendi 140,00 euro (S155); officine di autoriparazione + prevenzione incendi
        120,00 euro (S148). Per variazioni (VCA) e cambi di persone (VPF) la tabella ha importi
        diversi.
      status: verified
      source: tabella-2026
    - text: >-
        Se la combinazione non ha una riga propria (per esempio somministrazione + prevenzione
        incendi), si applica la "logica del carrello": si sommano i diritti dei singoli procedimenti
        della pratica.
      status: verified
      source: info-diritti
    - text: >-
        I diritti SUAP si pagano solo con pagoPA dentro la pratica su impresainungiorno; i diritti
        di altri enti (qui i Vigili del Fuoco) si pagano con le modalità dell'ente e la ricevuta si
        allega alla pratica SUAP.
      status: verified
      source: info-diritti
documents:
  - name: SCIA antincendio (Mod. PIN 2-2023) firmata dal responsabile dell'attività
    required: true
  - name: Asseverazione ai fini della sicurezza antincendio (Mod. PIN 2.1-2018) firmata da un tecnico abilitato
    required: true
    notes: >-
      Con le certificazioni e dichiarazioni su elementi costruttivi, prodotti, materiali e impianti
      rilevanti ai fini antincendio (Allegato II del D.M. 7/8/2012, modelli PIN 2.2–2.5).
  - name: Relazione tecnica ed elaborati grafici (solo categoria A)
    required: false
    notes: >-
      Per le categorie B e C il progetto è già stato approvato con la valutazione; nella SCIA si
      indicano data e protocollo dell'approvazione. Il Comando di Napoli chiede file firmati
      digitalmente con elaborati grafici in formato DWF o DXF.
  - name: Attestato del versamento ai Vigili del Fuoco
    required: true
  - name: Dichiarazione di non aggravio del rischio (Mod. PIN 2.6-2018)
    required: false
    notes: Solo per modifiche senza aggravio delle condizioni di sicurezza (art. 4, c. 6, D.P.R. 151/2011).
  - name: Dichiarazione sull'attuazione del sistema di gestione della sicurezza antincendio (SGSA)
    required: false
    notes: Solo se si usa l'approccio ingegneristico (D.M. 9 maggio 2007).
  - name: Procura/delega al tecnico o all'intermediario, con documento d'identità
    required: false
  - name: Istanza di valutazione del progetto (Mod. PIN 1-2023) con relazione tecnica ed elaborati grafici
    required: false
    notes: Solo categorie B e C, prima dei lavori.
  - name: Attestazione di rinnovo periodico (Mod. PIN 3-2023) con asseverazione del professionista antincendio (Mod. PIN 3.1)
    required: false
    notes: >-
      Ogni 5 anni. L'asseverazione serve se ci sono impianti di protezione attiva (esclusi gli
      estintori) o protezioni per la resistenza al fuoco delle strutture.
forms:
  - id: pin-2-2023-scia
    name: Mod. PIN 2-2023 – Segnalazione certificata di inizio attività ai fini della sicurezza antincendio (in vigore dal 1° marzo 2023)
    url: https://www.vigilfuoco.it/sites/default/files/2023-08/PIN_2_2023_SCIA_FV.pdf
    source: pin-2
    sha256: 08a7bfe125e9b0cefa60c89a098294b7327158e0f07ec57612a3ef81f14cbba6
    signature_required: true
    fields:
      # Pagina 1 – intestazione
      - label: Rif. Pratica VV.F. n.
        map: { ask: "Numero di pratica dei Vigili del Fuoco, se già assegnato (per esempio dalla valutazione del progetto)" }
      - label: Spazio per protocollo
        map: { blank_with_reason: Riservato all'ufficio. }
      - label: "Al Comando dei Vigili del Fuoco di ___ (provincia)"
        map: { blank_with_reason: "Napoli: attività nella provincia di Napoli." }
      # Dati del responsabile dell'attività
      - { label: "Il sottoscritto – Cognome", map: { direct: identity.last_name } }
      - { label: Nome, map: { direct: identity.first_name } }
      - label: "domiciliato in – indirizzo"
        map: { direct: domicilio.indirizzo }
        notes: Il modulo chiede il domicilio; se il registro non ne ha uno, chiedere alla persona quale indirizzo indicare.
      - { label: n. civico (domicilio), map: { direct: domicilio.civico } }
      - { label: c.a.p. (domicilio), map: { direct: domicilio.cap } }
      - { label: comune (domicilio), map: { direct: domicilio.comune } }
      - { label: provincia (domicilio), map: { direct: domicilio.provincia } }
      - { label: telefono, map: { direct: identity.phone } }
      - { label: codice fiscale della persona fisica, map: { direct: identity.codice_fiscale } }
      - label: "nella sua qualità di (titolare, legale rappresentante, amministratore, etc.)"
        map: { direct: business.qualita_dichiarante }
      - label: "della (ragione sociale ditta, impresa, ente, società, associazione, etc.)"
        map: { direct: business.denominazione }
      - { label: "con sede in – indirizzo", map: { direct: business.sede_legale_indirizzo } }
      - { label: n. civico (sede), map: { direct: business.sede_legale_civico } }
      - { label: c.a.p. (sede), map: { direct: business.sede_legale_cap } }
      - { label: comune (sede), map: { direct: business.sede_legale_comune } }
      - { label: provincia (sede), map: { direct: business.sede_legale_provincia } }
      - { label: telefono (sede), map: { ask: "Telefono dell'impresa" } }
      - { label: indirizzo di posta elettronica, map: { direct: business.email } }
