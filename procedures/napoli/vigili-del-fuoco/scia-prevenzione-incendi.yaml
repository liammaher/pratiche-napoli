      - { label: c.a.p. (attività), map: { direct: locale.cap } }
      - { label: Comune (attività), map: { direct: locale.comune } }
      - { label: provincia (attività), map: { direct: locale.provincia } }
      - { label: telefono (attività), map: { ask: "Telefono del locale dell'attività" } }
      - label: "La/e attività oggetto della Segnalazione sono individuate ai n./sotto classe/cat."
        map: { ask: "Numero, sottoclasse e categoria (A/B/C) di ogni attività dell'Allegato I DPR 151/2011 e del DM 7/8/2012, indicati dal tecnico" }
