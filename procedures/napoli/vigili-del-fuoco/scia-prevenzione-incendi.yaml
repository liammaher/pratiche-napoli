steps:
  - do: >-
      Verificare con un tecnico abilitato se l'attività (o un suo impianto: centrale termica,
      cucina, gruppo elettrogeno, deposito, autorimessa) rientra nell'Allegato I del D.P.R. 151/2011
      e con quale numero, sottoclasse e categoria
    who: professional
  - do: >-
      Categorie B e C: prima dei lavori, far preparare il progetto antincendio (relazione tecnica ed
      elaborati grafici) e presentare l'istanza di valutazione del progetto (Mod. PIN 1-2023) con il
      relativo versamento; attendere il parere del Comando (entro 60 giorni dalla documentazione completa)
    who: professional
  - do: Firmare l'istanza di valutazione del progetto (categorie B e C)
    who: owner
    human_only: true
  - do: >-
      Realizzare lavori e impianti secondo il progetto approvato (o, per la categoria A, secondo la
      regola tecnica applicabile) e raccogliere certificazioni e dichiarazioni di installatori e
      produttori
    who: professional
  - do: >-
      Far redigere al tecnico l'asseverazione (Mod. PIN 2.1) con la distinta delle certificazioni e,
      per la categoria A, la relazione tecnica e gli elaborati grafici
    who: professional
  - do: Calcolare il versamento ai Vigili del Fuoco (ore della tabella ministeriale × tariffa oraria) con il modulo di calcolo VVF
    who: professional
  - do: Pagare il versamento ai Vigili del Fuoco con pagoPA e i diritti d'istruttoria SUAP con pagoPA nella pratica
    who: owner
    human_only: true
  - do: >-
      Compilare la SCIA antincendio (Mod. PIN 2-2023) e inserirla nella pratica SUAP su
      impresainungiorno, di solito insieme alla SCIA dell'attività (vicinato, somministrazione,
      struttura ricettiva…)
    who: facilitator
  - do: Firmare digitalmente la SCIA antincendio e la pratica SUAP (e l'eventuale procura)
    who: owner
    human_only: true
  - do: Inviare la pratica al SUAP, che la trasmette al Comando
    who: owner
    human_only: true
  - do: Iniziare l'esercizio solo dopo la presentazione e la ricevuta
    who: owner
    human_only: true
  - do: >-
      Accogliere l'eventuale visita tecnica del Comando nei 60 giorni (sempre per la categoria C) e
      mettersi in regola entro 45 giorni se richiesto
    who: owner
    human_only: true
  - do: >-
      Tenere aggiornato il registro dei controlli, delle verifiche, delle manutenzioni e
      dell'informazione antincendio, da mostrare in caso di controllo
    who: owner
  - do: >-
      Ogni 5 anni dalla prima SCIA, presentare l'attestazione di rinnovo periodico (Mod. PIN 3-2023)
      con l'eventuale asseverazione PIN 3.1 e il versamento
    who: owner
    human_only: true
after:
  - Conservare la ricevuta della SCIA, l'asseverazione con gli allegati, le ricevute dei pagamenti e il numero di pratica VVF.
  - >-
    Annotare la data di presentazione della prima SCIA: da lì decorrono i 5 anni per il rinnovo
    periodico (10 per le attività 6, 7, 8, 64, 71, 72 e 77).
  - >-
    Se l'attività passa a un nuovo titolare (subingresso, cessione), il nuovo responsabile comunica
    la voltura al Comando con una dichiarazione sostitutiva (D.M. 7/8/2012, art. 9; Mod. PIN 7).
  - >-
    Le modifiche non sostanziali ai fini antincendio si documentano al Comando con il successivo
    rinnovo periodico (D.M. 7/8/2012, art. 4, c. 8).
pitfalls:
  - text: >-
      Anche sotto le soglie dell'Allegato I restano gli obblighi di sicurezza antincendio dei luoghi
      di lavoro: il D.M. Interno 3 settembre 2021 fissa i criteri di progettazione, realizzazione
      ed esercizio, con un allegato per i luoghi di lavoro a basso rischio di incendio (per gli
      altri vale il Codice di prevenzione incendi, D.M. 3 agosto 2015); ha sostituito il D.M. 10
      marzo 1998.
    status: verified
    source: vvf-dm-03-09-2021
  - text: >-
      Il D.M. Interno 2 settembre 2021 fissa i criteri di gestione della sicurezza antincendio in
      esercizio e in emergenza e le caratteristiche del servizio antincendio (addetti) per tutti i
      luoghi di lavoro dell'art. 62 D.Lgs. 81/2008. I dettagli (piano di emergenza, formazione degli
      addetti) non sono riportati qui.
    status: verified
    source: gu-dm-02-09-2021
  - text: >-
      Il registro dei controlli dell'art. 6 D.P.R. 151/2011 è espressamente richiesto alle attività
      soggette non disciplinate dal D.Lgs. 81/2008; chi ha lavoratori segue anche gli obblighi di
      quel decreto.
    status: verified
    source: dpr151-art6
  - text: >-
      I moduli PIN e il D.M. 7/8/2012 parlano di versamento alla Tesoreria provinciale dello Stato;
      il Comando di Napoli indica la piattaforma pagoPA dei Vigili del Fuoco. Pagare con pagoPA e
      riportare sul modulo gli estremi della ricevuta.
    status: verified
    source: vvf-napoli
  - text: >-
      I moduli PIN 2 e PIN 3 prevedono ancora la firma davanti al pubblico ufficiale o l'invio per
      posta con copia del documento; il Comando di Napoli accetta solo istanze telematiche con
      firma digitale.
    status: verified
    source: vvf-napoli
  - text: >-
      Il diritto d'istruttoria del SUAP (20 euro per la parte antincendio) non sostituisce il
      versamento ai Vigili del Fuoco: sono due pagamenti distinti.
    status: verified
    source: info-diritti
  - text: >-
      Una modifica sostanziale (nuova destinazione dei locali, cambi di lavorazione o di strutture,
      aggravio del rischio) obbliga a ripetere le procedure: non basta il rinnovo.
    status: verified
    source: dlgs139-art16
  - text: >-
      Per l'autorizzazione di somministrazione in zona tutelata (centro storico UNESCO e Buffer
      Zone), le certificazioni antincendio vanno trasmesse al SUAP all'avvio dell'attività (scheda
      napoli/comune/scia-somministrazione-alimenti-bevande).
    status: unverified
  - text: >-
      La pagina del Comando di Napoli cita ancora il D.M. 2/03/2012 per le tariffe della vigilanza
      antincendio; le tariffe orarie sono state sostituite dal D.M. 11 ottobre 2024.
    status: verified
    source: dm-tariffe-2024
