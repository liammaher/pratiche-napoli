verification:
  level: L1
  date: 2026-11-03
  by: claude
  method: >-
    Desk: su Normattiva il D.P.R. 120/2017 artt. 2 e 9 (testo in vigore dal 25/2/2023); il
    Procedurale VIA della Regione Campania (testo del PDF, §§ 1.1 e 9); l'operazione del SUE vista
    sul portale in una bozza di prova.
  notes: >-
    Non letti: l'Allegato 5, il modello regionale dell'istanza, gli oneri regionali. Non chiesto al
    SUE che cosa fa di un piano trasmesso dal suo portale per un'opera soggetta a VIA. Le opere
    soggette alla VIA statale hanno per autorità il Ministero, non la Regione.
