steps:
  - do: >-
      Verificare se l'indirizzo del locale è in zona tutelata (Centro Storico o Buffer Zone): per
      somministrazione, laboratori e vicinato con consumo sul posto cambia il regime della pratica
      commerciale
    who: anyone
  - do: >-
      Individuare le linee d'attività svolte e, nella master list regionale, la procedura
      (Comunicazione, SCIA, SCIA condizionata o riconoscimento) e i documenti da allegare
    who: anyone
  - { do: Compilare la notifica (riquadro 1 per l'avvio) con i dati della tabella dei campi, who: anyone }
  - { do: "Preparare planimetria e schede supplementari, se la master list le prevede", who: anyone }
  - { do: "Pagare i diritti sanitari all'ASL (20 euro per linea d'attività) e conservare la ricevuta", who: owner, human_only: true }
  - { do: Firmare la notifica e la pratica SUAP, who: owner, human_only: true }
  - do: >-
      Inviare la pratica su impresainungiorno (SUAP di Napoli), con la notifica allegata alla SCIA
      dell'attività, pagando con pagoPA i diritti d'istruttoria del SUAP
    who: owner
    human_only: true
  - { do: "Conservare la ricevuta del SUAP: con la SCIA si può iniziare dalla data indicata", who: owner }
  - do: >-
      Tenere pronti per il sopralluogo dell'ASL (controllo documentale e verifica in loco) il piano
      di autocontrollo e gli attestati di formazione del personale
    who: owner
after:
  - Conservare la ricevuta della pratica SUAP, la notifica inviata e le ricevute dei pagamenti.
  - >-
    Annotare il numero di registrazione e il protocollo della notifica: servono per subingresso,
    modifiche, sospensione e cessazione.
  - >-
    Modifiche significative dei locali (ampliamento o riduzione della superficie, cambiamento
    sostanziale del percorso produttivo) richiedono un aggiornamento della notifica tramite SUAP;
    nuovi macchinari o una diversa disposizione delle attrezzature no.
  - >-
    Nuove linee d'attività: stessa procedura dell'avvio. Cambio di titolare (anche affitto
    d'azienda): l'impresa subentrante presenta il subingresso (riquadro 2), che vale anche come
    comunicazione di cessazione del cedente.
  - >-
    Trasferimento in un altro indirizzo: in genere cessazione del vecchio stabilimento e nuova
    notifica, salvo le linee per cui la master list prevede la procedura di "trasferimento".
  - >-
    Cessazione o sospensione temporanea, totale o di singole linee: comunicarla al SUAP (riquadro
    4), senza diritti sanitari né bollo.
pitfalls:
  - text: >-
      Il sito dell'ASL Napoli 1 Centro non ha una pagina che descriva la procedura di registrazione
      né pubblica moduli propri: le regole e i moduli sono quelli regionali (SURAP, decreto 117/2020).
      Le pagine dell'ASL confermano solo che le UOSD Prevenzione Collettiva acquisiscono le SCIA con
      controllo documentale e sopralluogo di verifica.
    status: verified
    source: asl-uosd-28-30
  - text: >-
      Dal 25 luglio 2026, nel Centro Storico (Zona A) e nella Buffer Zone (Zona B) di Napoli
      apertura, trasferimento e ampliamento di somministrazione, laboratori e vicinato con consumo
      sul posto richiedono un'autorizzazione (procedimento unico ordinario) e non più la SCIA:
      l'attività parte solo dopo il rilascio. Il subingresso senza modifiche resta a SCIA.
    status: verified
    source: comune-zone-tutelate
  - text: >-
      Nelle zone tutelate la notifica sanitaria presumibilmente va ancora allegata alla pratica
      SUAP; le schede del Comune per queste zone non sono state lette.
    status: unverified
  - text: >-
      Il modulo unificato in uso è del 2017 (Accordo 46/CU). La pagina regionale elenca già
      l'Accordo 89/CU del 10 luglio 2025 sulla nuova modulistica per il commercio, ma nessun
      decreto regionale che la recepisca: controllare su impresainungiorno quale versione viene
      proposta.
    status: verified
    source: surap-disciplina
  - text: >-
      Per le linee d'attività non coperte dai moduli nazionali si usa invece il "Modello unico
      regionale" (procedure 1–11), che vale anche per variazione della sede legale, variazione delle
      schede supplementari e riattivazione; il modello cita ancora il D.Lgs. 194/2008 sui diritti
      sanitari.
    status: verified
    source: modello-unico-regionale
  - text: >-
      Le imprese di trasporto alimenti per conto terzi presentano una sola SCIA per l'intera impresa
      e inseriscono i veicoli nella scheda supplementare in GISA: usare un veicolo non inserito è
      sanzionabile.
    status: verified
    source: circolare-2021
  - text: >-
      Anche le imprese che svolgono attività solo registrabili devono avere un piano di
      autocontrollo.
    status: verified
    source: circolare-2021
  - text: >-
      Chi manipola alimenti deve avere l'attestato di formazione per alimentaristi (ha sostituito il
      libretto sanitario), valido tre anni: corsi di 4 ore (rischio 1, es. camerieri), 8 ore
      (rischio 2, es. cuochi) o 12 ore (responsabili), prenotabili alle UO di Prevenzione
      Collettiva del distretto (33,33 / 66,66 / 99,99 euro secondo il tariffario regionale).
    status: verified
    source: asl-libretto
  - text: >-
      Nelle società di persone (s.s., s.n.c., s.a.s.) il cambio del legale rappresentante richiede
      il subingresso; nelle società di capitali e cooperative no. Anche il cambio di denominazione
      con la stessa partita IVA richiede il subingresso.
    status: verified
    source: dd117
  - text: >-
      La notifica può essere presentata anche da un intermediario con procura (o tramite
      un'Agenzia per le Imprese); le dichiarazioni restano responsabilità del titolare.
    status: verified
    source: dd117
  - text: >-
      Il modulo di notifica non contiene i dati dell'impresa (denominazione, partita IVA, sede):
      questi stanno nella scheda anagrafica della pratica SUAP. Su impresainungiorno la pratica si
      firma di norma con firma digitale.
    status: unverified
