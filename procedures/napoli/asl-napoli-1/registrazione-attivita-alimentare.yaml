schema_version: 0
id: napoli/asl-napoli-1/registrazione-attivita-alimentare
title: Notifica sanitaria per la registrazione di un'attività alimentare (Reg. CE 852/2004) – ASL Napoli 1 Centro
summary: >-
  Chi apre a Napoli un'attività che produce, trasforma, deposita, trasporta, vende o somministra
  alimenti (bar, ristorante, negozio alimentare, laboratorio…) deve notificarla all'ASL per la
  registrazione prevista dall'art. 6 del Reg. CE 852/2004. In Campania la notifica non si manda
  all'ASL: si presenta al SUAP del Comune, di solito come allegato della SCIA dell'attività, e il
  SUAP la inoltra all'ASL Napoli 1 Centro. Con la stessa via si comunicano subingresso, modifiche
  e cessazione.
ente:
  name: ASL Napoli 1 Centro
  office: >-
    Dipartimento di Prevenzione – UOC Igiene degli Alimenti e Nutrizione (SIAN) e UOSD Prevenzione
    Collettiva dei distretti sanitari
applies_to:
  events: [open, food, change, close]
  audience: [business]
  sectors:
    - bar e ristorazione
    - commercio al dettaglio e all'ingrosso di alimenti
    - laboratori di produzione alimentare (pane, pizza, pasticceria, gastronomia…)
    - deposito e trasporto di alimenti per conto terzi
  conditions:
    - text: >-
        Ogni stabilimento che svolge una linea d'attività che incide sulla sicurezza alimentare è
        soggetto a notifica e registrazione, salvo le linee per cui serve il riconoscimento (per
        esempio gli stabilimenti del Reg. CE 853/2004 che trattano alimenti di origine animale per
        altri stabilimenti): per quelle la procedura è diversa.
      status: verified
      source: dd117
    - text: >-
        Non servono notifica né riconoscimento per la produzione primaria e la preparazione
        domestica di alimenti per uso privato, né per la fornitura diretta occasionale di piccoli
        quantitativi di prodotti primari da chi produce per uso domestico.
      status: verified
      source: dd117
    - text: >-
        Chi fa solo "delivery" (consegna al consumatore di alimenti presi da un esercizio di vendita
        o somministrazione) non deve presentare né comunicazione né SCIA.
      status: verified
      source: circolare-2021
    - text: >-
        Il SUAP competente è quello del Comune dove si trova lo stabilimento; per le attività senza
        sede fissa (ambulanti, trasporto…) è quello del Comune di residenza del titolare o della
        sede legale della società.
      status: verified
      source: dd117
    - text: >-
        Due imprese non possono notificare lo stesso stabilimento: se gli spazi non sono
        sufficientemente separati, la responsabilità resta all'impresa che ha fatto la notifica per
        l'intero stabilimento (anche in caso di affido di reparto).
      status: verified
      source: dd117
legal_basis:
  - text: Reg. (CE) n. 852/2004, art. 6 – notifica ai fini della registrazione.
    status: verified
    source: notifica-form
  - text: >-
      Reg. (CE) n. 852/2004, art. 5 – obbligo di procedure di autocontrollo basate sui principi
      HACCP (testo non aperto: EUR-Lex non era raggiungibile).
    status: unverified
  - text: >-
      DGRC n. 318 del 21/05/2015, il cui allegato è stato sostituito dal Decreto Dirigenziale
      regionale n. 117 del 30/04/2020 ("Procedure per le notifiche ed il riconoscimento degli
      stabilimenti…"): in Campania le notifiche si fanno con Comunicazione, SCIA o SCIA
      condizionata presentate al SUAP.
    status: verified
    source: dd117
  - text: >-
      Moduli unificati nazionali (Accordo 46/CU del 4 maggio 2017, recepito con DGR 308/2017);
      moduli in uso aggiornati con i DD regionali n. 119 del 13/05/2021 (commercio) e n. 143 del
      10/06/2021 (somministrazione).
    status: verified
    source: surap-disciplina
deadline:
  rules:
    - text: >-
        La notifica va presentata prima di iniziare: con la SCIA l'attività può partire subito dopo
        la presentazione e i controlli arrivano dopo.
      status: verified
      source: comune-zone-tutelate
    - text: >-
        Il modulo permette di indicare l'avvio contestuale alla data della notifica o una data di
        decorrenza successiva.
      status: verified
      source: notifica-form
    - text: >-
        Le modifiche relative all'attività o allo stabilimento (compreso il cambio di legale
        rappresentante) vanno comunicate tempestivamente: è uno degli impegni dichiarati nel modulo.
      status: verified
      source: notifica-form
    - text: La registrazione non scade e non va rinnovata.
      status: verified
      source: dd117
  lateness:
    text: >-
      Avviare uno stabilimento senza notifica, anche per una sola linea d'attività, o non notificare
      il cambio dell'impresa titolare, è sanzionato "secondo la normativa vigente" (il decreto
      regionale non indica importi). Per l'importo rivolgersi all'ASL; non stimarlo.
    status: verified
    source: dd117
channels:
  - type: portal
    name: impresainungiorno – SUAP del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    preferred: true
    source: comune-suap-contatti
    notes: >-
      Per il Comune di Napoli è l'unico canale telematico accettato: le pratiche mandate via PEC o
      email non vengono istruite. La notifica sanitaria va inserita nella pratica SUAP (di solito
      la SCIA unica dell'attività); il SUAP la trasmette all'ASL.
  - type: desk
    name: SUAP – Comune di Napoli
    address: Piazza Cavour 42, II piano, Napoli
    booking: Solo su prenotazione online, dalla pagina "Avviare, variare, chiudere un'attività produttiva".
    source: comune-suap-contatti
    notes: Per informazioni e assistenza; le pratiche si presentano solo su impresainungiorno.
  - type: pec
    name: UOC Igiene degli Alimenti e Nutrizione (SIAN) – ASL Napoli 1 Centro
    address: sian@pec.aslna1centro.it
    source: asl-sian-uoc
    notes: >-
      Per chiarimenti con l'ASL, non per presentare la notifica (che passa dal SUAP). Sede: Via
      Comunale del Principe 13/A, c/o Presidio Frullone, plesso laterale, V piano.
  - type: phone
    name: SIAN – ASL Napoli 1 Centro
    address: 081 2549829 / 081 2549832 / 081 2549837
    source: asl-sian-uoc
payment:
  method: pagopa
  notes:
    - text: >-
        Diritti sanitari a favore dell'ASL: 20 euro per ogni linea d'attività per l'avvio e le
        altre procedure degli stabilimenti registrabili; 20 euro in tutto per il subingresso.
        Cessazione, sospensione, riattivazione, variazione della sede legale e delle schede
        supplementari sono esenti. Importi del tariffario regionale DCA n. 94 del 5/11/2018,
        richiamato dal decreto. Il decreto è del 2020: confermare l'importo attuale con l'ASL
        prima di pagare.
      status: verified
      source: dd117
    - text: >-
        Il decreto regionale è del 2020; le tariffe nazionali per i controlli ufficiali sono state
        riordinate dal D.Lgs. 32/2021 (testo non controllato). Prima di pagare, confermare
        l'importo con l'ASL o con il SUAP.
      status: unverified
    - text: >-
        La ricevuta del pagamento dei diritti sanitari fa parte della pratica: va allegata alla
        notifica e il SUAP la chiede se manca.
      status: verified
      source: dd117
    - text: >-
        L'ASL Napoli 1 Centro indica sulla pagina della UOC SIAN l'IBAN aziendale per pagare i
        diritti sanitari (bonifico); copiarlo da lì.
      status: verified
      source: asl-sian-uoc
    - text: >-
        Per la notifica non si paga l'imposta di bollo: è una comunicazione, non un'istanza.
      status: verified
      source: dd117
    - text: >-
        Il SUAP di Napoli chiede inoltre i propri diritti d'istruttoria, pagati solo con pagoPA
        dentro impresainungiorno. Nell'esempio del Comune (SCIA unica di apertura di un bar) sono
        120 euro: 100 per la pratica commerciale e 20 per la notifica sanitaria. Gli importi delle
        altre pratiche sono nella tabella del Comune.
      status: verified
      source: comune-suap-diritti
documents:
  - name: Notifica ai fini della registrazione (art. 6 Reg. CE 852/2004), compilata e firmata
    required: true
    notes: Di solito come allegato della SCIA unica dell'attività (somministrazione, vicinato…).
  - name: Ricevuta del pagamento dei diritti sanitari all'ASL
    required: true
    notes: Non serve per le procedure esenti (cessazione, sospensione, riattivazione…).
  - name: Ricevuta dei diritti d'istruttoria del SUAP (pagoPA in impresainungiorno)
    required: true
  - name: Planimetria dei locali
    required: false
    notes: >-
      Solo per le linee d'attività per cui la master list regionale la prevede; la master list e
      l'"Elenco documentazione" sono pubblicati sul sito regionale GISA (non raggiungibile durante
      questa verifica).
  - name: Schede supplementari previste dalla master list per la linea d'attività
    required: false
    notes: >-
      Per alcune linee (es. distributori automatici, trasporto conto terzi) le schede si compilano
      direttamente in GISA dopo l'accreditamento.
  - name: Procura, se la pratica la presenta un intermediario
    required: false
