verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: letti la pagina dell'ASL Napoli 1 Centro sul libretto sanitario alimentaristi, le
    pagine dell'Area igienistica e della UOSD Prevenzione Collettiva 28-30, il DD regionale
    76/2018, il DD 110/2018 con disciplinare e format dell'attestato (PDF dal portale Personale
    SSR della Regione), le pagine Avvisi, Normativa e Modulistica di quel portale, la FAQ del
    SURAP sull'attestato di alimentarista, la sentenza del Consiglio di Stato n. 7346/2020 e
    l'art. 6 del D.Lgs. 193/2007 su Normattiva.
  notes: >-
    Non aperti: DGRC 623/2014 (prescrizione a 60 giorni, citata dal disciplinare), DGR 318/2015,
    DGR 242/2013, il tariffario regionale dei Dipartimenti di Prevenzione e il testo del Reg.
    CE 852/2004 su EUR-Lex. Non trovato l'elenco regionale degli enti autorizzati. Il modello di
    domanda dell'ASL non è pubblicato, quindi nessun modulo è mappato.
