verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: lette le pagine del Comune di Napoli sui verbali CdS e non CdS, pagamento, visione e
    copie, riduzione del 30%, patente a punti, rateizzazione, cartelle, la scheda del Servizio
    Sanzioni Amministrative e il servizio POTESs; i moduli del Comune per la comunicazione del
    conducente e per il ricorso al Prefetto (pdftotext) e la scheda degli elementi essenziali; le
    pagine della Prefettura di Napoli sui ricorsi CdS e sull'Area 3; su Normattiva gli artt. 126-bis,
    196, 201, 202, 202-bis, 203, 204, 204-bis, 205, 206 CdS, gli artt. 6 e 7 D.Lgs. 150/2011 e gli
    artt. 14, 16, 18, 22, 26, 27, 28 L. 689/1981.
  notes: >-
    Non verificati: indirizzo e orari dell'Ufficio del Giudice di Pace (solo dalla pagina del
    Comune), il numero civico di Via Vespucci e il funzionamento attuale di sana.interno.it (non
    raggiungibile il 25/10/2026).
