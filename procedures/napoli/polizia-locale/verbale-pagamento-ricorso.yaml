schema_version: 0
id: napoli/polizia-locale/verbale-pagamento-ricorso
title: Verbale (multa) della Polizia Locale di Napoli – controllarlo, pagarlo, comunicare il conducente o fare ricorso
headline: "Multa dei vigili a Napoli: come pagarla, contestarla o comunicare il conducente"
aka:
  - contravvenzione
  - verbale dei vigili urbani
  - ricorso al Prefetto
  - multa ZTL
updated: 2026-10-26
summary: >-
  Chi riceve un verbale della Polizia Locale di Napoli, per una violazione del Codice della Strada
  o di regolamenti comunali, commerciali o ambientali, può pagarlo in misura ridotta, comunicare
  chi guidava (se il verbale è arrivato al proprietario del veicolo), oppure contestarlo: ricorso al
  Prefetto o al Giudice di Pace per il Codice della Strada, scritti difensivi entro 30 giorni per le
  altre violazioni. Vale per privati, ditte e società; se non si paga e non si ricorre, la somma
  aumenta e passa alla riscossione coattiva.
ente:
  name: Comune di Napoli
  office: Servizio Sanzioni Amministrative (Area Entrate), per i verbali della Polizia Locale
  ipa: c_f839
applies_to:
  events: [letter]
  audience: [business, resident]
  conditions:
    - text: >-
        Verbale di violazione del Codice della Strada elevato dalla Polizia Locale di Napoli,
        contestato subito (consegnato su strada) oppure notificato dopo, al trasgressore o al
        proprietario del veicolo (obbligato in solido).
      status: verified
      source: cds-verbali
    - text: >-
        Verbale della Polizia Locale o di altre forze di polizia per violazioni di regolamenti
        comunali, ambientali, commerciali e reati depenalizzati (non Codice della Strada): regole
        diverse (L. 689/1981), descritte nella pagina "Verbali per infrazioni diverse dal C.d.S.".
      status: verified
      source: extra-cds
    - text: >-
        Il Servizio Sanzioni Amministrative gestisce i procedimenti per Codice della Strada,
        regolamenti comunali e ordinanze sindacali, ma non i casi legati all'occupazione di suolo
        pubblico che non siano verbali emessi ai sensi del Codice della Strada: per quelli seguire
        l'ufficio e le istruzioni indicati sul verbale.
      status: verified
      source: servizio-sanzioni
    - text: >-
        Il proprietario del veicolo (o l'usufruttuario, l'acquirente con patto di riservato
        dominio, l'utilizzatore in leasing; il locatario nei noleggi) risponde in solido con chi ha
        commesso la violazione, salvo che provi che il veicolo circolava contro la sua volontà.
      status: verified
      source: cds-196
legal_basis:
  - text: Codice della Strada (D.Lgs. 285/1992), art. 202 – pagamento in misura ridotta e riduzione del 30%.
    status: verified
    source: cds-202
  - text: Art. 202-bis CdS – rateazione delle sanzioni pecuniarie.
    status: verified
    source: cds-202bis
  - text: Artt. 203 e 204 CdS – ricorso al Prefetto e sua decisione.
    status: verified
    source: cds-203
  - text: Art. 204-bis CdS – opposizione davanti all'autorità giudiziaria, regolata dall'art. 7 D.Lgs. 150/2011.
    status: verified
    source: dlgs150-art7
  - text: Art. 126-bis CdS – patente a punti e comunicazione dei dati del conducente.
    status: verified
    source: cds-126bis
  - text: >-
      Opposizione al Giudice di Pace contro il verbale CdS: art. 7 D.Lgs. 150/2011; contro
      un'ordinanza-ingiunzione: art. 6 D.Lgs. 150/2011 (richiamato dall'art. 205 CdS e dall'art. 22
      L. 689/1981).
    status: verified
    source: dlgs150-art7
  - text: >-
      Violazioni diverse dal Codice della Strada: L. 689/1981, art. 14 (contestazione e notifica),
      art. 16 (pagamento in misura ridotta), art. 18 (scritti difensivi e ordinanza-ingiunzione),
      art. 27 (esecuzione forzata), art. 28 (prescrizione).
    status: verified
    source: l689-art18
deadline:
  rules:
    - text: >-
        Codice della Strada, pagamento in misura ridotta: entro 60 giorni dalla contestazione o
        dalla notificazione si paga il minimo fissato dalla norma violata; la somma è ridotta del
        30% se si paga entro 5 giorni (art. 202, c. 1).
      status: verified
      source: cds-202
    - text: >-
        La riduzione del 30% non si applica alle violazioni per cui è prevista la sanzione
        accessoria della confisca del veicolo (art. 210, c. 3) o della sospensione della patente
        (art. 202, c. 1). Secondo il Comune non si applica nemmeno alle spese di notificazione e
        accertamento, né alle violazioni diverse dal Codice della Strada (per esempio ai
        regolamenti comunali).
      status: verified
      source: riduzione-30
    - text: >-
        Il pagamento in misura ridotta non è ammesso in alcuni casi (art. 202, cc. 3 e 3-bis: per
        esempio chi non si è fermato all'invito dell'agente o ha rifiutato di esibire i documenti):
        in quei casi la somma la stabilisce il Prefetto con ordinanza-ingiunzione.
      status: verified
      source: cds-202
    - text: >-
        Ricorso al Prefetto di Napoli: entro 60 giorni dalla contestazione o dalla notificazione,
        solo se non si è già pagato in misura ridotta (art. 203, c. 1).
      status: verified
      source: cds-203
    - text: >-
        Ricorso al Giudice di Pace (in alternativa al Prefetto): entro 30 giorni dalla
        contestazione o dalla notificazione (60 se il ricorrente risiede all'estero), a pena di
        inammissibilità; è inammissibile se si è già fatto ricorso al Prefetto (art. 7, c. 3,
        D.Lgs. 150/2011).
      status: verified
      source: dlgs150-art7
    - text: >-
        Comunicazione dei dati del conducente (se il conducente non è stato identificato e il
        verbale comporta la perdita di punti): entro 60 giorni dalla notifica del verbale
        (art. 126-bis, c. 2).
      status: verified
      source: cds-126bis
    - text: >-
        Rateazione di una sanzione CdS: istanza entro 30 giorni dalla contestazione o
        notificazione (art. 202-bis, c. 5).
      status: verified
      source: cds-202bis
    - text: >-
        Violazioni diverse dal Codice della Strada: pagamento in misura ridotta entro 60 giorni
        dalla contestazione o notificazione; scritti difensivi e documenti entro 30 giorni (artt. 16
        e 18 L. 689/1981). Il Comune chiede di esibire la ricevuta di pagamento entro 10 giorni
        dal pagamento.
      status: verified
      source: extra-cds
    - text: >-
        Ordinanza-ingiunzione (del Prefetto dopo un ricorso respinto, o del Comune per le
        violazioni diverse dal CdS): opposizione al giudice entro 30 giorni dalla notifica (60 se
        residenti all'estero); il pagamento va fatto entro 30 giorni dalla notifica (art. 204, c. 2
        CdS; art. 18 L. 689/1981).
      status: verified
      source: dlgs150-art6
  lateness:
    text: >-
      Codice della Strada: se nei termini non si paga e non si ricorre, il verbale diventa titolo
      esecutivo per la metà del massimo della sanzione edittale più le spese di procedimento
      (art. 203, c. 3) e si procede alla riscossione coattiva. Non calcolare da sé gli importi:
      farseli indicare dal Servizio Sanzioni Amministrative o leggerli sull'atto ricevuto.
    status: verified
    source: cds-203
cost:
  text: >-
    Il ricorso al Prefetto si scrive in carta libera, senza marca da bollo. Il ricorso al Giudice
    di Pace è soggetto al contributo unificato e alle spese forfettizzate (art. 10, c. 6-bis, DPR
    115/2002): chiederne l'importo alla cancelleria. La multa e le spese di notifica sono a parte,
    come scritte sul verbale.
  status: verified
  source: prefettura-ricorsi
duration:
  text: >-
    Il Prefetto deve decidere sul ricorso entro 180 giorni se è presentato all'organo accertatore
    (il Comune), entro 210 se presentato tramite la Prefettura; se non decide in tempo, il ricorso
    si intende accolto (art. 204, c. 1-bis CdS). La decisione va poi notificata entro 150 giorni.
  status: verified
  source: prefettura-ricorsi
appointment:
  text: >-
    Per pagare non serve: si paga online con pagoPA o con il bollettino. Ricorsi, comunicazioni e
    istanze si depositano allo sportello di Via Diocleziano 330 (martedì, giovedì e venerdì
    8:00–13:00), per cui il Comune non indica appuntamento, o si inviano via PEC o raccomandata.
    L'appuntamento serve per vedere il verbale in ufficio senza copia: al telefono 081 7957292 o
    con la prenotazione online del Comune.
  status: verified
  source: visione-copie
channels:
  - type: portal
    name: POTESs – Multe al CdS e Sanzioni Amministrative
    url: https://servizionline.comune.napoli.it/web/napoli/sanzioni-amministrative
    auth: [spid, cie, cns]
    preferred: true
    source: potess-sanzioni
    notes: >-
      Per consultare preavvisi e verbali e, solo per ZTL e aree pedonali, le immagini delle
      violazioni.
  - type: portal
    name: PartenoPay (pagoPA del Comune di Napoli)
    url: https://partenopay.comune.napoli.it/
    auth: [none, spid]
    source: pagamento
    notes: >-
      Percorso indicato dal Comune: Pagamento Spontaneo, Comune di Napoli, Sanzioni
      Amministrative, Multe per Violazioni al Codice della Strada. Si paga online o si stampa
      l'avviso pagoPA da pagare a uffici postali, banche, ATM, tabaccherie e home banking CBILL.
  - type: desk
    name: Servizio Sanzioni Amministrative (sportello e box informazioni)
    address: Via Diocleziano 330, 80124 Napoli
    hours: martedì, giovedì e venerdì 8:00–13:00
    booking: >-
      Per vedere il verbale senza copia, appuntamento al telefono 081 7957292 o tramite il
      servizio di prenotazione online indicato dal Comune.
    source: visione-copie
    notes: >-
      Qui si depositano ricorsi al Prefetto, scritti difensivi, comunicazioni dei dati del
      conducente e istanze di rateazione. Il portale POTESs e il modulo del conducente indicano
      anche martedì e giovedì 14:00–17:00.
  - type: pec
    name: Ufficio Ricorsi al Prefetto e patente a punti
    address: ricorsi.prefetto@pec.comune.napoli.it
    receipt: legal
    source: cds-verbali
    notes: >-
      Indicata dal Comune per i ricorsi al Prefetto e per la comunicazione dei dati del
      conducente. La legge ammette il ricorso via PEC all'ufficio dell'organo accertatore
      (art. 203 CdS).
  - type: pec
    name: U.O. Ingiunzioni (violazioni diverse dal CdS)
    address: sanzioni.amministrative.ingiunzioni@pec.comune.napoli.it
    receipt: legal
    source: extra-cds
    notes: >-
      Per scritti difensivi, ricevute di pagamento e rateazione delle ingiunzioni. Nell'oggetto
      indicare "scritti difensivi verbale n…" o "pagamento verbale n…".
  - type: pec
    name: Ufficio Ruoli e Sgravi (cartelle esattoriali)
    address: sanzioni.amministrative.ruolisgravi@pec.comune.napoli.it
    receipt: legal
    source: cartelle
  - type: pec
    name: Ufficio Rateizzi
    address: sanzioni.amministrative.rateizzi@pec.comune.napoli.it
    receipt: legal
    source: rateizzazione-cds
  - type: post
    name: Ricorso al Prefetto tramite il Comune
    address: >-
      Al Prefetto di Napoli tramite Servizio Sanzioni Amministrative – Ufficio Ricorsi al
      Prefetto, Via Diocleziano 330, 80124 Napoli
    source: mod-ricorso
    notes: Raccomandata A/R.
  - type: post
    name: Ricorso direttamente al Prefetto di Napoli
    address: Prefettura di Napoli, Via Vespucci 172, Napoli
    source: cds-verbali
    notes: >-
      Raccomandata A/R. Il numero civico 172 lo indica il Comune; la Prefettura scrive solo che
      l'Area III ha sede in Via Vespucci.
  - type: pec
    name: Prefettura di Napoli (ricorso firmato digitalmente)
    address: prefettura.prefna@pec.interno.it
    receipt: legal
    source: prefettura-ricorsi
    notes: >-
      Indirizzo indicato nella pagina dei ricorsi; altre pagine della Prefettura indicano
      protocollo.prefna@pec.interno.it. Non si può usare l'e-mail ordinaria.
  - type: desk
    name: Ufficio del Giudice di Pace di Napoli
    address: Via Foria 2 (ex Caserma Garibaldi), Napoli
    source: cds-verbali
    notes: >-
      Deposito o raccomandata A/R del ricorso; il Comune chiede l'originale più 5 copie.
  - type: phone
    name: Servizio Sanzioni Amministrative
    address: 081 7957211
    source: servizio-sanzioni
payment:
  method: pagopa
  notes:
    - text: >-
        Codice della Strada: oltre a pagoPA (PartenoPay), il Comune indica il bollettino postale
        allegato al verbale sul c/c postale n. 1033919109 oppure il bonifico all'IBAN pubblicato
        nella stessa pagina (conto postale del Comune di Napoli con lo stesso numero), indicando
        nella causale numero e data del verbale.
      status: verified
      source: cds-verbali
    - text: >-
        Violazioni diverse dal CdS: il Comune indica il c/c postale n. 1033919224 o il bonifico
        all'IBAN di quel conto pubblicato nella stessa pagina (Comune di Napoli – DCSF Serv. Gest.
        San. Amm. Violazioni Leggi e Regolamenti), con il numero del verbale in causale; poi la ricevuta va
        esibita entro 10 giorni alla U.O. Ingiunzioni (sportello o PEC).
      status: verified
      source: extra-cds
    - text: >-
        Per i pagamenti diversi da contanti o conto corrente postale, il pagamento vale se
        l'accredito al Comune arriva entro due giorni dalla scadenza (interpretazione dell'art. 202,
        c. 1, data dall'art. 17-quinquies D.L. 18/2016).
      status: verified
      source: cds-202
    - text: >-
        Controllare che coordinate o avviso pagoPA corrispondano a quelli pubblicati dal Comune:
        il verbale deve indicare le modalità di pagamento (art. 202, c. 2). Un verbale che chiede
        di pagare su un conto diverso va verificato con il Servizio Sanzioni prima di pagare.
      status: unverified
    - text: >-
        Pagare in misura ridotta chiude la vicenda: dopo il pagamento il ricorso al Prefetto è
        inammissibile.
      status: verified
      source: prefettura-ricorsi
  rateazione: >-
    Codice della Strada (art. 202-bis): per sanzioni oltre 200 euro e reddito imponibile IRPEF non
    superiore a 10.628,16 euro (più 1.032,91 euro per ogni familiare convivente), istanza entro 30
    giorni al Servizio Sanzioni (sportello o PEC rateizzi) con il modello del Comune; fino a 12
    rate se l'importo non supera 2.000 euro, fino a 24 se non supera 5.000, fino a 60 oltre; rata
    minima 100 euro, più interessi; l'istanza vale come rinuncia al ricorso e senza risposta entro
    90 giorni si intende respinta. Ordinanze-ingiunzioni: rate da 3 a 30 (art. 26 L. 689/1981).
documents:
  - name: Il verbale (o il preavviso) ricevuto, con la busta o la relata che mostrano la data di notifica
    required: true
    notes: Da questa data decorrono tutti i termini.
  - name: Copia del documento d'identità di chi firma ricorsi, istanze o comunicazioni
    required: true
  - name: Copia fotostatica firmata della patente (o CQC) del conducente
    required: false
    notes: Solo per la comunicazione dei dati del conducente (art. 126-bis).
  - name: Prove a sostegno del ricorso (foto, testimonianze, certificati, atto di vendita del veicolo…)
    required: false
  - name: Delega e documento del delegato, se presenta un'altra persona
    required: false
  - name: Mandato all'avvocato, se il ricorso lo presenta un legale
    required: false
