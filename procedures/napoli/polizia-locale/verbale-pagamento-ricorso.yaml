steps:
  - do: >-
      Leggere il verbale: chi lo ha emesso, norma violata, importi (ridotto del 30% entro 5 giorni,
      ridotto entro 60 giorni), spese, punti patente e data di notifica, da cui partono i termini
    who: anyone
  - do: >-
      Controllare che sia autentico: cercarlo su POTESs (SPID, CIE o CNS) o chiedere al box
      informazioni del Servizio Sanzioni (081 7957292), e confrontare le coordinate di pagamento
      con quelle pubblicate dal Comune
    who: anyone
  - do: >-
      Per vedere il verbale e le foto: su POTESs (immagini solo per ZTL e aree pedonali); per
      gli altri, visione in ufficio su appuntamento; per avere copia, richiesta di accesso agli atti
      tramite URP
    who: anyone
  - do: >-
      Se il veicolo è intestato a lei o alla sua società e non guidava lei: compilare la
      comunicazione dei dati del conducente e farla firmare al conducente
    who: anyone
  - do: Firmare la comunicazione del conducente e inviarla entro 60 giorni dalla notifica (PEC, raccomandata o a mano)
    who: owner
    human_only: true
  - do: >-
      Scegliere: pagare (entro 5 giorni con lo sconto del 30% se previsto, altrimenti entro 60),
      chiedere la rateazione (entro 30 giorni), fare ricorso al Prefetto (entro 60 giorni) o al
      Giudice di Pace (entro 30 giorni); per le violazioni non CdS, pagare o presentare scritti
      difensivi entro 30 giorni
    who: owner
    human_only: true
  - do: Pagare con pagoPA (PartenoPay) o con le coordinate indicate dal Comune, con numero e data del verbale in causale
    who: owner
    human_only: true
  - do: Per i verbali non CdS, inviare la ricevuta di pagamento alla U.O. Ingiunzioni entro 10 giorni
    who: owner
    human_only: true
  - do: >-
      Per contestare un verbale CdS davanti al Prefetto: preparare il ricorso sul modello del Comune
      con motivi, documenti ed eventuale richiesta di audizione
    who: anyone
  - do: >-
      Firmare il ricorso e depositarlo o spedirlo (Servizio Sanzioni, raccomandata A/R al Prefetto o
      PEC) entro 60 giorni, allegando il verbale
    who: owner
    human_only: true
  - do: >-
      Se si sceglie il Giudice di Pace: depositare o spedire il ricorso entro 30 giorni all'Ufficio
      del Giudice di Pace di Napoli (originale più 5 copie)
    who: owner
    human_only: true
  - do: >-
      Se è stato fatto ricorso e il verbale toglie punti: inviare all'Ufficio Decurtazione Punti la
      prova del ricorso (frontespizio o ricevuta), come consiglia il Comune
    who: owner
    human_only: true
after:
  - Conservare il verbale, la prova della data di notifica e tutte le ricevute (pagamento, PEC, raccomandata).
  - >-
    Dopo un ricorso al Prefetto: se accolto arriva l'archiviazione; se respinto un'ordinanza-
    ingiunzione da pagare o impugnare entro 30 giorni. Il Comune indica di seguire l'esito sul sito
    sana.interno.it (prefettura di Napoli, numero del verbale e nominativo).
  - >-
    Se arriva una cartella o un'ingiunzione di riscossione per un verbale già pagato, contestato in
    tempo o mai notificato regolarmente, chiedere lo sgravio in autotutela all'Ufficio Ruoli e
    Sgravi; per pagarla a rate rivolgersi ad Agenzia delle entrate-Riscossione o a Napoli Obiettivo
    Valore, secondo chi l'ha emessa.
  - Controllare i punti della patente sul Portale dell'automobilista dopo la definizione del verbale.
pitfalls:
  - text: >-
      I termini di 5, 30 e 60 giorni partono dalla contestazione su strada o dalla notifica del
      verbale, non dal preavviso lasciato sul parabrezza: contro il preavviso non si può fare
      ricorso, si attende la notifica.
    status: verified
    source: prefettura-ricorsi
  - text: >-
      Il ricorso al Prefetto e quello al Giudice di Pace sono alternativi: non si possono presentare
      entrambi contro lo stesso verbale. Se il Prefetto respinge il ricorso, l'ordinanza-ingiunzione
      è di almeno il doppio del minimo previsto per la violazione, più le spese (art. 204).
    status: verified
    source: cds-204
  - text: >-
      Il Prefetto decide entro 120 giorni dal ricevimento degli atti; sommati ai termini di
      trasmissione la Prefettura indica 180 giorni (ricorso presentato al Comune) o 210 giorni
      (ricorso spedito direttamente al Prefetto). Se non decide in tempo, il ricorso si intende
      accolto; il termine si sospende se si è chiesta l'audizione.
    status: verified
    source: prefettura-ricorsi
  - text: >-
      Davanti al Giudice di Pace si apre una causa: se il ricorso è respinto il giudice fissa la
      sanzione tra minimo e massimo (art. 7, c. 11) e la Prefettura avverte che si possono dover
      pagare le spese della controparte. Gli atti sono esenti da tasse e imposte, salvo quanto
      previsto dall'art. 10, c. 6-bis, DPR 115/2002 (art. 7, c. 13): chiedere alla cancelleria se e
      quanto si deve versare.
    status: verified
    source: dlgs150-art7
  - text: >-
      Chi non comunica i dati del conducente senza giustificato e documentato motivo paga una
      sanzione da 291 a 1.166 euro (art. 126-bis, c. 2, testo su Normattiva). La pagina del Comune
      indica invece 269,00 euro: vale l'importo scritto sul verbale.
    status: disputed
    source: cds-126bis
  - text: >-
      La comunicazione dei dati del conducente va fatta anche se si paga il verbale. Se il veicolo è
      di una società, la fa il legale rappresentante o un suo delegato.
    status: verified
    source: patente-punti
  - text: >-
      Il Comune dice che, in caso di ricorso, i 60 giorni per comunicare il conducente decorrono
      anche dalla notifica del provvedimento che chiude il ricorso; il testo dell'art. 126-bis
      parla solo dei 60 giorni dalla notifica del verbale. Per prudenza comunicare entro 60 giorni
      dalla notifica del verbale.
    status: disputed
    source: patente-punti
  - text: >-
      Per il ricorso al Prefetto la pagina del Comune chiede di allegare l'originale del verbale;
      la Prefettura e la scheda "Elementi essenziali" del Comune parlano di copia. Conservare
      sempre una copia di tutto.
    status: disputed
    source: cds-verbali
  - text: >-
      Sulla rateazione delle sanzioni CdS la pagina dei ricorsi della Prefettura di Napoli dice che
      non è ammessa "in alcun caso" per il pagamento in misura ridotta; l'art. 202-bis e le pagine
      del Comune la ammettono, con i requisiti di reddito. Il Comune elenca solo le fasce fino a
      12 e 24 rate, la legge prevede fino a 60 rate oltre 5.000 euro.
    status: disputed
    source: rateizzazione-cds
  - text: >-
      La pagina CdS del Comune dice che un bonifico vale dalla data di accredito (circolare del
      14 gennaio 2016); la legge successiva (art. 17-quinquies D.L. 18/2016) considera valido
      l'accredito entro due giorni dalla scadenza. Meglio pagare con qualche giorno di anticipo.
    status: disputed
    source: cds-verbali
  - text: >-
      Per le violazioni diverse dal CdS la pagina del Comune dice di pagare "solo tramite C.C.
      postale" (o bonifico su quel conto), mentre la pagina pagoPA indica PartenoPay con il percorso
      "Multe per Violazioni al Codice della Strada": per i verbali non CdS usare le coordinate
      scritte sul verbale.
    status: disputed
    source: extra-cds
  - text: >-
      Le immagini consultabili online riguardano solo ZTL e aree pedonali; per autovelox o altre
      violazioni serve la visione in ufficio o l'accesso agli atti. Il vecchio link del Comune al
      portale pmm.napoli.it non rispondeva il 25/10/2026; il servizio è su POTESs.
    status: verified
    source: potess-sanzioni
  - text: >-
      Le regole per i regolamenti comunali possono prevedere importi ridotti diversi: per le
      violazioni di regolamenti e ordinanze comunali la Giunta può fissare un pagamento in misura
      ridotta diverso da quello della legge (art. 16, c. 2, L. 689/1981). Vale l'importo sul verbale.
    status: verified
    source: l689-art16
  - text: >-
      Se un veicolo era già venduto al momento della violazione, la Prefettura consiglia di
      mandare all'organo che ha emesso il verbale copia dell'atto di vendita autenticato o della
      visura PRA, e comunque di fare ricorso, perché l'annullamento d'ufficio non è garantito.
    status: verified
    source: prefettura-ricorsi
  - text: >-
      In caso di ritardo nel pagamento dopo che la sanzione è diventata esigibile, la somma è
      maggiorata di un decimo per ogni semestre fino alla trasmissione del ruolo; per il Codice
      della Strada la maggiorazione non può superare i tre quinti della sanzione (art. 27 L.
      689/1981). L'importo lo indica l'atto di riscossione, non va stimato.
    status: verified
    source: l689-art27
  - text: >-
      Il diritto a riscuotere le sanzioni si prescrive in cinque anni dal giorno della violazione;
      l'interruzione segue il codice civile (art. 28 L. 689/1981).
    status: verified
    source: l689-art28
