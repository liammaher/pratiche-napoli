steps:
  - do: >-
      Stabilire la sezione: imprenditore commerciale (sezione ordinaria) o piccolo imprenditore
      (sezione speciale); se l'attività è artigiana, verificare requisiti e incompatibilità per
      l'annotazione nella sezione artigiana. La scelta incide sul diritto annuale (44 € o 100 €).
    who: anyone
  - do: >-
      Verificare su ateco.infocamere.it codice ATECO e allegati richiesti; il codice deve
      coincidere con quello dichiarato per la partita IVA.
    who: anyone
  - do: Attivare una PEC intestata all'impresa (non usata da altre imprese) e procurarsi la firma digitale
    who: owner
    human_only: true
  - { do: Aderire gratuitamente a Telemaco e caricare il credito sul conto, who: owner, human_only: true }
  - do: >-
      Se l'attività richiede una SCIA o una comunicazione al SUAP di Napoli, compilarla su
      impresainungiorno partendo dalla pratica in DIRE (pulsante SUAP) e importarla nella pratica
      del Registro Imprese, così da inviarle insieme.
    who: anyone
  - do: >-
      Compilare in DIRE la pratica "Iscrizione – Impresa individuale con inizio attività" (per le
      artigiane: compilazione "ad adempimenti Albo Artigiani" – "Impresa individuale con inizio
      attività artigiana"), con data di costituzione uguale alla data di invio, sezione e
      qualifica, PEC, attività primaria e secondarie, partita IVA, quadri per INPS (AC per i
      commercianti, AA per gli artigiani) e INAIL se dovuti, dati del dichiarante e allegati.
    who: anyone
  - do: Se presenta un intermediario, firmare a mano la procura e consegnarla con copia del documento d'identità
    who: owner
    human_only: true
  - do: Selezionare bollo e diritti di segreteria, firmare digitalmente la pratica e inviarla al Registro Imprese di Napoli
    who: owner
    human_only: true
  - do: Pagare il diritto annuale con il prepagato Telemaco all'invio, oppure con F24 entro 30 giorni dall'invio
    who: owner
    human_only: true
  - do: >-
      Controllare la PEC: ricevuta, codice fiscale e partita IVA, esiti degli altri enti ed
      eventuali richieste di integrazione del Registro Imprese, a cui rispondere nel termine
      indicato.
    who: owner
after:
  - >-
    La ricevuta del Registro Imprese è titolo per l'immediato avvio dell'attività, se ci sono i
    presupposti di legge; gli enti comunicano per via telematica subito codice fiscale e partita
    IVA ed entro i quattro giorni successivi gli altri dati delle posizioni registrate (art. 9
    D.L. 7/2007).
  - Conservare la ricevuta, il numero REA e copia della pratica inviata.
  - >-
    Gli artigiani sono iscritti d'ufficio negli elenchi INPS degli artigiani; i commercianti sono
    iscritti alla Gestione Commercianti con il quadro AC della pratica. Vanno iscritti anche i
    familiari che lavorano nell'impresa con abitualità e prevalenza.
  - >-
    Dall'anno successivo il diritto annuale si paga ogni anno alla scadenza ordinaria (vedi
    napoli/camera-di-commercio/diritto-annuale); le comunicazioni arrivano alla PEC.
  - >-
    Modifiche (sede, attività, denominazione) e cessazione si comunicano con una nuova
    Comunicazione Unica entro 30 giorni.
  - >-
    Se l'impresa occupa un locale a Napoli, presentare entro 90 giorni la dichiarazione TARI per
    uso non abitativo (napoli/comune/tari-iscrizione-non-domestica).
records:
  - field: business.rea
    from: Ricevuta del Registro Imprese (numero REA)
  - field: business.partita_iva
    from: Comunicazione dell'Agenzia delle Entrate che segue l'invio della pratica
pitfalls:
  - text: >-
      La PEC comunicata al Registro Imprese deve essere valida, univoca (riconducibile a una sola
      impresa) e già attiva al momento dell'invio.
    status: verified
    source: sari-iscrizione
  - text: >-
      Senza domicilio digitale il Registro Imprese non sanziona ma sospende la domanda di
      iscrizione finché non viene integrata con la PEC.
    status: verified
    source: dl-179-2012
  - text: >-
      Per i commercianti, nella Comunicazione Unica va sempre compilato il quadro AC, che contiene
      gli obblighi previdenziali verso la Gestione Commercianti INPS; vanno iscritti anche parenti
      e affini entro il terzo grado che lavorano nell'impresa con abitualità e prevalenza.
    status: verified
    source: inps-commercianti
  - text: >-
      Se la pratica è rifiutata o archiviata, i diritti di segreteria non vengono restituiti,
      perché l'istruttoria è stata svolta.
    status: verified
    source: sari-iscrizione
  - text: >-
      Data di inizio attività: con SCIA contestuale coincide con la data di invio; per le attività
      soggette a SCIA non può essere anteriore all'invio al SUAP; per quelle soggette ad
      autorizzazione non può precedere il rilascio (e l'inizio va comunicato entro 6 mesi dal
      rilascio); per le attività libere è quella dell'effettivo inizio, non anteriore all'apertura
      della partita IVA.
    status: verified
    source: sari-iscrizione
  - text: >-
      Per le attività regolamentate con SUAP autonomo, la SCIA va inviata al SUAP e al Registro
      Imprese nello stesso giorno, allegando alla pratica camerale copia della SCIA con la
      ricevuta.
    status: verified
    source: sari-artigiana
  - text: >-
      La scheda della Camera per l'iscrizione con inizio attività indica come termine "nessuno",
      perché l'impresa si costituisce e inizia l'attività il giorno dell'invio; il codice civile
      (art. 2196) e la scheda per le imprese artigiane fissano invece 30 giorni dall'inizio.
      Contare comunque i 30 giorni dall'effettivo inizio.
    status: disputed
    source: sari-iscrizione
  - text: >-
      La pagina "Adempimenti" della Camera (aggiornata a ottobre 2026) descrive ancora
      ComunicaStarweb e webtelemaco, e la scheda per le imprese artigiane (agosto 2025) cita
      ComunicaStarweb; il Registro Imprese indica invece DIRE, che li ha sostituiti.
    status: verified
    source: na-adempimenti
  - text: >-
      L'annotazione come impresa artigiana è costitutiva (serve per le agevolazioni e per usare
      riferimenti all'artigianato nella ditta o nell'insegna) e decorre dalla presentazione:
      non si può far risalire a prima, anche se l'inizio attività viene denunciato retroattivamente.
    status: verified
    source: sari-artigiana
