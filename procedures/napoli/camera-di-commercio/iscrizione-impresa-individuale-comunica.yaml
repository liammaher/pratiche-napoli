schema_version: 0
id: napoli/camera-di-commercio/iscrizione-impresa-individuale-comunica
title: Iscrizione di un'impresa individuale al Registro delle Imprese con ComUnica – Camera di Commercio di Napoli
headline: "Aprire una ditta individuale a Napoli: iscrizione al Registro Imprese con ComUnica"
aka:
  - Comunicazione Unica
  - iscrizione Camera di Commercio
  - partita IVA ditta individuale
  - numero REA
  - impresa artigiana
updated: 2026-10-26
summary: >-
  Chi apre una ditta individuale con sede nella provincia di Napoli la iscrive al Registro delle
  Imprese della Camera di Commercio con la Comunicazione Unica (ComUnica): una sola pratica
  telematica che vale anche per la partita IVA (Agenzia delle Entrate), l'INPS, l'INAIL e,
  se serve, porta con sé la SCIA per il SUAP del Comune. Si presenta online con firma digitale
  e PEC dell'impresa, dal titolare o da un intermediario con procura, entro 30 giorni dall'inizio
  dell'attività; la ricevuta arriva subito e, se ci sono i presupposti di legge, consente di
  iniziare nello stesso giorno.
ente:
  name: Camera di Commercio, Industria, Artigianato e Agricoltura di Napoli
  office: Area Anagrafe Economica – Registro Imprese
applies_to:
  events: [open]
  audience: [business]
  sectors:
    - imprese individuali (commerciali, piccoli imprenditori, artigiane)
  conditions:
    - text: >-
        L'iscrizione al Registro delle Imprese è obbligatoria anche per gli imprenditori
        individuali: l'imprenditore commerciale individuale (art. 2195 c.c.) si iscrive nella
        sezione ordinaria; i piccoli imprenditori e coltivatori diretti (art. 2083 c.c.) e gli
        imprenditori agricoli nella sezione speciale, dove sono anche annotate le imprese
        artigiane (L. 443/1985).
      status: verified
      source: na-sezione-speciale
    - text: >-
        L'iscrizione nella sezione ordinaria produce gli effetti di pubblicità legale dell'art. 2193
        c.c.; quella nella sezione speciale produce effetti di pubblicità notizia (salvo che per gli
        imprenditori agricoli).
      status: verified
      source: na-sezione-ordinaria
    - text: >-
        Nella domanda il titolare dichiara se è "imprenditore commerciale" (sezione ordinaria) o
        "piccolo imprenditore" (sezione speciale, con la relativa qualifica). Non serve un atto
        pubblico.
      status: verified
      source: ri-impresa-individuale
    - text: >-
        Si presenta al Registro delle Imprese della provincia in cui si stabilisce la sede: per una
        sede nella provincia di Napoli, alla Camera di Commercio di Napoli.
      status: verified
      source: cc-2196
    - text: >-
        La Comunicazione Unica è una pratica informatica con un modello riepilogativo e i modelli
        per Registro Imprese, Agenzia delle Entrate, INPS, INAIL ed eventuale SCIA per il SUAP;
        si invia solo al Registro delle Imprese, che la smista agli altri enti.
      status: verified
      source: ri-comunica
    - text: >-
        Chi invia: il titolare con la propria firma digitale, oppure un intermediario incaricato
        con procura (circolare MISE 3616/C del 2008). Servono l'adesione a Telemaco e un domicilio
        digitale (PEC) a cui gli enti inviano ricevute ed esiti.
      status: verified
      source: ri-prerequisiti
    - text: >-
        Impresa artigiana: l'imprenditore deve esercitare personalmente e in prevalenza il proprio
        lavoro, anche manuale, nell'impresa, avere i requisiti tecnico-professionali se l'attività
        è regolamentata e rispettare i limiti dimensionali; può essere titolare di una sola impresa
        artigiana. È incompatibile con la posizione di titolare o socio lavorante in prevalenza di
        altre imprese e con un lavoro dipendente a tempo pieno o part-time superiore al 50%.
      status: verified
      source: sari-artigiana
legal_basis:
  - text: >-
      Art. 9 D.L. 7/2007 (convertito dalla L. 40/2007): la comunicazione unica si presenta al
      Registro delle Imprese per via telematica e vale per l'iscrizione e, sussistendo i
      presupposti, ai fini previdenziali, assistenziali e fiscali e per codice fiscale e partita
      IVA; si usa anche per modifiche e cessazione.
    status: verified
    source: dl-7-2007
  - text: >-
      Art. 2196 c.c.: entro trenta giorni dall'inizio dell'impresa l'imprenditore commerciale
      chiede l'iscrizione al Registro delle Imprese; modifiche e cessazione vanno iscritte entro
      trenta giorni.
    status: verified
    source: cc-2196
  - text: >-
      Art. 5 D.L. 179/2012: le imprese individuali che chiedono la prima iscrizione al Registro
      delle Imprese o all'albo delle imprese artigiane devono indicare un domicilio digitale (PEC).
    status: verified
    source: dl-179-2012
  - text: >-
      Art. 5, c. 2, D.P.R. 160/2010: la SCIA contestuale alla comunicazione unica si presenta al
      Registro delle Imprese, che la trasmette subito al SUAP.
    status: verified
    source: dpr-160-2010
  - text: >-
      Norme citate dalla scheda della Camera per l'iscrizione con inizio attività: art. 9 D.P.R.
      581/1995, art. 9 L. 40/2007, artt. 4 e 5 D.P.R. 160/2010, art. 80 D.Lgs. 59/2010, artt.
      2195 e 2135 c.c.; per le imprese artigiane anche art. 16 L.R. Campania 11/2015.
    status: verified
    source: sari-artigiana
deadline:
  rules:
    - text: >-
        Iscrizione entro 30 giorni dall'inizio dell'impresa (art. 2196 c.c.).
      status: verified
      source: cc-2196
    - text: >-
        I 30 giorni si contano dal giorno successivo a quello dell'evento; se il termine cade di
        sabato o in un giorno festivo, la domanda presentata il primo giorno lavorativo successivo
        è tempestiva (art. 3 D.P.R. 558/1999).
      status: verified
      source: na-sanzioni
    - text: >-
        Impresa artigiana: termine di 30 giorni per l'inizio attività; l'annotazione nella sezione
        artigiana decorre comunque dalla data di invio della pratica e non può essere retrodatata.
      status: verified
      source: sari-artigiana
    - text: >-
        Secondo l'INPS, la domanda di iscrizione all'Albo imprese artigiane va presentata entro
        30 giorni dall'inizio dell'attività artigiana; la Comunicazione Unica (quadro AA) vale
        anche per l'Albo.
      status: verified
      source: inps-artigiani
    - text: >-
        Se l'impresa è iscritta prima come "inattiva", la denuncia di inizio attività al REA va
        presentata entro 30 giorni dall'evento; oltre si applicano le sanzioni REA.
      status: verified
      source: na-sezione-speciale
  lateness:
    text: >-
      La pagina "Sanzioni" della Camera indica, per le imprese individuali (iscrizioni, modifiche e
      cessazioni dell'art. 2196 c.c.), una sanzione di 20,00 euro per il Registro Imprese, da
      pagare con F23 (codice tributo 741T) entro 60 giorni dalla notifica, più spese di
      procedimento e notifica indicate nel verbale. Per le denunce REA tardive (per esempio
      l'inizio attività) indica 10,00 euro se presentate entro 30 giorni dalla scadenza e 51,33
      euro oltre. Non calcolare l'importo da sé: fa fede il verbale; chiedere all'Ufficio Diritto
      Annuale e Sanzioni del Registro Imprese.
    status: verified
    source: na-sanzioni
cost:
  text: >-
    Imposta di bollo 17,50 € e diritti di segreteria 18,00 €, addebitati sul conto Telemaco,
    più il diritto annuale del primo anno. Se la pratica è rifiutata o archiviata, i diritti
    di segreteria non vengono restituiti.
  status: verified
  source: sari-iscrizione
duration:
  text: >-
    Il Registro Imprese rilascia la ricevuta subito all'invio e, se ci sono i presupposti di
    legge, la ricevuta permette di avviare l'attività da quel momento. Gli enti comunicano
    subito codice fiscale e partita IVA ed entro i quattro giorni successivi gli altri dati
    delle posizioni registrate.
  status: verified
  source: dl-7-2007
appointment:
  text: >-
    Non serve: la pratica si compila e si invia online, con lo strumento gratuito DIRE del
    Registro Imprese o con un software di mercato, firmata digitalmente dal titolare o da un
    intermediario con procura.
  status: verified
  source: ri-strumenti
channels:
  - type: portal
    name: DIRE – Depositi e Istanze al Registro imprese
    url: https://dire.registroimprese.it
    receipt: legal
    preferred: true
    source: ri-strumenti
    notes: >-
      Strumento gratuito del sistema camerale per compilare e inviare la Comunicazione Unica (in
      alternativa, i software di mercato). Sostituisce Fedra e ComunicaStarweb; dal 12 febbraio
      2026 il vecchio strumento ComUnica non è più disponibile e l'invio avviene dalla funzione
      integrata in DIRE. Serve l'adesione gratuita a Telemaco con credito sul conto.
  - type: pec
    address: registroimprese@na.legalmail.camcom.it
    receipt: legal
    source: na-sedi
    notes: >-
      PEC dell'Area Anagrafe Economica (Registro Imprese), per comunicare con l'ufficio; la
      pratica di iscrizione si invia in via telematica dal sistema del Registro Imprese.
  - type: desk
    name: Registro Imprese
    address: Corso Meridionale 58, 80143 Napoli
    hours: lunedì–giovedì 8:50–12:00; venerdì 8:50–11:00 (orari uffici)
    source: na-sedi
    notes: La pagina "Sanzioni" scrive CAP 80142 per lo stesso indirizzo.
  - type: desk
    name: Ufficio Artigianato (Albo e sezione imprese artigiane)
    address: Corso Meridionale 58, Palazzo Borsa Merci, Napoli
    hours: sportello martedì e giovedì lavorativi 10:30–11:30; informazioni dal martedì al venerdì 12:00–13:00 e 14:00–15:00
    source: na-artigianato
    notes: >-
      Telefono 081 7607507. Le pagine della Camera scrivono la PEC dell'ufficio in tre modi
      diversi (artigianato@na.legalmail.camcom.it, un link ad "artigianto@…" e
      artigianato@na.legalmail.it): verificarla prima di scrivere.
  - type: phone
    name: URP Camera di Commercio
    address: 081 7607712 / 081 7607716
    hours: lunedì–venerdì 8:50–12:30
    source: na-sedi
  - type: portal
    name: SARI – Supporto Specialistico Registro Imprese (Camera di Napoli)
    url: https://supportospecialisticori.infocamere.it/sariWeb/na
    auth: [none]
    receipt: none
    source: sari-iscrizione
    notes: Schede della Camera con importi, allegati e passaggi in DIRE; da lì si contatta l'assistenza.
payment:
  method: f24
  notes:
    - text: >-
        Iscrizione di impresa individuale con inizio attività (anche artigiana): imposta di bollo
        € 17,50, diritti di segreteria € 18,00, più il diritto annuale.
      status: verified
      source: sari-iscrizione
    - text: >-
        Gli stessi importi (bollo € 17,50, diritti di segreteria € 18,00) valgono per l'iscrizione
        senza immediato inizio dell'attività (impresa "inattiva").
      status: verified
      source: sari-senza-inizio
    - text: >-
        Impresa artigiana: se l'annotazione artigiana e l'inizio attività hanno date diverse sono
        dovuti diritti di segreteria distinti.
      status: verified
      source: sari-artigiana
    - text: >-
        Bollo e diritti si scelgono nella pratica ("Completa e allega") e sono addebitati sul conto
        Telemaco (prepagato, ricaricabile con carta di credito, oppure ICONTO). La registrazione a
        Telemaco è gratuita.
      status: verified
      source: ri-registrazione
    - text: >-
        Diritto annuale 2026 per le nuove iscrizioni (importi arrotondati all'euro): impresa
        individuale nella sezione speciale (piccoli imprenditori, artigiani, coltivatori diretti,
        imprenditori agricoli) € 44,00 per la sede e € 9,00 per unità locale; impresa individuale
        nella sezione ordinaria € 100,00 per la sede e € 20,00 per unità locale. Con unità locali
        si sommano gli importi non arrotondati (sezione speciale: € 8,80 per unità locale) e si
        arrotonda all'euro una sola volta sul totale (es. sede + 1 unità locale: € 52,80 → € 53).
      status: verified
      source: na-da-2026
    - text: >-
        Il diritto annuale delle nuove iscrizioni si paga al momento della domanda (prepagato
        Telemaco) oppure con modello F24 entro 30 giorni dall'invio della domanda di iscrizione.
      status: verified
      source: na-da-2026
documents:
  - name: Dispositivo di firma digitale del titolare (o del delegato)
    required: true
  - name: Casella PEC dell'impresa (domicilio digitale) valida, attiva e riferita solo a questa impresa
    required: true
  - name: Adesione a Telemaco con credito sul conto prepagato o ICONTO
    required: true
  - name: Procura per la Comunicazione Unica, con copia del documento d'identità del titolare
    required: false
    notes: Solo se firma e invia un intermediario (commercialista, associazione di categoria).
  - name: Documentazione richiesta per l'attività (requisiti, abilitazioni) secondo ateco.infocamere.it
    required: false
    notes: >-
      Dipende dal codice ATECO. La Camera indica di verificare gli allegati sul sito
      ateco.infocamere.it.
  - name: Dichiarazione sostitutiva per attività di fabbricazione, produzione, riparazione o confezione non regolamentate
    required: false
    notes: >-
      Modello della Camera di Napoli, da usare solo quando per l'ATECO non è prevista altra
      documentazione da depositare al REA per queste attività.
  - name: SCIA o comunicazione per il SUAP del Comune, se l'attività la richiede
    required: false
    notes: >-
      A Napoli la pratica SUAP si compila su impresainungiorno e si importa nella pratica del
      Registro Imprese (vedi le procedure SCIA del Comune).
