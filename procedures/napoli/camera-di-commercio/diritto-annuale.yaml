    due lettere 2026 (sezione ordinaria e sezione speciale/REA); la nota MIMIT n. 9347 del
    16/01/2026; su Normattiva l'art. 6 originario del D.L. 89/2026, l'art. 1 della L. 113/2026 e
    l'art. 1-sexies del D.L. 63/2026; le pagine sulla proroga delle Camere di Firenze e del Molise.
