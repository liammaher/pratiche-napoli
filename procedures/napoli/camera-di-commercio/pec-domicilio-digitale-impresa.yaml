verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: letti su Normattiva l'art. 16 D.L. 185/2008 (testo vigente al 25/10/2026), l'art. 5 D.L.
    179/2012, l'art. 1 c. 860 L. 207/2024, l'art. 13 D.L. 159/2025, gli artt. 2630 e 2194 c.c. e gli
    artt. 6-bis e 6-quater del CAD; le pagine della Camera di Napoli sul domicilio digitale degli
    amministratori (giugno 2025, 12/11/2025, 04/12/2025, 04/06/2026), "Avvisi PEC da cancellare",
    "Impresa digitale", "Sanzioni" e "Sedi e orari"; le due determinazioni del Conservatore del
    novembre 2024 e lo schema PEC del 2016; le pagine "Indirizzo PEC" e "Pratiche semplici" di
    registroimprese.it, la home di INI-PEC, la pagina MIMIT della nota 43836/2025 e la pagina della
    Camera di Ferrara.
  notes: >-
    Nessun modulo PDF da compilare: la comunicazione si fa con pratica telematica (Pratica
    semplice o DIRE). Il PDF della nota MIMIT 43836 e il decreto MIMIT 4/12/2025 non sono stati
    letti. INAD: sito domiciliodigitale.gov.it e pagine AgID non leggibili (JavaScript /
    manutenzione).
