  by: claude
  method: >-
    Desk: su Normattiva D.Lgs. 42/2004 artt. 21, 22 e 169; le pagine della Soprintendenza per il
    Comune di Napoli (modalità di presentazione, modulistica) e il suo modulo "Istanza per opere su
    immobili vincolati"; la massima di Cass. pen. Sez. III n. 34437/2026; l'elenco dei procedimenti
    del SUE di Napoli sul portale.
  notes: >-
    Non letti: la prassi della Soprintendenza di Napoli sulle istanze per lavori già eseguiti (il
    modulo non le prevede), l'art. 58 delle norme del PRG (l'altra autorizzazione che il modulo
    offre), la piattaforma GIADA. La pagina dice quando serve e dove si chiede.
