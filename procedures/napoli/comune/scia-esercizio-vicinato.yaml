schema_version: 0
id: napoli/comune/scia-esercizio-vicinato
title: SCIA per aprire un esercizio di vicinato (negozio fino a 250 mq) – SUAP del Comune di Napoli
headline: "Come aprire un negozio a Napoli: la SCIA per l'esercizio di vicinato"
aka:
  - licenza negozio
  - licenza commerciale
  - aprire un'attività commerciale
  - permesso per aprire un negozio
  - pratica SUAP
updated: 2026-10-27
summary: >-
  Chi vuole aprire a Napoli un negozio al dettaglio con superficie di vendita fino a 250 mq
  (esercizio di vicinato, alimentare o non alimentare) presenta una SCIA al SUAP del Comune,
  solo online su impresainungiorno. Si può aprire dal giorno in cui la SCIA è presentata; il
  Comune controlla dopo, entro 60 giorni.
ente:
  name: Comune di Napoli
  office: Area Sviluppo Economico – Servizio Sportello Unico Attività Produttive (SUAP)
  ipa: c_f839
applies_to:
  events: [open, food]
  audience: [business]
  sectors: [commercio al dettaglio in sede fissa, esercizio di vicinato]
  conditions:
    - text: >-
        Apertura di un esercizio di vicinato: per la legge nazionale, negozio con superficie di
        vendita non superiore a 250 mq nei comuni con più di 10.000 abitanti (come Napoli). La
        superficie di vendita è l'area destinata alla vendita, compresa quella di banchi e
        scaffalature; non contano magazzini, depositi, locali di lavorazione, uffici e servizi.
      status: verified
      source: dlgs-114-art4
    - text: >-
        Il modello nazionale avverte che alcune leggi regionali hanno fissato limiti di superficie
        diversi. Non è stato controllato il testo della L.R. Campania 7/2020 (Testo unico sul
        commercio), che il SUAP indica tra le norme di riferimento.
      status: unverified
    - text: >-
        La SCIA vale per apertura, trasferimento di sede e ampliamento della superficie di un
        esercizio di vicinato; questa scheda descrive l'apertura.
      status: verified
      source: dlgs-59-art65
    - text: >-
        Nel Centro storico UNESCO (zona A) e nella Buffer Zone (zona B) dal 25 luglio 2026
        l'apertura, il trasferimento e l'ampliamento di un vicinato alimentare con consumo
        immediato sul posto non vanno più a SCIA ma ad autorizzazione (PUO): si può aprire solo
        dopo il rilascio. Fuori da quelle zone resta la SCIA.
      status: verified
      source: zone-tutelate
legal_basis:
  - text: D.Lgs. 114/1998, art. 4, comma 1, lett. c) e d) (superficie di vendita ed esercizi di vicinato).
    status: verified
    source: dlgs-114-art4
  - text: D.Lgs. 59/2010, art. 65 (SCIA al SUAP per apertura, trasferimento e ampliamento del vicinato).
    status: verified
    source: dlgs-59-art65
  - text: D.Lgs. 59/2010, art. 71 (requisiti di onorabilità e, per il settore alimentare, professionali).
    status: verified
    source: dlgs-59-art71
  - text: "Legge 241/1990, art. 19 (SCIA: avvio dalla presentazione, controlli entro 60 giorni)."
    status: verified
    source: l241-art19
  - text: >-
        Accordo Conferenza Unificata 4 maggio 2017 (moduli unificati e standardizzati, Allegato 1:
        Scheda anagrafica e SCIA per l'esercizio di vicinato).
    status: verified
    source: accordo-2017
  - text: >-
        Norme indicate dal SUAP di Napoli su impresainungiorno per questo procedimento: L.R.
        Campania 21 aprile 2020 n. 7, L.R. Campania 29 dicembre 2018 n. 59, D.Lgs. 222/2016
        (Tabella A), D.Lgs. 59/2010, D.Lgs. 114/1998, D.P.R. 151/2011 (Allegato I, punto 69).
    status: verified
    source: iiug-napoli
  - text: "D.P.R. 160/2010 (SUAP): domande e segnalazioni solo in modalità telematica."
    status: verified
    source: suap-procedura
deadline:
  summary:
    text: >-
      Prima di aprire: si apre appena arriva la ricevuta di avvio pratica della SCIA. Entro 60 giorni
      il Comune può vietare l'attività o chiedere di mettersi in regola, dando almeno 30 giorni.
    status: verified
    source: suap-servizio
  rules:
    - text: >-
        La SCIA va presentata prima di aprire: l'attività può iniziare dalla data di
        presentazione. A Napoli l'avvio è possibile appena arriva la ricevuta di avvio pratica
        telematica del SUAP.
      status: verified
      source: suap-servizio
    - text: >-
        Entro 60 giorni dal ricevimento l'amministrazione, se mancano requisiti o presupposti,
        vieta la prosecuzione dell'attività o, se si può rimediare, invita a conformarsi entro un
        termine di almeno 30 giorni.
      status: verified
      source: l241-art19
  lateness:
    text: >-
      Questa scheda non riporta le sanzioni per chi apre senza SCIA. Il Piano zone tutelate
      richiama, per le attività che disciplina, gli artt. 145 e 149 della L.R. Campania 7/2020:
      per l'importo chiedere al SUAP.
    status: verified
    source: piano-zone
cost:
  text: >-
    Diritti d'istruttoria SUAP (tabella 2026), con pagoPA nella pratica: 100 euro per un negozio
    non alimentare; 120 euro per un negozio alimentare con la notifica sanitaria; 120 o 140 euro se
    serve anche la prevenzione incendi; 200 o 220 euro con la vendita di alcolici. Per la SCIA
    semplice non c'è imposta di bollo. Nel settore alimentare si pagano a parte i diritti sanitari
    dell'ASL (vedi la procedura ASL collegata).
  status: verified
  source: tabella-2026
duration:
  text: >-
    Si apre il giorno stesso, appena arriva la ricevuta di avvio pratica del SUAP; il SUAP ha poi
    60 giorni per i controlli e, se manca qualcosa, può vietare l'attività o chiedere di mettersi
    in regola. Nel centro storico UNESCO e nella buffer zone il negozio alimentare con consumo sul
    posto richiede invece un'autorizzazione e si apre solo dopo il rilascio.
  status: verified
  source: suap-servizio
appointment:
  text: >-
    Non serve: la SCIA si presenta solo online su impresainungiorno. Per informazioni e assistenza
    il SUAP (Piazza Cavour 42) riceve solo su prenotazione online, con il pulsante "Prenota
    appuntamento" della pagina "Avviare, variare, chiudere un'attività produttiva" del Comune.
  status: verified
  source: suap-contatti
channels:
  - type: portal
    purpose: procedure
    name: impresainungiorno – SUAP di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: suap-servizio
    notes: >-
      Unico canale telematico per le pratiche SUAP di Napoli. Servono PEC, kit di firma digitale
      e accesso con SPID, CIE, CNS (o eIDAS, Telemaco). Percorso: Commercio (Ateco 46-47) >
      Commercio al Dettaglio in area Privata > Esercizio di vicinato (Negozio) > settore NON
      alimentare oppure Alimentare o Misto > Aprire l'attività.
    use:
      ways: [web_form, upload]
      status: unverified
      notes: >-
        Il portale dice che vi si compila, firma e invia la pratica online; per altri procedimenti
        il vademecum del Comune indica la modulistica del front office più gli allegati da
        caricare. Il percorso di questo procedimento non è stato controllato dentro il portale.
  - type: pec
    purpose: info
    address: suap@pec.comune.napoli.it
    receipt: legal
    source: suap-contatti
    notes: >-
      Solo per comunicare con l'ufficio: le pratiche trasmesse via PEC o email ordinaria non
      vengono istruite.
  - type: email
    purpose: info
    address: suaponline@comune.napoli.it
    receipt: informal
    source: suap-contatti
    notes: Solo per informazioni; non per presentare la SCIA.
  - type: desk
    purpose: info
    name: Servizio SUAP
    address: Piazza Cavour 42, II piano, 80137 Napoli
    booking: >-
      Dal 18 maggio 2026 solo su prenotazione online (pulsante "Prenota appuntamento" della
      pagina "Avviare, variare, chiudere un'attività produttiva", portale del cittadino).
    source: suap-contatti
    notes: Informazioni e assistenza; la SCIA si presenta comunque online.
  - type: phone
    purpose: info
    address: 081 7953054
    source: suap-servizio
payment:
  method: pagopa
  notes:
    - text: >-
        Diritti d'istruttoria SUAP (tabella in vigore dall'11 giugno 2026, DGC 239/2026), apertura:
        vicinato non alimentare 100 euro; vicinato alimentare 100 euro; vicinato alimentare con
        notifica in campo alimentare 120 euro; con anche la prevenzione incendi 140 euro; vicinato
        non alimentare con prevenzione incendi 120 euro. Con la vendita di alcolici: 200 euro (non
        alimentare) o 220 euro (alimentare con notifica).
      status: verified
      source: tabella-2026
    - text: >-
        Si pagano solo con pagoPA dentro la pratica su impresainungiorno, nella sezione
        "Dichiarazione relativa ai diritti di segreteria/istruttori". Se la pratica unisce più
        procedimenti (SCIA unica) si sommano gli importi dei singoli procedimenti (logica del
        carrello).
      status: verified
      source: guida-pagopa
    - text: >-
        I diritti di altri enti (per esempio l'ASL per la parte sanitaria) si pagano con le
        modalità indicate da quegli enti e la ricevuta si allega alla pratica. Gli importi ASL non
        sono riportati qui.
      status: verified
      source: guida-pagopa
    - text: >-
        Secondo il modello nazionale l'imposta di bollo è obbligatoria solo se insieme alla SCIA si
        chiede un'autorizzazione (SCIA condizionata); la SCIA semplice non la prevede.
      status: verified
      source: accordo-2017
    - text: >-
        La SCIA per l'insegna di esercizio ha un proprio diritto d'istruttoria (100 euro in
        apertura).
      status: verified
      source: tabella-2026
documents:
  - name: SCIA per l'esercizio di vicinato con Scheda anagrafica, compilata sul portale e firmata digitalmente
    required: true
  - name: Procura speciale/delega, con documento d'identità di chi la conferisce
    required: false
    notes: Solo se la pratica è firmata e inviata da un procuratore (professionista, associazione, agenzia per le imprese).
  - name: Copia del documento d'identità del titolare
    required: false
    notes: Solo se la segnalazione non è firmata digitalmente e non c'è procura.
  - name: Allegato A – dichiarazione dei requisiti degli altri soci, con documento d'identità
    required: false
    notes: Sempre, se nella società ci sono soggetti diversi dal dichiarante tenuti ai requisiti.
  - name: Allegato B – dichiarazione dei requisiti del preposto, con documento d'identità
    required: false
    notes: Sempre, se c'è un preposto (per esempio chi ha il requisito professionale per il settore alimentare).
  - name: Notifica sanitaria ai fini della registrazione (art. 6 Reg. CE 852/2004)
    required: false
    notes: Sempre obbligatoria per il settore alimentare; si presenta nella stessa pratica (SCIA unica).
  - name: Ricevuta pagoPA dei diritti d'istruttoria SUAP
    required: true
    notes: Il portale la genera dentro la pratica.
  - name: Ricevute dei diritti di altri enti (per esempio ASL)
    required: false
  - name: Altre segnalazioni o comunicazioni allegate alla SCIA
    required: false
    notes: >-
      Secondo i casi: vendita di alcolici, SCIA prevenzione incendi (superficie lorda oltre 400 mq
      o attività dell'Allegato I DPR 151/2011), farmaci da banco, GPL e gas, prodotti agricoli e
      mangimi, SCIA per l'insegna di esercizio.
dichiarante:
  ruolo: [titolare, legale_rappresentante]
forms:
  - id: scia-vicinato-modello-nazionale
    name: >-
      Modello unificato nazionale – Scheda anagrafica + SCIA per l'esercizio di vicinato +
      Allegati A e B (Accordo Conferenza Unificata 4 maggio 2017, S.O. n. 26 alla G.U. n. 128 del
      5 giugno 2017, pagine 7-24)
    url: https://www.gazzettaufficiale.it/eli/gu/2017/06/05/128/so/26/sg/pdf
    source: accordo-2017
    sha256: cc4585324b95fce34d37b18eb04cd88954f4152705cb0d79b52fc9ac01070f24
    signature_required: true
    fields:
      # Scheda anagrafica – 1 Dati del dichiarante
      - { label: "1 – Dati del dichiarante: Cognome", map: { direct: identity.last_name } }
      - { label: Nome, map: { direct: identity.first_name } }
      - { label: codice fiscale, map: { direct: identity.codice_fiscale } }
      - { label: sesso, map: { direct: identity.sex } }
      - { label: Nato/a a, map: { direct: identity.birth_comune } }
      - { label: prov. (di nascita), map: { direct: identity.birth_province } }
      - label: Stato (di nascita)
        map: { direct: identity.birth_country }
        notes: Solo se nato all'estero; se nato in Italia scrivere Italia.
      - { label: il (data di nascita), map: { direct: identity.date_of_birth } }
      - { label: cittadinanza, map: { direct: identity.citizenship } }
      - label: estremi del documento di soggiorno
        map: { direct: permesso_soggiorno.numero }
        notes: Solo per cittadini non UE.
      - label: rilasciato da
        map: { direct: permesso_soggiorno.questura_rilascio }
        notes: Solo per cittadini non UE.
      - label: il (data rilascio del documento di soggiorno)
        map: { direct: permesso_soggiorno.data_rilascio }
        notes: Solo per cittadini non UE.
      - label: scadenza (del documento di soggiorno)
        map: { direct: permesso_soggiorno.data_scadenza }
        notes: Solo per cittadini non UE.
      - { label: residente in, map: { direct: residenza.comune } }
      - { label: prov. (di residenza), map: { direct: residenza.provincia } }
      - { label: Stato (di residenza), map: { direct: residenza.stato }, notes: "Vuoto nel vault vuol dire Italia: scrivere Italia." }
      - { label: indirizzo, map: { direct: residenza.indirizzo } }
      - { label: n., map: { direct: residenza.civico } }
      - { label: C.A.P., map: { direct: residenza.cap } }
      - { label: PEC / posta elettronica, map: { fallback: [identity.pec, identity.email] } }
      - { label: Telefono fisso / cellulare, map: { direct: identity.phone } }
      - label: in qualità di (Titolare / Legale rappresentante / Altro)
        map: { fallback: [business.qualita_dichiarante, ruolo.tipo] }
        notes: Se il ruolo è diverso da titolare o legale rappresentante, chiedere e scriverlo in "Altro".
      # Scheda anagrafica – 2 Dati della ditta/società/impresa
      - { label: "2 – Dati della ditta: Denominazione", map: { direct: business.denominazione } }
      - { label: Forma giuridica, map: { direct: business.forma_giuridica } }
      - label: codice fiscale / p. IVA
        map: { fallback: [business.codice_fiscale, business.partita_iva] }
      - label: iscritta alla C.C.I.A.A. di ... prov.
        map: { direct: business.cciaa }
        notes: >-
          La sigla della provincia (per esempio NA) indica la Camera di Commercio e la provincia.
          Se manca, è la sigla davanti al numero REA (business.rea, per esempio NA-123456): solo la
          sigla, mai il numero.
      - { label: n. REA, map: { direct: business.rea } }
      - label: non ancora iscritta / non necessita di iscrizione al R.I.
        map: { ask: "L'impresa non è ancora iscritta al Registro Imprese, o non ne ha bisogno?" }
        notes: Il modello ricorda che l'iscrizione alla Camera di Commercio va fatta entro 30 giorni dall'avvio.
      - { label: "con sede legale in: Comune", map: { direct: business.sede_legale_comune } }
      - { label: prov. (sede legale), map: { direct: business.sede_legale_provincia } }
      - { label: Stato (sede legale), map: { direct: business.sede_legale_stato }, notes: "Vuoto nel vault vuol dire Italia: scrivere Italia." }
      - { label: indirizzo (sede legale), map: { direct: business.sede_legale_indirizzo } }
      - { label: n. (sede legale), map: { direct: business.sede_legale_civico } }
      - { label: C.A.P. (sede legale), map: { direct: business.sede_legale_cap } }
      - { label: Telefono fisso / cell. (impresa), map: { direct: business.telefono } }
      - { label: fax, map: { blank_with_reason: Facoltativo; il registro non ha un campo fax. } }
      - { label: PEC (impresa), map: { direct: business.pec } }
      - label: Altro domicilio elettronico per invio delle comunicazioni inerenti la pratica
        map: { ask: "Altro indirizzo elettronico per le comunicazioni sulla pratica, se diverso dalla PEC" }
      # Scheda anagrafica – 3 Dati del procuratore/delegato
      - label: "3 – Dati del procuratore/delegato: Cognome e Nome"
        map: { party: { ruolo: procuratore }, concat: [identity.last_name, identity.first_name] }
        notes: Compilare solo in caso di procura.
      - { label: codice fiscale (procuratore), map: { party: { ruolo: procuratore }, direct: identity.codice_fiscale } }
      - { label: "Nato/a a, prov., Stato, il (procuratore)", map: { party: { ruolo: procuratore }, concat: [identity.birth_comune, identity.birth_province, identity.birth_country, identity.date_of_birth] } }
      - label: "residente in, prov., Stato, indirizzo, n., C.A.P. (procuratore)"
        map: { party: { ruolo: procuratore }, concat: [residenza.comune, residenza.provincia, residenza.indirizzo, residenza.civico, residenza.cap] }
        notes: Per chi risiede in Italia lo Stato è Italia; non è nel registro.
      - { label: PEC / posta elettronica (procuratore), map: { party: { ruolo: procuratore }, fallback: [identity.pec, identity.email] } }
      - { label: Telefono fisso / cellulare (procuratore), map: { party: { ruolo: procuratore }, direct: identity.phone } }
      - label: "in qualità di: Procuratore/delegato / Agenzia per le imprese – Denominazione"
        map: { ask: "Il procuratore agisce come persona delegata o come Agenzia per le imprese (con denominazione)?" }
      # SCIA – intestazione
      - label: "Al SUAP del Comune di – Indirizzo – PEC / Posta elettronica"
        map: { blank_with_reason: "Precompilato dal portale: SUAP del Comune di Napoli." }
      - label: Pratica / del / Protocollo
        map: { blank_with_reason: Compilato a cura del SUAP. }
      - label: "Tipo di segnalazione: SCIA Apertura / Trasferimento / Ampliamento; SCIA UNICA; SCIA CONDIZIONATA"
        map: { ask: "Si presentano insieme alla SCIA altre segnalazioni (es. notifica sanitaria, alcolici, insegna) o domande di autorizzazione?" }
        notes: >-
          Apertura non alimentare senza altro: SCIA Apertura. Settore alimentare: SCIA UNICA
          Apertura + notifica sanitaria. Con domande di autorizzazione: SCIA CONDIZIONATA.
      # SCIA – indirizzo dell'attività
      - label: "Indirizzo dell'attività: Via/piazza"
        map: { direct: locale.indirizzo }
        notes: Da compilare se diverso dalla sede dell'impresa.
      - { label: n. (attività), map: { direct: locale.civico } }
      - { label: Comune (attività), map: { direct: locale.comune } }
      - { label: prov. (attività), map: { direct: locale.provincia } }
      - { label: C.A.P. (attività), map: { direct: locale.cap } }
      - { label: Stato (attività), map: { blank_with_reason: "Italia: il negozio è a Napoli." } }
      - { label: Telefono fisso / cell. (attività), map: { direct: locale.telefono } }
      - { label: fax (attività), map: { blank_with_reason: Facoltativo; il registro non ha un campo fax. } }
      # SCIA – dati catastali
      - { label: "Dati catastali: Foglio n.", map: { direct: locale.catasto_foglio } }
      - { label: map., map: { direct: locale.catasto_particella } }
      - { label: sub., map: { direct: locale.catasto_subalterno } }
      - { label: sez., map: { direct: locale.catasto_sezione } }
      - { label: "Catasto: fabbricati", map: { blank_with_reason: Casella da barrare (catasto fabbricati). } }
      # SCIA – 1 Apertura
      - label: "1 – Apertura: Vicinato / Vendita esclusivamente mediante apparecchi automatici"
        map: { ask: "Negozio tradizionale o vendita solo con apparecchi automatici in un locale dedicato?" }
      - label: "Modalità di vendita: al dettaglio / congiunta al dettaglio e all'ingrosso – superficie di vendita mq"
        map: { ask: "Vendita solo al dettaglio o anche all'ingrosso, e con quale superficie di vendita in mq?" }
      - label: "Esercizio a carattere: Permanente / Stagionale (dal-al) / Temporaneo (dal-al)"
        map: { ask: "L'esercizio è permanente, stagionale o temporaneo (con date)?" }
      - label: "Esercizio collocato in centro commerciale: Sì (denominazione) / No"
        map: { ask: "Il negozio è dentro un centro commerciale? Se sì, quale?" }
      - label: "Settori merceologici: Alimentare – superficie di vendita mq"
        map: { ask: Superficie di vendita destinata al settore alimentare (mq) }
        notes: È la superficie di vendita, non la superficie totale del locale (locale.superficie_mq).
      - { label: "Non alimentare – superficie di vendita mq", map: { ask: Superficie di vendita destinata al settore non alimentare (mq) } }
      - label: Superficie di vendita complessiva mq
        map: { ask: "Superficie di vendita complessiva (mq): somma delle due precedenti, massimo 250" }
      - label: "Di cui: merci ingombranti (settore non alimentare) mq"
        map: { ask: "Parte della superficie per merci ingombranti (mobili, auto, materiali edili...), se presente" }
      - label: "Tabelle speciali: Generi di monopolio / Farmacie / Carburanti – mq"
        map: { ask: "Vendita di prodotti delle tabelle speciali (monopolio, farmacie, carburanti) e relativa superficie, se presente" }
      # SCIA – 2 Trasferimento e 3 Ampliamento
      - label: "2 – Trasferimento di sede (SCIA prec. prot./n., del, Comune, DA indirizzo, A indirizzo, superfici)"
        map: { blank_with_reason: Non si compila per una nuova apertura. }
      - label: "3 – Ampliamento (SCIA prec. prot./n., del, superfici da/a, variazione settori)"
        map: { blank_with_reason: Non si compila per una nuova apertura. }
      # SCIA – dichiarazioni sui requisiti
      - label: Dichiara di essere in possesso dei requisiti di onorabilità previsti dalla legge (art. 71 D.Lgs. 59/2010)
        map: { ask: "Il dichiarante conferma di avere i requisiti di onorabilità (dichiarazione sotto la propria responsabilità)?" }
        notes: Dichiarazione sostitutiva, che sceglie e firma solo il dichiarante.
      - label: Dichiara che non sussistono cause di divieto, decadenza o sospensione (art. 67 D.Lgs. 159/2011)
        map: { ask: "Il dichiarante conferma che non ci sono nei suoi confronti cause ostative antimafia?" }
      - label: "Solo settore alimentare – requisito professionale: corso professionale (Istituto, sede, oggetto, anno)"
        map: { ask: "Requisito professionale per l'alimentare: corso riconosciuto frequentato (istituto, sede, oggetto, anno)?" }
