steps:
  - do: >-
      Controllare che la superficie di vendita non superi 250 mq e che il locale sia in regola con
      destinazione d'uso, norme urbanistiche, edilizie e igienico-sanitarie (si dichiara nella SCIA)
    who: professional
  - do: >-
      Se si vendono alimenti con consumo sul posto, controllare sullo stradario del Piano zone
      tutelate se l'indirizzo è in zona A o B: in quel caso serve l'autorizzazione (PUO), non questa SCIA
    who: anyone
  - do: >-
      Settore alimentare: verificare che il titolare, il legale rappresentante o un preposto abbia
      uno dei requisiti professionali
    who: owner
  - do: Procurarsi firma digitale, PEC e accesso SPID, CIE o CNS; oppure affidare la pratica a un procuratore
    who: owner
  - do: Se si usa un procuratore, firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Compilare la pratica su impresainungiorno (Commercio > Commercio al Dettaglio in area
      Privata > Esercizio di vicinato > settore NON alimentare o Alimentare o Misto > Aprire
      l'attività), aggiungendo notifica sanitaria e altre segnalazioni se servono
    who: facilitator
  - do: Calcolare i diritti d'istruttoria con la tabella SUAP 2026, sommando i procedimenti della pratica
    who: anyone
  - do: Pagare i diritti con pagoPA dalla sezione pagamenti della pratica
    who: owner
    human_only: true
  - do: Firmare digitalmente SCIA e allegati (dichiarante, soci, preposto)
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS al front office di impresainungiorno (SUAP di Napoli), aprire la
      pratica compilata, controllare che SCIA e allegati firmati digitalmente siano caricati e
      inviarla al SUAP; salvare la ricevuta di avvio pratica
    who: owner
    human_only: true
    channel: [portal]
  - do: Aprire il negozio dopo aver ricevuto la ricevuta di avvio pratica
    who: owner
    human_only: true
  - do: Rispondere entro il termine indicato a eventuali richieste di conformazione del SUAP nei 60 giorni
    who: owner
after:
  - Conservare la ricevuta di avvio pratica, la ricevuta pagoPA e copia di quanto inviato; annotare l'ID pratica.
  - >-
    Presentare entro 90 giorni dall'inizio dell'occupazione del locale la dichiarazione TARI per
    uso non abitativo (napoli/comune/tari-iscrizione-non-domestica).
  - Per l'insegna esterna serve una SCIA per l'insegna di esercizio (napoli/comune/insegna-esercizio).
  - >-
    Il modello nazionale ricorda che l'iscrizione alla Camera di Commercio va fatta entro 30
    giorni dall'avvio, se l'impresa non è ancora iscritta.
  - Trasferimento di sede, ampliamento, subingresso e cessazione si comunicano al SUAP con le pratiche apposite.
pitfalls:
  - text: >-
      Le pratiche SUAP inviate via PEC o email ordinaria non vengono istruite: l'unico canale è
      impresainungiorno.
    status: verified
    source: suap-contatti
  - text: >-
      Nel Centro storico UNESCO (zona A), il Piano ammette in via San Gregorio Armeno solo
      produzione e vendita di arte presepiale e in via Port'Alba solo l'attività libraria. Il Piano
      riguarda somministrazione, produzione di alimenti e vicinato con consumo sul posto: chiedere
      al SUAP se il limite vale anche per altri negozi.
    status: verified
    source: piano-zone
  - text: >-
      Per le attività del Piano zone tutelate (incluso il vicinato alimentare con consumo sul
      posto), in tutte le zone A, B e C i titolari devono essere in regola con il pagamento dei
      tributi comunali.
    status: verified
    source: piano-zone
  - text: >-
      Nei negozi di vicinato che vendono alimenti il consumo immediato sul posto è ammesso solo
      senza servizio di somministrazione e senza attrezzature dedicate a esso (art. 7, c. 3, D.Lgs.
      114/1998).
    status: verified
    source: dlgs-114-art7
  - text: >-
      Nelle zone tutelate (A e B) la superficie per il consumo sul posto di un vicinato alimentare
      deve essere almeno il 20% della superficie totale dell'esercizio.
    status: verified
    source: scheda-4
  - text: >-
      La guida pagoPA del SUAP (maggio 2025) cita ancora come vigenti i diritti della DGC 373/2018;
      la pagina dei diritti indica la tabella della DGC 239/2026, in vigore dall'11 giugno 2026. Per
      il vicinato l'importo di apertura è 100 euro in entrambe; usare la tabella 2026.
    status: disputed
    source: diritti
  - text: >-
      La pagina del servizio "Avviare, variare, chiudere un'attività produttiva" (aggiornata a
      ottobre 2025) collega come "nuova tabella dei diritti" un file del 2025, non la tabella 2026.
    status: verified
    source: suap-servizio
  - text: >-
      Se nella pratica non compare il pagamento pagoPA (successo con le pratiche sanitarie per
      l'ASL), la guida del SUAP ammette solo in quel caso il bonifico alla Tesoreria comunale.
    status: verified
    source: guida-pagopa
  - text: >-
      Il modulo online di impresainungiorno è la versione del SUAP di Napoli del modello nazionale:
      possono comparire campi regionali in più. La mappatura qui segue il modello nazionale 2017.
    status: unverified
  - text: >-
      Le richieste di rimborso dei diritti versati per errore hanno scadenze annuali fissate dal
      SUAP (per il 2025 entro il 15 febbraio 2026).
    status: verified
    source: diritti
