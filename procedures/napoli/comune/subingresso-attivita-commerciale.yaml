verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: letti la L.R. Campania 7/2020 (pagina della Regione e PDF vigente, artt. 7, 26, 97, 145,
    149; allegato A, tabelle 1.1 e 5.1 come immagini del BURC), l'art. 2556 c.c. su Normattiva, la
    comunicazione di subingresso e la scheda anagrafica della Regione (SURAP, scaricate, pdftotext)
    e il modulo 12 del S.O. 26 alla G.U. 128/2017; le pagine SUAP del Comune (servizio, contatti,
    diritti), la tabella diritti 2026 con la legenda dei coefficienti, l'avviso, il vademecum, le
    schede 1–4 e l'allegato tecnico sulle zone tutelate, il Piano (art. 6), il regolamento del
    canone (artt. 10, 28, 31), la pagina dei dehors, il quadro A del Mod. 6 TARI e l'art. 25 del
    regolamento TARI.
  notes: >-
    Non visti i moduli del front office di impresainungiorno (richiedono accesso), né la versione
    dell'allegato A modificata dalla L.R. 5/2021. Il regime del subingresso in zona A e B non è stato
    confermato con l'ufficio.
