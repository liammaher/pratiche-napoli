schema_version: 0
id: napoli/comune/subingresso-attivita-commerciale
title: Subingresso in un negozio, bar o ristorante già avviato (cessione o affitto d'azienda) – SUAP del Comune di Napoli
headline: "Comprare o prendere in affitto un bar o un negozio avviato a Napoli: il subingresso"
aka:
  - voltura licenza
  - cambio intestazione licenza
  - passaggio di gestione
  - rilevare un'attività
  - subentro
updated: 2026-10-26
summary: >-
  Chi compra o prende in affitto un'azienda commerciale già avviata a Napoli (negozio di vicinato,
  bar, ristorante) deve intestarsi il titolo del precedente gestore con una comunicazione di
  subingresso al SUAP, solo online su impresainungiorno; per alimenti e bevande va insieme alla
  notifica sanitaria (SCIA unica). Serve prima il contratto con il notaio. Per bar e ristoranti il
  termine è di 90 giorni dall'atto; nel centro storico UNESCO e nella buffer zone il regime è
  controverso.
ente:
  name: Comune di Napoli
  office: Area Sviluppo Economico – Servizio Sportello Unico Attività Produttive (SUAP)
  ipa: c_f839
applies_to:
  events: [change, open]
  audience: [business]
  sectors:
    - commercio al dettaglio in sede fissa (esercizio di vicinato, alimentare e non alimentare)
    - somministrazione di alimenti e bevande (bar, ristoranti, pizzerie)
  conditions:
    - text: >-
        Subingresso: un'impresa subentra nell'attività di un'altra già avviata con SCIA, DIA o
        autorizzazione. Il modulo regionale prevede come motivi compravendita, affitto d'azienda,
        donazione, fusione, fallimento, successione o altre cause; questa scheda descrive la
        compravendita (cessione) e l'affitto d'azienda.
      status: verified
      source: modulo-subingresso
    - text: >-
        Nel vicinato il subingresso segue il regime della Tabella dell'allegato A della L.R.
        Campania 7/2020 (art. 26, c. 2): per il settore non alimentare basta la comunicazione (con la
        comunicazione di prevenzione incendi se l'attività è nell'Allegato I del DPR 151/2011 o supera
        400 mq lordi); per il settore alimentare serve la SCIA unica, cioè comunicazione + SCIA
        sanitaria (più la comunicazione di prevenzione incendi nei casi indicati).
      status: verified
      source: lr7-allegati
    - text: >-
        Per la somministrazione di alimenti e bevande il subingresso, in zone tutelate e non
        tutelate, segue la Tabella dell'allegato A (art. 97, c. 1): SCIA unica composta da
        comunicazione e SCIA sanitaria.
      status: verified
      source: lr7-allegati
    - text: >-
        La SCIA unica di subingresso nella somministrazione reintesta il titolo al subentrante solo se
        è provato l'effettivo trasferimento dell'attività e il subentrante ha i requisiti morali e
        professionali dell'art. 7 (art. 97, c. 2).
      status: verified
      source: lr7-campania
    - text: >-
        Requisiti: per ogni attività commerciale quelli di onorabilità dell'art. 71, cc. 1–5, del
        D.Lgs. 59/2010; per la vendita di alimenti e per la somministrazione anche uno dei requisiti
        professionali dell'art. 71, cc. 6 e 6-bis (L.R. 7/2020, art. 7). Si possono avere tramite un
        preposto (Allegato B del modulo).
      status: verified
      source: lr7-campania
    - text: >-
        Nel centro storico UNESCO (zona A) e nella buffer zone (zona B) il regime del subingresso in
        somministrazione, laboratori alimentari e vicinato con consumo sul posto è controverso (vedi
        i pitfalls). Il Piano stabilisce comunque che lì il subingresso non può cambiare la tipologia
        di attività né ampliare, anche indirettamente, la capacità di somministrazione (art. 6, c. 1).
      status: verified
      source: piano-zone
    - text: >-
        Per il SUAP il subingresso resta a SCIA anche nelle zone tutelate solo se è privo di
        modifiche sostanziali (per esempio variazione della linea di attività o ampliamenti);
        apertura, trasferimento e ampliamento in zona A o B richiedono l'autorizzazione.
      status: verified
      source: avviso-zone-tutelate
    - text: >-
        Per somministrazione, produzione di alimenti e vicinato con consumo immediato sul posto, in
        caso di subingresso a qualunque titolo devono essere in regola con i tributi comunali sia chi
        subentra sia chi cede (Piano, art. 6, c. 2).
      status: verified
      source: piano-zone
legal_basis:
  - text: >-
      L.R. Campania 21 aprile 2020, n. 7 (Testo unico sul commercio, testo vigente aggiornato alla
      L.R. 20/2025): art. 7 (requisiti), art. 26 (vicinato), art. 97 (subingresso nella
      somministrazione), artt. 145 e 149 (sanzioni), allegato A (regimi amministrativi).
    status: verified
    source: lr7-campania
  - text: >-
      Codice civile, art. 2556: per le imprese soggette a registrazione i contratti di trasferimento
      della proprietà o del godimento dell'azienda vanno provati per iscritto; quelli in forma
      pubblica o per scrittura privata autenticata sono depositati per l'iscrizione nel Registro
      delle imprese entro trenta giorni, a cura del notaio.
    status: verified
    source: cc-2556
  - text: >-
      Modulistica unificata e standardizzata (Accordo Conferenza Unificata 4 maggio 2017, modulo 12
      "Subingresso in attività"), nella versione pubblicata dalla Regione Campania sul portale SURAP.
    status: verified
    source: accordo-2017
  - text: >-
      Piano per la programmazione delle aperture nel centro storico UNESCO e nella buffer zone
      (deliberazione di Consiglio comunale n. 79 del 29 giugno 2026, in vigore dal 25 luglio 2026),
      art. 6.
    status: verified
    source: avviso-zone-tutelate
deadline:
  summary:
    text: >-
      Bar e ristoranti: SCIA unica entro 90 giorni dall'atto di trasferimento (l'erede entro un anno
      dalla morte), pena la decadenza; per il vicinato le fonti lette non fissano un termine, ma la
      comunicazione va fatta prima di lavorare a proprio nome. Si opera appena arriva la ricevuta del
      SUAP, la variazione TARI va presentata entro 90 giorni e l'erede di un'attività alimentare
      senza requisiti ha dodici mesi per acquisirli, intanto con un preposto.
    status: unverified
    source: lr7-campania
  rules:
    - text: >-
        Bar, ristoranti e altri esercizi di somministrazione: SCIA unica al SUAP entro novanta giorni
        dalla stipula dell'atto di trasferimento (L.R. 7/2020, art. 97, c. 2). In caso di morte del
        titolare l'erede presenta la SCIA entro un anno dalla morte, pena la decadenza del titolo,
        salvo proroga per forza maggiore (c. 3).
      status: verified
      source: lr7-campania
    - text: >-
        Il titolo di somministrazione decade se, in caso di subingresso, l'attività non viene avviata
        secondo le modalità dell'art. 97 (art. 149, c. 9, lett. g).
      status: verified
      source: lr7-campania
    - text: >-
        Vicinato: nei testi letti la L.R. 7/2020 non fissa un termine per la comunicazione di
        subingresso; il subingresso senza il titolo prescritto è però sanzionato (art. 145, c. 2),
        quindi la comunicazione va presentata prima di esercitare a proprio nome.
      status: unverified
    - text: >-
        Subingresso per morte in un'attività alimentare: se l'erede non ha i requisiti professionali
        deve acquisirli entro dodici mesi dal decesso e intanto può esercitare nominando un preposto
        (art. 26, c. 4).
      status: verified
      source: lr7-campania
    - text: >-
        Con la comunicazione o la SCIA si può operare appena arriva la ricevuta di avvio pratica
        telematica del SUAP.
      status: verified
      source: suap-servizio
    - text: >-
        TARI: chi subentra presenta la dichiarazione di variazione entro 90 giorni dalla data in cui
        si è verificata la variazione (art. 25, c. 5 del regolamento); per il subentro si usa il quadro
        A "voltura" del Mod. 6.
      status: verified
      source: regolamento-tari
    - text: >-
        Tempi d'istruttoria indicati dal Comune: 30 giorni per le comunicazioni, 60 per le SCIA, 90
        per le autorizzazioni.
      status: verified
      source: suap-servizio
  lateness:
    text: >-
      Per il commercio in sede fissa il subingresso senza il titolo prescritto obbliga il Comune a
      disporre la chiusura o la cessazione dell'attività e ad applicare la sanzione da 2.500 a
      15.000 euro (L.R. 7/2020, art. 145, c. 2). Per la somministrazione esercitare senza titolo,
      con titolo decaduto o senza i requisiti è punito con la sanzione da 2.500 a 15.000 euro e il
      SUAP dispone la cessazione e la chiusura (art. 149, cc. 2 e 4). L'importo in concreto lo
      stabilisce l'ufficio che accerta la violazione.
    status: verified
    source: lr7-campania
cost:
  text: >-
    Diritti d'istruttoria SUAP (tabella 2026, colonna delle variazioni), con pagoPA nella pratica:
    negozio non alimentare 80 euro; negozio alimentare con notifica sanitaria 96 euro; bar o
    ristorante fuori dalle zone tutelate 96 euro con la notifica sanitaria (176 con il nulla osta
    di impatto acustico). Per le zone tutelate la tabella ha righe da 336 e 416 euro, ma non dice
    se valgono per il subingresso: lo stabilisce il procedimento scelto su impresainungiorno. Con
    alcolici o prevenzione incendi gli importi salgono (vedi la tabella). A parte si pagano i
    diritti sanitari dell'ASL, l'eventuale SCIA di subentro nell'insegna (80 euro) e il notaio per
    il contratto.
  status: verified
  source: tabella-2026
duration:
  text: >-
    Con la comunicazione o la SCIA unica di subingresso si lavora a proprio nome appena arriva la
    ricevuta di avvio pratica del SUAP (o dalla data di decorrenza indicata); il Comune indica 30
    giorni di istruttoria per le comunicazioni e 60 per le SCIA. Nel centro storico UNESCO e nella
    buffer zone il regime del subingresso è controverso: chiedere al SUAP prima di firmare.
  status: verified
  source: suap-servizio
appointment:
  text: >-
    Non serve per il SUAP: la pratica si presenta solo online su impresainungiorno. Per
    informazioni e assistenza il SUAP (Piazza Cavour 42) riceve solo su prenotazione online, con il
    pulsante "Prenota appuntamento" della pagina "Avviare, variare, chiudere un'attività
    produttiva". Il contratto si firma prima dal notaio.
  status: verified
  source: suap-contatti
channels:
  - type: portal
    purpose: procedure
    name: impresainungiorno – SUAP di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: suap-servizio
    notes: >-
      Unico canale per le pratiche SUAP di Napoli. Servono e-mail, PEC, firma digitale e accesso con
      SPID, CIE, CNS (anche eIDAS o Telemaco). Nel procedimento dell'attività si sceglie l'evento
      "Subentrare nell'esercizio dell'attività".
  - type: pec
    purpose: info
    address: suap@pec.comune.napoli.it
    receipt: legal
    source: suap-contatti
    notes: Solo per comunicare con l'ufficio; le pratiche inviate via PEC o e-mail non vengono istruite.
  - type: email
    purpose: info
    address: suaponline@comune.napoli.it
    receipt: informal
    source: suap-contatti
    notes: Solo informazioni.
  - type: desk
    purpose: info
    name: Servizio SUAP
    address: Piazza Cavour 42, II piano, Napoli
    booking: >-
      Dal 18 maggio 2026 solo su prenotazione online (pulsante "Prenota appuntamento" della pagina
      "Avviare, variare, chiudere un'attività produttiva").
    source: suap-contatti
    notes: Informazioni e assistenza; la pratica si presenta comunque online.
  - type: phone
    purpose: info
    address: 081 7953054
    source: suap-servizio
payment:
  method: pagopa
  calculator_url: https://static-www.comune.napoli.it/wp-content/uploads/2021/07/2026-TABELLA-DIRITTI-SUAP-DEF.pdf
  notes:
    - text: >-
        Diritti d'istruttoria SUAP in vigore dall'11 giugno 2026 (delibera di Giunta n. 239/2026). La
        tabella mette subingresso, cessione di azienda e fitto di ramo d'azienda tra le "variazioni
        ciclo di vita aziendale", con coefficiente 0,8: l'importo è quello della colonna VCA (0,8
        volte l'importo di apertura).
      status: verified
      source: tabella-2026
    - text: >-
        Colonna VCA, vicinato: non alimentare 80 euro (S1), con prevenzione incendi 96 euro (S2);
        alimentare 80 euro (S3), con notifica sanitaria 96 euro (S4), con notifica e prevenzione
        incendi 112 euro (S5). Con la vendita di alcolici: 160 euro (S23, non alimentare), 176 euro
        (S24, non alimentare con prevenzione incendi; S25, alimentare con notifica), 192 euro (S26).
      status: verified
      source: tabella-2026
    - text: >-
        Colonna VCA, somministrazione in zone non tutelate: 80 euro (S71), con notifica sanitaria 96
        euro (S72), con notifica e nulla osta di impatto acustico 176 euro (S73). In zone tutelate:
        320 euro (S74), 336 euro (S75), 416 euro (S76).
      status: verified
      source: tabella-2026
    - text: >-
        Quale riga si applica a un subingresso in zona A o B (S74–S76 oppure S71–S73) lo determina il
        procedimento scelto nel front office; le fonti non lo dicono in modo esplicito.
      status: unverified
    - text: >-
        I diritti d'istruttoria si pagano con pagoPA. I diritti sanitari a favore dell'ASL Napoli 1
        Centro si pagano a parte, preferibilmente con pagoPA (nota ASL sulla pagina dei diritti); per
        gli importi vedi napoli/asl-napoli-1/registrazione-attivita-alimentare.
      status: verified
      source: diritti
    - text: >-
        Se la pratica unisce più procedimenti (per esempio comunicazione + notifica sanitaria +
        alcolici) si sommano i diritti dei singoli procedimenti, come per le aperture.
      status: unverified
documents:
  - name: Contratto di cessione o di affitto d'azienda (atto pubblico o scrittura privata autenticata dal notaio), con gli estremi di registrazione
    required: true
    notes: >-
      Nel modulo si indicano numero e data di registrazione. Se l'atto è ancora in corso di
      registrazione si allega la dichiarazione del notaio che lo attesta.
  - name: Comunicazione di subingresso (con Scheda anagrafica), compilata su impresainungiorno e firmata digitalmente
    required: true
  - name: Dichiarazione del notaio che l'atto è in corso di registrazione
    required: false
    notes: Solo se l'atto non è ancora registrato.
  - name: Notifica sanitaria ai fini della registrazione – aggiornamento per subingresso (Reg. CE 852/2004)
    required: false
    notes: Sempre per vendita o somministrazione di alimenti; va nella stessa pratica (SCIA unica).
  - name: Comunicazione per la vendita di alcolici (D.Lgs. 504/1995)
    required: false
    notes: Se si vendono alcolici.
  - name: Allegato A – requisiti degli altri soci, con documento d'identità
    required: false
    notes: Sempre, se ci sono soci o altri soggetti tenuti ai requisiti diversi dal dichiarante.
  - name: Allegato B – requisiti del preposto, con documento d'identità
    required: false
    notes: Per attività alimentari o di somministrazione, se il requisito professionale lo ha un preposto.
  - name: Procura speciale, con documento d'identità di chi la conferisce
    required: false
    notes: Se la pratica è firmata e inviata da un procuratore o da un'agenzia per le imprese.
  - name: Copia del documento d'identità del titolare
    required: false
    notes: Solo se la comunicazione non è firmata digitalmente e non c'è procura.
  - name: Ricevuta pagoPA dei diritti d'istruttoria SUAP e ricevute dei diritti di altri enti (ASL)
    required: true
dichiarante:
  ruolo: [titolare, legale_rappresentante]
forms:
  - id: comunicazione-subingresso-campania
    name: >-
      Comunicazione per il subingresso in attività – modulistica unificata e standardizzata, Regione
      Campania (SURAP), con Allegati A, B, C e D
    url: https://surap.regione.campania.it/Allegati/ModulisticaUnificata/Commercio/pdf/Comunicazione_per_il_subingresso_in_attivit%C3%A0.pdf
    source: modulo-subingresso
    sha256: a7a32a3edc89a903ce26561552b26618c848a20a865be23f2d1c01eb3b0dc1b1
    signature_required: true
    fields:
      # Intestazione
      - label: "Al SUAP del Comune di – Indirizzo – PEC / Posta elettronica"
        map: { blank_with_reason: "Precompilato dal portale: SUAP del Comune di Napoli." }
      - label: "Compilato a cura del SUAP: Pratica / del / Protocollo"
        map: { blank_with_reason: Spazio riservato al SUAP. }
      - label: "COMUNICAZIONE: Subingresso in attività / SCIA UNICA: Subingresso in attività di commercio/somministrazione di prodotti alimentari + SCIA sanitaria e/o altre segnalazioni"
        map: { ask: "L'attività vende o somministra alimenti, o si allegano altre segnalazioni (per esempio alcolici)? Se sì è SCIA unica, altrimenti solo comunicazione" }
      # Indirizzo dell'attività
      - label: "Indirizzo dell'attività: Via/piazza"
        map: { direct: locale.indirizzo }
        notes: Da compilare se diverso dalla sede dell'impresa.
      - { label: "n. (attività)", map: { direct: locale.civico } }
      - { label: "Comune (attività)", map: { direct: locale.comune } }
      - { label: "prov. (attività)", map: { direct: locale.provincia } }
      - { label: "C.A.P. (attività)", map: { direct: locale.cap } }
      - { label: "Stato (attività)", map: { blank_with_reason: "Italia: l'attività è a Napoli." } }
      - { label: "Telefono fisso / cell. (attività)", map: { ask: Telefono dell'esercizio } }
      - { label: "fax (attività)", map: { blank_with_reason: Facoltativo; il registro non ha un campo fax. } }
      # Dati catastali
      - { label: "Dati catastali: Foglio n.", map: { direct: locale.catasto_foglio } }
      - { label: "map.", map: { direct: locale.catasto_particella } }
      - { label: "sub.", map: { direct: locale.catasto_subalterno } }
      - { label: "sez.", map: { direct: locale.catasto_sezione } }
      - { label: "Catasto: fabbricati", map: { blank_with_reason: Casella da barrare (catasto fabbricati). } }
      # 1 – Dati della impresa a cui si subentra
      - label: "1 – Il/la sottoscritto/a COMUNICA il subingresso nell'attività di: (impresa cedente)"
        map: { ask: "Denominazione dell'impresa a cui si subentra (cedente o locatrice dell'azienda)" }
      - label: "già avviata con la SCIA/DIA/autorizzazione prot./n."
        map: { ask: "Numero di protocollo della SCIA, DIA o autorizzazione del cedente (chiederlo al cedente)" }
      - label: "del (data del titolo del cedente)"
        map: { ask: "Data della SCIA, DIA o autorizzazione del cedente" }
      - label: "Avvio dell'attività contestuale / con decorrenza dal"
        map: { ask: "Il subentrante inizia dalla data di presentazione o da una data successiva (quale)?" }
      # 2 – Motivazione del subingresso
      - label: "2 – Motivazione: Compravendita / Affitto d'azienda / Donazione / Fusione / Fallimento / Successione / Altre cause"
        map: { ask: "Motivo del subingresso: compravendita (cessione), affitto d'azienda o altro (specificare)" }
      - label: "Con atto di registrazione n."
        map: { ask: "Numero di registrazione dell'atto di cessione o affitto d'azienda (dall'Agenzia delle Entrate o dal notaio)" }
        notes: Se l'atto è in corso di registrazione, allegare la dichiarazione del notaio.
      - label: "del (data di registrazione dell'atto)"
        map: { ask: Data di registrazione dell'atto }
      # 3 – Variazione della denominazione
      - label: "3 – Variazione della denominazione – In caso di commercio elettronico: indirizzo nuovo sito web"
        map: { direct: business.sito_web }
        notes: Solo per il commercio elettronico, se il sito cambia.
      # Dichiarazioni a) commercio e somministrazione
      - label: "a) Solo per l'attività di commercio: requisiti di onorabilità previsti dalla legge"
        map: { ask: "Il dichiarante conferma di avere i requisiti di onorabilità (art. 71 D.Lgs. 59/2010)? Dichiarazione sotto la propria responsabilità" }
        notes: Dichiarazione sostitutiva, che sceglie e firma solo il dichiarante.
      - label: "a) Solo per la somministrazione: requisiti di onorabilità e assenza delle condizioni degli artt. 11, 92 e 131 TULPS"
        map: { ask: "Per bar e ristoranti: il dichiarante conferma i requisiti di onorabilità e di non trovarsi nelle condizioni degli artt. 11, 92 e 131 TULPS?" }
      - label: "Per tutte le attività: assenza di cause di divieto, decadenza o sospensione (art. 67 D.Lgs. 159/2011)"
        map: { ask: "Il dichiarante conferma che non ci sono nei suoi confronti cause ostative antimafia?" }
      - label: "Solo per subingresso in commercio e/o somministrazione di prodotti alimentari: requisito professionale – corso professionale (Istituto, sede, oggetto corso, anno di conclusione)"
        map: { ask: "Requisito professionale per alimenti o somministrazione: corso riconosciuto frequentato (istituto, sede, oggetto, anno)?" }
      - label: "oppure: esercizio in proprio per almeno 2 anni nel quinquennio (tipo di attività, dal, al; CCIAA e n. REA o registro UE)"
        map: { ask: "Attività d'impresa propria nel settore alimentare o della somministrazione (tipo, periodi, Camera di commercio e REA)?" }
      - label: "oppure: lavoro per almeno 2 anni nel quinquennio presso imprese del settore (nome e sede impresa; dipendente qualificato / coadiutore familiare / socio lavoratore / altre posizioni, iscritto INPS, dal, al)"
        map: { ask: "Lavoro presso imprese alimentari o di somministrazione (impresa, sede, ruolo, periodi con iscrizione INPS)?" }
      - label: "oppure: diploma o laurea con materie attinenti (Scuola/Istituto/Ateneo, anno di conclusione, materie attinenti)"
        map: { ask: "Diploma o laurea con materie attinenti al commercio o agli alimenti (istituto, anno, materie)?" }
      - label: "oppure: qualificazione professionale estera riconosciuta (decreto n., in data)"
        map: { ask: "Qualifica ottenuta all'estero e riconosciuta in Italia (estremi del decreto)?" }
      - label: "oppure: pratica professionale – iscrizione al REC / esame di idoneità REC / REC sezione imprese turistiche (anno, CCIAA o ente)"
        map: { ask: "Iscrizione al REC o esame di idoneità REC superato (anno e Camera di commercio o ente)?" }
      - label: "OPPURE: requisiti professionali posseduti dal preposto Sig./ra ... (Allegato B)"
        map: { party: { ruolo: preposto }, concat: [identity.first_name, identity.last_name] }
        notes: Solo se il requisito professionale lo ha il preposto (Allegato B).
      # Dichiarazioni b) acconciatore ed estetista
      - label: "b) Attività di acconciatore e/o estetista: assenza di cause antimafia, responsabile tecnico, abilitazione o qualifica, oppure elenco dei responsabili tecnici (Allegati C e D)"
        map: { blank_with_reason: "Solo per acconciatori ed estetisti: non riguarda negozi, bar e ristoranti (vedi napoli/comune/scia-acconciatore-estetista)." }
      # Altre dichiarazioni
      - label: "Solo per commercio in spacci interni: vendita esclusivamente a favore di dipendenti / militari / soci / scuole / ospedali"
        map: { blank_with_reason: Non riguarda un negozio aperto al pubblico. }
      - label: "Solo per commercio mediante apparecchi automatici presso altri esercizi: impegno a comunicare ogni sei mesi installazioni e disinstallazioni"
        map: { blank_with_reason: "Non riguarda un negozio, bar o ristorante in sede fissa." }
      - label: "Solo per commercio presso il domicilio del consumatore: impegno a comunicare l'elenco degli incaricati"
        map: { blank_with_reason: "Non riguarda un negozio, bar o ristorante in sede fissa." }
      - label: "Solo per acconciatore e/o estetista: consentire i controlli se l'attività è svolta nella propria abitazione"
        map: { blank_with_reason: Solo per acconciatori ed estetisti. }
      - label: "In tutti i casi: impegno a comunicare ogni variazione di stati, fatti, condizioni e titolarità"
        map: { ask: "Il dichiarante si impegna a comunicare le variazioni?" }
      - label: "SCIA UNICA: presenta le segnalazioni e/o comunicazioni del quadro riepilogativo"
        map: { ask: "Quali segnalazioni si allegano (notifica sanitaria, alcolici)? Vedi quadro riepilogativo" }
      - { label: Data, map: { ask: Data di sottoscrizione } }
      - label: Firma
        map: { blank_with_reason: Firma digitale del dichiarante (o del procuratore con procura); solo la persona. }
      - label: "Informativa sul trattamento dei dati personali (Reg. UE 2016/679): Titolare del trattamento Comune di, indirizzo, mail/PEC, responsabile, DPO"
        map: { blank_with_reason: Dati del Comune; nel modulo online li fornisce il portale. }
      - label: "Informativa: Data e Firma (presa visione)"
        map: { blank_with_reason: Presa visione e firma del dichiarante; solo la persona. }
      # Quadro riepilogativo
      - label: "Quadro riepilogativo – Procura/Delega"
        map: { ask: "La pratica è presentata da un procuratore con procura speciale?" }
      - label: "Copia del documento di identità del/i titolare/i"
        map: { blank_with_reason: Serve solo se la comunicazione non è firmata digitalmente e non c'è procura. }
      - label: "Dichiarazioni sul possesso dei requisiti da parte degli altri soci (Allegato A) + documento"
        map: { ask: "Ci sono altri soci o amministratori tenuti ai requisiti? (serve l'Allegato A per ciascuno)" }
      - label: "Dichiarazioni sul possesso dei requisiti da parte del preposto (Allegato B) + documento"
        map: { ask: "C'è un preposto? (serve l'Allegato B)" }
      - label: "Dichiarazioni del responsabile tecnico (Allegati C e/o D) e dichiarazione di accettazione + documento"
        map: { blank_with_reason: Solo per acconciatori ed estetisti. }
      - label: "Dichiarazione da parte del notaio (atto in corso di registrazione)"
        map: { ask: "L'atto di cessione o affitto è ancora in corso di registrazione? (allegare la dichiarazione del notaio)" }
      - label: "SCIA UNICA – Notifica sanitaria (art. 6 Reg. CE 852/2004)"
