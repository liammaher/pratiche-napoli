      - { label: residente in, map: { direct: residenza.comune } }
      - { label: prov. (di residenza), map: { direct: residenza.provincia } }
      - { label: Stato (di residenza), map: { ask: "Stato di residenza (Italia se residente in Italia)" } }
      - { label: indirizzo, map: { direct: residenza.indirizzo } }
      - { label: n., map: { direct: residenza.civico } }
      - { label: C.A.P., map: { direct: residenza.cap } }
