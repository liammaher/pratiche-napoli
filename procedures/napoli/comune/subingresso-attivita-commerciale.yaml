        notes: Per chi risiede in Italia lo Stato è Italia; non è nel registro.
      - { label: PEC / posta elettronica (procuratore), map: { party: { ruolo: procuratore }, fallback: [identity.pec, identity.email] } }
      - { label: Telefono fisso / cellulare (procuratore), map: { party: { ruolo: procuratore }, direct: identity.phone } }
      - label: "in qualità di: Procuratore/delegato / Agenzia per le imprese – Denominazione"
        map: { ask: "Il procuratore agisce come persona delegata o come Agenzia per le imprese (con denominazione)?" }
      # 4 – Dati dell'attività/intervento
      - label: "4 – Dati dell'attività/intervento (differenziato per tipologia di procedimento)"
        map: { blank_with_reason: "Per il subingresso questi dati sono nella comunicazione di subingresso (indirizzo, dati catastali, impresa cedente)." }
steps:
  - do: >-
      Prima di firmare il contratto, farsi dare dal cedente gli estremi del suo titolo (SCIA, DIA o
      autorizzazione) e controllare che l'attività sia regolarmente avviata e che il locale sia in
      regola (destinazione d'uso, igiene, sorvegliabilità per bar e ristoranti)
    who: professional
  - do: >-
      Controllare con lo stradario e la cartografia del Piano se l'indirizzo è in zona A, B o C; in
      zona A o B, e se cedente e subentrante non sono in regola con i tributi comunali, chiedere al
      SUAP prima di comprare o affittare
    who: anyone
  - do: >-
      Verificare che il subentrante (o un preposto) abbia i requisiti di onorabilità e, per alimenti
      e somministrazione, un requisito professionale
    who: owner
  - do: Stipulare dal notaio il contratto di cessione o di affitto d'azienda (atto pubblico o scrittura privata autenticata)
    who: owner
    human_only: true
  - do: >-
      Annotare la data di stipula: per bar e ristoranti la SCIA unica va presentata entro 90 giorni.
      Se l'atto non è ancora registrato, farsi rilasciare dal notaio la dichiarazione che è in corso
      di registrazione
    who: owner
  - do: Procurarsi firma digitale, PEC e accesso SPID, CIE o CNS; oppure affidare la pratica a un procuratore
    who: owner
  - do: Se si usa un procuratore, firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Compilare la pratica su impresainungiorno nel procedimento dell'attività (per esempio Vicinato
      – settore Alimentare o Misto, oppure Esercizio di somministrazione di alimenti e bevande in
      zone tutelate) scegliendo "Subentrare nell'esercizio dell'attività", aggiungendo
      l'aggiornamento della notifica sanitaria per subingresso e le altre segnalazioni necessarie
    who: facilitator
  - do: Calcolare i diritti d'istruttoria con la colonna VCA della tabella SUAP 2026, sommando i procedimenti della pratica
    who: anyone
  - do: Pagare i diritti SUAP con pagoPA dalla pratica e i diritti sanitari ASL dove richiesto
    who: owner
    human_only: true
  - do: Firmare digitalmente comunicazione e allegati (dichiarante, soci, preposto)
    who: owner
    human_only: true
  - do: Inviare la pratica al SUAP dal portale
    who: owner
    human_only: true
  - do: Iniziare a operare a proprio nome dopo la ricevuta di avvio pratica (o dalla data di decorrenza indicata)
    who: owner
    human_only: true
  - do: Rispondere entro il termine indicato a eventuali richieste del SUAP
    who: owner
after:
  - Conservare l'atto notarile, la ricevuta di avvio pratica, le ricevute dei pagamenti e copia di quanto inviato.
  - >-
    TARI: entro 90 giorni presentare il Mod. 6 (quadro A, voltura per cessione d'azienda o di ramo,
    o "altro") per intestarsi l'utenza del cedente (napoli/comune/tari-variazione-non-domestica);
    per la posizione del cedente vedi napoli/comune/tari-cessazione-non-domestica.
  - >-
    Insegna: il subentro nella titolarità della SCIA per insegna di esercizio richiede una nuova
    SCIA (napoli/comune/insegna-esercizio).
  - >-
    Dehors: la voltura della concessione di suolo pubblico si comunica con firma congiunta di
    cedente e subentrante (napoli/comune/concessione-suolo-pubblico-dehors).
  - >-
    Registro delle imprese: il notaio deposita il contratto entro 30 giorni; per gli adempimenti
    del subentrante (iscrizione o apertura dell'unità locale) vedi
    napoli/camera-di-commercio/iscrizione-impresa-individuale-comunica.
  - >-
    Alimenti: l'aggiornamento della registrazione per subingresso va nella stessa pratica SUAP
    (napoli/asl-napoli-1/registrazione-attivita-alimentare).
pitfalls:
  - text: >-
      Subingresso in zona A o B: il Piano approvato dal Consiglio (art. 6, c. 1, testo emendato) lo
      subordina ad autorizzazione con verifica dei requisiti strutturali e gestionali; l'avviso e il
      vademecum del SUAP (23 luglio 2026) e l'allegato tecnico operativo dicono che, senza modifiche
      sostanziali, resta a SCIA "in virtù della prevalente normativa regionale"; le schede 1–4 del
      SUAP indicano "Comunicazione"; la L.R. 7/2020 (art. 97 e allegato A) prevede la SCIA unica
      (comunicazione + SCIA sanitaria) sia in zone tutelate sia non tutelate. Chiedere al SUAP prima
      di comprare o affittare un locale già avviato in zona tutelata.
    status: disputed
    source: piano-zone
  - text: >-
      Il vademecum del SUAP riporta nella tabella riassuntiva "SCIA" per il subingresso in zona
      tutelata, ma nelle sezioni per tipo di attività indica come regime "Comunicazione". Nella
      sostanza sono coerenti con la L.R. 7/2020, che chiama SCIA unica la comunicazione di subingresso
      unita alla SCIA sanitaria.
    status: verified
    source: vademecum
  - text: >-
      Atto non ancora registrato: la comunicazione si può presentare allegando la dichiarazione del
      notaio che l'atto è in corso di registrazione.
    status: verified
    source: modulo-subingresso
  - text: >-
      Prima della stipula dell'atto la comunicazione non si può presentare: il subentrante deve
      provare l'effettivo trasferimento dell'attività (art. 97, c. 2, per la somministrazione) e il
      modulo chiede gli estremi dell'atto. Nessuna fonte letta prevede la presentazione sulla base di
      un preliminare.
    status: unverified
  - text: >-
      Il modulo ricorda che, secondo l'art. 2556 c.c., i contratti di trasferimento della proprietà o
      della gestione di un'azienda commerciale si stipulano dal notaio, per atto pubblico o scrittura
      privata autenticata, registrata all'Agenzia delle Entrate. Il codice civile chiede la prova
      scritta e il deposito al Registro delle imprese da parte del notaio entro 30 giorni.
    status: verified
    source: modulo-subingresso
  - text: >-
      Affitto d'azienda e dehors: il fitto o comodato d'azienda non comporta la voltura della
      concessione di suolo pubblico, che resta in capo al proprietario, soggetto passivo del canone
      per tutta la durata del fitto (regolamento del canone, art. 10, c. 10).
    status: verified
    source: regolamento-cup
  - text: >-
      Cessione con dehors di un bar o ristorante: il subentro nella concessione è efficace solo con
      l'atto notarile presentato al servizio concessorio, i canoni in regola per tutte le annualità
      non prescritte e i tributi locali del subentrante in regola (art. 10, c. 9). Senza comunicazione
      tempestiva della voltura il canone resta dovuto dal cedente fino alla scadenza (c. 7).
    status: verified
    source: regolamento-cup
  - text: >-
      La pagina del Comune sui dehors (aggiornata al 10/02/2026) chiede di inviare le comunicazioni di
      subingresso via PEC a due indirizzi del Comune, mentre il SUAP dice che le pratiche via PEC non
      vengono istruite: chiedere al SUAP il canale attuale.
    status: disputed
    source: dehors-pagina
  - text: >-
      Diritti SUAP per la voltura del dehors: la riga S189 (occupazione di suolo pubblico annesso a
      pubblici esercizi) ha 250 euro in apertura e 200 euro nella colonna VCA; non è confermato che
      si applichi alla comunicazione di voltura.
    status: unverified
  - text: >-
      Insegne: per le autorizzazioni dei mezzi pubblicitari permanenti il regolamento del canone (art.
      28) chiede un'istanza di voltura al SUAP entro 90 giorni dalla cessione o dal fitto d'azienda,
      con il cedente iscritto alla Camera di commercio e cedente e subentrante in regola con tributi
      e canoni; per le insegne di esercizio l'art. 31 prevede invece la SCIA di subentro. Chiedere al
      SUAP quale regola si applica a insegne diverse dall'insegna di esercizio.
    status: verified
    source: regolamento-cup
  - text: >-
      Diritti SUAP per la SCIA di subentro nell'insegna: 80 euro (riga S204, colonna VCA).
    status: verified
    source: tabella-2026
  - text: >-
      Nel front office di impresainungiorno-Napoli l'evento è "Subentrare nell'esercizio
      dell'attività": per il vicinato alimentare il percorso è Vicinato – settore merceologico
      Alimentare o Misto – Subentrare nell'esercizio dell'attività; con consumo sul posto va indicata
      la superficie dedicata al consumo.
    status: verified
    source: scheda-4
  - text: >-
      Per bar e ristoranti in zona A o B il SUAP indica il procedimento "Esercizio di
      somministrazione di alimenti e bevande in zone tutelate" (settore ristorazione, Ateco 55–56),
      evento "Subentrare nell'esercizio dell'attività", con gli allegati chiesti dal front office.
    status: verified
    source: scheda-1
  - text: >-
      Il modulo regionale in PDF serve per preparare i dati: la pratica si compila nel front office di
      impresainungiorno-Napoli, che può chiedere campi diversi.
    status: unverified
  - text: >-
      L'allegato A della L.R. 7/2020 è pubblicato sul sito della Regione solo come immagini del BURC n.
      91 del 27 aprile 2020; l'indice lo dice modificato dalla L.R. 5/2021 (art. 11, lettere l e m) e
      il testo modificato non è stato visto.
    status: verified
    source: lr7-allegati
  - text: >-
      Le pratiche SUAP inviate via PEC o e-mail ordinaria non vengono istruite: l'unico canale è
      impresainungiorno.
    status: verified
    source: suap-contatti
  - text: >-
      La pagina del servizio "Avviare, variare, chiudere un'attività produttiva" (aggiornata al
      07/10/2025) collega come "nuova tabella" dei diritti un file precedente; vale la tabella 2026
      della pagina Diritti d'istruttoria.
    status: verified
    source: suap-servizio
