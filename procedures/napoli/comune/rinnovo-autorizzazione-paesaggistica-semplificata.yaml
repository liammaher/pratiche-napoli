steps:
  - do: Firmare la procura speciale se la domanda la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Verificare con il tecnico che l'autorizzazione sia scaduta da non più di un anno, che i lavori
      non siano stati eseguiti o lo siano solo in parte, e se il progetto cambia o sono sopravvenute
      prescrizioni di tutela (allora la relazione paesaggistica semplificata, o l'ordinaria)
    who: professional
  - do: Pagare l'imposta di bollo e i diritti dovuti, e allegarne la ricevuta
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      del rinnovo dell'autorizzazione paesaggistica semplificata, compilare, allegare i documenti
      firmati digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
  - do: Attendere il rinnovo prima di riprendere i lavori
    who: owner
