schema_version: 0
id: napoli/comune/rinnovo-autorizzazione-paesaggistica-semplificata
title: Rinnovo dell'autorizzazione paesaggistica scaduta (art. 7 D.P.R. 31/2017) – Comune di Napoli, sul SUE
headline: "Autorizzazione paesaggistica scaduta da meno di un anno: come rinnovarla a Napoli"
aka:
  - rinnovo paesaggistica
  - rinnovo autorizzazione paesaggistica
  - paesaggistica scaduta
  - art. 7 DPR 31/2017
updated: 2026-11-05
summary: >-
  L'autorizzazione paesaggistica vale cinque anni. Se è scaduta da non più di un anno e i lavori
  non sono stati fatti, o solo in parte, si chiede il rinnovo con il procedimento semplificato del
  D.P.R. 31/2017, anche per un'autorizzazione ordinaria, purché il progetto resti quello
  autorizzato e rispetti le eventuali nuove prescrizioni di tutela; se si cambia il progetto in
  modo non lieve si torna all'autorizzazione ordinaria. Senza modifiche non serve la relazione
  paesaggistica. A Napoli si chiede al Comune sul portale "Impresa in un giorno".
ente:
  name: Comune di Napoli
  office: Sportello Unico Edilizia (istanze sul SUE)
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata, paesaggio]
  conditions:
    - text: >-
        Sono assoggettate al procedimento semplificato le istanze di rinnovo di autorizzazioni
        paesaggistiche, anche rilasciate ai sensi dell'art. 146 del Codice, scadute da non più di un
        anno e relative a interventi in tutto o in parte non eseguiti, a condizione che il progetto
        risulti conforme a quanto in precedenza autorizzato e alle specifiche prescrizioni di tutela
        eventualmente sopravvenute (art. 7 c. 1 D.P.R. 31/2017).
      status: verified
      source: dpr31-art7
    - text: >-
        Se con l'istanza di rinnovo si chiedono anche variazioni progettuali che comportano
        interventi di non lieve entità, si applica il procedimento ordinario dell'art. 146 del
        Codice (art. 7 c. 2).
      status: verified
      source: dpr31-art7
    - text: >-
        L'istanza di rinnovo non è corredata dalla relazione paesaggistica semplificata se non si
        chiedono variazioni progettuali e non sono sopravvenute specifiche prescrizioni di tutela
        (art. 7 c. 3).
      status: verified
      source: dpr31-art7
    - text: >-
        L'autorizzazione paesaggistica è efficace per cinque anni, scaduti i quali i lavori vanno
        sottoposti a nuova autorizzazione; i lavori iniziati nel quinquennio possono essere conclusi
        entro l'anno successivo alla sua scadenza (art. 146 c. 4 D.Lgs. 42/2004). Lo stesso vale per
        l'autorizzazione rinnovata (art. 7 c. 3 D.P.R. 31/2017).
      status: verified
      source: dlgs42-art146
    - text: >-
        Sul SUE di Napoli l'operazione "Rinnovo Autorizzazione Paesaggistica Semplificata (DPR
        31/2017 - Comune)" (gruppo Beni Paesaggistici) chiede numero, data, scadenza ed ente
        dell'autorizzazione scaduta e se si tratta di una semplificata per interventi dell'Allegato
        B o di un'autorizzazione dell'art. 146 scaduta da non più di un anno, e le dichiarazioni sui
        diritti di segreteria e sull'imposta di bollo.
      status: verified
      source: portale-sue-operazioni
legal_basis:
  - text: "D.P.R. 13 febbraio 2017, n. 31, art. 7 (rinnovo) e art. 11 (procedimento semplificato); D.Lgs. 42/2004, art. 146 c. 4."
    status: verified
    source: dpr31-art7
deadline:
  summary:
    text: Entro un anno dalla scadenza dell'autorizzazione.
    status: verified
    source: dpr31-art7
duration:
  text: >-
    Il Comune chiede le eventuali integrazioni entro dieci giorni e trasmette alla Soprintendenza la
    proposta di accoglimento entro venti giorni dall'istanza; il Soprintendente dà il parere
    vincolante entro venti giorni e il Comune adotta il provvedimento nei dieci giorni successivi
    (art. 11 c. 5 D.P.R. 31/2017). Se il parere non arriva nei tempi si forma il silenzio assenso
    e il Comune rilascia l'autorizzazione (c. 9).
  status: verified
  source: dpr31-art11
pitfalls:
  - text: >-
      La tabella dei diritti SUE 2026 non ha una riga per il rinnovo; se valga quella delle
      autorizzazioni paesaggistiche oggetto di autonoma istanza (SUE 2, 401,00 euro) va chiesto al
      SUE.
    status: unverified
    source: tabella-diritti
  - text: >-
      Un'autorizzazione scaduta da più di un anno non si rinnova con l'art. 7: serve una nuova
      autorizzazione.
    status: verified
    source: dpr31-art7
