steps:
  - do: >-
      Stabilire con il tecnico se l'immobile è tutelato (artt. 136, 142) e se i lavori sono fuori
      degli Allegati A e B del D.P.R. 31/2017
    who: professional
  - do: Preparare la relazione paesaggistica e gli elaborati
    who: professional
  - do: Pagare l'imposta di bollo e i diritti dovuti
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      dell'autorizzazione paesaggistica ordinaria (da sola o con la SCIA), compilare, allegare i
      documenti firmati digitalmente e inviare
    who: professional
    human_only: true
    channel: [portal]
  - do: Iniziare i lavori solo dopo il rilascio dell'autorizzazione e del titolo edilizio
    who: owner
