schema_version: 0
id: napoli/comune/autorizzazione-paesaggistica-ordinaria
title: Autorizzazione paesaggistica ordinaria (art. 146 D.Lgs. 42/2004) – Comune di Napoli, sul SUE
headline: "Autorizzazione paesaggistica ordinaria a Napoli: per i lavori in area vincolata"
aka:
  - paesaggistica ordinaria
  - vincolo paesaggistico
  - nulla osta paesaggistico
updated: 2026-10-29
summary: >-
  Chi fa lavori in un'area o su un immobile sotto tutela paesaggistica (artt. 136 e 142 del D.Lgs.
  42/2004) che alterano i luoghi o l'aspetto esteriore degli edifici, quando non sono nell'Allegato
  A (esenti) né nell'Allegato B (semplificata) del D.P.R. 31/2017, chiede l'autorizzazione
  paesaggistica ordinaria. A Napoli la rilascia il Comune e si chiede sul portale "Impresa in un
  giorno", da sola o nella stessa pratica del titolo edilizio; è un atto autonomo e presupposto del
  titolo edilizio, e i lavori non partono prima del rilascio.
ente:
  name: Comune di Napoli
  office: Sportello Unico Edilizia (istanze sul SUE)
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata, paesaggio]
  conditions:
    - text: >-
        Chi possiede o detiene immobili e aree di interesse paesaggistico tutelati per legge (art.
        142) o in base alla legge (art. 136 e seguenti) presenta il progetto degli interventi e non
        avvia i lavori finché non ha ottenuto l'autorizzazione (art. 146 c. 1-2 D.Lgs. 42/2004).
      status: verified
      source: dlgs42-art146
    - text: >-
        L'autorizzazione è un atto autonomo e presupposto rispetto al permesso di costruire o agli
        altri titoli edilizi, è efficace per cinque anni e, fuori dei casi dell'art. 167 c. 4 e 5,
        non può essere rilasciata in sanatoria dopo la realizzazione, anche parziale, dei lavori (art.
        146 c. 4).
      status: verified
      source: dlgs42-art146
    - text: Gli interventi dell'Allegato A del D.P.R. 31/2017 e dell'art. 4 non sono soggetti ad autorizzazione (art. 2).
      status: verified
      source: dpr31-art2
    - text: >-
        Gli interventi di lieve entità dell'Allegato B seguono il procedimento semplificato (art. 3
        D.P.R. 31/2017); gli altri che richiedono l'autorizzazione seguono il procedimento ordinario
        dell'art. 146.
      status: verified
      source: dpr31-art3
    - text: >-
        Sul SUE di Napoli l'operazione "Autorizzazione paesaggistica ordinaria (art.146 del D.Lgs
        42/2004 - Comune)" è un adempimento degli uffici del Comune di Napoli, e si può scegliere
        insieme alla SCIA nella stessa pratica.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        Con la SCIA l'autorizzazione ordinaria si chiede contestualmente (SCIA condizionata, quadro
        17.3.2 del modulo, con la relazione paesaggistica): i lavori iniziano dopo il suo rilascio.
      status: verified
      source: scia-modulo
legal_basis:
  - text: "D.Lgs. 42/2004, artt. 136, 142, 146; D.P.R. 31/2017, artt. 2-3."
    status: verified
    source: dlgs42-art146
