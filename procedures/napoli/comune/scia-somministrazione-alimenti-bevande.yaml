schema_version: 0
id: napoli/comune/scia-somministrazione-alimenti-bevande
title: Aprire un bar o un ristorante – SCIA o autorizzazione per la somministrazione di alimenti e bevande (Comune di Napoli)
headline: "Aprire un bar o un ristorante a Napoli: SCIA, autorizzazione e requisiti"
aka:
  - licenza bar
  - licenza ristorante
  - aprire una pizzeria
  - permesso per aprire un locale
  - pratica SUAP
updated: 2026-10-26
summary: >-
  Chi vuole aprire a Napoli un bar, un ristorante, una pizzeria o un altro locale dove i clienti
  consumano sul posto con servizio deve presentare la pratica al SUAP del Comune, solo online su
  impresainungiorno. Fuori dal centro storico UNESCO e dalla buffer zone basta una SCIA e si può
  aprire dal giorno della presentazione; dentro quelle zone, dal 25 luglio 2026, serve
  un'autorizzazione che si ottiene solo rispettando i requisiti strutturali e un punteggio minimo
  del Piano comunale.
ente:
  name: Comune di Napoli
  office: Area Sviluppo Economico – Servizio Sportello Unico per le Attività Produttive (SUAP)
  ipa: c_f839
applies_to:
  events: [open, food, move]
  audience: [business]
  sectors:
    - somministrazione di alimenti e bevande (bar, ristoranti, pizzerie, pub, gelaterie con servizio)
  conditions:
    - text: >-
        Somministrazione al pubblico di alimenti e bevande: la vendita per il consumo sul posto,
        in cui i clienti consumano, con il relativo servizio, nei locali dell'esercizio o in
        un'area aperta al pubblico attrezzata a tal fine (L.R. Campania 7/2020, art. 89).
      status: verified
      source: lr-campania-7-2020
    - text: >-
        In Campania gli esercizi di somministrazione sono un'unica tipologia, che comprende anche
        le bevande alcoliche di qualsiasi gradazione (art. 90, c. 1).
      status: verified
      source: lr-campania-7-2020
    - text: >-
        Requisiti morali: non deve trovarsi in nessuna delle situazioni dell'art. 71, commi 1–5,
        del d.lgs. 59/2010 (ad esempio alcune condanne definitive o misure di prevenzione); per la
        somministrazione contano anche le condanne per reati contro la moralità pubblica e il buon
        costume, per gioco d'azzardo, scommesse clandestine, stupefacenti o reati commessi in stato
        di ubriachezza (comma 2). In una società li devono avere il legale rappresentante, l'eventuale
        preposto e gli altri soggetti indicati dalla norma antimafia (comma 5).
      status: verified
      source: dlgs-59-2010-art71
    - text: >-
        Requisiti professionali (almeno uno): a) corso professionale per il commercio, la
        preparazione o la somministrazione di alimenti istituito o riconosciuto dalla Regione,
        superato con esito positivo; b) almeno due anni, anche non continuativi, negli ultimi cinque,
        di attività in proprio nel settore alimentare o della somministrazione, o di lavoro
        qualificato in imprese del settore (anche come coadiuvante familiare iscritto all'INPS);
        c) diploma o laurea con materie attinenti al commercio, alla preparazione o alla
        somministrazione degli alimenti (art. 71, c. 6).
      status: verified
      source: dlgs-59-2010-art71
    - text: >-
        In un'impresa individuale o in una società i requisiti professionali li deve avere il
        titolare o il legale rappresentante, oppure la persona preposta all'attività (art. 71,
        c. 6-bis).
      status: verified
      source: dlgs-59-2010-art71
    - text: >-
        La L.R. Campania 7/2020 (art. 7) applica alla somministrazione proprio questi requisiti
        morali e professionali del d.lgs. 59/2010.
      status: verified
      source: lr-campania-7-2020
    - text: >-
        Zona C (fuori dal centro storico UNESCO e dalla buffer zone): apertura, trasferimento di
        sede e ampliamento di superficie sono soggetti a SCIA (art. 19 L. 241/1990) presentata al
        SUAP (Piano, art. 5).
      status: verified
      source: piano-2026
    - text: >-
        Zona A (centro storico UNESCO, aree 1 rossa, 2 arancione, 3 gialla) e zona B (buffer zone,
        blu): apertura, trasferimento di sede e ampliamento di superficie sono soggetti ad
        autorizzazione del Comune, rilasciata solo se il locale ha i requisiti strutturali minimi e
        raggiunge il punteggio gestionale minimo della propria area (Piano, artt. 4, 7, 9, 11, 12).
        È soggetto ad autorizzazione anche il trasferimento da una zona non tutelata a una
        tutelata o dentro la stessa zona tutelata.
      status: verified
      source: piano-2026
    - text: >-
        Requisiti strutturali minimi in zona A e B: superficie di somministrazione (tavoli, sedie e
        arredi per il pubblico) non inferiore a 20 mq; locali accessibili alle persone con
        disabilità; richiesta di nulla osta di impatto acustico (art. 8 L. 447/1995); un sistema di
        sicurezza (videosorveglianza, antintrusione o sistemi passivi). Tutto va asseverato da un
        tecnico abilitato (Piano, art. 7).
      status: verified
      source: piano-2026
    - text: >-
        Punteggio gestionale minimo per la somministrazione: zona A area 1 ≥ 120 punti (superficie
        totale oltre 150 mq) o ≥ 90 (fino a 150 mq); area 2 ≥ 110 o ≥ 80; area 3 ≥ 100 o ≥ 70;
        zona B ≥ 90 o ≥ 60. I punti si ottengono con i criteri dell'art. 9 (ad esempio chiusura
        entro le 24: 40 punti; climatizzazione: 30; insonorizzazione certificata: 30; vigilanza
        esterna dopo le 22: 30), asseverati da un tecnico abilitato (Piano, artt. 9 e 12).
      status: verified
      source: piano-2026
    - text: >-
        Restano soggette a SCIA in qualsiasi zona alcune somministrazioni particolari: aree di
        servizio autostradali, stazioni, mense aziendali, ospedali, scuole, mezzi di trasporto,
        catering e domicilio del consumatore, esercizi annessi a strutture ricettive per i soli
        alloggiati e altre (Piano, art. 4, c. 5; L.R. 7/2020, art. 92).
      status: verified
      source: piano-2026
    - text: >-
        In tutte le zone (A, B e C) il titolare deve essere in regola con il pagamento dei tributi
        comunali (Piano, art. 3, c. 2).
      status: verified
      source: piano-2026
legal_basis:
  - text: >-
      L.R. Campania 21 aprile 2020, n. 7 (Testo unico sul commercio): art. 7 (requisiti), artt.
      88–100 (somministrazione: definizioni, regimi, SCIA, subingresso, prezzi, orari), art. 149
      (vigilanza, sanzioni e decadenza).
    status: verified
    source: lr-campania-7-2020
  - text: D.lgs. 26 marzo 2010, n. 59, art. 71 (requisiti morali e professionali).
    status: verified
    source: dlgs-59-2010-art71
  - text: >-
      Art. 64 del d.lgs. 59/2010 e art. 91, c. 3, della L.R. 7/2020: il Comune può sottoporre ad
      autorizzazione le aperture nelle zone tutelate.
    status: verified
    source: lr-campania-7-2020
  - text: >-
      Piano per la programmazione delle aperture degli esercizi di somministrazione di alimenti e
      bevande nel centro storico di Napoli, sito UNESCO, e nella buffer zone, approvato con
      deliberazione di Consiglio comunale n. 79 del 29 giugno 2026; in vigore dal 25 luglio 2026.
    status: verified
    source: avviso-zone-tutelate
  - text: >-
      Art. 19 della L. 241/1990 (SCIA): nelle zone non tutelate l'attività può iniziare dal giorno
      della presentazione.
    status: verified
    source: esercizi-pubblici
  - text: >-
      Decreto del Ministro dell'interno 17 dicembre 1992, n. 564 (sorvegliabilità dei locali): il
      Comune la accerta anche in caso di ampliamento o modifiche strutturali (L.R. 7/2020, art. 90,
      c. 2).
    status: verified
    source: lr-campania-7-2020
deadline:
  rules:
    - text: >-
        Zona C: la SCIA va presentata prima di iniziare; l'attività può partire dal giorno della
        presentazione (con la ricevuta elettronica del SUAP).
      status: verified
      source: esercizi-pubblici
    - text: >-
        Zone A e B: non si può aprire prima di aver ottenuto l'autorizzazione e, se richiesto
        separatamente, il nulla osta di impatto acustico.
      status: verified
      source: nota-condivisione
    - text: >-
        Tempo di risposta sull'autorizzazione: la L.R. 7/2020 (art. 91, c. 5) prevede risposta
        entro 60 giorni dalla domanda, con silenzio-assenso se il SUAP non risponde; la pagina del
        Comune "Avviare, variare, chiudere un'attività produttiva" indica invece 90 giorni per le
        autorizzazioni (e 60 per le SCIA, 30 per le comunicazioni). Chiedere al SUAP quale termine
        applica.
      status: disputed
      source: lr-campania-7-2020
    - text: >-
        Il titolo decade se l'attività non viene avviata entro sei mesi dal rilascio
        dell'autorizzazione o dalla presentazione della SCIA, salvo proroga motivata (L.R. 7/2020,
        art. 149, c. 9; il Piano, art. 16, indica 180 giorni per le attività autorizzate). Decade
        anche se l'attività resta sospesa per più di dodici mesi.
      status: verified
      source: lr-campania-7-2020
    - text: >-
        La delega a un preposto va comunicata al Comune entro trenta giorni dal conferimento (L.R.
        7/2020, art. 91, c. 6).
      status: verified
      source: lr-campania-7-2020
    - text: >-
        Subingresso (acquisto o affitto d'azienda): SCIA al SUAP entro novanta giorni dalla
        stipula dell'atto di trasferimento; in caso di morte del titolare, entro un anno (L.R.
        7/2020, art. 97).
      status: verified
      source: lr-campania-7-2020
  lateness:
    text: >-
      Chi esercita senza autorizzazione o SCIA, con un titolo sospeso o decaduto, o senza i
      requisiti morali e professionali è punito con la sanzione amministrativa prevista dall'art.
      149, c. 2, della L.R. 7/2020 (da 2.500 a 15.000 euro) e il SUAP dispone la cessazione
      dell'attività e la chiusura dell'esercizio (c. 4). Nelle zone A e B il Piano (art. 15)
      prevede anche il divieto di prosecuzione per chi non rispetta i suoi requisiti. L'importo in
      concreto lo stabilisce l'ufficio che accerta la violazione.
    status: verified
    source: lr-campania-7-2020
cost:
  text: >-
    Diritti d'istruttoria SUAP (tabella 2026), da pagare con pagoPA nella pratica: fuori dal centro
    storico UNESCO e dalla buffer zone 120 euro per bar o ristorante con notifica sanitaria, 220
    euro se c'è anche il nulla osta di impatto acustico; nelle zone tutelate 420 euro, o 520 con il
    nulla osta. A parte si pagano i diritti sanitari dell'ASL (vedi la procedura ASL collegata) e,
    per la domanda di autorizzazione nelle zone tutelate, l'eventuale imposta di bollo. Il compenso
    del tecnico non è compreso.
  status: verified
  source: tabella-diritti-2026
duration:
  text: >-
    Fuori dalle zone tutelate (zona C) si apre il giorno stesso, appena arriva la ricevuta della
    SCIA, e il SUAP ha 60 giorni per i controlli. Nel centro storico UNESCO e nella buffer zone
    (zone A e B) si apre solo dopo l'autorizzazione: la L.R. Campania 7/2020 (art. 91) dà al SUAP
    60 giorni, con silenzio-assenso se non risponde, mentre la pagina del Comune indica 90 giorni
    per le autorizzazioni. Chiedere al SUAP quale termine applica.
  status: disputed
  source: servizio-suap
appointment:
  text: >-
    Non serve: la pratica si presenta solo online su impresainungiorno. Per informazioni e
    assistenza il SUAP (Piazza Cavour 42) riceve solo su prenotazione online, con il pulsante
    "Prenota appuntamento" della pagina "Avviare, variare, chiudere un'attività produttiva" del
    Comune.
  status: verified
  source: suap-contatti
channels:
  - type: portal
    name: impresainungiorno – SUAP del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/route/suap?codComune=F839&locale=IT
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: servizio-suap
    notes: >-
      Unico canale per le pratiche SUAP. Servono firma digitale, e-mail e PEC. La pagina del
      servizio elenca come sistemi di accesso anche eIDAS e Telemaco. Pratiche inviate via PEC o
      e-mail non vengono istruite.
  - type: desk
    name: SUAP del Comune di Napoli
    address: Piazza Cavour 42, II piano, Napoli
    booking: Solo su prenotazione online (https://portalecittadino.comune.napoli.it/s/prenotazione-appuntamento)
    source: suap-contatti
    notes: >-
      Per informazioni e assistenza, non per depositare la pratica. Ricevimento su prenotazione dal
      18 maggio 2026. Il CAP è indicato come 80137 sulla pagina del servizio e come 80100 sui
      documenti del SUAP.
  - type: phone
    address: 081 7953054
    source: servizio-suap
  - type: email
    address: suaponline@comune.napoli.it
    receipt: informal
    source: suap-contatti
    notes: Per informazioni; le pratiche inviate per e-mail non vengono istruite.
payment:
  method: pagopa
  calculator_url: https://static-www.comune.napoli.it/wp-content/uploads/2021/07/2026-TABELLA-DIRITTI-SUAP-DEF.pdf
  notes:
    - text: >-
        I diritti d'istruttoria SUAP si pagano con pagoPA dentro il front office di
        impresainungiorno-Napoli, nella sezione "Dichiarazione relativa ai diritti di
        segreteria/istruttori".
      status: verified
      source: guida-pagopa
    - text: >-
        Tabella 2026 (apertura): somministrazione in zone non tutelate 100 € (S71); con notifica
        sanitaria 120 € (S72); con notifica sanitaria e nulla osta di impatto acustico 220 € (S73).
        In zone tutelate 400 € (S74); con notifica sanitaria 420 € (S75); con notifica sanitaria e
        nulla osta di impatto acustico 520 € (S76). Per le variazioni (subingresso, variazione
        superficie, trasferimento ecc.) si usano le colonne VCA e VPF della stessa tabella.
      status: verified
      source: tabella-diritti-2026
    - text: >-
        Le tariffe in vigore dall'11 giugno 2026 sono quelle della delibera di Giunta comunale n.
        239 del 28 maggio 2026.
      status: verified
      source: diritti-suap
    - text: >-
        Per una pratica composta (per esempio SCIA unica bar + notifica sanitaria) si paga la somma
        dei diritti dei singoli procedimenti ("logica del carrello"). I diritti dovuti ad altri enti
        (per esempio l'ASL) si pagano secondo le istruzioni di quegli enti e la ricevuta si allega
        alla pratica.
      status: verified
      source: guida-pagopa
    - text: >-
        Sulla domanda di autorizzazione (zone A e B) potrebbe essere dovuta l'imposta di bollo;
        la guida del SUAP spiega come pagarla con pagoPA ma non dice se è dovuta per questo
        procedimento. Verificarlo nel front office.
      status: unverified
documents:
  - name: Relazione tecnica asseverata da tecnico abilitato, con gli elaborati tecnici (planimetrie)
    required: true
    notes: >-
      Deve attestare il rispetto delle norme edilizie, urbanistiche, di destinazione d'uso, di
      tutela delle zone di pregio, di sicurezza sul lavoro, di sorvegliabilità, igienico-sanitarie
      e di impatto acustico (pagina Esercizi pubblici).
  - name: Dichiarazioni sostitutive sui requisiti morali e professionali (artt. 46–47 DPR 445/2000)
    required: true
    notes: >-
      Rese nei modelli del front office dal titolare o legale rappresentante, dagli altri soggetti
      richiesti e dall'eventuale preposto; tenere a portata di mano l'attestato del corso, il
      titolo di studio o le prove dell'esperienza.
  - name: Notifica sanitaria ai fini della registrazione (art. 6 Reg. CE 852/2004)
    required: true
    notes: >-
      Si presenta nella stessa pratica SUAP (SCIA unica bar + notifica sanitaria); vedi la
      procedura ASL collegata.
  - name: Istanza o nulla osta di impatto acustico
    required: false
    notes: >-
      Obbligatoria nelle zone A e B (Piano, art. 7). Il Comune la richiede anche per la musica
      riservata ai clienti; in zona C la relazione del tecnico deve comunque coprire l'impatto
      acustico.
  - name: Allegato 1 CS 1 – asseverazione dei criteri strutturali (zone A e B)
    required: false
    notes: Solo zone A e B; lo compila e firma il tecnico abilitato sul modello del SUAP.
  - name: Allegato 3 CG 1 – asseverazione dei criteri gestionali con punteggio (zone A e B)
    required: false
    notes: Solo zone A e B; lo compila e firma il tecnico abilitato sul modello del SUAP.
  - name: Nota di condivisione e assunzione di responsabilità dell'intestatario della pratica (zone A e B)
    required: false
    notes: Solo zone A e B; vedi il modulo mappato sotto.
  - name: Ricevuta di pagamento dei diritti d'istruttoria (pagoPA) e degli eventuali diritti di altri enti
    required: true
  - name: Titolo di disponibilità del locale (contratto di locazione, proprietà, comodato)
    required: false
    notes: >-
      Per l'autorizzazione in zona tutelata non serve già alla domanda: va trasmesso al SUAP
      all'avvio dell'attività, insieme al nome dell'eventuale preposto e alle certificazioni
      sanitarie e antincendio (L.R. 7/2020, art. 91, c. 4).
