  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: letti il Piano (testo coordinato) e la delibera C.C. 79/2026, l'avviso SUAP sulle zone
    tutelate, il vademecum, la Scheda 1, la nota di condivisione, gli allegati CS 1 e CG 1,
    l'allegato tecnico operativo, le pagine comunali Esercizi pubblici, Avviare/variare/chiudere
    un'attività produttiva, SUAP Contatti, Procedura e Diritti d'istruttoria, la tabella diritti
    SUAP 2026, la guida pagoPA, gli artt. 7, 88–100 e 149 della L.R. Campania 7/2020 e l'art. 71
    del d.lgs. 59/2010.
  notes: >-
    Non visti i moduli del front office di impresainungiorno (richiedono accesso), quindi non
    mappati. Non verificati con l'ufficio il termine dell'autorizzazione e il regime del
    subingresso nelle zone tutelate.
