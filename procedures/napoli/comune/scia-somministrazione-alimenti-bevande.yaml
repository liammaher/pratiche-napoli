      - { label: Data, map: { ask: Data in cui si firma la nota } }
      - label: Altro (in calce)
        map: { blank_with_reason: Campo libero facoltativo; lasciarlo vuoto se non serve. }
      - label: Firma dell'intestatario della pratica
