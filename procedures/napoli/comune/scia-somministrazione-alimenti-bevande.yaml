steps:
  - do: >-
      Controllare se l'indirizzo del locale ricade nella zona A (aree 1, 2, 3), nella zona B o
      nella zona C, con lo stradario e le cartografie allegate al Piano (in caso di dubbio prevale
      la cartografia)
    who: anyone
  - do: >-
      Verificare che il titolare o legale rappresentante (o un preposto) abbia i requisiti morali
      e almeno un requisito professionale, e che l'impresa sia in regola con i tributi comunali
    who: owner
  - do: >-
      Incaricare un tecnico abilitato di verificare il locale (destinazione d'uso, igiene,
      sorvegliabilità, sicurezza, acustica) e di preparare relazione asseverata ed elaborati; in
      zona A o B anche gli allegati CS 1 e CG 1 con il punteggio raggiunto
    who: professional
  - do: >-
      Creare la pratica su impresainungiorno-Napoli (settore ristorazione, Ateco 55–56): in zona C
      SCIA di apertura con la notifica sanitaria; in zona A o B il procedimento "Esercizio di
      somministrazione di alimenti e bevande in zone tutelate" – Aprire l'attività, allegando i
      modelli del Piano
    who: facilitator
  - do: Compilare la nota di condivisione (solo zone A e B) con il codice della pratica
    who: anyone
  - { do: Firmare la nota di condivisione e i modelli della pratica (firma digitale), who: owner, human_only: true }
  - { do: Pagare i diritti d'istruttoria con pagoPA nel front office, who: owner, human_only: true }
  - { do: Inviare la pratica su impresainungiorno, who: owner, human_only: true }
  - do: >-
      Zona C: aprire dopo aver ricevuto la ricevuta elettronica. Zone A e B: attendere
      l'autorizzazione del SUAP (e il nulla osta acustico, se richiesto separatamente)
    who: office
  - do: >-
      Avviare l'attività entro sei mesi; comunicare al Comune e al pubblico l'orario adottato ed
      esporre prezzi e menù; comunicare entro 30 giorni l'eventuale delega al preposto
    who: owner
after:
  - Conservare la ricevuta di impresainungiorno, l'autorizzazione (zone A e B) e tutti gli allegati inviati.
  - >-
    Entro 90 giorni dall'inizio dell'occupazione del locale presentare la dichiarazione TARI per
    uso non abitativo.
  - >-
    Per l'insegna serve una SCIA a parte; per tavolini all'aperto su suolo pubblico (dehors) serve
    la concessione di suolo pubblico.
  - >-
    Ogni variazione (subingresso, trasferimento, ampliamento, cambio del legale rappresentante,
    cessazione) va comunicata al SUAP con il procedimento previsto.
  - >-
    Nelle zone A e B i requisiti del Piano vanno mantenuti nel tempo: il Comune li controlla anche
    dopo l'apertura e, se mancano, può revocare l'autorizzazione.
pitfalls:
  - text: >-
      La pagina del Comune "Esercizi pubblici" (aggiornata al 4 giugno 2025) dice ancora che ogni
      nuova apertura è soggetta a SCIA e distingue le tipologie A–D della L. 287/1991: è superata,
      per le zone A e B, dal Piano in vigore dal 25 luglio 2026.
    status: verified
    source: esercizi-pubblici
  - text: >-
      La L.R. Campania 7/2020 (art. 90) prevede un'unica tipologia di esercizio di somministrazione,
      senza la distinzione A–D della pagina comunale.
    status: verified
    source: lr-campania-7-2020
  - text: >-
      Subingresso nelle zone A e B: il Piano approvato dal Consiglio (art. 6, c. 1, come
      emendato) lo subordina ad autorizzazione; il vademecum e l'avviso del SUAP dicono che resta
      a SCIA se non ci sono modifiche sostanziali, "in virtù della prevalente normativa regionale";
      la Scheda 1 indica "Comunicazione". Chiedere al SUAP prima di comprare o affittare un locale
      già avviato in zona tutelata.
    status: disputed
    source: piano-2026
  - text: >-
      Superficie minima in zona A e B: il Piano (art. 7) e il modello CS 1 chiedono una superficie
      di somministrazione non inferiore a 20 mq; l'allegato tecnico operativo del SUAP riporta
      "≥ 30 mq; 20 mq". Il punteggio gestionale parte comunque da 30 mq di superficie di
      somministrazione.
    status: disputed
    source: allegato-tecnico
  - text: >-
      La nota di condivisione cita il Piano come "Delibera di Giunta Comunale n. 288 del
      24/06/2025", ma quella è la proposta: il Piano è stato approvato con la delibera di
      Consiglio n. 79 del 29 giugno 2026, il cui testo riporta la data della proposta sia come
      24/06/2025 sia come 24.06.2026.
    status: disputed
    source: delibera-cc-79-2026
  - text: >-
      Al 23 luglio 2026 impresainungiorno non aveva ancora i procedimenti specifici del Piano: si
      usano quelli esistenti e i modelli richiesti dal Piano (CS 1, CG 1, nota di condivisione) si
      allegano a parte, seguendo la Scheda 1.
    status: verified
    source: avviso-zone-tutelate
  - text: >-
      In impresainungiorno-Napoli la pratica per le zone tutelate si trova in "Scelta settore
      attività" → strutture ricettive (alloggio) e ristorazione (Ateco da 55 a 56) → "Esercizio di
      somministrazione di alimenti e bevande in zone tutelate"; per aprire va allegato, oltre ai
      documenti chiesti dal front office, CS 1, CG 1 e la nota di condivisione.
    status: verified
    source: scheda-1
  - text: >-
      Se lo stradario e le cartografie del Piano non coincidono, prevale la cartografia.
    status: verified
    source: vademecum
  - text: >-
      In via San Gregorio Armeno è ammessa solo la produzione e vendita di prodotti dell'arte
      presepiale; a Port'Alba solo l'attività libraria. Nella zona A è vietata la somministrazione
      con distributori automatici.
    status: verified
    source: piano-2026
  - text: >-
      Chi alla data di entrata in vigore del Piano aveva già investimenti documentati con data
      certa (pratiche edilizie, contratto di locazione registrato, finanziamenti) in strade delle
      zone A e B non comprese nelle zone tutelate può essere escluso dal Piano, ma deve presentare
      la domanda entro 120 giorni dall'entrata in vigore (art. 21, c. 3).
    status: verified
    source: piano-2026
  - text: >-
      Le pratiche inviate via PEC o e-mail al SUAP non vengono istruite: si usa solo
      impresainungiorno.
    status: verified
    source: suap-contatti
  - text: >-
      La guida pagoPA del SUAP indica ancora i diritti della delibera di Giunta n. 373/2018; dall'11
      giugno 2026 valgono quelli della delibera n. 239/2026.
    status: verified
    source: guida-pagopa
  - text: >-
      Anche la sola musica riservata ai clienti non richiede licenza né SCIA, purché non diventi
      pubblico spettacolo, ma serve il nulla osta di impatto acustico del servizio controlli
      ambientali.
    status: verified
    source: esercizi-pubblici
  - text: >-
      Gli orari sono liberi ma vanno comunicati prima al Comune e al pubblico; il Comune può
      limitarli con ordinanza (art. 50 TUEL).
    status: verified
    source: lr-campania-7-2020
  - text: >-
      Il locale deve rispettare i criteri di sorvegliabilità del D.M. 564/1992 e le norme di
      prevenzione incendi.
    status: verified
    source: lr-campania-7-2020
