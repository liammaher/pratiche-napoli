schema_version: 0
id: napoli/comune/cambio-intestazione-cila-scia
title: Cambio d'intestazione di una CILA, SCIA o DIA – SUE del Comune di Napoli
headline: "Subentrare in una CILA o una SCIA a Napoli: la comunicazione di cambio d'intestazione"
aka:
  - cambio intestazione CILA
  - cambio intestazione SCIA
  - voltura SCIA
  - voltura CILA
  - subentro titolo edilizio
updated: 2026-11-04
summary: >-
  Quando l'immobile di una CILA, di una SCIA o di una vecchia DIA cambia proprietario (o chi ha
  titolo sui lavori cambia) mentre i lavori sono in corso, il nuovo avente titolo lo comunica allo
  Sportello Unico per l'Edilizia: indica il titolo e l'atto con cui è subentrato, dichiara di aver
  preso visione della pratica e dei pareri e di rispettarne le prescrizioni, e può indicare insieme
  un nuovo direttore dei lavori o una nuova impresa. A Napoli si presenta sul portale "Impresa in
  un giorno". Per un permesso di costruire c'è la voltura.
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Sul SUE di Napoli l'operazione "Cambio intestazione CIA / SCIA / DIA" (gruppo Altri
        adempimenti edilizi) è la "Comunicazione per cambio intestazione C.I.L.A. / S.C.I.A. /
        D.I.A." ("Modifica degli aventi titolo"): chiede il tipo di titolo (CILA, DIA o SCIA) con
        protocollo e data, la tipologia di attività, la presa visione della pratica, dei suoi
        allegati e dei pareri, l'impegno a rispettarne prescrizioni e condizioni e la conoscenza di
        progettista, direttore dei lavori ed esecutore; tre scelte aggiungono un nuovo direttore dei
        lavori, una nuova ditta esecutrice e gli altri aventi titolo se ci sono cointestatari.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        Tra gli allegati il portale prevede la dichiarazione sostitutiva sul diritto reale a
        presentare il titolo, la copia registrata dell'atto di alienazione e la ricevuta dei
        versamenti.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        L'art. 11 c. 2 DPR 380/2001 rende trasferibile con l'immobile il permesso di costruire; il
        testo unico non ha una regola analoga scritta per la CILA e la SCIA, e quando la
        comunicazione di cambio d'intestazione sia obbligatoria non è stato verificato (il
        Regolamento edilizio di Napoli non è stato letto).
      status: unverified
      source: dpr380-art11
    - text: >-
        La segnalazione di agibilità, a fine lavori, la presentano chi ha presentato la SCIA o i suoi
        successori o aventi causa (art. 24 c. 2 DPR 380/2001).
      status: verified
      source: dpr380-art24
legal_basis:
  - text: >-
      Nessuna norma specifica trovata; l'operazione è quella del SUE di Napoli su impresainungiorno
      (DD 501/2026).
    status: unverified
