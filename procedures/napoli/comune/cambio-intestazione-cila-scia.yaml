  - type: pec
    purpose: info
    address: sportello.unico.edilizia@pec.comune.napoli.it
    receipt: legal
    source: sue-ufficio
    notes: Per comunicare con l'ufficio, non per presentare la comunicazione.
steps:
  - do: Firmare la procura speciale se la comunicazione la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Raccogliere gli estremi della CILA, SCIA o DIA e dell'atto di trasferimento, prendere visione
      della pratica, dei suoi allegati e dei pareri, e stabilire se cambiano anche direttore dei
      lavori o impresa
    who: professional
  - do: Se ci sono diritti da versare, pagarli e allegarne la ricevuta
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      "Cambio intestazione CIA / SCIA / DIA", compilare, allegare i documenti firmati digitalmente
      e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
