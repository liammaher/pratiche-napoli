  method: >-
    Desk: su Normattiva DPR 380/2001 artt. 15 e 23; le note illustrative della CILA del Comune; la
    DD 501/2026; le operazioni di fine lavori e di agibilità del portale lette in una bozza di
    prova.
  notes: >-
    Non trovati: un termine di legge per la comunicazione di fine lavori, una pagina del Comune su
    di essa e una riga della tabella dei diritti SUE 2026 che la nomini (il portale ha comunque la
    dichiarazione sui diritti e lo spazio per la ricevuta). Non letto il Regolamento edilizio di
    Napoli.
