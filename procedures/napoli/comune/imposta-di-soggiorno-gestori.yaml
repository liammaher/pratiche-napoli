schema_version: 0
id: napoli/comune/imposta-di-soggiorno-gestori
title: Imposta di soggiorno – obblighi del gestore della struttura ricettiva (Comune di Napoli)
headline: "Imposta di soggiorno a Napoli per B&B e affitti brevi: iscrizione GEIS e versamenti"
aka:
  - tassa di soggiorno
  - tourist tax
  - tassa turistica
  - dichiarazione trimestrale imposta di soggiorno
updated: 2026-10-26
summary: >-
  Chi gestisce a Napoli un albergo, un B&B, un affittacamere, una casa vacanze o una locazione
  breve deve iscriversi sul portale GEIS del Comune, far pagare l'imposta di soggiorno agli
  ospiti, presentare ogni trimestre la dichiarazione su GEIS e versare l'imposta con pagoPA entro
  il 15 del mese successivo. Ogni anno, entro il 30 giugno, presenta anche la dichiarazione
  nazionale sul modello del Ministero dell'Economia e delle Finanze.
ente:
  name: Comune di Napoli
  office: Area Entrate – Servizio Gestione Canoni e Altri Tributi – Ufficio Imposta di Soggiorno
  ipa: c_f839
applies_to:
  events: [open, annual]
  audience: [business, resident]
  sectors:
    - alberghi
    - strutture ricettive extralberghiere (B&B, affittacamere, case e appartamenti per vacanze, case per ferie, agriturismi)
    - locazioni brevi (affitti turistici fino a 30 giorni)
  conditions:
    - text: >-
        Riguarda le strutture ricettive alberghiere ed extralberghiere situate nel Comune di Napoli:
        alberghi, residenze turistico-alberghiere, case per ferie, affittacamere, case e appartamenti
        per vacanze, appartamenti ammobiliati per uso turistico, bed & breakfast, agriturismi. Gli
        ostelli della gioventù sono esclusi (art. 2, c. 1 del regolamento).
      status: verified
      source: regolamento
    - text: >-
        L'imposta è dovuta anche per i pernottamenti in immobili a uso abitativo per periodi
        inferiori a 30 giorni (locazioni brevi), che ai fini dell'imposta sono equiparate alle
        strutture extralberghiere.
      status: verified
      source: comune-2026
    - text: >-
        Pagano l'imposta gli ospiti di età superiore a 14 anni, non residenti e non iscritti
        all'anagrafe del Comune di Napoli, per persona e per notte, fino a un massimo di 14
        pernottamenti consecutivi.
      status: verified
      source: comune-2026
    - text: >-
        Il gestore della struttura ricettiva è responsabile del pagamento dell'imposta, con diritto di
        rivalsa sugli ospiti, e della presentazione della dichiarazione (art. 4, c. 1-ter, D.Lgs.
        23/2011). Per le locazioni brevi la stessa responsabilità ricade su chi incassa il canone o
        interviene nel pagamento (art. 4, c. 5-ter, D.L. 50/2017), per esempio una piattaforma o
        un'agenzia.
      status: verified
      source: mef-istruzioni
legal_basis:
  - text: >-
      D.Lgs. 14 marzo 2011, n. 23, art. 4 (istituzione dell'imposta; c. 1-ter: responsabilità del
      gestore, dichiarazione annuale telematica entro il 30 giugno, sanzioni).
    status: verified
    source: dlgs-23-art4
  - text: >-
      D.L. 24 aprile 2017, n. 50, art. 4, c. 5-ter (locazioni brevi: responsabile chi incassa il
      canone o interviene nel pagamento).
    status: verified
    source: mef-istruzioni
  - text: >-
      Regolamento comunale sull'imposta di soggiorno: testo coordinato approvato con delibera C.C.
      20/2012 e modificato da ultimo con delibera C.C. 13 del 29/03/2019 (artt. 7 esenzioni, 8
      obblighi del gestore, 9 sanzioni).
    status: verified
    source: regolamento
  - text: >-
      Delibera C.C. 12 del 04/08/2020: dichiarazione e versamento trimestrali per tutte le strutture
      dal 1° luglio 2020; abrogati i commi 4 e 5 dell'art. 9 del regolamento (sanzioni comunali per
      dichiarazione e riversamento), sostituiti dalle sanzioni di legge.
    status: verified
    source: dcc-12-2020
  - text: >-
      D.M. Economia e Finanze 29 aprile 2022: modello, istruzioni e specifiche tecniche della
      dichiarazione annuale dell'imposta di soggiorno.
    status: verified
    source: mef-decreto
  - text: Delibera di Giunta n. 89 del 12/03/2026 (tariffe in vigore dal 1° maggio 2026).
    status: verified
    source: comune-2026
deadline:
  summary:
    text: >-
      Iscrizione su GEIS all'inizio dell'attività; ogni trimestre dichiarazione (anche senza imposta
      da versare) e riversamento entro il 15 aprile, 15 luglio, 15 ottobre e 15 gennaio;
      dichiarazione annuale entro il 30 giugno dell'anno dopo. Non è chiaro se il Modello 21 vada
      ancora presentato entro il 30 gennaio: chiederlo all'Ufficio Imposta di Soggiorno.
    status: disputed
    source: modalita
  rules:
    - text: >-
        Iscrizione su GEIS Portal contemporaneamente all'inizio dell'attività (obbligo in vigore dal
        1° aprile 2019). L'obbligo resta anche per chi usa piattaforme o intermediari convenzionati
        con il Comune.
      status: verified
      source: comune-2026
    - text: >-
        Dichiarazione trimestrale su GEIS e riversamento dell'imposta riscossa entro il 15 del mese
        successivo al trimestre: entro il 15 aprile, 15 luglio, 15 ottobre e 15 gennaio. La
        dichiarazione si inserisce in corrispondenza dell'ultimo mese del trimestre (marzo, giugno,
        settembre, dicembre).
      status: verified
      source: modalita
    - text: >-
        La dichiarazione trimestrale va presentata anche se nel trimestre non è dovuto alcun
        riversamento (art. 8, c. 1, lett. h, come modificato dalla delibera C.C. 12/2020).
      status: verified
      source: dcc-12-2020
    - text: >-
        Dichiarazione annuale sul modello ministeriale, esclusivamente in via telematica, entro il 30
        giugno dell'anno successivo a quello dei pernottamenti (per l'anno 2026: entro il 30 giugno
        2027).
      status: verified
      source: dlgs-23-art4
    - text: >-
        Modello 21 (conto di gestione): il regolamento (art. 8, c. 2) lo chiede entro il 30 gennaio al
        gestore "in qualità di Agente Contabile". Dopo la sentenza delle Sezioni Unite della
        Cassazione n. 1527/2026 il Comune scrive di ritenerlo "non più doveroso" ed elabora solo i
        modelli arrivati entro il 30/01/2026; la stessa pagina però ripete che va presentato entro il
        30/01, e la pagina "Imposta di Soggiorno 2025" lo indica ancora come obbligo. Chiedere
        all'Ufficio Imposta di Soggiorno prima del 30 gennaio 2027.
      status: disputed
      source: modello-21
  lateness:
    text: >-
      Sanzioni di legge, da non calcolare da soli. Per le violazioni commesse fino al 31/12/2026
      l'art. 4, c. 1-ter, D.Lgs. 23/2011 prevede, per l'omessa o infedele dichiarazione, una
      sanzione "dal 100 al 200 per cento dell'importo dovuto" e, per l'omesso, ritardato o parziale
      versamento, la sanzione dell'art. 13 del D.Lgs. 471/1997. Per le violazioni dal 1° gennaio 2027
      (D.Lgs. 147/2026) l'omessa dichiarazione è punita con il 100% del tributo non versato e
      l'infedele con il 40%, in entrambi i casi non meno di 50 euro. Il ravvedimento si calcola con la
      funzione "Ravvedimento" di GEIS o con l'ufficio.
    status: verified
    source: dlgs-23-art4
cost:
  text: >-
    Le pagine del Comune, il manuale e le FAQ di GEIS non indicano diritti per l'iscrizione o per
    le dichiarazioni, che come dichiarazioni tributarie sono esenti dall'imposta di bollo (D.P.R.
    642/1972, tabella B, art. 5, testo in vigore fino al 31/12/2026). L'imposta riscossa dagli
    ospiti si riversa a parte, con pagoPA.
  status: verified
  source: dpr642-tabella-b
duration:
  text: >-
    Ogni dichiarazione trimestrale inviata su GEIS viene protocollata all'invio, con numero
    progressivo e di protocollo, e se ne scarica la ricevuta PDF. Il manuale non dice in quanto
    tempo l'ufficio esamina la domanda "Nuovo gestore struttura" o le richieste di modifica.
  status: verified
  source: geis-manuale
appointment:
  text: >-
    Non serve: iscrizione, dichiarazioni e versamenti si fanno online su GEIS. Per chiarimenti
    l'Ufficio Imposta di Soggiorno, in Via Diocleziano 330, riceve il pubblico dal lunedì al
    venerdì 8:30–12:30 secondo la pagina generale, che non parla di appuntamento.
  status: verified
  source: comune-index
channels:
  - type: portal
    purpose: procedure
    name: GEIS Portal – Portale Multiservizi del Comune di Napoli
    url: https://cizrm.municipia.eng.it/?ente=NAPO
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: geis-info
    notes: >-
      Per iscrizione, dichiarazioni trimestrali, pagamento pagoPA, delegati, variazioni e cessazione
      della struttura. La pagina del Comune indica SPID, CIE o TS-CNS; il manuale cita SPID o CIE,
      le FAQ solo SPID. Ogni dichiarazione inviata riceve numero e protocollo e una ricevuta PDF.
  - type: pec
    purpose: procedure
    address: entrate.impostasoggiorno@pec.comune.napoli.it
    receipt: legal
    source: modalita
    notes: >-
      Solo se è oggettivamente impossibile usare GEIS: dichiarazione trimestrale sul modulo del
      Comune, con motivo, copia del versamento e documento del legale rappresentante, entro le stesse
      scadenze. Anche per il Modello 21 firmato digitalmente.
  - type: email
    purpose: procedure
    address: entrate.impostasoggiorno@comune.napoli.it
    receipt: informal
    source: modalita
    notes: Alternativa alla PEC per la dichiarazione di emergenza quando GEIS non funziona.
  - type: desk
    purpose: info
    name: Ufficio Imposta di Soggiorno (Servizio Gestione Canoni e Altri Tributi)
    address: Via Diocleziano 330, 1° piano, 80124 Napoli
    source: comune-2026
    notes: >-
      Orario incerto: la pagina generale indica lunedì–venerdì 8:30–12:30, la pagina degli accordi
      con gli intermediari 9:00–13:00.
  - type: phone
    purpose: info
    address: 081 7953749 – 081 7956901
    source: comune-index
    notes: Numeri indicati sulla pagina generale dell'imposta "per chiarimenti", subito dopo l'avviso sul CIN.
  - type: portal
    purpose: procedure
    name: Agenzia delle Entrate – area riservata (dichiarazione annuale imposta di soggiorno)
    url: https://portale.agenziaentrate.gov.it/PortaleWeb/home
    receipt: legal
    source: mef-dichiarazione
    notes: >-
      Il link "Dichiarazione" della pagina del Dipartimento delle Finanze porta qui. Si può far
      trasmettere da un intermediario abilitato (commercialista, CAF, associazione di categoria).
payment:
  method: pagopa
  calculator_url: https://cizrm.municipia.eng.it/?ente=NAPO
  schedule:
    - { label: "Dichiarazione e riversamento IV trimestre 2026 (data calcolata: entro il 15 del mese dopo il trimestre)", due: 2027-01-15, source: modalita, status: unverified }
    - { label: "Dichiarazione e riversamento I trimestre 2027 (data calcolata: entro il 15 del mese dopo il trimestre)", due: 2027-04-15, source: modalita, status: unverified }
    - { label: "Dichiarazione e riversamento II trimestre 2027 (data calcolata: entro il 15 del mese dopo il trimestre)", due: 2027-07-15, source: modalita, status: unverified }
    - { label: "Dichiarazione e riversamento III trimestre 2027 (data calcolata: entro il 15 del mese dopo il trimestre)", due: 2027-10-15, source: modalita, status: unverified }
  notes:
    - text: >-
        Tariffe per persona e per notte. Dal 01/01/2026: albergo 5 stelle e 5 stelle lusso € 5,00;
        4 stelle € 5,00; 3 stelle € 4,50; 2 stelle € 3,50; 1 stella € 3,00; strutture ricettive
        extra alberghiere € 4,50; locazioni brevi € 5,00. Dal 01/05/2026 (delibera di Giunta n. 89
        del 12/03/2026): albergo 5 stelle e 5 stelle lusso € 6,00; 4 stelle € 6,00; 3 stelle €
        5,50; 2 stelle € 4,50; 1 stella € 4,00; strutture ricettive extra alberghiere € 5,50;
        locazioni brevi € 6,00. Il Comune non indica regole di arrotondamento.
      status: verified
      source: comune-2026
    - text: >-
        L'aumento 2026 è basato sulla Legge di Bilancio 2026 (L. 199/2025), che consente ai
        capoluoghi di mantenere le misure incrementali adottate per il Giubileo 2025.
      status: verified
      source: notizia-tariffe-2026
    - text: >-
        Il riversamento si fa dentro GEIS: si sceglie l'importo, si genera l'avviso pagoPA e si paga
        online o presso un punto abilitato. Non serve comunicare gli estremi al Comune; la
        registrazione del pagamento richiede 24–72 ore.
      status: verified
      source: geis-faq
    - text: >-
        Il regolamento ammette, solo se pagoPA non è possibile, il bonifico sul conto corrente del
        Comune dedicato all'imposta, con causale: denominazione e codice fiscale della struttura,
        "versamento imposta di soggiorno", periodo e anno. Le pagine del Comune non pubblicano
        l'IBAN: chiederlo all'ufficio.
      status: verified
      source: regolamento
    - text: >-
        L'imposta riversata in eccesso si può compensare con i versamenti successivi, indicandolo nella
        dichiarazione, o chiedere a rimborso entro cinque anni; non si rimborsano importi fino a €
        12,00 (art. 12).
      status: verified
      source: regolamento
    - text: >-
        Le prime tre scadenze del 2026 sono passate; per il III trimestre 2025 il Comune aveva
        prorogato dichiarazione e versamento dal 15/10/2025 al 15/11/2025 (disposizione
        dirigenziale n. 294 del 14/10/2025). Nessuna proroga trovata per il 2026.
      status: verified
      source: proroga-2025
documents:
  - name: Quietanza rilasciata all'ospite per l'imposta pagata
    required: true
    notes: Art. 8, c. 1, lett. b del regolamento.
  - name: Documentazione delle esenzioni (certificati, autocertificazioni, moduli A–J del Comune)
    required: true
    notes: Da conservare per 5 anni presso la struttura (art. 7, c. 5).
  - name: Documentazione su imposta applicata, dichiarazioni e riversamenti
    required: true
    notes: Da conservare per 5 anni ed esibire su richiesta del Comune (art. 8, c. 3; art. 10, c. 3).
  - name: Codici CUSR e CIN della struttura
    required: false
    notes: GEIS li chiede nella scheda della struttura e segnala se mancano; non sono obbligatori per l'iscrizione.
  - name: Copia del documento d'identità del legale rappresentante
    required: false
    notes: Solo per la dichiarazione di emergenza via e-mail/PEC e per il Modello 21.
dichiarante:
  ruolo: [titolare, legale_rappresentante]
forms:
  - id: dichiarazione-trimestrale-comune
    name: Imposta di soggiorno – Dichiarazione trimestrale (modulo del Comune, agg. 27/02/2025)
    url: https://static-www.comune.napoli.it/wp-content/uploads/2025/06/ModelloDichiarazione_27022025.pdf
    source: modello-dichiarazione
    sha256: 33dc447893492af5af40573eb1fd64182692afbcc36334c09fe404e66eb57b0d
    signature_required: true
    fields:
      - label: Il/La sottoscritto/a
        map: { concat: [identity.last_name, identity.first_name] }
      - label: Nato/a a
        map: { fallback: [identity.birth_comune, identity.birth_country] }
      - label: Prov. (di nascita)
        map: { direct: identity.birth_province }
      - label: Il (data di nascita)
        map: { direct: identity.date_of_birth }
      - label: Residente a
        map: { direct: residenza.comune }
      - label: Prov. (di residenza)
        map: { direct: residenza.provincia }
      - label: Via/Piazza (residenza)
        map: { direct: residenza.indirizzo }
      - label: N. (residenza)
        map: { direct: residenza.civico }
      - label: CAP (residenza)
        map: { direct: residenza.cap }
      - label: Tel
        map: { direct: identity.phone }
      - label: Fax
        map: { blank_with_reason: Facoltativo; da compilare solo se si ha un fax. }
      - label: E-mail
        map: { direct: identity.email }
      - label: Codice fiscale (del dichiarante)
        map: { direct: identity.codice_fiscale }
      - label: In qualità di legale rappresentante di
        map:
          ask: >-
            Gestisce la struttura per un'impresa o una società (di cui è titolare o legale
            rappresentante)? Se sì, il suo nome; se no, il suo nome e cognome, e i dati della sede
            legale e la partita IVA restano vuoti
        notes: >-
          Va chiesto anche quando l'archivio ha i dati di un'impresa: un B&B non imprenditoriale o
          una locazione breve di chi ha un'altra attività non sono di quell'attività. Se sì, il nome
          è business.denominazione.
      - label: Codice fiscale (del gestore)
        map:
          ask: >-
            Codice fiscale del gestore: quello della società se gestisce una società; altrimenti il
            suo (anche per una ditta individuale, il cui codice fiscale è quello del titolare)
        notes: >-
          Per una società è business.codice_fiscale o, se non c'è (quando coincide con la partita
          IVA), business.partita_iva; altrimenti identity.codice_fiscale.
      - label: Partita IVA
        map: { direct: business.partita_iva }
        notes: >-
          Solo se gestita da un'impresa (riga «In qualità di»); vuoto per il B&B non imprenditoriale
          e la locazione breve, anche se il gestore ha una partita IVA per altro.
      - label: Sede legale a
        map: { direct: business.sede_legale_comune }
        notes: Solo se gestita da un'impresa; altrimenti vuoto.
      - label: Prov. (sede legale)
        map: { direct: business.sede_legale_provincia }
        notes: Solo se gestita da un'impresa; altrimenti vuoto.
      - label: Via/Piazza (sede legale)
        map: { concat: [business.sede_legale_indirizzo, business.sede_legale_civico] }
        notes: Solo se gestita da un'impresa; altrimenti vuoto.
      - label: CAP (sede legale)
        map: { direct: business.sede_legale_cap }
        notes: Solo se gestita da un'impresa; altrimenti vuoto.
      - label: Struttura ricettiva ubicata in Via/Piazza
        map: { ask: "Indirizzo della struttura (via o piazza)" }
        notes: >-
          Per una struttura nei locali dell'impresa sono locale.*; per un B&B o una locazione breve
          nella casa del gestore, la sua residenza o il suo domicilio. Tutto l'indirizzo dalla
          stessa fonte, mai i locali di un'altra attività.
      - label: N. (struttura)
        map: { ask: Numero civico della struttura }
        notes: Dalla stessa fonte dell'indirizzo della struttura (riga «Via/Piazza»).
      - label: CAP (struttura)
        map: { ask: CAP della struttura }
        notes: Dalla stessa fonte dell'indirizzo della struttura (riga «Via/Piazza»).
      - label: Classificazione alberghiera
        map: { ask: "Tipo di struttura (albergo, residenza turistico-alberghiera, B&B, affittacamere, casa vacanze, locazione breve…)" }
      - label: Stelle
        map: { ask: Numero di stelle dell'albergo (vuoto se non è un albergo) }
      - label: Con riferimento al trimestre solare
        map: { ask: "Trimestre dichiarato (I, II, III o IV)" }
      - label: Anno
        map: { ask: Anno del trimestre dichiarato }
      - label: A) Totale trimestre – n° ospiti soggetti ad imposta
        map: { ask: Numero di ospiti soggetti all'imposta nel trimestre (dal registro presenze) }
      - label: A) Totale trimestre – n° pernottamenti complessivi
        map: { ask: "Numero totale dei pernottamenti del trimestre, compresi quelli oltre i 14 giorni" }
      - label: A) Totale trimestre – n° pernottamenti soggetti ad imposta
        map: { ask: Pernottamenti soggetti all'imposta (al massimo 14 consecutivi per ospite) }
      - label: B) Euro a notte
        map: { ask: Tariffa per notte della categoria nel periodo (tabella tariffe del Comune) }
        notes: Nel 2026 la tariffa cambia dal 1° maggio; per il II trimestre 2026 un solo importo non basta, chiedere all'ufficio come compilare.
      - label: C) Totale imposta da riversare al Comune = [A x B] euro
        map: { ask: Totale dell'imposta da riversare (pernottamenti soggetti × tariffa) }
      - label: Soggetti e pernottamenti non imponibili – oltre il limite di 14 giorni (n° ospiti, n° pernottamenti)
        map: { ask: Ospiti e pernottamenti oltre il quattordicesimo consecutivo }
      - label: Esenti a) Minori entro il quattordicesimo anno di età (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Ospiti minori di 14 anni e relativi pernottamenti }
      - label: Esenti b) Residenti del Comune di Napoli (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Ospiti residenti a Napoli e relativi pernottamenti }
      - label: Esenti c) Pazienti in day-hospital (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Ospiti esenti come pazienti in day-hospital e relativi pernottamenti }
      - label: Esenti d) Accompagnatori di degenti (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Ospiti esenti come accompagnatori di degenti e relativi pernottamenti }
      - label: Esenti e) Genitori accompagnatori di malati minori di diciotto anni (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Genitori accompagnatori di malati minorenni e relativi pernottamenti }
      - label: Esenti f) Rifugiati politici (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Ospiti esenti come rifugiati e relativi pernottamenti }
      - label: Esenti g) Appartenenti alle Forze dell'Ordine (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Ospiti esenti delle Forze dell'Ordine e relativi pernottamenti }
      - label: Esenti h) Volontari Protezione Civile, Croce Rossa e ONLUS in caso di calamità (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Volontari esenti e relativi pernottamenti }
      - label: Esenti i) Persone con disabilità non inferiore all'80% (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Ospiti con disabilità certificata (e accompagnatore) e relativi pernottamenti }
      - label: Esenti j) Autisti di pullman e accompagnatori turistici (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Autisti e accompagnatori turistici esenti e relativi pernottamenti }
      - label: Esenti k) Personale dipendente della struttura ricettiva (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Dipendenti della struttura alloggiati e relativi pernottamenti }
      - label: Esenti l) Persone ospitate gratuitamente su richiesta del Comune o di altro ente pubblico (ospiti, pernottamenti, pernottamenti fino a 14 giorni)
        map: { ask: Ospiti a titolo gratuito su richiesta di un ente pubblico e relativi pernottamenti }
