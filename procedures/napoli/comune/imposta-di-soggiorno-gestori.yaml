verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: lette le pagine del Comune di Napoli sull'imposta di soggiorno (generale, 2026, 2025,
    modalità di dichiarazione e versamento, iscrizione e uso di GEIS, Modello 21, accordi con gli
    intermediari, modulistica), la notizia sulle tariffe 2026, l'avviso SUAP del 20/05/2026, il
    testo coordinato del regolamento, la delibera C.C. 12/2020 (scansione), la disposizione
    dirigenziale 294/2025, il manuale e le FAQ di GEIS, il modulo di dichiarazione trimestrale;
    l'art. 4 del D.Lgs. 23/2011 e l'art. 13 del D.Lgs. 471/1997 su Normattiva (versioni vigenti); la
    pagina, il decreto, il modello, le istruzioni, le FAQ e la Risoluzione 1/DF 2023 del Dipartimento
    delle Finanze. Il testo della delibera di Giunta 89/2026 non è stato trovato: le tariffe vengono
    dalle pagine del Comune.
