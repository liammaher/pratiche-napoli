steps:
  - do: >-
      Se la struttura o la locazione breve non è ancora avviata, completare prima gli adempimenti di
      apertura (SCIA o comunicazione al SUAP, codice CIN): sono procedure separate.
    who: owner
  - do: >-
      Iscriversi su GEIS all'inizio dell'attività: accedere a https://cizrm.municipia.eng.it/?ente=NAPO
      con SPID/CIE, "Domande Online" → "Procedimenti Tributi Comune di Napoli" → "Nuovo gestore
      struttura", e seguire la procedura (dati del gestore, della struttura, ubicazione e dati
      catastali, camere e posti letto). Chi era già iscritto al vecchio portale è stato migrato e non
      deve iscriversi di nuovo.
    who: owner
    human_only: true
  - do: Accedere personalmente con la propria identità digitale e accettare l'informativa privacy di GEIS
    who: owner
    human_only: true
  - do: Inserire CUSR e CIN nella scheda "Strutture"; abbinare eventuali delegati (per esempio un collaboratore o il commercialista)
    who: owner
  - do: >-
      Esporre agli ospiti le informazioni sull'imposta (tariffe, esenzioni) in appositi spazi; a fine
      soggiorno chiedere il pagamento e rilasciare quietanza; raccogliere la documentazione delle
      esenzioni (moduli A–J del Comune).
    who: owner
    human_only: true
  - do: >-
      Tenere un registro per mese di ospiti, pernottamenti, esenti, oltre 14 notti e prenotazioni
      tramite piattaforme convenzionate (riga "AIRBNB" in GEIS).
    who: anyone
  - do: >-
      Entro il 15 del mese dopo ogni trimestre: in GEIS "Comunicazione periodica" → struttura e
      trimestre → numero di soggetti e pernottamenti per tipo di tariffa ed esenzione → salvare e
      inviare; scaricare la ricevuta.
    who: anyone
    human_only: true
  - do: Generare dalla dichiarazione l'avviso pagoPA e pagarlo entro la stessa scadenza
    who: owner
    human_only: true
  - do: >-
      Solo se GEIS è inutilizzabile: compilare il modulo di dichiarazione trimestrale del Comune,
      firmarlo e inviarlo per PEC o e-mail con motivo, copia del versamento e documento d'identità,
      entro la scadenza.
    who: owner
    human_only: true
  - do: >-
      Entro il 30 giugno dell'anno successivo: presentare la dichiarazione annuale sul modello
      ministeriale nell'area riservata dell'Agenzia delle Entrate, direttamente o tramite un
      intermediario abilitato.
    who: owner
    human_only: true
  - do: >-
      Prima del 30 gennaio: chiedere all'Ufficio Imposta di Soggiorno se il Modello 21 è ancora
      richiesto (vedi scadenze).
    who: owner
  - do: >-
      In caso di variazioni (categoria, camere, posti letto) o di fine attività, presentare in GEIS la
      domanda "Modifica Struttura Imposta di Soggiorno", indicando la data di fine attività quando si
      chiude.
    who: owner
    human_only: true
after:
  - Conservare per 5 anni ricevute GEIS, ricevute pagoPA, quietanze agli ospiti e documenti delle esenzioni.
  - >-
    Controllare in GEIS "Elenco Dichiarazioni" gli avvisi di anomalia (versamento mancante, avvisi
    pagoPA non pagati, CUSR o CIN mancanti).
  - >-
    Per correggere una dichiarazione già inviata: prima della scadenza "Comun. Sost./Ripresenta";
    dopo la scadenza domanda online "Riporta in Bozza Dichiarazione", che l'ufficio deve approvare.
  - >-
    Per correggere la dichiarazione annuale si presenta una "Dichiarazione sostitutiva", anche dopo
    il 30 giugno.
pitfalls:
  - text: >-
      La Risoluzione 1/DF del 2023 del Dipartimento delle Finanze afferma che il modello ministeriale
      è "l'unica modalità" per l'adempimento dichiarativo e che i comuni non possono predisporre
      propri modelli di dichiarazione.
    status: verified
    source: mef-risoluzione-2023
  - text: >-
      Il Comune di Napoli continua invece a chiedere la dichiarazione trimestrale su GEIS (regolamento
      art. 8; pagina modalità aggiornata all'11/12/2025; avviso del 20/05/2026). Le due cose
      convivono: fare entrambe finché il Comune non cambia il regolamento.
    status: disputed
    source: modalita
  - text: >-
      Piattaforme e società di intermediazione convenzionate con il Comune, che riscuotono e
      riversano l'imposta al posto del gestore: Airbnb, Boundless Housing, Di Morra, Domus Extra,
      Mister B&B, MyBnB (elenco della pagina aggiornata al 15/10/2025). Per queste prenotazioni il
      gestore non incassa né versa, ma resta obbligato all'iscrizione su GEIS e le indica nella
      dichiarazione trimestrale nella riga della piattaforma.
    status: verified
    source: accordi
  - text: >-
      Le piattaforme non convenzionate (per esempio Booking.com, che non è nell'elenco) non riscuotono
      per conto del Comune: l'imposta la chiede, dichiara e versa il gestore.
    status: unverified
  - text: >-
      Nella dichiarazione annuale ministeriale, i pernottamenti per cui ha riscosso e versato
      l'intermediario non vanno dichiarati dal gestore, nemmeno come esenti: li dichiara
      l'intermediario. Il gestore dichiara solo i soggiorni gestiti direttamente.
    status: verified
    source: mef-faq
  - text: >-
      Esenti (art. 7): minori entro il quattordicesimo anno; pazienti in day-hospital; un
      accompagnatore per degente (entrambi i genitori se il paziente è minore); rifugiati politici;
      Forze dell'Ordine alloggiate per emergenze o soccorso disposti da autorità pubbliche;
      volontari di Protezione Civile e Croce Rossa in occasione di calamità; persone con disabilità
      non inferiore all'80% più un accompagnatore; autisti di pullman e un accompagnatore turistico
      ogni 25 partecipanti di gruppi organizzati; personale dipendente che lavora nella struttura;
      ospiti gratuiti su richiesta del Comune o di altro ente pubblico. Ogni esenzione richiede il
      documento indicato dall'art. 7.
    status: verified
    source: regolamento
  - text: >-
      Il modulo di dichiarazione del Comune rinvia alle lettere dell'art. 7 con una numerazione
      diversa da quella del testo coordinato 2019 (per esempio i rifugiati sono "lettera e" nel
      modulo e "lettera d" nel regolamento) e aggiunge una riga per gli esenti genitori di minori
      che il regolamento comprende nella lettera c.
    status: verified
    source: modello-dichiarazione
  - text: >-
      Il regolamento (art. 8) parla ancora del "portale Tourist Tax"; oggi il Comune usa GEIS
      Portal.
    status: verified
    source: regolamento
  - text: >-
      Sanzioni comunali ancora in vigore (art. 9 del regolamento, non abrogate dalla delibera
      12/2020): mancata iscrizione al portale da € 200,00 a € 500,00; mancata informazione agli
      ospiti da € 100,00 a € 500,00.
    status: verified
    source: regolamento
  - text: >-
      La pagina generale del Comune e l'art. 6 del regolamento indicano per l'omesso, tardivo o
      parziale versamento una sanzione del 30%; l'art. 13 del D.Lgs. 471/1997 a cui rinvia la legge
      prevede il 25% per le violazioni commesse dal 1° settembre 2024. Far calcolare l'importo
      all'ufficio.
    status: disputed
    source: comune-index
  - text: >-
      I moduli C (dichiarazione dell'ospite che non paga) e D (dichiarazione del gestore) sono ancora
      sulla pagina modulistica, ma sono indirizzati a Corso Arnaldo Lucci 66-82 e citano il
      regolamento modificato nel 2013.
    status: verified
    source: modulo-d
  - text: >-
      Dal 2020 la legge rende il gestore responsabile del pagamento, con rivalsa sull'ospite: non è
      detto che il modulo D lo esoneri quando l'ospite non paga. Chiedere all'ufficio.
    status: unverified
  - text: >-
      Per l'omesso, ritardato o parziale versamento l'art. 13 del D.Lgs. 471/1997 prevede oggi il
      25% di ogni importo non versato, ridotto alla metà per ritardi fino a 90 giorni e a un
      quindicesimo per giorno di ritardo fino a 15 giorni; l'articolo è abrogato dal 1° gennaio 2027
      e sostituito dal testo unico delle sanzioni tributarie.
    status: verified
    source: dlgs-471-art13
  - text: >-
      Chi era già iscritto al vecchio portale è stato migrato automaticamente su GEIS e non deve
      iscriversi di nuovo; solo i nuovi gestori presentano la domanda "Nuovo gestore struttura".
    status: verified
    source: geis-iscrizione
  - text: >-
      In GEIS il gestore può modificare da solo solo convenzione, CUSR e CIN; ogni altra variazione
      (categoria, nome, camere, posti letto, data di fine attività) passa da una domanda online che
      l'ufficio approva.
    status: verified
    source: geis-manuale
  - text: >-
      La pagina "Imposta di Soggiorno 2025" (aggiornata il 14/07/2026) descrive ancora il gestore
      come agente contabile tenuto al Modello 21 entro il 30 gennaio, in contrasto con la pagina sul
      Modello 21.
    status: verified
    source: comune-2025
  - text: >-
      L'avviso del 20/05/2026 rinvia per le sanzioni alla "D.C.C. n. 12 del 4/08/2020", che in realtà
      ha abrogato le sanzioni comunali per dichiarazione e riversamento rinviando a quelle di legge.
    status: verified
    source: avviso-2026
  - text: >-
      Le FAQ di GEIS dicono che i versamenti sono "solitamente mensili o trimestrali"; dal 1° luglio
      2020 sono trimestrali per tutte le strutture. Sulla pagina modulistica restano anche i vecchi
      modelli mensili e bimestrali, da non usare.
    status: verified
    source: dcc-12-2020
  - text: >-
      In GEIS il numero dei pernottamenti non può essere inferiore al numero degli ospiti, e le
      dichiarazioni vanno caricate per singola struttura: chi gestisce più strutture fa una
      dichiarazione per ciascuna.
    status: verified
    source: geis-faq
  - text: >-
      Se il civico della struttura non compare nell'elenco di GEIS, le FAQ dicono di inserire il
      civico 0.
    status: verified
    source: geis-faq
