payment:
  method: pagopa
  rateazione: >-
    Il canone si paga in unica soluzione; sopra 350 euro è ammesso il pagamento in rate (al massimo
    3 per i titoli permanenti, l'ultima entro l'anno) (art. 48, cc. 3–4).
  schedule:
    - { label: Canone esposizione pubblicitaria 2026 – rata unica o I rata, due: 2026-08-31, source: differimento-2026, status: verified }
    - { label: Canone esposizione pubblicitaria 2026 – II rata, due: 2026-10-30, source: differimento-2026, status: verified }
    - { label: Canone esposizione pubblicitaria 2026 – III rata, due: 2026-12-30, source: differimento-2026, status: verified }
  notes:
    - text: >-
        Sono esenti dal canone le insegne di esercizio di attività commerciali e di produzione di
        beni o servizi che contraddistinguono la sede dell'attività, di superficie complessiva fino
        a 5 metri quadrati (art. 46, c. 1.4).
      status: verified
      source: regolamento-cup
    - text: >-
        Il regolamento non dice se, oltre i 5 metri quadrati complessivi, il canone si applichi a
        tutta la superficie o solo all'eccedenza: chiederlo all'Ufficio CUP Pubblicità.
      status: unverified
    - text: >-
        Sono esenti anche gli altri mezzi pubblicitari (non le insegne) esposti nelle vetrine e sulle
        porte d'ingresso, attinenti all'attività, fino a mezzo metro quadrato per vetrina o ingresso
        (art. 46, c. 1.9), e i messaggi sotto i 300 cm² (art. 45, c. 2).
      status: verified
      source: regolamento-cup
    - text: >-
        Tariffa annua a metro quadrato per le esposizioni permanenti: T = Tmax × a × b × c × d, con
        Tmax = 145 euro/mq; a = zona del Piano Generale degli Impianti (rossa 1, verde 0,90, azzurra
        0,85, gialla 0,80; elenco delle strade pubblicato dal Comune); b = 1 se la strada è
        nell'Allegato G al regolamento, 0,9 se non lo è; c = 0,75 fino a 5,50 mq, 0,90 da 5,51 a 8,50
        mq, 1 da 8,51 mq; d = 0,70 per le insegne di esercizio.
      status: verified
      source: cup-esposizioni
    - text: >-
        Per le insegne la superficie di ogni insegna si arrotonda per eccesso al metro quadrato, e le
        frazioni oltre il primo al mezzo metro quadrato superiore (art. 45, c. 4). Nel primo anno il
        canone si calcola in dodicesimi, in base all'effettivo utilizzo (art. 45, c. 12).
      status: verified
      source: regolamento-cup
    - text: >-
        Il canone è in autoliquidazione: dal 2026 l'ufficio trasmette un avviso PagoPA, ma il mancato
        arrivo dell'avviso non esonera dal pagamento nei termini. L'avviso si può chiedere
        all'ufficio.
      status: verified
      source: cup-pagina
    - text: >-
        Le scadenze annuali (30 aprile o date fissate dalla Giunta) sono scritte per "concessioni e
        autorizzazioni permanenti"; che valgano allo stesso modo per le insegne presentate con SCIA è
        un'interpretazione: confermarlo con l'Ufficio CUP Pubblicità.
      status: unverified
    - text: >-
        Diritti d'istruttoria SUAP per la SCIA insegna di esercizio (voce S204, in vigore dall'11
        giugno 2026): 100 euro per la nuova installazione, 80 euro per le variazioni del ciclo di vita
        aziendale (tra cui modifiche insegne, subingresso, voltura), 65 euro per le variazioni delle
        persone fisiche. Si pagano con PagoPA.
      status: verified
      source: tabella-diritti-2026
documents:
  - name: SCIA per installazione (o modifica, o subentro) di insegna di esercizio, compilata su impresainungiorno
    required: true
    notes: Firmata digitalmente dal titolare o legale rappresentante.
  - name: Ricevuta del pagamento PagoPA dei diritti d'istruttoria SUAP
    required: true
  - name: Attestazione del pagamento del canone unico
    required: false
    notes: Obbligatoria se l'insegna è soggetta a canone, cioè oltre l'esenzione dei 5 mq (art. 26, c. 4).
  - name: Autorizzazione della Soprintendenza ai sensi dell'art. 49 del D.Lgs. 42/2004
    required: false
    notes: >-
      Obbligatoria se l'insegna va su un edificio o in un'area tutelati come beni culturali: senza,
      la SCIA non è applicabile.
  - name: Bozzetto dell'insegna con misure, materiali e illuminazione, e fotografie della facciata
    required: false
    notes: >-
      Non verificato: l'elenco esatto degli allegati tecnici è nel modulo online su impresainungiorno,
      che non è stato possibile scaricare.
steps:
  - do: >-
      Verificare se l'edificio o l'area sono tutelati come beni culturali o paesaggistici; se è un
      bene culturale, ottenere prima l'autorizzazione della Soprintendenza (art. 49 D.Lgs. 42/2004)
    who: professional
  - do: >-
      Progettare l'insegna rispettando il Piano Generale degli Impianti, l'art. 71 del Regolamento
      Edilizio e i divieti dell'art. 33 del regolamento del canone; misurare la superficie di ogni
      insegna
    who: professional
  - do: >-
      Se le insegne superano in tutto 5 mq, calcolare il canone (formula della pagina Esposizioni
      pubblicitarie) o farselo indicare dall'Ufficio CUP Pubblicità e chiedere l'avviso PagoPA
    who: anyone
  - do: Pagare il canone con PagoPA, se dovuto, prima di presentare la SCIA
    who: owner
    human_only: true
  - { do: Pagare con PagoPA i diritti d'istruttoria SUAP (voce S204), who: owner, human_only: true }
  - { do: Compilare la SCIA insegna di esercizio su impresainungiorno e allegare i documenti, who: anyone }
  - do: >-
      Accedere con SPID, CIE o CNS al front office di impresainungiorno (SUAP di Napoli), firmare
      digitalmente la SCIA e gli allegati (bozzetto e foto della facciata, ricevute dei
      pagamenti, eventuale autorizzazione della Soprintendenza), caricarli e inviare la pratica;
      salvare la ricevuta di avvio pratica
    who: owner
    human_only: true
    channel: [portal]
  - do: >-
      Installare l'insegna solo dopo la ricevuta di avvio pratica (in area paesaggistica, solo dopo
      l'autorizzazione paesaggistica)
    who: owner
    human_only: true
  - do: Conservare la ricevuta della SCIA e il suo esito, da esibire alla Polizia Municipale su richiesta (art. 31, c. 3)
    who: owner
after:
  - Conservare ricevuta della SCIA, esito, ricevute PagoPA e bozzetto presentato.
  - >-
    Se l'insegna è soggetta a canone, pagare ogni anno l'avviso PagoPA alle scadenze; se l'avviso
    non arriva, chiederlo all'Ufficio CUP Pubblicità.
  - >-
    Per cambiare dimensioni o messaggio dell'insegna, o per subentrare a un'altra attività,
    presentare una nuova SCIA prima della modifica.
  - >-
    Se l'insegna viene tolta o l'attività cessa, comunicare la cessazione al SUAP (la pagina
    Esposizioni pubblicitarie chiede di presentare al SUAP cessazioni, subentri, rinunce e ogni
    variazione).
pitfalls:
  - text: >-
      Le insegne sono vietate nelle porzioni di facciata tra le vetrine (salvo targhe fino a 0,5 mq
      con sporgenza massima 5 cm), su fregi, cornici, balaustre e altri elementi architettonici, su
      balconi e ringhiere e su finestre di edifici residenziali (art. 33, c. 1).
    status: verified
    source: regolamento-cup
  - text: >-
      Nei luoghi con vincoli paesaggistici o monumentali nessun mezzo pubblicitario può essere
      collocato senza autorizzazione o nulla osta dell'autorità competente (art. 33, c. 5.1).
    status: verified
    source: regolamento-cup
  - text: >-
      Le fonti comunali consultate non contengono regole specifiche per le insegne nel centro storico
      patrimonio UNESCO: valgono i vincoli del D.Lgs. 42/2004 sul singolo edificio o area, da
      verificare caso per caso.
    status: unverified
  - text: >-
      Il Piano Generale degli Impianti (DCC 419/1999) e l'art. 71 del Regolamento Edilizio non sono
      stati trovati online sul sito del Comune: misure e posizioni ammesse vanno controllate con il
      SUAP o con un tecnico.
    status: unverified
  - text: >-
      Anche le vetrofanie su vetrine, porte e finestre richiedono la SCIA (art. 31, c. 1.4 bis).
    status: verified
    source: regolamento-cup
  - text: >-
      La pagina Pubblicità e affissioni cita ancora il regolamento del canone "approvato con
      Deliberazione di Consiglio Comunale n. 8 del 28/07/2021".
    status: verified
    source: pubblicita-affissioni
  - text: >-
      La pagina dei regolamenti tributari pubblica invece il regolamento vigente adottato con
      delibera di C.C. n. 16 del 30 maggio 2022.
    status: verified
    source: regolamenti-tributari
  - text: >-
      La pagina Esposizioni pubblicitarie riporta solo le scadenze ordinarie (30 aprile, 30 luglio,
      30 ottobre); per il 2026 valgono quelle spostate dalla deliberazione 195/2026.
    status: verified
    source: cup-esposizioni
  - text: >-
      Dal 1° gennaio 2026 Napoli Servizi S.p.A. non si occupa più della riscossione e
      dell'accertamento del canone per esposizioni pubblicitarie: rivolgersi all'Ufficio CUP
      Pubblicità.
    status: verified
    source: cup-esposizioni
  - text: >-
      La pagina del servizio SUAP rimanda ancora alla tabella dei diritti del 2025; quella in vigore
      dall'11 giugno 2026 è sulla pagina Diritti d'istruttoria SUAP (per la SCIA insegne gli importi
      sono rimasti 100 e 80 euro).
    status: verified
    source: suap-diritti
