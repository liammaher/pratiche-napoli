schema_version: 0
id: napoli/comune/insegna-esercizio
title: Insegna di esercizio – SCIA e canone unico per esposizione pubblicitaria (Comune di Napoli)
headline: "Mettere l'insegna al negozio a Napoli: SCIA e quando si paga il canone"
aka: [permesso insegna, autorizzazione insegna, tassa insegna, imposta sulla pubblicità, vetrofanie]
updated: 2026-10-27
summary: >-
  Un negozio, un locale o un'altra attività che a Napoli installa o modifica la propria insegna
  deve prima presentare una SCIA al SUAP del Comune tramite impresainungiorno. Le insegne della
  sede che in tutto non superano 5 metri quadrati sono esenti dal canone unico patrimoniale; oltre
  quella misura il canone si paga con avviso PagoPA.
ente:
  name: Comune di Napoli
  office: >-
    Servizio Sportello Unico Attività Produttive (SUAP) per la SCIA; Area Entrate – Servizio
    Gestione Canoni e Altri Tributi (Ufficio CUP Pubblicità) per il canone
  ipa: c_f839
applies_to:
  events: [signage, open, change]
  audience: [business]
  conditions:
    - text: >-
        Insegna di esercizio: scritta in caratteri alfanumerici, eventualmente completata da simboli
        e marchi, installata nella sede dell'attività a cui si riferisce o nelle sue pertinenze
        accessorie (Allegato C al regolamento del canone).
      status: verified
      source: allegati-cup
    - text: >-
        Sono soggette a SCIA l'installazione di insegne di esercizio, targhe e simili, il subentro
        nella titolarità della SCIA per insegna, la modifica dell'insegna (per dimensioni o per
        messaggio) e l'apposizione di vetrofanie su vetrine, porte e finestre di attività
        commerciali (art. 31, c. 1).
      status: verified
      source: regolamento-cup
    - text: >-
        Le insegne di esercizio su suolo privato non richiedono l'autorizzazione preventiva prevista
        per gli altri mezzi pubblicitari permanenti in conto proprio (art. 25, c. 2.2): per loro
        basta la SCIA.
      status: verified
      source: regolamento-cup
    - text: >-
        La SCIA va presentata anche se l'insegna è esente dal canone (pagina Esposizioni
        pubblicitarie: "anche se esente dal pagamento del canone").
      status: verified
      source: cup-esposizioni
legal_basis:
  - text: >-
      Legge 27 dicembre 2019, n. 160, art. 1, commi 816–836 (canone unico patrimoniale), richiamata
      dall'art. 1 del regolamento comunale.
    status: verified
    source: regolamento-cup
  - text: >-
      Regolamento per la disciplina del canone patrimoniale di concessione, autorizzazione o
      esposizione pubblicitaria, adottato con delibera di C.C. n. 16 del 30 maggio 2022: artt. 25–34
      (titoli e divieti), 44–47 (tariffe, esenzioni, riduzioni), 48 (versamento).
    status: verified
    source: regolamento-cup
  - text: >-
      Le regole tecniche per l'installazione delle insegne sono nel Piano Generale degli Impianti
      Pubblicitari (delibera consiliare n. 419 del 29/10/1999) e nell'art. 71 del Regolamento
      Edilizio del Comune di Napoli.
    status: verified
    source: pubblicita-affissioni
  - text: >-
      D.Lgs. 42/2004 (Codice dei beni culturali e del paesaggio): art. 49 per edifici e aree tutelati
      come beni culturali; parte III per le aree sottoposte a tutela paesaggistica.
    status: verified
    source: pubblicita-affissioni
  - text: >-
      Tariffe del canone per esposizione pubblicitaria approvate con delibera di G.C. n. 186 dell'8
      giugno 2023, ancora vigenti.
    status: verified
    source: cup-esposizioni
  - text: D.P.R. 160/2010 (regolamento SUAP).
    status: verified
    source: suap-procedura
deadline:
  summary:
    text: >-
      Prima di installare o modificare l'insegna: si installa appena arriva la ricevuta della SCIA
      (con il pagamento del canone allegato, se dovuto), ma in area con tutela paesaggistica solo
      dopo l'autorizzazione paesaggistica. Negli anni dopo il primo il canone si paga entro il 30
      aprile o in tre rate fino al 30 ottobre; per il 2026 le scadenze sono 31 agosto, 30 ottobre e
      30 dicembre.
    status: verified
    source: regolamento-cup
  rules:
    - text: >-
        La SCIA va presentata prima di installare o modificare l'insegna: l'installazione senza la
        SCIA prescritta, o diversa da quanto dichiarato per superficie, tipologia, illuminazione o
        ubicazione, è pubblicità abusiva (art. 34, c. 1).
      status: verified
      source: regolamento-cup
    - text: >-
        Con la SCIA si può iniziare appena arriva la ricevuta di avvio pratica telematica SUAP;
        l'istruttoria SUAP per le SCIA è indicata in 60 giorni.
      status: verified
      source: suap-servizio
    - text: >-
        Se l'insegna è soggetta a canone, l'attestazione del pagamento del canone è un allegato
        obbligatorio della SCIA (art. 26, c. 4).
      status: verified
      source: regolamento-cup
    - text: >-
        Nelle aree o vicino a immobili sottoposti a tutela paesaggistica (parte III del D.Lgs.
        42/2004) la SCIA resta inefficace fino all'autorizzazione paesaggistica, il cui procedimento
        è curato dall'ufficio.
      status: verified
      source: pubblicita-affissioni
    - text: >-
        Per le esposizioni permanenti, negli anni successivi al primo il canone si versa in
        autoliquidazione entro il 30 aprile; sopra 350 euro si può pagare in tre rate (30 aprile, 30
        luglio, 30 ottobre). La Giunta può fissare date diverse ogni anno (art. 48, c. 6).
      status: verified
      source: regolamento-cup
    - text: >-
        Per il 2026 la deliberazione n. 195/2026 del 30/04/2026 ha spostato le scadenze del canone
        per esposizioni pubblicitarie al 31 agosto (rata unica e I rata), 30 ottobre (II rata) e 30
        dicembre (III rata).
      status: verified
      source: differimento-2026
  lateness:
    text: >-
      Se il canone non è pagato correttamente, il Comune notifica un avviso di accertamento
      esecutivo da pagare entro 60 giorni, con la sanzione dell'art. 13, c. 1, del D.Lgs. 471/1997 e
      gli interessi al tasso legale aumentato di 1,5 punti; prima dell'avviso si può usare il
      ravvedimento operoso (art. 13 D.Lgs. 472/1997). Per un'insegna installata senza titolo è
      dovuta un'indennità pari al canone maggiorato fino al 50%, più una sanzione pari al doppio
      dell'indennità e gli interessi, e va rimossa entro 15 giorni dalla contestazione. Farsi
      calcolare gli importi dall'Ufficio CUP Pubblicità.
    status: verified
    source: cup-esposizioni
cost:
  text: >-
    Diritti d'istruttoria SUAP (tabella 2026), con pagoPA: 100 euro per una nuova insegna, 80 euro
    per modificarla o subentrare. Il canone unico, quando è dovuto, è a parte, come il compenso del
    tecnico e dell'installatore.
  status: verified
  source: tabella-diritti-2026
duration:
  text: >-
    L'insegna si può installare appena arriva la ricevuta di avvio pratica del SUAP, che ha poi 60
    giorni per l'istruttoria. Su un edificio tutelato come bene culturale serve prima
    l'autorizzazione della Soprintendenza; in area con vincolo paesaggistico la SCIA vale solo
    dopo l'autorizzazione paesaggistica.
  status: verified
  source: suap-servizio
appointment:
  text: >-
    Non serve: la SCIA si presenta solo online su impresainungiorno. Per informazioni il SUAP
    (Piazza Cavour 42) riceve solo su prenotazione dal portale del cittadino; per il canone
    l'Ufficio CUP Pubblicità (Via Diocleziano 330) è aperto dal lunedì al venerdì, 8:30–12:30.
  status: verified
  source: suap-contatti
