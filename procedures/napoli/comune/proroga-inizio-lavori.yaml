schema_version: 0
id: napoli/comune/proroga-inizio-lavori
title: Proroga del termine di inizio lavori del permesso di costruire (art. 15 c. 2 DPR 380/2001) – SUE del Comune di Napoli
headline: "Permesso di costruire in scadenza: come chiedere la proroga dell'inizio lavori a Napoli"
aka:
  - proroga inizio lavori
  - proroga permesso di costruire
  - proroga ordinaria
updated: 2026-11-04
summary: >-
  Se i lavori di un permesso di costruire non possono iniziare entro il termine del permesso (al
  massimo un anno dal rilascio), il titolare chiede la proroga prima che scada: il Comune la
  accorda con un provvedimento motivato per fatti sopravvenuti estranei alla sua volontà, e la
  deve accordare se l'avvio è stato impedito da iniziative dell'amministrazione o del giudice poi
  rivelatesi infondate. Senza proroga il permesso decade. A Napoli la domanda si presenta allo
  Sportello Unico per l'Edilizia sul portale "Impresa in un giorno". È diversa dalla proroga
  straordinaria dell'art. 10-septies, che basta comunicare.
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Il termine per l'inizio dei lavori non può superare un anno dal rilascio del titolo; decorso,
        il permesso decade di diritto per la parte non eseguita, tranne che, anteriormente alla
        scadenza, venga richiesta una proroga (art. 15 c. 2 DPR 380/2001).
      status: verified
      source: dpr380-art15
    - text: >-
        La proroga può essere accordata, con provvedimento motivato, per fatti sopravvenuti estranei
        alla volontà del titolare del permesso, o in considerazione della mole dell'opera, delle sue
        particolari caratteristiche tecnico-costruttive o di difficoltà tecnico-esecutive emerse dopo
        l'inizio dei lavori, o per opere pubbliche finanziate in più esercizi (art. 15 c. 2).
      status: verified
      source: dpr380-art15
    - text: >-
        La proroga dei termini è comunque accordata quando i lavori non possono essere iniziati per
        iniziative dell'amministrazione o dell'autorità giudiziaria rivelatesi poi infondate (art.
        15 c. 2-bis).
      status: verified
      source: dpr380-art15
    - text: >-
        Il permesso decade anche con l'entrata in vigore di previsioni urbanistiche contrastanti,
        salvo che i lavori siano già iniziati e vengano completati entro tre anni dall'inizio (art.
        15 c. 4).
      status: verified
      source: dpr380-art15
    - text: >-
        La pagina del Comune distingue questa proroga "ordinaria", da chiedere per il permesso di
        costruire, dalla proroga straordinaria dell'art. 10-septies D.L. 21/2022, che opera con una
        comunicazione.
      status: verified
      source: proroga-pagina
    - text: >-
        Sul SUE di Napoli l'operazione "Proroga inizio lavori" (gruppo Altri adempimenti edilizi) è
        il "Provvedimento di proroga del termine di inizio lavori": chiede le motivazioni, i giorni
        di proroga richiesti, gli estremi del permesso di costruire (o della DIA), i dati catastali,
        l'oggetto, l'intestatario e la data prevista di inizio dei lavori, e le dichiarazioni sui
        diritti di segreteria e sull'imposta di bollo.
      status: verified
      source: portale-sue-operazioni
legal_basis:
  - text: "D.P.R. 380/2001, art. 15 c. 2 e 2-bis (proroga dei termini del permesso di costruire)."
    status: verified
    source: dpr380-art15
deadline:
  summary:
    text: Prima della scadenza del termine di inizio dei lavori indicato nel permesso.
    status: verified
    source: dpr380-art15
cost:
  text: >-
    Diritti d'istruttoria di 501,00 euro (riga SUE 11 della tabella: "Rinnovi, varianti, proroghe e
    volture di permessi di costruire rilasciati"), più l'imposta di bollo che il portale chiede di
    dichiarare assolta (importo non indicato dalle fonti lette). A parte c'è il compenso del tecnico.
  status: verified
  source: tabella-diritti
channels:
  - type: portal
    purpose: procedure
    name: Impresa in un giorno – Sportello Unico Edilizia del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/route/suap?codComune=F839&locale=IT&tipoSportello=E
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: potess-sue
    notes: >-
      Unico canale per le pratiche del SUE dal 6 luglio 2026 (DD 501/2026): la consegna al
      protocollo che la pagina del Comune sulle proroghe descrive è superata. Operazione "Proroga
      inizio lavori", gruppo Altri adempimenti edilizi.
    use:
      ways: [web_form, upload]
      status: verified
      source: dd-501-2026
      notes: Si compila online; gli allegati si firmano digitalmente.
  - type: pec
    purpose: info
    address: sportello.unico.edilizia@pec.comune.napoli.it
    receipt: legal
    source: sue-ufficio
    notes: Per comunicare con l'ufficio, non per chiedere la proroga.
steps:
  - do: Firmare la procura speciale se la domanda la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Verificare con il tecnico se basta la proroga straordinaria dell'art. 10-septies (permessi
      rilasciati o formati fino al 31/12/2025) o serve quella ordinaria, e scrivere i fatti
      sopravvenuti che impediscono l'inizio
    who: professional
  - do: Pagare i diritti d'istruttoria (501,00 euro) e l'imposta di bollo, e allegarne la ricevuta
    who: owner
    human_only: true
  - do: >-
      Prima della scadenza, accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli),
      scegliere l'operazione "Proroga inizio lavori", compilare, allegare i documenti firmati
      digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
  - do: Attendere il provvedimento motivato del Comune
    who: office
