schema_version: 0
id: napoli/comune/proroga-straordinaria-inizio-lavori
title: Comunicazione integrativa della proroga straordinaria del termine di inizio lavori (art. 10-septies D.L. 21/2022) – SUE del Comune di Napoli
headline: "Proroga straordinaria dell'inizio lavori già comunicata: come estenderla al SUE di Napoli"
aka:
  - comunicazione integrativa proroga
  - proroga straordinaria inizio lavori
  - proroga 10 septies
  - proroga trenta mesi
updated: 2026-11-05
summary: >-
  La proroga straordinaria dell'art. 10-septies è cresciuta più volte: da uno a due anni, a trenta
  e trentasei mesi, oggi a quarantotto mesi per i titoli rilasciati o formati fino al 31 dicembre
  2025. Chi l'aveva già comunicata per l'inizio dei lavori nella misura più breve può mandare al
  Comune una comunicazione integrativa per avvalersi dell'estensione, purché il termine non sia già
  scaduto. A Napoli si presenta allo Sportello Unico per l'Edilizia sul portale "Impresa in un
  giorno", con l'operazione che il portale chiama ancora "proroga straordinaria trenta mesi".
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Sono prorogati di quarantotto mesi i termini di inizio e di ultimazione dei lavori dei
        permessi di costruire rilasciati o formatisi fino al 31 dicembre 2025, purché non già
        decorsi al momento della comunicazione dell'interessato e salvo contrasto con nuovi
        strumenti urbanistici approvati o con piani o provvedimenti di tutela dei beni culturali o
        del paesaggio; la proroga vale anche per i termini delle SCIA (art. 10-septies c. 1 a D.L.
        21/2022, testo vigente).
      status: verified
      source: dl21-art10septies
    - text: >-
        La pagina del Comune ammette, per chi aveva comunicato la proroga di un solo anno, una
        comunicazione integrativa per manifestare la volontà di usufruire dell'ulteriore proroga.
      status: verified
      source: proroga-pagina
    - text: >-
        Il testo dell'art. 10-septies chiede solo la comunicazione dell'interessato di volersi
        avvalere della proroga e non nomina una comunicazione integrativa; se chi aveva già
        comunicato una proroga più breve abbia l'estensione senza integrarla non è stato verificato
        su una fonte ufficiale.
      status: unverified
    - text: >-
        Sul SUE di Napoli l'operazione "Comunicazione integrativa proroga straordinaria trenta mesi
        inizio lavori (art. 10 septies, Legge 51/2022)" (gruppo Altri adempimenti edilizi) chiede
        gli estremi del permesso di costruire o della SCIA, l'oggetto, l'intestatario e la data
        prevista di inizio dei lavori; una scelta aggiunge la dichiarazione di assenso dei terzi
        titolari di altri diritti reali o obbligatori, se il titolare non è esclusivo.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        Il nome dell'operazione sul portale parla di trenta mesi e della L. 11/2024; il testo vigente
        dell'art. 10-septies dà quarantotto mesi (D.L. 200/2025, convertito dalla L. 26/2026).
      status: disputed
      source: portale-sue-operazioni
    - text: >-
        Nel gruppo Altri adempimenti edilizi del SUE di Napoli c'è solo questa operazione
        integrativa per l'inizio dei lavori: per l'ultimazione ci sono sia la comunicazione sia
        l'integrativa.
      status: verified
      source: portale-sue-scelta
    - text: >-
        Con quale operazione del portale si fa una prima comunicazione della proroga straordinaria
        dell'inizio lavori va chiesto al SUE.
      status: unverified
legal_basis:
  - text: "D.L. 21 marzo 2022, n. 21, art. 10-septies c. 1 a (convertito dalla L. 51/2022), nel testo modificato da ultimo dal D.L. 200/2025 (L. 26/2026)."
    status: verified
    source: dl21-art10septies
deadline:
  summary:
    text: >-
      Prima che scada il termine di inizio dei lavori: la proroga non opera per i termini già
      decorsi al momento della comunicazione.
    status: verified
    source: dl21-art10septies
pitfalls:
  - text: >-
      La proroga non opera se, al momento della comunicazione, il titolo contrasta con nuovi
      strumenti urbanistici approvati o con piani o provvedimenti di tutela del paesaggio o dei
      beni culturali.
    status: verified
    source: dl21-art10septies
  - text: >-
      La tabella dei diritti SUE 2026 ha una riga per le proroghe di permessi di costruire
      rilasciati (SUE 11, 501,00 euro); se valga anche per questa comunicazione integrativa,
      che non chiede un provvedimento, e per un titolo che non sia un permesso, va chiesto al
      SUE.
    status: unverified
    source: tabella-diritti
channels:
  - type: portal
    purpose: procedure
    name: Impresa in un giorno – Sportello Unico Edilizia del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/route/suap?codComune=F839&locale=IT&tipoSportello=E
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: potess-sue
    notes: >-
      Unico canale per le pratiche del SUE dal 6 luglio 2026 (DD 501/2026). Operazione
      "Comunicazione integrativa proroga straordinaria trenta mesi inizio lavori (art. 10 septies,
      Legge 51/2022)", gruppo Altri adempimenti edilizi.
    use:
      ways: [web_form, upload]
      status: verified
      source: dd-501-2026
      notes: Si compila online; gli allegati si firmano digitalmente.
  - type: pec
    purpose: info
    address: sportello.unico.edilizia@pec.comune.napoli.it
    receipt: legal
    source: sue-ufficio
    notes: Per comunicare con l'ufficio, non per presentare la comunicazione.
steps:
  - do: Firmare la procura speciale se la comunicazione la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Ritrovare la comunicazione di proroga già presentata e verificare che il termine di inizio
      non sia scaduto e che il titolo non contrasti con nuovi strumenti urbanistici o vincoli;
      calcolare la nuova data di inizio
    who: professional
  - do: Se il titolare non è esclusivo, raccogliere la dichiarazione di assenso dei terzi titolari di diritti
    who: owner
    human_only: true
  - do: >-
      Prima della scadenza, accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli),
      scegliere l'operazione della comunicazione integrativa per l'inizio dei lavori, compilare,
      allegare i documenti firmati digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
