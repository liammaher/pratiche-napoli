schema_version: 0
id: napoli/comune/utilizzo-materiale-scavo-fuori-sito
title: Dichiarazione di utilizzo delle terre e rocce da scavo fuori del sito di produzione (art. 21 D.P.R. 120/2017) – Comune di Napoli e ARPAC, sul SUE
headline: "Terre e rocce da scavo a Napoli: la dichiarazione di utilizzo per i cantieri piccoli"
aka:
  - dichiarazione di utilizzo terre e rocce
  - terre e rocce da scavo sottoprodotti
  - dichiarazione art. 21 DPR 120/2017
  - allegato 6 DPR 120/2017
updated: 2026-11-03
summary: >-
  Chi scava in un cantiere e vuole usare le terre e rocce fuori del sito come sottoprodotti, e non
  smaltirle come rifiuti, lo dichiara prima di scavare. Nei cantieri piccoli (fino a 6.000 m³) e in
  quelli grandi che non sono soggetti a VIA o AIA il produttore manda la dichiarazione di utilizzo al
  Comune del luogo di produzione e all'ARPA almeno 15 giorni prima dell'inizio degli scavi. A Napoli
  si presenta sul portale "Impresa in un giorno", da sola o nella stessa pratica del titolo edilizio
  dei lavori. A utilizzo finito segue la dichiarazione di avvenuto utilizzo.
ente:
  name: Comune di Napoli
  office: Sportello Unico Edilizia (istanze sul SUE), con ARPA Campania, Dipartimento Provinciale di Napoli
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata, ambiente]
  conditions:
    - text: >-
        È cantiere di piccole dimensioni quello in cui si producono terre e rocce da scavo per non più
        di seimila metri cubi, calcolati dalle sezioni di progetto (art. 2 c. 1 t D.P.R. 120/2017).
      status: verified
      source: dpr120-art2
    - text: >-
        Nei cantieri di piccole dimensioni il produttore attesta le condizioni dell'art. 4 con una
        dichiarazione sostitutiva di atto di notorietà (modulo dell'Allegato 6), trasmessa anche solo
        per via telematica al Comune del luogo di produzione e all'Agenzia di protezione ambientale
        almeno 15 giorni prima dell'inizio dei lavori di scavo (art. 21 c. 1); la dichiarazione
        assolve la funzione del piano di utilizzo (c. 2) e va aggiornata se i requisiti cambiano in
        modo sostanziale (c. 3).
      status: verified
      source: dpr120-art21
    - text: >-
        Anche le terre e rocce dei cantieri di grandi dimensioni non sottoposti a VIA o AIA si
        qualificano sottoprodotti con la dichiarazione dell'art. 21, secondo gli artt. 20 e 21 (art.
        22).
      status: verified
      source: dpr120-art22
    - text: >-
        Le terre e rocce riutilizzate nello stesso sito in cui sono scavate, escluse dalla disciplina
        dei rifiuti (art. 185 c. 1 c D.Lgs. 152/2006), seguono l'art. 24, non questa dichiarazione.
      status: verified
      source: dpr120-art24
    - text: >-
        Sul SUE di Napoli l'operazione "Dichiarazione di utilizzo del materiale di scavo fuori del
        sito di produzione ai sensi dell'art. 21 del DPR n.120/2017" è nel gruppo Terre e rocce da
        scavo e genera due adempimenti, agli uffici del Comune di Napoli - SUE e ad ARPA Campania,
        Dipartimento Provinciale di Napoli; si sceglie insieme al titolo edilizio nella stessa
        pratica.
      status: verified
      source: portale-sue-operazioni
