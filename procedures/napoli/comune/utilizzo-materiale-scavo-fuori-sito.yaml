    l'art. 48 c. 3 D.L. 13/2023 lo abroga solo dall'entrata in vigore del nuovo regolamento, non
    ancora adottato il 3/11/2026, e il D.L. 177/2026 aggiunge l'art. 185-ter D.Lgs. 152/2006 per il
