      notes: Si compila online; la dichiarazione e gli elaborati si allegano.
    notes: >-
      Operazione "Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai
      sensi dell'art. 21 del DPR n.120/2017", nel gruppo Terre e rocce da scavo: da sola, o spuntata
      insieme al titolo edilizio (CIL, CILA, SCIA, SCIA alternativa, permesso di costruire).
steps:
  - do: >-
      Stabilire con il tecnico se le terre e rocce escono dal sito come sottoprodotti, quanti metri
      cubi si scavano e se l'opera è soggetta a VIA o AIA: fino a 6.000 m³, o oltre ma senza VIA né
      AIA, si fa questa dichiarazione
    who: professional
  - do: >-
      Compilare la dichiarazione (Allegato 6), sottoscritta dal produttore, con i siti di
      destinazione, i tempi e le quantità
    who: professional
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione da
      sola o insieme al titolo edilizio, compilare, allegare, firmare e inviare almeno 15 giorni
      prima degli scavi; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
pitfalls:
  - text: >-
      La dichiarazione va prima degli scavi: dopo, le terre e rocce già portate via non sono
      sottoprodotti, e dove la dichiarazione di avvenuto utilizzo manca nei termini perdono la
      qualifica con effetto immediato (art. 7 c. 3).
    status: verified
    source: dpr120-art7
