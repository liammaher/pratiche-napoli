    use:
      ways: [web_form, upload]
      status: verified
      source: dd-501-2026
      notes: Si compila online; gli allegati si firmano digitalmente.
  - type: pec
    purpose: info
    address: sportello.unico.edilizia@pec.comune.napoli.it
