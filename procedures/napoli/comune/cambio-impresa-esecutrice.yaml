    notes: Per comunicare con l'ufficio, non per presentare la comunicazione.
steps:
  - do: Firmare la procura speciale se la comunicazione la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Verificare la nuova impresa (visura camerale, DURC, organico medio, contratto collettivo,
      patente dell'art. 27 D.Lgs. 81/2008) e firmare la dichiarazione sostitutiva di averlo fatto
    who: owner
    human_only: true
  - do: Se la notifica preliminare era già stata trasmessa, aggiornarla presso l'ASL e la direzione provinciale del lavoro
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      di cambio dell'impresa esecutrice, compilare, allegare i documenti firmati digitalmente e
      inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
