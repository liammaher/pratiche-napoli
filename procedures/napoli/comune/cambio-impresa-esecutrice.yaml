schema_version: 0
id: napoli/comune/cambio-impresa-esecutrice
title: Comunicazione di cambio dell'impresa esecutrice – SUE del Comune di Napoli
headline: "L'impresa ha lasciato il cantiere: come comunicare la nuova al SUE di Napoli"
aka:
  - cambio impresa
  - sostituzione impresa esecutrice
  - nuova impresa esecutrice
  - cessazione impresa
updated: 2026-11-04
summary: >-
  Se l'impresa che esegue i lavori cessa o viene sostituita, il committente comunica la nuova
  impresa allo Sportello Unico per l'Edilizia, dopo averne verificato l'idoneità come per la prima:
  visura camerale, DURC, organico e contratto collettivo, patente. Se il cantiere è soggetto alla
  notifica preliminare già trasmessa, la notifica va aggiornata. Per aggiungere un'impresa a quella
  che resta si usa invece la comunicazione di nomina. A Napoli si presenta sul portale "Impresa in
  un giorno".
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Sul SUE di Napoli l'operazione "Comunicazione al Comune di cambio dell'impresa esecutrice (da
        utilizzare in caso di cessazione della precedente impresa)" (gruppo Altri adempimenti
        edilizi) ha una scelta per il caso in cui l'intervento ricade nel D.Lgs. 81/2008 e la
        notifica dell'art. 99 è già stata trasmessa; tra gli allegati c'è la dichiarazione
        sostitutiva sulle verifiche dell'art. 90 c. 9.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        La comunicazione di nomina dell'impresa del SUE serve per la prima nomina o per un'impresa in
        aggiunta alla precedente; in caso di cessazione della precedente rimanda a quella di cambio
        dell'impresa.
      status: verified
      source: portale-nomina
    - text: >-
        Il committente o il responsabile dei lavori verifica l'idoneità tecnico-professionale delle
        imprese, chiede la dichiarazione dell'organico e del contratto collettivo e verifica la
        patente dell'art. 27, e trasmette all'amministrazione concedente la notifica preliminare, il
        DURC e la dichiarazione di queste verifiche (art. 90 c. 9 D.Lgs. 81/2008); senza notifica o
        DURC, quando previsti, l'efficacia del titolo è sospesa (c. 10).
      status: verified
      source: dlgs81-art90
    - text: >-
        La notifica preliminare si trasmette con i suoi eventuali aggiornamenti all'ASL e alla
        direzione provinciale del lavoro, anche per i cantieri che diventano soggetti all'obbligo
        per varianti in corso d'opera (art. 99 c. 1 D.Lgs. 81/2008).
      status: verified
      source: dlgs81-art99
    - text: >-
        Se il cambio d'impresa vada comunicato al Comune prima che la nuova impresa entri in
        cantiere non è scritto nelle norme lette, che parlano dell'inizio dei lavori.
      status: unverified
legal_basis:
  - text: "D.Lgs. 81/2008, art. 90 c. 9-10 (obblighi del committente) e art. 99 (notifica preliminare e suoi aggiornamenti)."
    status: verified
    source: dlgs81-art90
