verification:
  level: L1
  date: 2026-10-29
  by: claude
  method: >-
    Desk: su Normattiva DPR 380/2001 artt. 3, 22, 23-ter e la Tabella A del D.Lgs. 222/2016
    (attività 35-38), D.Lgs. 42/2004 art. 21; la pagina SCIA del Comune di Napoli e il modulo SCIA
    del 23/06/2025; la DD 501/2026; le operazioni del SUE viste sul portale in una bozza di prova;
    sui cambi d'uso in Campania la circolare regionale CI/2025/3 e i testi vigenti della L.R.
    19/2001 (art. 2), 13/2022 (art. 2) e 31/2021 (artt. 26-27) sul sito della Regione.
  notes: >-
    Non letti: il testo della DGC 454/2014 (citata dalla pagina del Comune), la L.R. Campania
    19/2001 e le norme della Variante generale al PRG, la tabella dei diritti per la SCIA. La pagina
    è minima: dice quando serve la SCIA e come si presenta, non ancora i documenti e i costi.
