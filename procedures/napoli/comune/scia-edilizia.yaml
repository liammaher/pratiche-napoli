schema_version: 0
id: napoli/comune/scia-edilizia
title: SCIA edilizia – segnalazione certificata di inizio attività per lavori edilizi (SUE del Comune di Napoli)
headline: "SCIA edilizia a Napoli per strutture, facciate, ristrutturazioni e cambi d'uso"
aka:
  - scia lavori
  - scia ristrutturazione
  - cambio di destinazione d'uso
  - variante in corso d'opera
updated: 2026-10-29
summary: >-
  La SCIA edilizia serve a Napoli per i lavori che toccano le strutture o i prospetti
  dell'edificio, per le ristrutturazioni edilizie che non richiedono il permesso di costruire,
  per le varianti in corso d'opera e per i cambi di destinazione d'uso ammessi dalla legge. La
  presenta un tecnico abilitato per conto del proprietario o di chi ha titolo, allo Sportello
  Unico per l'Edilizia (SUE) sul portale "Impresa in un giorno". Se servono l'autorizzazione
  paesaggistica o altri atti di assenso, si chiedono nella stessa pratica (SCIA condizionata) e
  i lavori iniziano solo dopo il loro rilascio.
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Si realizzano con SCIA (art. 22 c. 1 DPR 380/2001): a) la manutenzione straordinaria
        quando riguarda le parti strutturali dell'edificio o i prospetti; b) il restauro e
        risanamento conservativo quando riguarda le parti strutturali; c) la ristrutturazione
        edilizia (art. 3 c. 1 d) diversa da quella dell'art. 10 c. 1 c, che richiede il permesso di
        costruire.
      status: verified
      source: dpr380-art22
    - text: >-
        Si realizzano con SCIA anche le varianti a permessi di costruire che non incidono sui
        parametri urbanistici e sulle volumetrie, non cambiano la destinazione d'uso e la categoria
        edilizia, non alterano la sagoma di un edificio vincolato e rispettano le prescrizioni del
        permesso (art. 22 c. 2), e quelle che non sono una variazione essenziale (c. 2-bis, anche
        comunicate a fine lavori).
      status: verified
      source: dpr380-art22
    - text: >-
        Tabella A, Sezione II del D.Lgs. 222/2016: le varianti in corso d'opera a permessi di
        costruire (attività 35) e quelle che non presentano i caratteri delle variazioni essenziali
        (attività 36) sono a SCIA; le varianti con i caratteri delle variazioni essenziali
        (attività 37) e quelle che modificano la sagoma nel centro storico (attività 38) chiedono
        l'autorizzazione, cioè il permesso di costruire.
      status: verified
      source: dlgs222-tabella-a
    - text: >-
        Il modulo SCIA del Comune prevede anche la variante in corso d'opera a una SCIA, sia quando
        non è una variazione essenziale (c.5) sia quando lo è ai sensi dell'art. 32 (c.6).
      status: verified
      source: scia-modulo
    - text: >-
        Il cambio di destinazione d'uso di una singola unità all'interno della stessa categoria
        funzionale (art. 23-ter c. 1-bis), quello di una singola unità in un immobile delle zone A,
        B o C del D.M. 1444/1968 tra le categorie residenziale, turistico-ricettiva, produttiva e
        direzionale, commerciale (c. 1-ter) e quello di un intero immobile nella stessa categoria
        (c. 3, salvo diversa previsione delle leggi regionali) si fanno con SCIA quando sono senza
        opere o con le sole opere dell'edilizia libera, e con SCIA anche quando sono accompagnati da
        opere da CILA (c. 1-quinquies); negli altri casi con il titolo richiesto per le opere.
      status: verified
      source: dpr380-art23ter
    - text: >-
        Per le unità poste al primo piano fuori terra o seminterrate il cambio di destinazione d'uso
        è disciplinato dalla legislazione regionale (art. 23-ter c. 1-quater); i cambi tra categorie
        fuori dei casi del c. 1-ter, compresi quelli verso o dalla categoria rurale, non rientrano
        nelle ipotesi di SCIA elencate sopra.
      status: verified
      source: dpr380-art23ter
    - text: >-
        In Campania i cambi di destinazione d'uso seguono l'art. 23-ter DPR 380/2001 insieme alla
        L.R. 19/2001 (art. 2, c. 5-8), alla L.R. 13/2022 (art. 2, c. 4 e 6) e alla L.R. 31/2021
        (artt. 26-27). Per i titoli la circolare regionale CI/2025/3 precisa: per una singola unità
        nella stessa categoria vale l'art. 23-ter c. 1-quinquies (SCIA senza opere o con opere di
        edilizia libera o da CILA; altrimenti il titolo delle opere); per una singola unità tra le
        categorie a), a-bis), b) e c) vale lo stesso c. 1-quinquies, salvo il mutamento senza opere
        tra categorie compatibili con la zona territoriale omogenea, che è libero (art. 2 c. 5 L.R.
        19/2001); per un intero immobile, nella stessa categoria o tra categorie diverse, serve la
        SCIA alternativa al permesso di costruire (art. 2 c. 6 L.R. 13/2022), salvi i casi a
        permesso di costruire dell'art. 2 c. 6-8 L.R. 19/2001 (e, tra categorie, il mutamento senza
        opere del c. 5); il mutamento, con o senza opere, anche tra categorie diverse, che non
        aumenta il fabbisogno di standard urbanistici è liberamente attuabile (art. 2 c. 4 L.R.
        13/2022).
      status: verified
      source: circolare-salva-casa-campania
    - text: >-
        Non sono urbanisticamente rilevanti le modifiche di destinazione d'uso, con o senza opere,
        che non generano incremento del fabbisogno degli standard urbanistici (art. 2 c. 4 L.R.
        Campania 13/2022); sono soggetti a SCIA alternativa al permesso di costruire anche le
        modifiche della destinazione d'uso urbanisticamente rilevanti, con opere e senza opere (c.
        6).
      status: verified
      source: lr13-2022
    - text: >-
        L.R. Campania 19/2001, art. 2: il mutamento di destinazione d'uso senza opere,
        nell'ambito di categorie compatibili alle singole zone territoriali omogenee, è libero (c.
        5); con opere che incidano sulla sagoma dell'edificio o determinino un aumento plano
        volumetrico è soggetto a permesso di costruire (c. 6), come con opere su sagoma, volumi e
        superfici con passaggio di categoria (c. 7); nelle zone agricole (zona E) è sempre soggetto
        a permesso di costruire (c. 8).
      status: verified
      source: lr19-2001
    - text: >-
        Il mutamento d'uso è rilevante quando assegna l'immobile o l'unità a un'altra categoria
        funzionale e genera incremento del fabbisogno di standard urbanistici; la nuova destinazione
        è ammissibile solo se lo strumento urbanistico la indica come compatibile per quella parte
        del territorio (art. 27 c. 2 L.R. Campania 31/2021).
      status: verified
      source: lr31-2021
    - text: >-
        Per un'unità al primo piano fuori terra o seminterrata, che l'art. 23-ter c. 1-quater
        rimette alla legge regionale, la circolare regionale CI/2025/3 non indica il titolo. Non è
        verificato se valga la regola generale della L.R. 13/2022 (SCIA alternativa al permesso per i
        cambi rilevanti, art. 2 c. 6): va chiesto al SUE. Se il cambio non aumenta il fabbisogno di
        standard, è comunque non rilevante (c. 4).
      status: unverified
    - text: >-
        Il modulo SCIA del Comune elenca gli stessi cambi d'uso: senza opere o con opere dell'art. 6,
        o con opere dell'art. 6-bis, di una singola unità nella stessa categoria o tra le categorie
        a), a-bis), b) e c), e di un intero immobile nella stessa categoria (quadro c.7 e c.8).
      status: verified
      source: scia-modulo
    - text: >-
        È comunque facoltà dell'interessato chiedere il permesso di costruire per gli interventi da
        SCIA, senza obbligo del contributo di costruzione salvo i casi dell'art. 23 (art. 22 c. 7).
      status: verified
      source: dpr380-art22
    - text: >-
        A Napoli la Delibera di Giunta comunale n. 454 del 6 giugno 2014 esclude la SCIA per gli
        interventi di demolizione e ricostruzione e per le varianti a permessi di costruire che
        modificano la sagoma dei fabbricati in zona A della Variante generale al PRG o della
        Variante occidentale.
      status: verified
      source: scia-pagina
    - text: >-
        Gli interventi su immobili sottoposti a tutela storico-artistica, paesaggistico-ambientale o
        dell'assetto idrogeologico richiedono prima il parere o l'autorizzazione previsti (art. 22
        c. 6).
      status: verified
      source: dpr380-art22
    - text: >-
        Con la SCIA si può chiedere al SUE di acquisire gli atti di assenso necessari, per esempio
        l'autorizzazione paesaggistica semplificata o ordinaria (SCIA condizionata, quadro b.3 e
        quadro 17.3): i lavori iniziano dopo che lo Sportello comunica il loro rilascio.
      status: verified
      source: scia-modulo
    - text: >-
        Sul portale del SUE l'operazione della SCIA e quelle dell'autorizzazione paesaggistica
        semplificata e ordinaria del Comune si scelgono insieme nella stessa pratica.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        Se l'intervento tocca le strutture, il quadro 15 della SCIA dichiara le opere in cemento
        armato o metalliche (denuncia dell'art. 65) e quelle da denunciare o autorizzare in zona
        sismica (artt. 93 e 94 DPR 380/2001 o la normativa regionale), con la relativa
        documentazione allegata; il deposito o l'autorizzazione sismica sono un procedimento del
        Genio Civile (napoli/genio-civile/deposito-autorizzazione-sismica).
      status: verified
      source: scia-modulo
    - text: >-
        Per lavori già eseguiti in assenza o difformità dal titolo il modulo prevede la SCIA in
        sanatoria (art. 36-bis) e l'accertamento di compatibilità paesaggistica (quadro 17.3.3):
        sono procedimenti diversi dalla SCIA per lavori da fare.
      status: verified
      source: scia-modulo
    - text: >-
        Sui beni culturali l'esecuzione di opere e lavori di qualunque genere richiede
        l'autorizzazione del soprintendente (art. 21 c. 4 D.Lgs. 42/2004).
      status: verified
      source: dlgs42-art21
legal_basis:
  - text: "D.P.R. 380/2001, art. 22 (SCIA edilizia), art. 3 c. 1 (definizioni), art. 23-ter (mutamento d'uso), nel testo vigente."
    status: verified
    source: dpr380-art22
  - text: "D.Lgs. 222/2016, Tabella A, Sezione II – Edilizia (attività 35-38: varianti)."
    status: verified
    source: dlgs222-tabella-a
  - text: >-
      Modulistica unificata adottata dal SUE di Napoli (modulo SCIA del 23/06/2025) e Disposizione
      Dirigenziale SUE n. 501 del 23 giugno 2026 (presentazione su impresainungiorno).
    status: verified
    source: dd-501-2026
deadline:
  summary:
    text: >-
      Prima di iniziare i lavori; con una SCIA condizionata i lavori iniziano solo dopo che lo
      Sportello comunica il rilascio degli atti di assenso.
    status: verified
    source: scia-modulo
