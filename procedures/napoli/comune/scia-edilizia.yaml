steps:
  - do: Incaricare un tecnico abilitato (architetto, ingegnere, geometra…) e firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Stabilire con il tecnico il titolo giusto (CILA, SCIA, SCIA alternativa o permesso), lo stato
      legittimo, i vincoli (paesaggio, bene culturale, zona A del PRG) e se l'intervento tocca le
      strutture
    who: professional
  - do: >-
      Se l'intervento tocca le strutture, preparare con il progettista delle strutture il deposito
      o la richiesta di autorizzazione sismica per il Genio Civile
    who: professional
  - do: Pagare i diritti di segreteria del SUE e allegarne la ricevuta
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      SCIA (con l'autorizzazione paesaggistica se serve), compilare, allegare i documenti firmati
      digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
  - do: A fine lavori, comunicazione di fine lavori e collaudo finale del progettista, con la ricevuta della variazione catastale
    who: professional
    human_only: true
