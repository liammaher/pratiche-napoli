  method: >-
    Desk: la direttiva del Comune sul paesaggio (§ 3.2, testo del PDF), l'art. 4 del D.P.R. 31/2017 su
    Normattiva, le FAQ della Soprintendenza per l'area metropolitana di Napoli (le richieste sulla
    fattibilità vanno all'ente delegato, cioè il Comune); la pratica vista nella mappa del portale
    (bozza vuota del 2026-10-28).
  notes: >-
    Non letti: la Circolare MiBACT 42/2017 che la direttiva cita; se un altro ente (un parco
    regionale) risponda a domande così per una parte del territorio comunale. Non chiesto
    all'ufficio Paesaggio che cosa fa di una domanda presentata comunque dal portale.
