schema_version: 0
id: napoli/comune/parere-esonero-autorizzazione-paesaggistica
title: Domanda di parere per esonero dall'obbligo di autorizzazione paesaggistica – Comune di Napoli, sul SUE
headline: "Parere di esonero dall'autorizzazione paesaggistica a Napoli: il Comune non lo rilascia"
aka:
  - esonero autorizzazione paesaggistica
  - parere di esclusione paesaggistica
  - attestazione allegato A
  - interventi esclusi dall'autorizzazione paesaggistica
updated: 2026-10-30
summary: >-
  Il portale "Impresa in un giorno" offre, tra le pratiche del SUE di Napoli, la "Domanda di parere
  per esonero dall'obbligo di autorizzazione paesaggistica": si chiede che i lavori in area vincolata
  siano riconosciuti esclusi dall'autorizzazione (Allegato A del D.P.R. 31/2017). A Napoli però la
  direttiva del Comune sul paesaggio esclude un'attestazione del genere, perché non è prevista
  dall'ordinamento: per i lavori esclusi è il tecnico ad asseverare il caso di esclusione e la voce
  dell'Allegato A, nella pratica edilizia quando serve, e il Comune può verificarlo in sede di
  controllo. Per i lavori di edilizia libera esclusi non c'è niente da presentare.
ente:
  name: Comune di Napoli
  office: Area Ambiente, Servizio Tutela dell'Ambiente, della Salute e del Paesaggio (ufficio Paesaggio)
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata, paesaggio]
  conditions:
    - text: >-
        Non sono soggetti ad autorizzazione paesaggistica gli interventi dell'art. 149 D.Lgs. 42/2004,
        quelli dell'Allegato A del D.P.R. 31/2017 e quelli dell'art. 4 dello stesso decreto; come
        prevede la Circolare 42/2017, il tecnico incaricato assevera la ricorrenza dei presupposti e
        dei casi di esclusione, e in particolare la singola voce dell'Allegato A.
      status: verified
      source: direttiva-paesaggio
    - text: >-
        La direttiva del Comune esclude la possibilità di un'attestazione circa l'eventuale
        esclusione o esonero, perché atipica e non prevista dall'ordinamento; in sede di controllo o
        vigilanza il Comune può verificare la rispondenza tra quanto realizzato e quanto dichiarato
        (§ 3.2).
      status: verified
      source: direttiva-paesaggio
    - text: >-
        L'art. 4 del D.P.R. 31/2017 esonera dall'autorizzazione semplificata alcuni interventi degli
        Allegati A e B dove il provvedimento di vincolo o il piano paesaggistico contengono specifiche
        prescrizioni d'uso; l'esonero vale dalla pubblicazione dell'avviso sui siti della Regione e
        del Ministero.
      status: verified
      source: dpr31-art4
    - text: >-
        Sul SUE di Napoli l'operazione "Domanda di parere per esonero dall'obbligo di autorizzazione
        paesaggistica" è nel gruppo Beni Paesaggistici, come domanda preventiva di pareri e/o atti di
        assenso agli uffici del Comune di Napoli - SUE; chiede il titolo del richiedente, la
        legittimità dello stato dei luoghi, la voce dell'Allegato A, l'Ente a cui va la richiesta
        con la relazione illustrativa, e l'imposta di bollo.
      status: verified
      source: portale-sue-operazioni
legal_basis:
  - text: "D.Lgs. 42/2004, art. 149; D.P.R. 31/2017, art. 2 e 4 e Allegato A; Direttiva del Comune di Napoli sul procedimento di autorizzazione paesaggistica (D.D. 1072I/2024/154), § 3.2."
    status: verified
    source: direttiva-paesaggio
channels:
  - type: portal
    purpose: procedure
    name: Impresa in un giorno – Sportello Unico Edilizia del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/route/suap?codComune=F839&locale=IT&tipoSportello=E
    auth: [spid, cie, cns]
    receipt: legal
    preferred: false
    source: potess-sue
    notes: >-
      Operazione "Domanda di parere per esonero dall'obbligo di autorizzazione paesaggistica", nel
      gruppo Beni Paesaggistici. Il portale la offre, ma la direttiva del Comune esclude
      l'attestazione che chiede.
    use:
      ways: [web_form, upload]
      status: verified
      source: dd-501-2026
      notes: Si compila online; la relazione illustrativa e gli elaborati si allegano.
steps:
  - do: >-
      Stabilire con il tecnico se i lavori rientrano nell'art. 149 D.Lgs. 42/2004 o in una voce
      dell'Allegato A del D.P.R. 31/2017
    who: professional
  - do: >-
      Se servono un titolo edilizio (CILA, SCIA, permesso), il tecnico vi assevera il caso di
      esclusione e la voce dell'Allegato A; se sono lavori di edilizia libera, non si presenta niente
    who: professional
  - do: >-
      Chi la presenta comunque: accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli),
      scegliere l'operazione della domanda di parere per esonero, compilare, allegare la relazione
      illustrativa, gli elaborati e le fotografie, e inviare; conservare la ricevuta. La direttiva
      del Comune esclude l'attestazione che chiede
    who: professional
    human_only: true
    channel: [portal]
pitfalls:
  - text: >-
      Una domanda di parere sull'esonero presentata al Comune di Napoli chiede un'attestazione che la
      sua direttiva sul paesaggio esclude (§ 3.2): non sostituisce l'asseverazione del tecnico.
    status: verified
    source: direttiva-paesaggio
