steps:
  - do: >-
      Verificare sulla tavola di zonizzazione se il locale è in Area A (sito UNESCO e buffer zone) o
      in Area B, se la strada rientra nelle Linee guida del Centro Storico e la categoria della strada
      nello Stradario (Allegato F al regolamento CUP)
    who: anyone
  - do: Scegliere tipo di dehors e regime (semplificato fino a 120 giorni o continuativo 3/5 anni)
    who: owner
  - do: >-
      Incaricare un tecnico abilitato di rilievo, foto, progetto, relazione tecnica e relazione
      asseverata secondo il regolamento dehors e il catalogo degli arredi
    who: professional
  - do: Compilare le dichiarazioni del Comune (requisiti igienico-sanitari e, se serve, procedura semplificata) e il piano di pulizia
    who: anyone
  - { do: Firmare le dichiarazioni, who: owner, human_only: true }
  - { do: Pagare con PagoPA i diritti d'istruttoria SUAP e assolvere l'imposta di bollo, who: owner, human_only: true }
  - do: Inviare l'istanza telematica con tutti gli allegati su impresainungiorno (SUAP di Napoli)
    who: facilitator
    human_only: true
  - do: >-
      Per i tipi C e D o in aree del Centro Storico soggette alla Soprintendenza, consegnare le copie
      cartacee di progetto e relazioni entro 7 giorni dall'invio
    who: professional
    human_only: true
  - { do: Rispondere alle eventuali richieste di integrazione del SUAP entro 30 giorni, who: facilitator }
  - do: >-
      Ricevuto l'esito positivo, pagare il canone (o la prima rata) e il bollo con gli estremi
      comunicati dal SUAP
    who: owner
    human_only: true
  - do: >-
      Restituire tramite il portale i patti e le condizioni firmati digitalmente con le ricevute di
      pagamento, e attendere la concessione firmata dal dirigente
    who: owner
    human_only: true
  - { do: Allestire il dehors solo dopo il rilascio e nei limiti della concessione, who: owner }
after:
  - Conservare l'atto di concessione e le ricevute dei pagamenti per i controlli della Polizia Locale (art. 7, c. 5 regolamento CUP).
  - Pagare ogni anno il canone con l'avviso PagoPA, alle scadenze fissate dal Comune.
  - Ogni sera, e durante ferie e chiusure, ritirare tavoli, sedie e ombrelloni in un locale chiuso e chiudere le tende (art. 16 regolamento dehors).
  - >-
    Prima della scadenza presentare il rinnovo (vedi i termini, che i due regolamenti indicano in modo
    diverso) con la dichiarazione che le condizioni non sono cambiate e le ricevute dei canoni.
  - >-
    Per subingresso, variazioni del titolare, sospensione o cessazione usare i modelli del Comune; la
    rinuncia va comunicata al SUAP e al Servizio Gestione Canoni.
pitfalls:
  - text: >-
      La pagina del Comune sui dehors (aggiornata nel 2026) presenta ancora il regolamento dehors come
      allegato tecnico del regolamento COSAP, che dal 2021 è stato sostituito dal canone unico. Sulla
      pagina dei regolamenti tributari restano pubblicati anche i regolamenti COSAP 2015, 2017, 2018 e
      2019: non vanno più usati per il canone.
    status: verified
    source: regolamenti-tributari
  - text: >-
      Il regolamento del canone unico dice che le concessioni permanenti si rinnovano con SCIA almeno
      7 giorni prima della scadenza; il regolamento dehors prevede invece una comunicazione dal 1°
      settembre al 30 novembre. Presentarla nella finestra più prudente e chiedere conferma al SUAP.
    status: disputed
    source: regolamento-cup
  - text: >-
      Il rinnovo è negato se ci sono canoni non pagati, salvo un piano di rateizzazione in regola
      (art. 7, c. 14); e il rilascio di nuove concessioni richiede la regolarità nel pagamento dei
      tributi locali (art. 9, c. 6 regolamento CUP).
    status: verified
    source: regolamento-dehors
  - text: >-
      L'affitto o il comodato d'azienda non trasferisce la concessione: resta intestata al
      proprietario dell'azienda, che continua a dovere il canone (art. 10, c. 10 regolamento CUP).
    status: verified
    source: regolamento-cup
  - text: >-
      Spazio libero per i pedoni: almeno 2,00 m, o 1,20 m nelle zone storiche o con strade strette
      (regolamento dehors, art. 15). Il regolamento CUP fissa un minimo generale di 1 m: per i dehors
      vale la regola più severa del regolamento di settore.
    status: verified
    source: regolamento-dehors
  - text: >-
      Su stalli di sosta il dehors non può superare 20 mq (due stalli in linea o a pettine, tre a
      spina); in carreggiata solo in aree pedonali, ZTL attive 24 ore e strade a traffico
      estremamente limitato, con parere della Polizia Municipale e una corsia libera di 3,50 m.
      Almeno 6 m dagli incroci, 5 m dagli ingressi delle chiese, 1 m da passi carrai e scivoli.
    status: verified
    source: regolamento-dehors
  - text: >-
      In Area A niente arredi in plastica (struttura in metallo verniciato opaco o legno) e niente teli
      verticali in pvc agli ombrelloni; sotto portici e gallerie solo tavoli e sedie, senza coperture.
    status: verified
    source: regolamento-dehors
  - text: >-
      Le tende a sbraccio richiedono una procedura separata presso il Servizio tecnico della
      Municipalità; scritte pubblicitarie su coperture e delimitazioni (massimo 30 cm) richiedono una
      SCIA separata.
    status: verified
    source: regolamento-dehors
  - text: >-
      Tipi C e D: la concessione è un "atto unico" che vale anche come titolo edilizio, con parere
      dello Sportello Unico Edilizia; in aree con vincolo paesaggistico serve l'autorizzazione
      paesaggistica semplificata e la conferenza di servizi (art. 7). L'Allegato 4 dello stesso
      regolamento parla invece di permesso di costruire: farsi confermare dal SUAP quale titolo serve.
    status: disputed
    source: regolamento-dehors
  - text: >-
      Soprintendenza: per le concessioni continuative nelle aree del Centro Storico individuate dalla
      Giunta e non soggette a progetto d'ambito serve l'autorizzazione della Soprintendenza (artt.
      21/22 e 106 D.Lgs. 42/2004); per semplificate e tipo A basta la concessione (Allegato 4).
    status: verified
    source: regolamento-dehors
  - text: >-
      Nelle strade e piazze delle Linee guida 2019 (Centro Antico, Dante–Toledo, Chiaia–San Ferdinando,
      Foria) il progetto conforme alle Linee guida non richiede il parere della Soprintendenza: la
      conformità la attestano gli uffici comunali. Altrove nel Centro Storico era previsto un regime
      transitorio con soli arredi minimi (sedie, tavolini, ombrelloni a palo centrale).
    status: verified
    source: linee-guida-centro-storico
  - text: >-
      Il modello di relazione asseverata cita il DPR 139/2010 per l'autorizzazione paesaggistica
      semplificata, ma quel DPR è stato abrogato dal DPR 31/2017, che oggi regola la procedura.
    status: verified
    source: dpr-31-2017
  - text: >-
      Il regolamento dehors parla ancora di "Dia sanitaria"; oggi si tratta della notifica sanitaria
      per la registrazione dell'impresa alimentare (Reg. CE 852/2004).
    status: unverified
  - text: >-
      Il link al SUAP "adempimenti e modulistica" indicato dalla pagina del canone unico risulta non
      trovato (404); i modelli dei dehors sono sulla pagina "Concessioni di suolo pubblico annesso a
      pubblici esercizi". Il foglio "Comunicazione ai fini del pagamento del canone OSAP" lì
      pubblicato è del 2015, superato, e riporta un vecchio ufficio in via Oronzio Massa.
    status: verified
    source: dehors-pagina
  - text: >-
      Dal 2018 subingressi, variazioni soggettive, cessazioni e sospensioni vanno inviati via PEC con i
      modelli firmati digitalmente a polizia.amministrativa@pec.comune.napoli.it e
      entrate.cosap@pec.comune.napoli.it (pagina dei dehors). La pagina contatti del SUAP dice invece
      che le pratiche via PEC non sono istruite: chiedere al SUAP il canale attuale.
    status: disputed
    source: dehors-pagina
  - text: >-
      Le concessioni del regime straordinario post-Covid (art. 9-ter D.L. 137/2020) valgono al massimo
      fino al 30 giugno 2027, o fino a prima se entra in vigore il decreto di riordino: chi le ha deve
      prepararsi a chiedere una concessione ordinaria.
    status: verified
    source: legge-182-2025
