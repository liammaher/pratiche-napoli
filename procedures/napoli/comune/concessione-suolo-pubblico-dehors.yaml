      Servizio Gestione Canoni: rinuncia alla concessione (insieme al SUAP), richieste di dilazione,
      chiarimenti sul canone. Non è un canale per la domanda di concessione.
  - type: desk
    purpose: related
    name: Ufficio CUP Occupazione di Suolo (Servizio Gestione Canoni e Altri Tributi)
    address: Via Diocleziano 330, primo piano, Napoli
    hours: lunedì–venerdì 8:30–12:30
    source: cup-occupazione
  - type: email
    purpose: info
    address: entrate.cosap@comune.napoli.it
    receipt: informal
    source: cup-occupazione
    notes: Informazioni sul canone unico per occupazione di suolo.
payment:
  method: pagopa
  rateazione: >-
    Rate ammesse solo se il canone supera 350 euro: per le concessioni permanenti al massimo 3 rate
    entro l'anno, con la prima prima del ritiro della concessione (art. 48 regolamento CUP).
  schedule:
    - { label: Canone 2026 – rata unica o prima rata, due: 2026-08-31, source: cup-occupazione, status: verified }
    - { label: Canone 2026 – seconda rata, due: 2026-10-30, source: cup-occupazione, status: verified }
    - { label: Canone 2026 – terza rata, due: 2026-12-30, source: cup-occupazione, status: verified }
  notes:
    - text: >-
        Formula del canone (art. 39 regolamento CUP): C = T × D × S × α. T è la tariffa della
        categoria della strada (A, B o C) secondo lo Stradario, Allegato F al regolamento; D la
        durata (per le permanenti si contano per intero il mese di inizio e quello di fine; per le
        temporanee ogni giorno); S la superficie in mq arrotondata all'unità superiore; α il
        coefficiente di specificità dell'Allegato B.
      status: verified
      source: cup-occupazione
    - text: >-
        Tariffe 2026 (suolo pubblico): permanente, euro/mq all'anno – categoria A 186,545, B
        143,207, C 84,742; temporanea, euro/mq al giorno – A 13,712, B 9,592, C 6,844. Le tariffe
        sono aggiornate ogni anno dalla Giunta (75% dell'indice FOI).
      status: verified
      source: cup-occupazione
    - text: >-
        I dehors non compaiono nella tabella dei coefficienti dell'Allegato B, quindi si applica
        α = 1; la parte di suolo coincidente con la proiezione di tende regolarmente autorizzate ha
        α = 0,75. Il calcolo lo fa il SUAP al rilascio.
      status: verified
      source: cup-occupazione
    - text: >-
        Al rilascio il SUAP comunica gli oneri e gli estremi per il versamento; la concessione è
        firmata solo dopo aver ricevuto le ricevute di pagamento del canone (o della prima rata) e
        dell'imposta di bollo (art. 7, c. 13 regolamento dehors; art. 9 regolamento CUP).
      status: verified
      source: regolamento-dehors
    - text: >-
        Dal 2026 il canone annuale si paga con l'avviso PagoPA che il Servizio Gestione Canoni invia
        prima della prima rata. Il regolamento prevede scadenze ordinarie 30 aprile, 30 luglio e 30
        ottobre, modificabili dalla Giunta: per il 2026 la delibera 195/2026 le ha spostate al 31
        agosto, 30 ottobre e 30 dicembre.
      status: verified
      source: cup-occupazione
    - text: >-
        La pagina dei dehors (testo dal 2018) indica ancora il pagamento con bollettino o bonifico sul
        conto corrente postale 49543655 "COSAP"; la pagina del canone unico indica PagoPA dal 2026 e
        lo stesso conto solo per annualità pregresse o conguagli. Usare gli estremi che comunica il
        SUAP o l'avviso PagoPA.
      status: disputed
      source: dehors-pagina
    - text: >-
        Diritti d'istruttoria SUAP dall'11 giugno 2026 (delibera G.C. 239/2026): "Occupazione di suolo
        pubblico annesso a pubblici esercizi" 250 euro (200 euro per le variazioni); "Rinnovo" 80
        euro. Si pagano con PagoPA prima dell'invio e la ricevuta va allegata all'istanza.
      status: verified
      source: diritti-suap-2026
    - text: >-
        In caso di rinuncia o cessazione anticipata resta dovuto l'intero canone dell'anno in corso;
        la cessazione decorre dalla presa d'atto del SUAP.
      status: verified
      source: cup-occupazione
documents:
  - name: Istanza telematica in bollo su impresainungiorno, con i dati del richiedente e dell'impresa
    required: true
    notes: >-
      Generalità, residenza e codice fiscale; per le società anche denominazione, sede, codice fiscale
      o partita IVA e dati del legale rappresentante; attività ed estremi del titolo abilitante;
      ubicazione, misura e tipo di dehors; durata; dichiarazione di conoscere i regolamenti (art. 6, c.
      1). Le imprese devono indicare una PEC (art. 6, c. 3.5 regolamento CUP).
  - name: Ricevuta del pagamento dei diritti d'istruttoria SUAP
    required: true
  - name: Stralcio planimetrico in scala 1:4000 e 1:1000 della zona
    required: true
    notes: Questo e i documenti tecnici seguenti vanno datati e firmati da un tecnico abilitato.
  - name: Fotografie a colori da varie angolature (minimo 9x12 cm), con planimetria dei punti di ripresa
    required: true
  - name: Progetto quotato, di norma in scala 1:50 o 1:100 (pianta, prospetti, sezioni, viste)
    required: true
    notes: >-
      Con marciapiede, carreggiata, parcheggi, fermate, chiusini, scivoli, alberi, accessi confinanti,
      passaggi pedonali.
  - name: Relazione tecnica sullo stato dei luoghi, il progetto di arredo e i materiali
    required: true
  - name: Relazione tecnica asseverata (modello del Comune, versione semplificata o continuativa)
    required: true
    notes: >-
      Attesta zona, tipo di dehors, vincoli culturali o paesaggistici e conformità al regolamento,
      con le verifiche di collocazione dell'art. 15 (passaggio pedonale, distanze, carreggiata).
  - name: Schede o estratti di catalogo degli arredi, eventuale fotomontaggio prima e dopo
    required: true
  - name: Campione del tessuto della copertura
    required: false
    notes: Non serve per gli ombrelloni in tessuto chiaro naturale.
  - name: Conformità di illuminazione, stufe e attrezzature alle norme
    required: false
    notes: Solo se previste.
  - name: Piano di pulizia e sanificazione delle aree esterne
    required: true
  - name: Dichiarazione sostitutiva dei requisiti igienico-sanitari (modello del Comune)
    required: true
    notes: >-
      Titolo di somministrazione, avvenuta presentazione della "Dia sanitaria", servizi igienici
      adeguati, area per ricoverare gli arredi (art. 6, c. 3; Allegato 5).
  - name: Dichiarazione per l'occupazione con procedura semplificata (modello del Comune)
    required: false
    notes: Solo per la concessione semplificata (fino a 120 giorni).
  - name: Autorizzazione dei frontisti
    required: false
    notes: Se il dehors si estende davanti ad altre aperture private o commerciali (art. 15, c. 2).
  - name: Relazione paesaggistica semplificata e copie cartacee del progetto
    required: false
    notes: Per i tipi C e D in aree con vincolo paesaggistico, e per le aree del Centro Storico che richiedono la Soprintendenza.
