schema_version: 0
id: napoli/comune/concessione-suolo-pubblico-dehors
title: Dehors – concessione di suolo pubblico per bar e ristoranti e canone unico (Comune di Napoli)
headline: "Tavolini all'aperto per bar e ristoranti a Napoli: come chiedere il dehors"
aka: [permesso dehors, occupazione suolo pubblico, permesso tavolini e sedie, COSAP, OSAP]
updated: 2026-10-26
summary: >-
  Un pubblico esercizio (bar, ristorante, pizzeria…) che vuole mettere tavoli, sedie, ombrelloni o
  una struttura coperta su suolo pubblico a Napoli deve prima ottenere la concessione dal SUAP,
  con un'istanza telematica su impresainungiorno corredata dal progetto di un tecnico. Ottenuta la
  concessione, ogni anno si paga il canone unico patrimoniale per l'occupazione di suolo.
ente:
  name: Comune di Napoli
  office: >-
    Area Sviluppo Economico – Servizio Sportello Unico per le Attività Produttive (SUAP), Unità
    Operativa Occupazione Suolo Pubblico; per il canone, Servizio Gestione Canoni e Altri Tributi
    (Area Entrate)
  ipa: c_f839
applies_to:
  events: [dehors]
  audience: [business]
  sectors:
    - Somministrazione di alimenti e bevande (bar, ristoranti, pizzerie)
  conditions:
    - text: >-
        Occupazione di suolo pubblico, o di suolo privato gravato da servitù di uso pubblico, con un
        dehors annesso al locale: tipo A (tavoli e sedie), tipo B (A più ombrelloni o tende a
        sbraccio), tipo C (A con copertura stabile a teli, delimitazioni e/o pedane, aperto sui lati)
        o tipo D (A con struttura chiusa su massimo tre lati e copertura rigida).
      status: verified
      source: regolamento-dehors
    - text: >-
        I tipi B, C e D sono riservati ai pubblici esercizi di somministrazione. Esercizi di vicinato
        e artigiani alimentari possono avere solo il tipo A (tavolini alti e sgabelli), fino a 10 mq e
        senza servizio ai tavoli (artt. 9 e 13).
      status: verified
      source: regolamento-dehors
    - text: >-
        Due regimi: concessione semplificata (solo tavoli, sedie e ombrelloni non fissati, per non più
        di 120 giorni continuativi) e concessione continuativa (3 o 5 anni, fino al 31 dicembre del
        terzo o quinto anno) (artt. 3 e 8).
      status: verified
      source: regolamento-dehors
    - text: >-
        Zone: Area A coincide con il sito UNESCO (Patrimonio Mondiale) e la buffer zone; Area B è il
        resto della città. In Area A, finché la Giunta non approva i progetti d'ambito, sono ammessi
        solo dehors di tipo A e B, con ombrellone a sostegno centrale (artt. 4 e 5).
      status: verified
      source: regolamento-dehors
    - text: >-
        Superficie e posti a sedere devono essere proporzionati ai servizi igienici (Allegato 5): un
        servizio per il personale più uno per i clienti fino a 30 posti tra interno ed esterno, e così
        via. Con un solo servizio igienico per personale e clienti il dehors non può superare 10 mq e
        10 posti.
      status: verified
      source: regolamento-dehors
legal_basis:
  - text: >-
      Regolamento per l'occupazione di suolo pubblico per il ristoro all'aperto (dehors), delibera di
      C.C. n. 71 del 10/12/2014: tipologie, zone, documenti, procedimento, rinnovi, criteri di
      collocazione.
    status: verified
    source: regolamento-dehors
  - text: >-
      Regolamento per la disciplina del canone patrimoniale di concessione, autorizzazione o
      esposizione pubblicitaria (canone unico, L. 160/2019, commi 816–836), delibera di C.C. n. 16 del
      30/05/2022: sostituisce il COSAP e fa salve le discipline di settore come quella dei dehors
      (art. 1).
    status: verified
    source: regolamento-cup
  - text: >-
      Linee guida per l'occupazione di suolo pubblico per la ristorazione nel Centro Storico (sito
      UNESCO), approvate dalla Giunta comunale il 10 maggio 2019, con allineamenti, superfici,
      tipologie, colori e materiali per un elenco di strade e piazze.
    status: verified
    source: linee-guida-centro-storico
  - text: >-
      Le concessioni temporanee rilasciate con il regime straordinario post-Covid (art. 9-ter, commi
      4 e 5, D.L. 137/2020) sono prorogate fino all'entrata in vigore del decreto legislativo di
      riordino dei dehors e comunque non oltre il 30 giugno 2027 (art. 26, c. 4, L. 193/2024, come
      modificato dall'art. 50 della L. 182/2025). Il Governo ha la delega fino al 31 dicembre 2026.
    status: verified
    source: legge-182-2025
  - text: >-
      Non è stato verificato se il decreto legislativo di riordino dei dehors (L. 193/2024, art. 26)
      sia già stato adottato: se sì, può cambiare i casi in cui serve l'autorizzazione della
      Soprintendenza.
    status: unverified
deadline:
  summary:
    text: >-
      Prima di occupare il suolo serve la concessione: la continuativa arriva in 90 giorni
      (integrazioni entro 30), la semplificata entro 10 giorni; per i dehors C e D e nel Centro
      Storico con Soprintendenza le copie cartacee vanno consegnate entro 7 giorni dall'invio. Il
      rinnovo della semplificata va chiesto almeno 10 giorni prima della scadenza; per la
      continuativa le fonti indicano 1° settembre–30 novembre oppure 7 giorni prima: chiedere al SUAP.
    status: disputed
    source: regolamento-dehors
  rules:
    - text: >-
        La concessione va ottenuta prima di occupare il suolo: l'occupazione senza concessione è
        abusiva (art. 6 regolamento dehors; art. 17 regolamento CUP).
      status: verified
      source: regolamento-cup
    - text: >-
        Per i dehors di tipo C e D, e per le aree del Centro Storico di valore storico-artistico che
        richiedono l'autorizzazione della Soprintendenza, le copie cartacee di progetto e relazioni
        vanno consegnate entro 7 giorni dall'invio telematico (2 copie; 4 copie più la relazione
        paesaggistica se serve l'autorizzazione paesaggistica). Senza, l'istanza è archiviata (art.
        6, cc. 4–7).
      status: verified
      source: regolamento-dehors
    - text: >-
        Concessione continuativa: il procedimento si conclude in 90 giorni, sospesi durante le
        richieste di integrazione; se le integrazioni non arrivano entro 30 giorni la pratica è
        archiviata (art. 7, cc. 6–7).
      status: verified
      source: regolamento-dehors
    - text: >-
        Concessione semplificata: il SUAP rilascia o nega la concessione entro 10 giorni dalla
        richiesta; il procedimento (pareri ASL e Polizia Municipale) si chiude in 60 giorni (art. 8,
        cc. 3–4).
      status: verified
      source: regolamento-dehors
    - text: >-
        Il regolamento del canone unico fissa termini generali di 90 giorni per le concessioni
        permanenti e 30 per le temporanee, salvo disposizioni specifiche come quelle del regolamento
        dehors (art. 8, c. 4).
      status: verified
      source: regolamento-cup
    - text: >-
        Rinnovo della concessione continuativa: secondo il regolamento dehors si presenta una
        comunicazione dal 1° settembre al 30 novembre (art. 7, c. 14); secondo il regolamento del
        canone unico e la pagina del canone le concessioni permanenti si rinnovano con SCIA almeno 7
        giorni prima della scadenza (art. 10, c. 4). Chiedere al SUAP quale termine applica.
      status: disputed
      source: regolamento-dehors
    - text: >-
        Rinnovo della concessione semplificata: domanda almeno 10 giorni prima della scadenza; una
        sola volta nello stesso anno solare, per i due anni successivi alla prima domanda, poi serve
        una nuova istanza (art. 8, cc. 7–8).
      status: verified
      source: regolamento-dehors
  lateness:
    text: >-
      Per l'occupazione abusiva (senza concessione, oltre la superficie concessa o dopo la scadenza
      senza rinnovo) il regolamento prevede un'indennità pari al canone maggiorato del 50%, una
      sanzione pari al doppio dell'indennità, interessi al tasso legale più 1,5 punti e la rimozione
      entro 5 giorni dalla contestazione (artt. 17, 51 e 52). Per il canone non pagato, avviso di
      accertamento esecutivo con penale e interessi (art. 50). Gli importi li calcola il Servizio
      Gestione Canoni: non stimarli.
    status: verified
    source: cup-occupazione
cost:
  text: >-
    Diritti d'istruttoria SUAP (tabella 2026): 250 euro per la domanda di concessione, 80 euro per
    il rinnovo, con pagoPA prima dell'invio. Sono dovute anche l'imposta di bollo sull'istanza e
    sulla concessione (le fonti non indicano l'importo) e il compenso del tecnico che firma il
    progetto. Il canone unico per il suolo occupato è a parte.
  status: verified
  source: diritti-suap-2026
duration:
  text: >-
    Concessione continuativa (3 o 5 anni): il procedimento si chiude in 90 giorni, sospesi durante
    le richieste di integrazione. Concessione semplificata (fino a 120 giorni): il SUAP la rilascia
    o la nega entro 10 giorni dalla richiesta. In ogni caso i tavolini si mettono solo dopo il
    rilascio della concessione.
  status: verified
  source: regolamento-dehors
appointment:
  text: >-
    La domanda si presenta solo online su impresainungiorno. Per parlare con l'Unità Occupazione
    Suolo Pubblico del SUAP (Piazza Cavour 42) serve un appuntamento, il lunedì e il giovedì dalle
    9 alle 12, da prenotare online sul portale del cittadino del Comune.
  status: verified
  source: suap-contatti
channels:
