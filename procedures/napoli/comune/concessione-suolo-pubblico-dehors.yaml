    purpose: procedure
    name: impresainungiorno – SUAP del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    preferred: true
    source: suap-contatti
    notes: >-
      Unico canale per le pratiche telematiche SUAP: quelle inviate via PEC o e-mail non sono
      istruite. L'istanza è in bollo e i patti e condizioni della concessione si restituiscono
      firmati digitalmente; il tipo di accesso al portale non è stato verificato.
  - type: desk
    purpose: info
    name: SUAP – Unità Operativa Occupazione Suolo Pubblico
    address: Piazza Cavour 42, II piano, 80137 Napoli
    hours: >-
      Solo su appuntamento; l'Unità Occupazione Suolo Pubblico riceve lunedì e giovedì 9:00–12:00
    booking: >-
      Prenotazione online sul portale del cittadino del Comune (motivo "Avviare, variare, chiudere
      un'attività produttiva")
    source: suap-contatti
  - type: phone
    purpose: info
    address: 081 7953376 / 081 7953377
