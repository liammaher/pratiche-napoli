schema_version: 0
id: napoli/comune/scia-in-sanatoria
title: SCIA in sanatoria – lavori già eseguiti senza SCIA o in difformità (SUE del Comune di Napoli)
headline: "SCIA in sanatoria a Napoli: regolarizzare lavori già fatti senza SCIA"
aka:
  - sanatoria edilizia
  - accertamento di conformità
  - salva casa
  - scia tardiva
  - difformità
updated: 2026-10-30
summary: >-
  Chi ha eseguito, o sta eseguendo, lavori che chiedevano la SCIA senza presentarla, o in
  difformità da quella presentata, li regolarizza con una SCIA in sanatoria (art. 36-bis DPR
  380/2001) o, se i lavori sono ancora in corso, con la SCIA presentata spontaneamente pagando 516
  euro (art. 37 c. 5). A Napoli si presenta allo Sportello Unico per l'Edilizia (SUE) sul portale
  "Impresa in un giorno", rispondendo sì alla domanda sulla sanatoria nella SCIA. L'oblazione la
  determina lo Sportello; il tecnico ne indica l'importo e se ne paga un acconto prima di presentare.
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        La SCIA presentata spontaneamente quando l'intervento è in corso di esecuzione comporta il
        pagamento, a titolo di sanzione, di 516 euro (art. 37 c. 5 DPR 380/2001).
      status: verified
      source: dpr380-art37
    - text: >-
        Per gli interventi eseguiti in assenza della SCIA o in difformità da essa, nei casi dell'art.
        37, il responsabile o il proprietario possono ottenere la sanatoria se l'intervento è conforme
        alla disciplina urbanistica vigente al momento della presentazione della domanda e ai
        requisiti della disciplina edilizia vigente al momento della realizzazione (art. 36-bis c. 1).
      status: verified
      source: dpr380-art36bis
    - text: >-
        La sanatoria è subordinata al pagamento di un'oblazione pari al doppio dell'aumento del valore
        venale dell'immobile, da 1.032 a 10.328 euro; da 516 a 5.164 euro se l'intervento è conforme
        alla disciplina urbanistica ed edilizia vigente sia al momento della realizzazione sia a quello
        della presentazione (art. 36-bis c. 5 lett. b).
      status: verified
      source: dpr380-art36bis
    - text: >-
        Il modulo SCIA del Comune distingue quattro casi (quadro d): la SCIA in corso di esecuzione
        (516 euro), la sanatoria con doppia conformità, quella con la conformità dell'art. 36-bis c. 1
        e la regolarizzazione delle varianti a titoli anteriori alla legge 10/1977 (art. 34-ter). Per
        ciascuno si danno gli estremi del pagamento o se ne allega la ricevuta, soggetto a conguaglio;
        l'efficacia della SCIA in sanatoria è subordinata al pagamento integrale dell'oblazione
        determinata dallo Sportello e, in area tutelata dal D.Lgs. 42/2004, della sanzione dell'art.
        36-bis c. 5-bis.
      status: verified
      source: scia-modulo
    - text: >-
        Il modulo SCIA del 23/06/2025 dice che nei casi d.2, d.3 e d.4 "la procedura è cartacea",
        mentre dal 1° luglio 2026 le pratiche edilizie si presentano esclusivamente su Impresa in un
        giorno e quelle cartacee sono irricevibili (DD 501/2026); sul portale la SCIA offre i quattro
        casi.
      status: disputed
      source: scia-modulo
    - text: >-
        Nell'asseverazione il tecnico dà la data o l'epoca di realizzazione (dai documenti dell'art.
        9-bis c. 1-bis, che si allegano, o con la propria attestazione se non è possibile accertarla),
        determina l'oblazione, dice se la SCIA propone interventi a cui lo Sportello può condizionare
        la sanatoria (art. 36-bis c. 2) e, in zona sismica 1 o 2 come Napoli, se l'intervento ha
        rilevanza strutturale (art. 36-bis c. 3-bis).
      status: verified
      source: scia-modulo
    - text: >-
        Sul SUE di Napoli la domanda della SCIA "Le opere ricadono nell'ambito della Sanatoria e
        regolarizzazioni per interventi già realizzati e in corso di esecuzione?" aggiunge il quadro
        della sanatoria alla pratica.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        Lo stato comparativo delle sanatorie segna in rosso le opere eseguite in difformità e in giallo
        quelle non eseguite rispetto al titolo (Linee guida del SUE, punto 9).
      status: verified
      source: dd-501-2026
legal_basis:
  - text: "D.P.R. 380/2001, art. 36-bis (accertamento di conformità) e art. 37 (interventi in assenza o difformità dalla SCIA), nel testo in vigore dal 28/07/2024."
    status: verified
    source: dpr380-art36bis
  - text: >-
      Disposizione Dirigenziale SUE n. 501 del 23 giugno 2026: presentazione esclusiva su
      impresainungiorno e Linee guida vincolanti.
    status: verified
    source: dd-501-2026
cost:
  text: >-
    Diritti di segreteria per gli accertamenti di conformità (artt. 36 e 36-bis) e le
    regolarizzazioni (art. 34-ter): almeno 441,00 euro all'atto della presentazione (riga SUE 16),
    poi l'importo esatto secondo lo scaglione; 1.103,00 euro per l'art. 36-bis c. 5 lett. b con le
    modalità della circolare del SUE (d.d. 913/2024, riga SUE 17), 1.635,00 euro se si chiede la
    valutazione dell'Agenzia delle Entrate (riga SUE 18). A parte l'oblazione o la sanzione e il
    compenso del tecnico.
  status: verified
  source: tabella-diritti
