steps:
  - do: Incaricare un tecnico abilitato e firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Stabilire con il tecnico lo stato legittimo, le difformità, quale caso della sanatoria si
      applica, la data di realizzazione e l'importo dell'oblazione
    who: professional
  - do: Pagare i diritti di segreteria e l'acconto dell'oblazione o la sanzione, e conservarne le ricevute
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere la SCIA e
      rispondere sì alla domanda sulla sanatoria, compilare, allegare i documenti firmati
      digitalmente e inviare
    who: professional
    human_only: true
    channel: [portal]
  - do: Pagare il saldo dell'oblazione che lo Sportello determina
    who: owner
    human_only: true
