    Comune (quadri d e 4 dell'asseverazione); la tabella dei diritti del SUE; la DD 501/2026 e le
    sue Linee guida; la SCIA con la sanatoria vista sul portale in una bozza di prova.
  notes: >-
    Non letti: la circolare del SUE sulla d.d. 913/2024 (come il SUE calcola l'aumento di valore),
    l'art. 34-ter e l'art. 34-bis c. 3-bis richiamato per la rilevanza sismica, la sanzione dell'art.
    36-bis c. 5-bis in area tutelata. La pagina è minima.
