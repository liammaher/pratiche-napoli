schema_version: 0
id: napoli/comune/permesso-di-costruire
title: Permesso di costruire (art. 10 DPR 380/2001) – SUE del Comune di Napoli
headline: "Permesso di costruire a Napoli: quando serve e come si chiede al SUE"
aka:
  - concessione edilizia
  - nuova costruzione
  - demolizione e ricostruzione
updated: 2026-10-31
summary: >-
  Il permesso di costruire serve a Napoli per le nuove costruzioni, la ristrutturazione
  urbanistica e le ristrutturazioni edilizie "pesanti" dell'art. 10 c. 1 c DPR 380/2001; si può
  chiedere anche, per scelta, al posto della SCIA. Lo chiede un tecnico abilitato per conto del
  proprietario o di chi ha titolo, allo Sportello Unico per l'Edilizia (SUE) sul portale "Impresa
  in un giorno". L'autorizzazione paesaggistica, se serve, va ottenuta prima: è un atto autonomo e
  presupposto del permesso.
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Sono subordinati a permesso di costruire (art. 10 c. 1 DPR 380/2001): a) la nuova
        costruzione; b) la ristrutturazione urbanistica; c) la ristrutturazione edilizia che porta a
        un organismo in tutto o in parte diverso dal precedente quando modifica anche la volumetria
        complessiva, o, in zona omogenea A, il mutamento della destinazione d'uso, o modifica sagoma,
        volumetria o prospetti di immobili tutelati dal D.Lgs. 42/2004, e la demolizione e
        ricostruzione (o il ripristino) di edifici nelle aree tutelate dagli artt. 136 c. 1 c) e d) e
        142 con modifiche di sagoma, prospetti, sedime, caratteristiche planivolumetriche o con
        aumento di volume.
      status: verified
      source: dpr380-art10
    - text: >-
        È facoltà dell'interessato chiedere il permesso di costruire anche per gli interventi da SCIA
        (art. 22 c. 7 DPR 380/2001); il modulo del Comune lo prevede alla casella a.2.
      status: verified
      source: pdc-modulo
    - text: >-
        Per gli interventi dell'art. 10 c. 1 c e per le nuove costruzioni o ristrutturazioni
        urbanistiche disciplinate da piani con precise disposizioni plano-volumetriche, il permesso
        ha un'alternativa: la SCIA dell'art. 23 (napoli/comune/scia-alternativa-pdc).
      status: verified
      source: dpr380-art23
    - text: >-
        Le varianti a permessi di costruire con i caratteri delle variazioni essenziali (attività 37)
        e quelle che modificano la sagoma negli ambiti del centro storico (attività 38) chiedono
        l'autorizzazione, cioè un permesso di costruire (Tabella A del D.Lgs. 222/2016).
      status: verified
      source: dlgs222-tabella-a
    - text: >-
        A Napoli la Delibera di Giunta comunale n. 454 del 6 giugno 2014 esclude la SCIA per la
        demolizione e ricostruzione e per le varianti che modificano la sagoma dei fabbricati in zona
        A della Variante generale al PRG o della Variante occidentale.
      status: verified
      source: scia-pagina
    - text: >-
        In Campania il mutamento di destinazione d'uso con opere che incidano sulla sagoma
        dell'edificio o determinino un aumento plano volumetrico, e quello con opere su sagoma,
        volumi e superfici con passaggio di categoria, sono soggetti a permesso di costruire (art. 2
        c. 6-7 L.R. 19/2001); nelle zone agricole (zona E) il mutamento è sempre soggetto a permesso
        di costruire (c. 8).
      status: verified
      source: lr19-2001
    - text: >-
        La circolare regionale CI/2025/3 tiene fermi questi casi a permesso di costruire per i
        mutamenti d'uso di un intero immobile, che per il resto vanno a SCIA alternativa.
      status: verified
      source: circolare-salva-casa-campania
    - text: >-
        L'autorizzazione paesaggistica è un atto autonomo e presupposto rispetto al permesso di
        costruire (art. 146 c. 4 D.Lgs. 42/2004); il modulo del Comune la tratta nel quadro 19.
      status: verified
      source: dlgs42-art146
    - text: >-
        Il modulo comprende anche casi che hanno regole proprie: il permesso in sanatoria (art. 36,
        casella a.3; l'istanza di sanatoria va presentata in formato cartaceo), il permesso in deroga
        agli strumenti urbanistici (art. 14, a.4), il permesso convenzionato (art. 28-bis, a.7) e gli
        interventi delle leggi regionali (sottotetti, parcheggi, cambi d'uso, ampliamenti e
        demolizioni e ricostruzioni della L.R. 19/2001 e della L.R. 16/2004, a.8-a.14).
      status: verified
      source: pdc-modulo
    - text: >-
        Il Piano casa (artt. 4, 5, 6-bis e 7 L.R. Campania 19/2009) non accetta nuove istanze: il
        termine è stato prorogato l'ultima volta al 30 settembre 2022 (art. 28 c. 6 L.R. 31/2021).
      status: verified
      source: lr31-2021-piano-casa
    - text: >-
        La L.R. 13/2022 decide con la disciplina della L.R. 19/2009 solo le istanze pendenti alla sua
        entrata in vigore (art. 4 c. 17). Il recupero abitativo dei sottotetti (L.R. 15/2000) vale
        anche per i sottotetti esistenti a quella data e si assente secondo le categorie dell'art. 3
        DPR 380/2001; con i mutamenti d'uso urbanisticamente rilevanti può andare anche a SCIA
        alternativa al permesso (art. 2 cc. 6-7).
      status: verified
      source: lr13-2022
legal_basis:
  - text: "D.P.R. 380/2001, art. 10 (interventi subordinati a permesso di costruire) e art. 20 (procedimento)."
    status: verified
    source: dpr380-art10
  - text: "D.Lgs. 222/2016, Tabella A, Sezione II – Edilizia (attività 37 e 38)."
    status: verified
    source: dlgs222-tabella-a
deadline:
  summary:
    text: Prima di iniziare i lavori, che si possono iniziare solo dopo il rilascio del permesso.
    status: unverified
channels:
  - type: portal
    purpose: procedure
    name: Impresa in un giorno – Sportello Unico Edilizia del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/route/suap?codComune=F839&locale=IT&tipoSportello=E
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: potess-sue
    notes: >-
      Unico canale per le pratiche del SUE dal 6 luglio 2026 (DD 501/2026). La pagina del Comune sul
      permesso di costruire indica ancora la presentazione su carta: è superata su questo punto.
    use:
      ways: [web_form, upload]
      status: verified
      source: dd-501-2026
      notes: Si compila online; elaborati e allegati firmati digitalmente.
  - type: pec
    purpose: info
    address: sportello.unico.edilizia@pec.comune.napoli.it
    receipt: legal
    source: sue-ufficio
    notes: Per comunicare con l'ufficio, non per chiedere il permesso.
steps:
  - do: Incaricare un tecnico abilitato e firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Stabilire con il tecnico che i lavori chiedono il permesso (o che il committente lo sceglie),
      lo stato legittimo, i vincoli e se servono prima l'autorizzazione paesaggistica o altri atti
      di assenso
    who: professional
  - do: Preparare il progetto, gli elaborati e, se l'intervento tocca le strutture, gli adempimenti sismici con il progettista delle strutture
    who: professional
  - do: Pagare i diritti di segreteria del SUE e allegarne la ricevuta
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      del permesso di costruire, compilare, allegare i documenti firmati digitalmente e inviare;
      conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
  - do: Dopo il rilascio, pagare il contributo di costruzione se dovuto e comunicare l'inizio dei lavori
    who: owner
    human_only: true
