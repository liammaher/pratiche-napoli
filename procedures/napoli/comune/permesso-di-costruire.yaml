verification:
  level: L1
  date: 2026-10-29
  by: claude
  method: >-
    Desk: su Normattiva DPR 380/2001 artt. 10, 22, 23, la Tabella A del D.Lgs. 222/2016 (attività
    35-38) e D.Lgs. 42/2004 art. 146; le pagine del Comune di Napoli sul permesso di costruire e
    sulla SCIA, il modulo PDC del 23/06/2025; la DD 501/2026; la L.R. Campania 19/2001 (art. 2,
    testo vigente) e la circolare regionale CI/2025/3.
  notes: >-
    Non letti: art. 20 DPR 380/2001 (tempi del procedimento), la DGC
    454/2014, la tabella dei diritti per il permesso. La pagina è minima: dice quando serve il
    permesso e come si chiede, non ancora documenti, costi e tempi.
