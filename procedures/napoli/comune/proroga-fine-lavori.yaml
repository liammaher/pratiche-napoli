schema_version: 0
id: napoli/comune/proroga-fine-lavori
title: Proroga del termine di ultimazione lavori del permesso di costruire (art. 15 c. 2 DPR 380/2001) – SUE del Comune di Napoli
headline: "Lavori che non finiscono in tempo: come chiedere la proroga della fine lavori a Napoli"
aka:
  - proroga fine lavori
  - proroga ultimazione lavori
  - proroga ordinaria
updated: 2026-11-04
summary: >-
  I lavori di un permesso di costruire vanno finiti entro il termine del permesso, al massimo tre
  anni dall'inizio. Se non si riesce, il titolare chiede la proroga prima della scadenza: il Comune
  la accorda con un provvedimento motivato per la mole dell'opera, le sue caratteristiche
  tecnico-costruttive, difficoltà emerse dopo l'inizio o fatti estranei alla sua volontà. Senza
  proroga il permesso decade per la parte non eseguita, che richiede un nuovo titolo. A Napoli la
  domanda si presenta allo Sportello Unico per l'Edilizia sul portale "Impresa in un giorno".
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Il termine di ultimazione, entro il quale l'opera deve essere completata, non può superare
        tre anni dall'inizio dei lavori; decorso, il permesso decade di diritto per la parte non
        eseguita, tranne che, anteriormente alla scadenza, venga richiesta una proroga (art. 15 c. 2
        DPR 380/2001).
      status: verified
      source: dpr380-art15
    - text: >-
        La proroga può essere accordata, con provvedimento motivato, per fatti sopravvenuti estranei
        alla volontà del titolare, in considerazione della mole dell'opera, delle sue particolari
        caratteristiche tecnico-costruttive o di difficoltà tecnico-esecutive emerse dopo l'inizio
        dei lavori, o per opere pubbliche finanziate in più esercizi (art. 15 c. 2); è comunque
        accordata se i lavori non possono essere conclusi per iniziative dell'amministrazione o
        dell'autorità giudiziaria rivelatesi infondate (c. 2-bis).
      status: verified
      source: dpr380-art15
    - text: >-
        La parte non ultimata nel termine richiede un nuovo permesso per le opere ancora da eseguire,
        salvo che rientrino tra quelle realizzabili con SCIA, e si ricalcola, se necessario, il
        contributo di costruzione (art. 15 c. 3).
      status: verified
      source: dpr380-art15
    - text: >-
        Sul SUE di Napoli l'operazione "Proroga fine lavori" (gruppo Altri adempimenti edilizi) è il
        "Provvedimento di proroga del termine di ultimazione lavori": chiede il tipo di lavori, gli
        estremi del permesso di costruire (o della DIA), i dati catastali, l'oggetto,
        l'intestatario, la data entro cui i lavori dovrebbero finire e quella prevista, e le
        dichiarazioni sui diritti di segreteria e sull'imposta di bollo.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        La pagina del Comune indica, per la proroga ordinaria dovuta alla mole o alle
        caratteristiche dell'opera, la procedura del permesso di costruire; per la proroga
        straordinaria dell'art. 10-septies basta una comunicazione.
      status: verified
      source: proroga-pagina
legal_basis:
  - text: "D.P.R. 380/2001, art. 15 c. 2, 2-bis e 3."
    status: verified
    source: dpr380-art15
deadline:
  summary:
    text: Prima della scadenza del termine di ultimazione indicato nel permesso.
    status: verified
    source: dpr380-art15
cost:
  text: >-
    Diritti d'istruttoria di 501,00 euro (riga SUE 11 della tabella: "Rinnovi, varianti, proroghe e
    volture di permessi di costruire rilasciati"), più l'imposta di bollo che il portale chiede di
    dichiarare assolta (importo non indicato dalle fonti lette). A parte c'è il compenso del tecnico.
  status: verified
  source: tabella-diritti
