steps:
  - do: Firmare la procura speciale se la domanda la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Verificare con il tecnico se basta la proroga straordinaria dell'art. 10-septies o serve
      quella ordinaria, e motivare la richiesta (mole dell'opera, difficoltà emerse, fatti estranei
      alla volontà del titolare) con la nuova data di fine lavori
    who: professional
  - do: Pagare i diritti d'istruttoria (501,00 euro) e l'imposta di bollo, e allegarne la ricevuta
    who: owner
    human_only: true
  - do: >-
      Prima della scadenza, accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli),
      scegliere l'operazione "Proroga fine lavori", compilare, allegare i documenti firmati
      digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
  - do: Attendere il provvedimento motivato del Comune
    who: office
