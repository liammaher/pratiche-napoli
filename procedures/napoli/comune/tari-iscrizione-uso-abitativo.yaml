verification:
  level: L1
  date: 2026-10-25
  by: liam
  method: >-
    Desk: letti il Mod. 1 (versione pubblicata il 2026-10-25), la pagina della modulistica, la
    pagina TARI 2026 e gli artt. 25, 26 e 35 del regolamento approvato con la delibera C.C.
    37/2023.
run_log:
  - date: 2026-10-25
    note: >-
      Primo uso su un caso reale (modulo preparato, non ancora inviato). Termine della
      dichiarazione ancora da verificare.
  - date: 2026-10-25
    note: >-
      Ricontrollato sul Mod. 1 pubblicato e sul regolamento 2023: termine confermato (90 giorni);
      il modulo attuale riporta già il nuovo link del simulatore; campi rifatti sul modulo reale
      (indirizzo su una riga, aggiunta la sezione box/cantina).
