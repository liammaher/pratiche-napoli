schema_version: 0
id: napoli/comune/tari-iscrizione-uso-abitativo
title: TARI – nuova iscrizione per uso abitativo (Comune di Napoli)
summary: >-
  Chi inizia a occupare o detenere un'abitazione a Napoli (proprietario, inquilino o altro)
  deve presentare la dichiarazione TARI con il Mod. 1 entro 90 giorni. La dichiarazione vale
  anche per gli anni successivi finché non cambia qualcosa (variazione o cessazione).
ente:
  name: Comune di Napoli
  office: Area Entrate – Servizio IMU e TARI
  ipa: c_f839
applies_to:
  events: [home, move]
  audience: [resident]
  conditions:
    - text: Inizio dell'occupazione o detenzione, a qualsiasi titolo, di un'abitazione nel Comune di Napoli.
      status: verified
      source: mod-1
    - text: >-
        La dichiarazione spetta all'intestatario della scheda di famiglia; per chi non è iscritto
        all'anagrafe di Napoli, all'occupante (art. 25, c. 3).
      status: verified
      source: regolamento-2023
legal_basis:
  - text: Regolamento TARI del Comune di Napoli, artt. 25 (obbligo) e 26 (contenuto e presentazione).
    status: verified
    source: regolamento-2023
deadline:
  rules:
    - text: >-
        Entro 90 giorni dalla data di inizio dell'occupazione o detenzione, o dalla variazione dei
        dati dichiarati (art. 25, c. 5).
      status: verified
      source: regolamento-2023
  lateness:
    text: >-
      Per l'omessa dichiarazione il regolamento prevede una sanzione sul primo anno d'imposta dal
      100% (un anno) al 200% (più di due anni) del tributo, minimo 50 euro (art. 35, c. 3). Farsi
      calcolare l'importo dall'ufficio: norme nazionali successive possono averlo modificato.
    status: verified
    source: regolamento-2023
channels:
  - type: pec
    address: entrate.tari-tares-tarsu@pec.comune.napoli.it
    receipt: legal
    preferred: true
    source: mod-1
    notes: Preferibile per chi ha una PEC, perché dà una ricevuta con valore legale.
  - type: portal
    name: POTESs – Servizi Tributari
    url: https://servizionline.comune.napoli.it/web/napoli/servizi-tributari
    auth: [spid, cie, cns]
    source: modulistica
  - type: email
    address: entrate.tari-tares-tarsu@comune.napoli.it
    receipt: informal
    source: mod-1
  - type: post
    address: Comune di Napoli, Area Entrate, Servizio IMU e TARI, Via Diocleziano 330, 80125 Napoli
    source: mod-1
    notes: Raccomandata A/R.
  - type: desk
    name: Sportelli URP delle Municipalità
    source: modulistica
    notes: Per le utenze domestiche; la pagina non indica gli indirizzi.
  - type: desk
    name: Sportello TARI
    address: Via Diocleziano 330, 80125 Napoli
    hours: lunedì–venerdì 8:30–12:30
    source: mod-1
  - type: phone
    address: 081 795 3711
    hours: 9:00–13:00 (orario indicato sul modulo)
    source: mod-1
    notes: >-
      Un appuntamento telefonico o via mail con un operatore si prenota su
      https://servizionline.comune.napoli.it/web/napoli/tributi
payment:
  method: f24
  codice_ente: F839
  codici_tributo: ["3944", "TEFA"]
  rateazione: 0101 (unica soluzione)
  calculator_url: https://portaletributi.comune.napoli.it/?ente=NAPO
  schedule:
    - { label: Acconto 2026 – rata 1, due: 2026-09-30, source: tari-2026, status: verified }
    - { label: Acconto 2026 – unica soluzione, due: 2026-10-15, source: tari-2026, status: verified }
    - { label: Acconto 2026 – rata 2, due: 2026-10-30, source: tari-2026, status: verified }
    - { label: Acconto 2026 – rata 3, due: 2026-11-30, source: tari-2026, status: verified }
    - { label: Saldo 2026 (nuovo avviso del Comune), due: 2027-02-16, source: tari-2026, status: verified }
  notes:
    - text: >-
        Codice ente F839 (codice catastale di Napoli), codici tributo 3944 (TARI) e TEFA,
        rateazione 0101: non riportati nella pagina TARI 2026; controllarli sull'avviso o con il
        simulatore del Comune.
      status: unverified
    - text: L'acconto è il 75% dell'importo calcolato con le tariffe 2025; il saldo usa le tariffe 2026.
      status: verified
      source: tari-2026
    - text: >-
        Il pagamento è in autoliquidazione: è dovuto alle scadenze anche senza avviso, quindi un
        nuovo occupante che non ha ricevuto nulla deve comunque la rata 2026.
      status: verified
      source: mod-1
documents:
  - name: Mod. 1 TARI compilato e firmato
    required: true
  - name: Copia di un documento d'identità valido (per esempio CIE o passaporto)
    required: true
    notes: Art. 38 DPR 445/2000.
  - name: Visura catastale
    required: false
    notes: Utile se non si conoscono i dati catastali dell'abitazione.
forms:
  - id: mod-1
    name: Mod. 1 TARI – Nuova iscrizione uso abitativo
    url: https://static-www.comune.napoli.it/wp-content/uploads/2020/09/MOD-1-ISCRIZIONE-USO-ABITATIVO.pdf
    source: mod-1
    sha256: 2950daa429f5cfd2e19b03792cf4245638f32c3e8267b55e975443145eb8a218
    signature_required: true
    fields:
      - { label: Il/La sottoscritto/a, map: { concat: [identity.last_name, identity.first_name] } }
      - { label: nato/a a, map: { direct: identity.birth_comune } }
      - { label: nato/a a (stato estero), map: { direct: identity.birth_country } }
      - { label: il, map: { direct: identity.date_of_birth } }
      - { label: C.F., map: { direct: identity.codice_fiscale } }
      - { label: residente in, map: { direct: residenza.comune } }
      - { label: Via, map: { direct: residenza.indirizzo } }
      - { label: n°, map: { direct: residenza.civico } }
      - { label: Telefono, map: { direct: identity.phone } }
      - { label: e-mail, map: { direct: identity.email } }
      - { label: pec, map: { direct: identity.pec } }
      - { label: a decorrere dal, map: { direct: abitazione.data_inizio } }
      - label: qualità di (proprietario / possessore / locatario / altro)
        map: { direct: abitazione.titolo }
        notes: >-
          "possessore" non è tra i valori dell'abitazione nel registro: scegliere la voce che
          corrisponde al titolo reale.
      - label: Appartamento sito in via
        map: { fallback: [domicilio.indirizzo, residenza.indirizzo] }
        notes: >-
          Una sola riga per l'indirizzo: aggiungere civico, interno e piano (domicilio.civico,
          domicilio.interno o residenza.*, abitazione.piano) dello stesso indirizzo scelto per la
          via, il domicilio se esiste, altrimenti la residenza. Non mescolare i due.
      - { label: Sez., map: { direct: abitazione.catasto_sezione } }
      - { label: Foglio, map: { direct: abitazione.catasto_foglio } }
      - { label: Part., map: { direct: abitazione.catasto_particella } }
      - { label: Sub., map: { direct: abitazione.catasto_subalterno } }
      - { label: Superficie calpestabile in mq, map: { direct: abitazione.superficie_calpestabile_mq } }
      - label: Autorimessa/cantinola/posto auto (via, dati catastali, superficie, pertinenza)
        map: { ask: "Dati del box, cantina o posto auto, se c'è; indicare se è pertinenza dell'abitazione" }
      - label: Conviventi (nominativo, luogo e data di nascita, rapporto, codice fiscale)
        map: { repeat: nucleo_familiare.membro<N>_* }
      - label: Richiesta di riduzione del 40% "Uso stagionale"
        map: { ask: "Seconda casa tenuta a disposizione, con già una posizione TARI per l'abitazione principale?" }
      - { label: Eventuali note, map: { ask: Note facoltative per l'ufficio } }
      - label: Cod.Contr.
        map: { blank_with_reason: Spazio riservato all'ufficio; il codice contribuente lo assegna il Comune. }
steps:
  - { do: "Verificare se un Mod. 1 è già stato compilato, firmato o inviato", who: anyone }
  - { do: Compilare il Mod. 1 (dati dalla tabella dei campi), who: anyone }
  - { do: Firmare il modulo, who: owner, human_only: true }
  - do: Inviare modulo firmato e copia del documento, preferibilmente via PEC
    who: owner
    human_only: true
  - { do: Calcolare l'F24 con il simulatore del Comune o usare l'avviso di pagamento, who: anyone }
  - { do: Pagare l'F24 alle scadenze, who: owner, human_only: true }
  - { do: Annotare il codice contribuente quando il Comune lo comunica, who: owner }
after:
  - Conservare la ricevuta della PEC o l'email inviata.
  - >-
    Il Comune risponde (o arriva un avviso) con il codice contribuente: annotarlo insieme a data
    e protocollo della dichiarazione.
  - >-
    Controllare che superficie tassata e numero di componenti dell'avviso corrispondano alla
    superficie calpestabile e al nucleo familiare dichiarati.
pitfalls:
  - text: >-
      La riduzione del 40% per "uso stagionale" vale solo per un'abitazione tenuta a disposizione
      quando si è già titolari di un'altra posizione TARI per l'abitazione principale.
    status: verified
    source: mod-1
  - text: >-
      Un convivente senza codice fiscale italiano è stato indicato come "N/E"; il Comune non ha
      confermato che sia accettato.
    status: unverified
  - text: >-
      Il regolamento (art. 26) indica ancora il portale "Linkmate" per presentare le
      dichiarazioni.
    status: verified
    source: regolamento-2023
  - text: La pagina della modulistica indica invece il portale POTESs (Servizi Tributari).
    status: verified
    source: modulistica
  - text: >-
      La pagina della modulistica segnala una chiusura temporanea degli sportelli informativi di
      Via Diocleziano 330, senza date: verificare prima di andarci.
    status: verified
    source: modulistica
related: []
