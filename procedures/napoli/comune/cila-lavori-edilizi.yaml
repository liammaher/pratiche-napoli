schema_version: 0
id: napoli/comune/cila-lavori-edilizi
title: CILA – comunicazione di inizio lavori asseverata per lavori interni non strutturali (SUE del Comune di Napoli)
headline: "CILA a Napoli per lavori interni in casa, negozio o ufficio: come si presenta"
aka:
  - ristrutturazione interna
  - pratica edilizia
  - permesso per lavori in casa
  - spostare tramezzi
updated: 2026-10-26
summary: >-
  Chi vuole fare a Napoli lavori interni che non toccano le strutture (per esempio spostare
  tramezzi, rifare bagni e impianti in un negozio, un ufficio o una casa) deve presentare prima
  dell'inizio dei lavori una CILA allo Sportello Unico per l'Edilizia (SUE). La presenta online
  un tecnico abilitato (architetto, ingegnere, geometra…) per conto del proprietario o di chi ha
  titolo, di solito con procura speciale. Dal 6 luglio 2026 l'unico canale è il portale
  "Impresa in un giorno".
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Servono la CILA i lavori che non rientrano nell'edilizia libera (art. 6), nel permesso di
        costruire (art. 10) o nella SCIA (art. 22 del DPR 380/2001). Il tecnico assevera tra
        l'altro che non vi è interessamento delle parti strutturali dell'edificio.
      status: verified
      source: dpr380-art6bis
    - text: >-
        Rientrano nella CILA, tra gli altri: la manutenzione straordinaria (compresa l'apertura di
        porte interne o lo spostamento di pareti interne) e il restauro e risanamento conservativo,
        sempre che non riguardino le parti strutturali dell'edificio.
      status: verified
      source: cila-note
    - text: >-
        La manutenzione ordinaria (riparazione, rinnovamento e sostituzione delle finiture, opere
        per mantenere in efficienza gli impianti esistenti) è edilizia libera e non richiede la
        CILA.
      status: verified
      source: dpr380-art6
    - text: >-
        La manutenzione straordinaria non può alterare la volumetria complessiva né comportare
        mutamenti urbanisticamente rilevanti della destinazione d'uso con aumento del carico
        urbanistico.
      status: verified
      source: dpr380-art3
    - text: >-
        Il cambio di destinazione d'uso tra categorie funzionali (residenziale, turistico-ricettiva,
        produttiva e direzionale, commerciale, rurale) è un mutamento rilevante con regole proprie
        (art. 23-ter DPR 380/2001): la relazione della CILA deve dichiarare che non c'è modifica
        della categoria d'uso urbanisticamente rilevante.
      status: verified
      source: cila-note
    - text: >-
        La CILA la presenta il proprietario dell'immobile o chi ne ha titolo (per esempio
        comproprietario, usufruttuario, amministratore di condominio); un inquilino dichiara di non
        avere titolarità esclusiva e di disporre dell'assenso dei terzi titolari.
      status: verified
      source: cila-modulo
    - text: >-
        Lavori su parti strutturali: la CILA non basta. Non è stato controllato su Normattiva quale
        titolo serva (di norma SCIA, art. 22, più gli adempimenti sismici).
      status: unverified
legal_basis:
  - text: "D.P.R. 380/2001, art. 6-bis (CILA), art. 3 c. 1 (definizioni degli interventi), art. 6 (edilizia libera)."
    status: verified
    source: dpr380-art6bis
  - text: "D.Lgs. 222/2016, Tabella A, Sezione II – Edilizia (attività soggette a CILA), richiamata dal modulo."
    status: verified
    source: cila-modulo
  - text: >-
        Modulistica unificata nazionale (Accordo Conferenza Unificata 27/03/2025, rep. 35/CU),
        approvata dalla Regione Campania con Decreto Dirigenziale n. 217 del 16 giugno 2025 e
        adottata dal SUE di Napoli con Disposizione Dirigenziale n. 603 del 23 giugno 2025.
    status: verified
    source: dd-603-2025
  - text: >-
        Disposizione Dirigenziale SUE n. 501 del 23 giugno 2026: attivazione del SUE su
        impresainungiorno e Linee guida vincolanti per la presentazione delle istanze.
    status: verified
    source: dd-501-2026
  - text: "D.Lgs. 42/2004, art. 21 c. 4 (lavori su beni culturali) e art. 149 (interventi esenti da autorizzazione paesaggistica)."
    status: verified
    source: dlgs42-art21
deadline:
  summary:
    text: >-
      Prima di iniziare i lavori; se con la CILA si chiedono atti di assenso di altri enti, si
      inizia solo quando lo Sportello comunica di averli acquisiti. A fine lavori, se serve,
      l'aggiornamento catastale entro 30 giorni.
    status: verified
    source: dpr380-art6bis
  rules:
    - text: >-
        La CILA si presenta prima di iniziare i lavori ("previa comunicazione"); nel modulo si
        indica la data di inizio dei lavori.
      status: verified
      source: dpr380-art6bis
    - text: >-
        Se servono atti di assenso di altri enti (per esempio Soprintendenza o autorizzazione
        paesaggistica) chiesti insieme alla CILA, i lavori possono iniziare solo dopo che lo
        Sportello comunica di averli acquisiti.
      status: verified
      source: cila-modulo
    - text: >-
        A fine lavori, quando serve, l'aggiornamento catastale va presentato entro trenta giorni
        (art. 34-quinquies, c. 2, lett. b, D.L. 4/2006).
      status: verified
      source: cila-note
  lateness:
    text: >-
      DPR 380/2001, art. 6-bis, c. 5: "La mancata comunicazione asseverata dell'inizio dei lavori
      comporta la sanzione pecuniaria pari a 1.000 euro. Tale sanzione è ridotta di due terzi se la
      comunicazione è effettuata spontaneamente quando l'intervento è in corso di esecuzione." Il
      modulo del Comune indica le ricevute da allegare (casella d.2, lavori in corso; casella d.3,
      lavori già realizzati). Per la "mancata CILA" il SUE chiede anche diritti di segreteria
      propri (riga SUE 15 della tabella). Per l'importo esatto e il canale (vedi pitfalls) chiedere
      al SUE.
    status: verified
    source: dpr380-art6bis
cost:
  text: >-
    Diritti di segreteria di 151,00 euro (riga SUE 13 della tabella), da versare prima di
    presentare la pratica. Di norma la CILA non paga il contributo di costruzione, salvo che i
    lavori aumentino il carico urbanistico; le fonti non indicano marche da bollo. A parte c'è il
    compenso del tecnico.
  status: verified
  source: tabella-diritti
duration:
  text: >-
    La CILA non attende un'approvazione: i lavori iniziano alla data indicata nel modulo, dopo la
    presentazione. Se con la CILA si chiedono atti di assenso di altri enti (per esempio della
    Soprintendenza), si inizia solo quando lo Sportello Unico comunica di averli acquisiti.
  status: verified
  source: cila-modulo
appointment:
  text: >-
    Non serve: la CILA la presenta il tecnico, solo online su Impresa in un giorno. Per
    informazioni il Servizio Sportello Unico Edilizia riceve il pubblico il mercoledì
    10:00–13:00 (rubrica del 15/06/2026), senza indicare un appuntamento.
  status: verified
  source: sue-contatti
channels:
  - type: portal
    purpose: procedure
    name: Impresa in un giorno – Sportello Unico Edilizia del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/route/suap?codComune=F839&locale=IT&tipoSportello=E
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: potess-sue
    notes: >-
      Unico canale per le CILA dal 6 luglio 2026; le istanze presentate in altro modo sono
      dichiarate improcedibili o irricevibili. Il servizio è per professionisti: il modulo si
      compila online e tutti i documenti e gli allegati vanno firmati digitalmente. L'indirizzo è
      quello a cui porta il pulsante "Accedi al Servizio" della scheda POTESs; la pagina "Edilizia
      Privata" del Comune dice ancora che il link "verrà successivamente fornito".
  - type: desk
    purpose: info
    name: Servizio Sportello Unico Edilizia
    address: Piazza Dante 79, IV piano, 80135 Napoli
    hours: ricevimento del pubblico il mercoledì, 10:00–13:00
    source: sue-ufficio
    notes: >-
      Informazioni e accesso agli atti; la CILA non si consegna allo sportello. Orario dalla
      rubrica del SUE aggiornata al 15/06/2026; piano dalla scheda POTESs.
  - type: email
    purpose: info
    address: sportello.unico.edilizia@comune.napoli.it
    receipt: informal
    source: sue-ufficio
    notes: Solo per informazioni.
  - type: pec
    purpose: info
    address: sportello.unico.edilizia@pec.comune.napoli.it
    receipt: legal
    source: sue-ufficio
    notes: >-
      Per comunicare con l'ufficio, non per presentare la CILA: dal 6 luglio 2026 le pratiche via
      PEC sono irricevibili (DD 501/2026).
  - type: phone
    purpose: info
    address: 081 7953384
    source: sue-ufficio
    notes: Segreteria del Servizio (anche 081 7958216). Rubrica interna completa nel PDF dei contatti.
payment:
  method: bollettino
  notes:
    - text: >-
        Diritti di segreteria per la CILA ("Comunicazione di inizio lavori con asseverazione
        tecnica"): 151,00 euro (riga SUE 13 della tabella aggiornata al 16/06/2026). Per la
        mancata CILA: 166,00 euro (riga SUE 15).
      status: verified
      source: tabella-diritti
    - text: >-
        I diritti di segreteria si pagano unicamente sul conto corrente postale n. 57060964
        intestato a Comune di Napoli – Servizio Tesoreria Edilizia Privata; pagamenti fatti in altro
        modo rendono l'istanza irricevibile.
      status: verified
      source: costi
    - text: >-
        Contributo di costruzione, oneri e sanzioni si pagano con bonifico sull'IBAN del Comune
        indicato nella pagina Costi (non riportato qui: copiarlo dalla pagina al momento del
        pagamento; la scheda POTESs mostra anche un IBAN precedente).
      status: verified
      source: costi
    - text: >-
        I pagamenti si fanno prima di presentare la pratica e l'attestazione del versamento va
        allegata.
      status: verified
      source: dd-501-2026
    - text: >-
        Causale: la pagina Costi (aggiornata al 30/06/2026) indica il codice N1051_SUE ("Il codice
        N1055_SUE è sostituito dal seguente: N1051"), seguito da tipo pratica, identificativo e
        anno, oppure, se la pratica non ha ancora un identificativo, da nome del titolare e
        indirizzo dell'immobile. La scheda del servizio su POTESs indica ancora N1055_SUE.
      status: disputed
      source: costi
    - text: >-
        La CILA è di norma gratuita. Diventa onerosa (contributo commisurato alle sole opere di
        urbanizzazione) se la manutenzione straordinaria comporta aumento del carico urbanistico e
        della superficie calpestabile: in quel caso il tecnico allega il prospetto di calcolo.
      status: verified
      source: cila-modulo
    - text: Non risulta dalle fonti lette se il portale offra il pagamento pagoPA per il SUE di Napoli.
      status: unverified
documents:
  - name: CILA compilata sul portale, firmata digitalmente da titolare e progettista
    required: true
    notes: Il portale genera il modulo dai dati inseriti; il tracciato è quello del Mod.CILA-23-06-2025 mappato sotto.
  - name: Allegato "Soggetti coinvolti" (titolari, tecnici incaricati, imprese esecutrici)
    required: true
  - name: Procura speciale/delega al tecnico, firmata digitalmente
    required: false
    notes: >-
      Obbligatoria se la pratica è presentata da una persona diversa dal titolare: senza procura,
      o con procura non firmata digitalmente, la pratica è irricevibile (Linee guida DD 501/2026).
  - name: Ricevuta del versamento dei diritti di segreteria (bollettino postale)
    required: true
  - name: Allegato A Programma 100 – dichiarazione sostitutiva sulla regolarità tributaria verso il Comune di Napoli
    required: true
    notes: Con copia del documento d'identità.
  - name: Modello DP – dichiarazione di pagamento del professionista (L.R. Campania 59/2018)
    required: true
    notes: >-
      Firmato dal tecnico e dal committente, con copia firmata dei documenti d'identità di entrambi
      e lettera d'incarico o contratto. Senza, l'iter non si completa.
  - name: Elaborati grafici dello stato di fatto, di progetto e dello stato comparativo, in PDF/A
    required: true
    notes: >-
      Massimo 20 MB per file, nomi senza spazi né accenti; nello stato comparativo giallo per le
      demolizioni e rosso per le nuove opere (Linee guida).
  - name: Relazione tecnica e documentazione fotografica a colori con coni ottici
    required: true
  - name: Copia del documento d'identità del titolare e/o del tecnico
    required: false
    notes: Solo se i soggetti coinvolti non hanno firmato digitalmente e non c'è procura.
  - name: Dichiarazione di assenso dei terzi titolari di altri diritti
    required: false
    notes: Se il titolare non ha titolarità esclusiva (per esempio inquilino).
  - name: Notifica preliminare (art. 99 D.Lgs. 81/2008)
    required: false
    notes: Se il cantiere vi è soggetto.
  - name: Atti di assenso già ottenuti, o documentazione per farli acquisire dal SUE
    required: false
    notes: Per esempio autorizzazione della Soprintendenza o autorizzazione paesaggistica.
  - name: Attestazione della corrispondenza dell'unità edilizia al tipo edilizio della Variante generale al PRG
    required: false
    notes: Solo nel centro storico (zona A), firmata dal professionista (art. 63, c. 4 delle norme della Variante).
  - name: Prospetto di calcolo del contributo di costruzione e ricevuta del versamento
    required: false
    notes: Solo se l'intervento è oneroso.
dichiarante:
  ruolo: [titolare, legale_rappresentante]
forms:
  - id: mod-cila-2025
    name: Mod.CILA-23-06-2025 – Comunicazione inizio lavori asseverata (modello unificato adottato dal SUE di Napoli)
    url: https://static-www.comune.napoli.it/wp-content/uploads/2010/06/CILA_23.06.25-1.pdf
    source: cila-modulo
    sha256: a8a62c2d85fa679281b16159808e8ae6c21481235a8547f51c91bd3c613d2227
    signature_required: true
    fields:
      # Intestazione
      - label: "Al Comune di Napoli – SUAP / SUE (casella)"
        map: { ask: "La CILA va al SUE (solo lavori) o al SUAP (lavori collegati all'avvio o alla modifica di un'attività)? Risponde il tecnico." }
      - label: "Al Comune di Napoli – Indirizzo, PEC / Posta elettronica"
        map: { blank_with_reason: "Recapiti dello sportello destinatario, non del dichiarante; sul portale li inserisce il sistema o il tecnico." }
      - label: "Pratica edilizia, del, Protocollo, tipo (CILA / CILA con altre comunicazioni o SCIA / CILA con richiesta contestuale di atti presupposti)"
        map: { blank_with_reason: "Da compilare a cura del SUE/SUAP." }
      # Dati del titolare
      - { label: Dati del titolare – Cognome e Nome, map: { concat: [identity.last_name, identity.first_name] } }
      - { label: Dati del titolare – codice fiscale, map: { direct: identity.codice_fiscale } }
      - { label: Dati del titolare – sesso, map: { direct: identity.sex } }
      - { label: Dati del titolare – nato a, map: { direct: identity.birth_comune } }
      - { label: Dati del titolare – prov. (nascita), map: { direct: identity.birth_province } }
      - { label: Dati del titolare – stato (nascita), map: { direct: identity.birth_country }, notes: "Solo se nato all'estero; altrimenti Italia." }
      - { label: Dati del titolare – nato il, map: { direct: identity.date_of_birth } }
      - { label: Dati del titolare – residente in, map: { direct: residenza.comune } }
      - { label: Dati del titolare – prov. (residenza), map: { direct: residenza.provincia } }
      - { label: Dati del titolare – Stato (residenza), map: { direct: residenza.stato }, notes: "Vuoto nel vault vuol dire Italia: scrivere Italia." }
      - { label: Dati del titolare – indirizzo, map: { direct: residenza.indirizzo } }
      - { label: Dati del titolare – n., map: { direct: residenza.civico } }
      - { label: Dati del titolare – C.A.P., map: { direct: residenza.cap } }
      - { label: Dati del titolare – PEC / posta elettronica, map: { fallback: [identity.pec, identity.email] } }
      - { label: Dati del titolare – Telefono fisso / cellulare, map: { direct: identity.phone } }
      # Dati della ditta o società (eventuale)
      - label: Dati della ditta o società – in qualità di
        map:
          ask: >-
            Il titolare presenta la CILA per un'impresa o una società (lavori nei suoi locali o sui
            suoi immobili)? Se sì, in che qualità (titolare, legale rappresentante); se no, questa
            sezione resta vuota
        notes: >-
          Va chiesto anche quando l'archivio ha i dati di un'impresa: i lavori sulla propria casa di
          chi ha un'impresa non sono dell'impresa. Se sì, la qualità è business.qualita_dichiarante
          o, in un archivio d'impresa, quella tra titolare e legale rappresentante che è nel ruolo.tipo
          del firmatario, mai l'elenco intero.
      - { label: Dati della ditta o società – della ditta / società, map: { direct: business.denominazione }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – codice fiscale / p. IVA, map: { fallback: [business.codice_fiscale, business.partita_iva] }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – Iscritta alla C.C.I.A.A. di, map: { direct: business.cciaa }, notes: "Il nome della Camera di commercio: per la sigla NA, Napoli; se business.cciaa manca, è la sigla davanti al numero REA (business.rea). Solo se il titolare agisce per un'impresa; altrimenti vuoto." }
      - { label: Dati della ditta o società – prov. (C.C.I.A.A.), map: { direct: business.cciaa }, notes: "La sigla (per esempio NA); se manca, quella davanti al numero REA, mai il numero. Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – n. (iscrizione), map: { direct: business.rea }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – con sede in, map: { direct: business.sede_legale_comune }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – prov. (sede), map: { direct: business.sede_legale_provincia }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – indirizzo, map: { concat: [business.sede_legale_indirizzo, business.sede_legale_civico] }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – PEC / posta elettronica, map: { fallback: [business.pec, business.email] }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – C.A.P., map: { direct: business.sede_legale_cap }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      - { label: Dati della ditta o società – Telefono fisso / cellulare, map: { direct: business.telefono }, notes: "Solo se il titolare agisce per un'impresa (riga «in qualità di»); altrimenti vuoto." }
      # Dati del procuratore/delegato (in caso di procura)
      - { label: Dati del procuratore/delegato – Cognome, map: { blank_with_reason: "Dati del procuratore (di solito il tecnico incaricato), non del titolare: li inserisce il procuratore." } }
      - { label: Dati del procuratore/delegato – Nome, map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      - { label: Dati del procuratore/delegato – codice fiscale, map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      - { label: Dati del procuratore/delegato – sesso, map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      - { label: "Dati del procuratore/delegato – Nato/a a, prov., Stato", map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      - { label: Dati del procuratore/delegato – il (data di nascita), map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      - { label: "Dati del procuratore/delegato – residente in, prov., Stato", map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      - { label: "Dati del procuratore/delegato – indirizzo, n., C.A.P.", map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      - { label: Dati del procuratore/delegato – PEC / posta elettronica, map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      - { label: Dati del procuratore/delegato – Telefono fisso / cellulare, map: { blank_with_reason: Dati del procuratore; li inserisce il procuratore. } }
      # Dichiarazioni del titolare
      - label: "a) di avere titolo alla presentazione di questa pratica edilizia in quanto … dell'immobile"
        map: { ask: "A che titolo il titolare ha l'immobile dei lavori: proprietario, comproprietario, usufruttuario, locatario, amministratore di condominio…?" }
        notes: >-
          Per i locali dell'impresa è locale.titolo; per la propria casa abitazione.titolo
          (proprietario, locatario…). Mai il titolo sui locali di un'impresa per lavori a casa, o
          viceversa.
      - label: "a.1 titolarità esclusiva / a.2 non esclusiva ma con assenso dei terzi titolari"
        map: { ask: "Il titolare ha titolarità esclusiva all'esecuzione dei lavori, o (per esempio inquilino o comproprietario) dispone dell'assenso scritto degli altri titolari?" }
      - label: "b) Opere su parti comuni o modifiche esterne – b.1 non riguardano parti comuni / b.2 parti comuni di un condominio / b.3 parti comuni di un fabbricato non in condominio, con assenso dei comproprietari / b.4 parti comuni senza assenso (art. 1102 c.c.)"
        map: { ask: "I lavori toccano parti comuni dell'edificio? Se sì, c'è un condominio con delibera dell'assemblea, o l'assenso firmato dei comproprietari? Risponde il tecnico." }
      - label: "c) c.1 non servono altri atti / c.2 si allegano altre comunicazioni o SCIA / c.3 si chiede contestualmente l'acquisizione d'ufficio degli atti di assenso"
        map: { ask: "Servono altri atti di assenso, comunicazioni o SCIA (per esempio Soprintendenza, autorizzazione paesaggistica)? Risponde il tecnico." }
      - label: "d) Qualificazione – d.1 intervento da eseguire / d.2 intervento in corso (art. 6-bis c. 5, ricevuta di 333,00 euro, procedura telematica) / d.3 intervento già realizzato (art. 6-bis c. 5, ricevuta di 1000,00 euro, procedura cartacea)"
        map: { ask: "I lavori devono ancora iniziare, sono già in corso o sono già finiti?" }
