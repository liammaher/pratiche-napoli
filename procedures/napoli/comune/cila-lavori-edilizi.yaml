  method: >-
    Desk: lette le pagine del Comune di Napoli Edilizia Privata (avvisi 11/02-01/07/2026), CILA,
    Documentazione, Costi, Controlli a campione, la scheda dell'ufficio SUE e la scheda POTESs "SUE
    – Piattaforma Impresa In Un Giorno" (con il link di accesso), il comunicato del Comune e quello
    della Camera di Commercio del 02/07/2026; la DD 501/2026 con le Linee guida, la DD 603/2025
    (testo), il Mod.CILA-23-06-2025 e le note illustrative, la tabella diritti SUE 2026, la rubrica
    SUE, l'Allegato A Programma 100 e il Modello DP; su Normattiva DPR 380/2001 artt. 3, 6, 6-bis,
    23-ter e D.Lgs. 42/2004 artt. 21 e 149.
