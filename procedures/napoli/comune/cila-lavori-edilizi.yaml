        map: { ask: "Tipologia dell'intervento ai sensi dell'art. 6-bis (di norma 1, manutenzione straordinaria non strutturale). Risponde il tecnico." }
      - { label: "1) e che consistono in (descrizione sintetica delle opere)", map: { ask: "Descrizione sintetica dei lavori (risponde il tecnico, partendo da cosa vuole fare il titolare)" } }
      - label: "2) Dichiarazione di tolleranze (2.1–2.5, art. 34-bis e 34-ter) e rilevanza sismica (2.6, 2.7 e sottocaselle)"
        map: { ask: "L'immobile presenta tolleranze costruttive da dichiarare, e con quale rilevanza sismica? Risponde il tecnico." }
      - { label: "3) Altre comunicazioni, segnalazioni, asseverazioni – tabella (comunicazioni / autorità competente)", map: { ask: "Altre comunicazioni o segnalazioni presentate con la CILA e autorità competente (risponde il tecnico)" } }
