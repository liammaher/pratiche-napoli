    Non aperti: il portale impresainungiorno dopo l'accesso (serve SPID), il testo del DD Regione
    Campania 217/2025 e dell'Accordo CU 35/CU (citati tramite la DD 603/2025), le norme della
    Variante generale al PRG, la DCC 129/2026, il Piano di gestione UNESCO, la modulistica della
    Soprintendenza. Il modulo mappato è quello pubblicato dal Comune; sul portale la pratica si
    compila online con lo stesso tracciato unificato (non verificato campo per campo).
