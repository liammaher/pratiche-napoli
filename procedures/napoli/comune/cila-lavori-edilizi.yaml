steps:
  - do: >-
      Incaricare un tecnico abilitato (architetto, ingegnere, geometra…) con lettera d'incarico o
      contratto firmato
    who: owner
    human_only: true
  - do: >-
      Verificare con il tecnico che i lavori siano davvero da CILA (non edilizia libera, non
      strutturali, senza cambio di categoria d'uso), lo stato legittimo dell'immobile e gli
      eventuali vincoli (bene culturale, paesaggio, centro storico zona A)
    who: professional
  - do: >-
      Se servono atti di assenso (autorizzazione della Soprintendenza, autorizzazione
      paesaggistica), ottenerli prima o chiederne l'acquisizione con la CILA (casella c.3)
    who: professional
  - do: Procurarsi visura catastale e titoli edilizi precedenti; preparare elaborati PDF/A, relazione e foto secondo le Linee guida
    who: professional
  - do: Compilare l'Allegato A Programma 100 e preparare la procura speciale (dati dalla tabella dei campi)
    who: anyone
  - do: Firmare digitalmente la procura speciale al tecnico, l'Allegato A e il Modello DP (insieme al tecnico)
    who: owner
    human_only: true
  - do: Pagare i diritti di segreteria (151,00 euro) con bollettino sul c/c postale 57060964, con la causale indicata dal Comune
    who: owner
    human_only: true
  - do: >-
      Compilare la CILA su Impresa in un giorno (SUE di Napoli), allegare documenti e ricevuta,
      firmare digitalmente e inviare
    who: professional
    human_only: true
  - do: Conservare la ricevuta di presentazione e annotare numero e data della pratica
    who: owner
  - do: >-
      Prima di iniziare: notifica preliminare e DURC se dovuti, cartello di cantiere visibile dalla
      strada con gli estremi della CILA, eventuale deroga acustica e concessione di suolo pubblico
      per ponteggi o materiali
    who: professional
  - do: >-
      A fine lavori: comunicazione di fine lavori con asseverazione del direttore dei lavori e,
      se serve, aggiornamento catastale entro 30 giorni
    who: professional
    human_only: true
after:
  - Conservare la ricevuta della pratica, la CILA firmata, gli elaborati e la ricevuta dei diritti.
  - >-
    Il SUE controlla a campione il 5% delle CILA presentate nel mese precedente, con sorteggio
    mensile in seduta pubblica: tenere la documentazione pronta.
  - >-
    Se cambiano tecnici o impresa, o per inizio e fine lavori, presentare le comunicazioni previste
    (vedi pitfalls sul canale).
  - >-
    Se i lavori cambiano superficie o destinazione dei locali di un'attività, valutare la
    variazione TARI entro 90 giorni.
pitfalls:
  - text: >-
      La pagina "CILA" del Comune (aggiornata all'11/11/2025) dice ancora di stampare i moduli,
      scansionarli e inviarli con i "servizi online del Comune di Napoli". È superata: dal 6 luglio
      2026 le CILA si presentano solo su Impresa in un giorno, compilando la pratica online (avviso
      del 01/07/2026 e DD 501/2026, che dismette il Portale Metropolitano Multicanale).
    status: verified
    source: ed-privata
  - text: >-
      Mancata CILA (art. 6-bis c. 5): la pagina CILA, le note illustrative e la pagina dei
      controlli a campione (aggiornata al 16/10/2026) dicono di presentarla su carta; il modulo
      dice telematica per i lavori in corso (d.2) e cartacea per quelli realizzati (d.3); l'avviso
      del 01/07/2026 elenca invece anche le CILA dell'art. 6-bis c. 5 tra le pratiche da inoltrare
      solo su Impresa in un giorno. Chiedere al SUE prima di presentarla.
    status: disputed
    source: ed-privata
  - text: >-
      Inizio e fine lavori e variazioni di nominativi: le note illustrative, la scheda POTESs e la
      pagina dell'ufficio indicano il Modello COM via PEC alla Municipalità competente (indirizzi
      municipalitaN.territorio.economia@pec.comune.napoli.it); l'avviso del 01/07/2026 elenca gli
      "Adempimenti edilizi (inizio e fine lavori…)" tra le pratiche solo su Impresa in un giorno, e
      la DD 501/2026 esclude la PEC. Verificare con il SUE il canale in uso.
    status: disputed
    source: cila-note
  - text: >-
      Se serve l'autorizzazione paesaggistica (art. 146 D.Lgs. 42/2004), va ottenuta come
      procedimento autonomo e presupposto prima di inoltrare la CILA.
    status: verified
    source: potess-sue
  - text: >-
      Nessuna autorizzazione paesaggistica serve per manutenzione ordinaria, straordinaria,
      consolidamento statico e restauro conservativo che non alterino lo stato dei luoghi e
      l'aspetto esteriore degli edifici: i lavori solo interni di norma ne sono esenti.
    status: verified
    source: dlgs42-art149
  - text: >-
      Se l'edificio è un bene culturale vincolato (frequente nel centro storico), qualsiasi opera,
      anche interna, richiede l'autorizzazione del soprintendente; il cambio di destinazione d'uso
      va comunicato al soprintendente. Senza, la CILA è inefficace.
    status: verified
    source: dlgs42-art21
  - text: >-
      Nel centro storico (zona A della Variante generale al PRG) va allegata l'attestazione del
      professionista che l'unità edilizia corrisponde al tipo edilizio codificato nelle norme della
      Variante (art. 63, c. 4), da cui dipendono gli interventi ammessi.
    status: verified
    source: cila-note
  - text: >-
      L'iscrizione del centro storico nella lista UNESCO non è, nelle fonti lette, un titolo o un
      vincolo edilizio a sé: contano il vincolo culturale, quello paesaggistico e le norme del PRG
      per la zona A. Non è stato letto il Piano di gestione del sito UNESCO.
    status: unverified
  - text: >-
      Il Comune ha approvato con DCC n. 129 del 15/9/2026 una variante "per la salvaguardia
      dell'offerta abitativa nel centro storico". Se i lavori servono a trasformare un'abitazione in
      negozio, ufficio o altro nel centro storico, verificarla con il tecnico (testo non letto).
    status: verified
    source: ed-privata
  - text: >-
      Frazionare un'unità immobiliare (art. 22 c. 2 della Variante generale al PRG) richiede un
      atto d'obbligo trascritto sulla non ulteriore frazionabilità, da inviare con la fine dei
      lavori.
    status: verified
    source: cila-note
  - text: >-
      Per un cantiere di un'attività commerciale o produttiva in un edificio residenziale, o con
      macchinari rumorosi all'aperto, serve l'autorizzazione in deroga del piano di zonizzazione
      acustica (art. 12, DCC 204/2001), da chiedere al servizio competente prima dei lavori.
    status: verified
    source: cila-note
  - text: >-
      Le pratiche sono irricevibili se moduli, dichiarazioni o procure non sono firmati
      digitalmente, se manca la procura quando presenta un'altra persona, o se i file non sono in
      PDF/A o superano 20 MB.
    status: verified
    source: dd-501-2026
  - text: >-
      Le CILA non conformi agli strumenti urbanistici e alle norme di settore (sismiche,
      antincendio, igienico-sanitarie, energetiche, beni culturali e paesaggio) o prive della
      documentazione essenziale sono inefficaci.
    status: verified
    source: cila-note
  - text: >-
      L'efficacia della CILA è sospesa se mancano, quando previsti, il piano di sicurezza e
      coordinamento, il fascicolo, la notifica preliminare o il DURC.
    status: verified
    source: cila-modulo
  - text: >-
      Se i lavori servono ad aprire o modificare un'attività, il modulo permette di presentare la
      CILA al SUAP invece che al SUE (caselle d.4 e d.5). Non è stato verificato come il SUAP di
      Napoli gestisca su impresainungiorno le CILA collegate a una SCIA d'attività.
    status: unverified
