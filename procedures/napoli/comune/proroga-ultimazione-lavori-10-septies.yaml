schema_version: 0
id: napoli/comune/proroga-ultimazione-lavori-10-septies
title: Comunicazione di proroga del termine di ultimazione lavori (art. 10-septies D.L. 21/2022, L. 51/2022) – SUE del Comune di Napoli
headline: "Proroga straordinaria della fine lavori (10-septies): come comunicarla al SUE di Napoli"
aka:
  - proroga straordinaria
  - proroga 10 septies
  - proroga caro materiali
  - proroga fine lavori
updated: 2026-11-05
summary: >-
  Per i permessi di costruire rilasciati o formati fino al 31 dicembre 2025, e anche per le SCIA,
  la legge proroga di quarantotto mesi i termini di inizio e di ultimazione dei lavori, senza
  domanda né provvedimento: basta comunicare al Comune di volersene avvalere prima che il termine
  scada, se il titolo non contrasta con nuovi strumenti urbanistici o con piani e provvedimenti di
  tutela dei beni culturali o del paesaggio. A Napoli la comunicazione per la fine lavori si
  presenta allo Sportello Unico per l'Edilizia sul portale "Impresa in un giorno".
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Sono prorogati di quarantotto mesi i termini di inizio e di ultimazione dei lavori dell'art.
        15 DPR 380/2001 relativi ai permessi di costruire rilasciati o formatisi fino al 31 dicembre
        2025, purché non siano già decorsi al momento della comunicazione dell'interessato di
        volersi avvalere della proroga e il titolo non risulti in contrasto, a quel momento, con
        nuovi strumenti urbanistici approvati o con piani o provvedimenti di tutela dei beni
        culturali o del paesaggio (art. 10-septies c. 1 a D.L. 21/2022, testo vigente).
      status: verified
      source: dl21-art10septies
    - text: >-
        La stessa proroga vale per i termini delle SCIA, delle autorizzazioni paesaggistiche e delle
        dichiarazioni e autorizzazioni ambientali, e per i permessi e le SCIA già prorogati ai sensi
        dell'art. 15 c. 2 DPR 380/2001, dell'art. 10 c. 4 D.L. 76/2020 o dell'art. 103 c. 2 D.L.
        18/2020 (art. 10-septies c. 1 a).
      status: verified
      source: dl21-art10septies
    - text: >-
        La durata è stata portata da uno a due anni (D.L. 198/2022), a trenta mesi (D.L. 181/2023,
        L. 11/2024), a trentasei mesi (D.L. 202/2024) e infine a quarantotto mesi per i titoli fino
        al 31/12/2025 (D.L. 200/2025, convertito dalla L. 26/2026).
      status: verified
      source: dpr380-art15
    - text: >-
        Sul SUE di Napoli l'operazione "Proroga del termine di ultimazione lavori (art. 10 septies,
        Legge 51/2022)" (gruppo Altri adempimenti edilizi) è una "Comunicazione di proroga del
        termine di ultimazione lavori": chiede gli estremi del permesso di costruire o della SCIA,
        l'oggetto, l'intestatario, la data entro cui i lavori dovrebbero finire e quella prevista.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        La pagina del Comune sulle proroghe (aggiornata al 12/06/2025) descrive ancora la proroga di
        due anni per i permessi fino al 31/12/2023 e chiede di indicare se la comunicazione riguarda
        l'inizio o l'ultimazione; il testo vigente dell'art. 10-septies dà quarantotto mesi per i
        titoli fino al 31/12/2025.
      status: disputed
      source: proroga-pagina
legal_basis:
  - text: "D.L. 21 marzo 2022, n. 21, art. 10-septies c. 1 a (convertito dalla L. 51/2022), nel testo modificato da ultimo dal D.L. 200/2025 (L. 26/2026)."
    status: verified
    source: dl21-art10septies
deadline:
  summary:
    text: >-
      Prima che scada il termine di ultimazione: la proroga non opera per i termini già decorsi al
      momento della comunicazione.
    status: verified
    source: dl21-art10septies
pitfalls:
  - text: >-
      La proroga non opera se, al momento della comunicazione, il titolo contrasta con nuovi
      strumenti urbanistici approvati o con piani o provvedimenti di tutela del paesaggio o dei
      beni culturali: va verificato prima di comunicarla.
    status: verified
    source: dl21-art10septies
  - text: >-
      La tabella dei diritti SUE 2026 ha una riga per le proroghe di permessi di costruire
      rilasciati (SUE 11, 501,00 euro); se valga anche per questa comunicazione, che non chiede un
      provvedimento, va chiesto al SUE.
    status: unverified
    source: tabella-diritti
channels:
  - type: portal
    purpose: procedure
    name: Impresa in un giorno – Sportello Unico Edilizia del Comune di Napoli
    url: https://www.impresainungiorno.gov.it/route/suap?codComune=F839&locale=IT&tipoSportello=E
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: potess-sue
    notes: >-
      Unico canale per le pratiche del SUE dal 6 luglio 2026 (DD 501/2026): la consegna al
      protocollo che la pagina del Comune descrive è superata. Operazione "Proroga del termine di
      ultimazione lavori (art. 10 septies, Legge 51/2022)", gruppo Altri adempimenti edilizi.
    use:
      ways: [web_form, upload]
      status: verified
      source: dd-501-2026
      notes: Si compila online; gli allegati si firmano digitalmente.
  - type: pec
    purpose: info
    address: sportello.unico.edilizia@pec.comune.napoli.it
    receipt: legal
    source: sue-ufficio
    notes: Per comunicare con l'ufficio, non per presentare la comunicazione.
steps:
  - do: Firmare la procura speciale se la comunicazione la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Verificare che il titolo sia stato rilasciato o formato entro il 31/12/2025, che il termine di
      fine lavori non sia scaduto e che il titolo non contrasti con nuovi strumenti urbanistici o
      vincoli; calcolare la nuova data di fine lavori
    who: professional
  - do: >-
      Prima della scadenza, accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli),
      scegliere l'operazione "Proroga del termine di ultimazione lavori (art. 10 septies, Legge
      51/2022)", compilare, allegare i documenti firmati digitalmente e inviare; conservare la
      ricevuta
    who: professional
    human_only: true
    channel: [portal]
