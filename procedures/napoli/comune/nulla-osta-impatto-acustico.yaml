payment:
  method: pagopa
  calculator_url: https://static-www.comune.napoli.it/wp-content/uploads/2021/07/2026-TABELLA-DIRITTI-SUAP-DEF.pdf
  notes:
    - text: >-
        Diritti d'istruttoria SUAP in vigore dall'11 giugno 2026 (delibera di Giunta comunale n.
        239 del 28 maggio 2026).
      status: verified
      source: diritti-suap
    - text: >-
        Tabella 2026, colonne APERTURA / VCA / VPF: nulla osta di impatto acustico L. 447/1995
        come procedimento del Servizio Tutela dell'Ambiente (TS 7): 100,00 € / 80,00 € / 65,00 €.
        Somministrazione in zone non tutelate + notifica sanitaria + nulla osta di impatto
        acustico (S73): 220,00 € / 176,00 € / 130,00 €. Somministrazione in zone tutelate +
        notifica sanitaria + nulla osta di impatto acustico (S76): 520,00 € / 416,00 € / 325,00 €.
      status: verified
      source: tabella-diritti-2026
    - text: >-
        Altre voci della tabella 2026 che comprendono il nulla osta: stabilimento balneare (S101)
        500,00 €; spettacolo o intrattenimento all'aperto senza strutture con emissioni sonore
        (S103) 200,00 €; spettacolo o intrattenimento in locali aperti al pubblico (S111) 600,00
        €; officine di autoriparazione (S147) 200,00 €; tipografie e litografie (S161) 200,00 €
        (importi di apertura). Le deroghe per manifestazioni ed eventi ex art. 13 del piano di
        zonizzazione (TS 8) costano 100,00 €.
      status: verified
      source: tabella-diritti-2026
    - text: >-
        Si paga con pagoPA dentro la pratica su impresainungiorno, come gli altri diritti SUAP.
        Non è stato verificato se per il nulla osta sia dovuta anche l'imposta di bollo.
      status: unverified
documents:
  - name: Documentazione di previsione di impatto acustico (relazione tecnica)
    required: true
    notes: >-
      Redatta da un tecnico competente in acustica. Secondo il piano di zonizzazione (art. 7)
      contiene: rilievi fonometrici dello stato di fatto; posizione e descrizione degli impianti
      rumorosi e loro contributo; verifica dei requisiti di fonoisolamento del D.P.C.M. 5
      dicembre 1997; contributo complessivo all'inquinamento acustico; verifica dei limiti di
      emissione e immissione della zona e del criterio differenziale; misure previste per
      ridurre le emissioni. Se ci sono edifici residenziali vicini, va valutato anche il rumore
      del traffico indotto, soprattutto di notte (art. 6).
  - name: Dichiarazione sostitutiva dell'atto di notorietà (art. 8, c. 5, L. 447/1995)
    required: false
    notes: >-
      Alternativa alla documentazione completa per le imprese che rientrano nel D.P.R. 227/2011
      quando non si superano i limiti di emissione (art. 4, commi 1 e 2). A Napoli è irricevibile
      per le attività con musica nelle aree del centro storico individuate dalla delibera di
      Giunta n. 246/2023.
  - name: Dichiarazione sostitutiva di appartenenza alle categorie di impresa del D.P.R. 227/2011
    required: false
    notes: Serve per usare le semplificazioni (art. 1 del D.P.R. 227/2011, art. 46 D.P.R. 445/2000).
  - name: Estremi del titolo con cui l'attività è già aperta
    required: false
    notes: Solo se si chiede il nulla osta per un'attività già in esercizio (SCIA, autorizzazione ecc.).
  - name: Ricevuta pagoPA dei diritti d'istruttoria SUAP
    required: true
steps:
  - do: >-
      Verificare in quale classe acustica ricade il locale, con le tavole del piano di
      zonizzazione acustica (zona centrale, orientale, occidentale, settentrionale), e se è nelle
      zone A o B del Piano delle somministrazioni 2026
    who: anyone
  - do: >-
      Stabilire se servono la documentazione completa o la dichiarazione sostitutiva: in zona A e
      B per bar e ristoranti, e per le attività con musica nel centro storico, serve comunque
      l'istanza di nulla osta con relazione tecnica
    who: professional
  - do: >-
      Incaricare un tecnico competente in acustica iscritto nell'elenco nazionale (ENTECA), che
      esegue i rilievi fonometrici e redige la documentazione di previsione di impatto acustico
    who: owner
  - { do: Redigere la relazione o la dichiarazione e firmarla, who: professional, human_only: true }
  - do: >-
      Inserire l'istanza di nulla osta e la documentazione nella pratica SUAP su impresainungiorno
      (insieme alla SCIA o all'autorizzazione di apertura, voltura o subentro; oppure come pratica
      a sé con gli estremi del titolo se l'attività è già aperta)
    who: facilitator
  - { do: Firmare digitalmente la pratica, who: owner, human_only: true }
  - { do: Pagare i diritti d'istruttoria con pagoPA nel front office, who: owner, human_only: true }
  - { do: Inviare la pratica su impresainungiorno, who: owner, human_only: true }
  - do: >-
      Attendere l'esito: il nulla osta arriva solo dopo la conclusione positiva della pratica SUAP;
      non usare gli impianti di diffusione sonora prima del rilascio
    who: office
after:
  - Conservare la ricevuta di impresainungiorno, la relazione del tecnico e il nulla osta nel locale.
  - >-
    Usare solo gli impianti descritti nella relazione: se cambiano impianti, disposizione o
    attività, far aggiornare la documentazione dal tecnico prima di usarli.
  - >-
    In caso di cambio di gestore o subentro, la voltura del nulla osta va chiesta dentro la
    pratica SUAP di subentro.
  - >-
    Per eventi o musica all'aperto oltre i limiti, chiedere per tempo l'autorizzazione in deroga
    prevista dall'art. 13 del piano di zonizzazione.
pitfalls:
  - text: >-
      Le istanze di nulla osta presentate fuori da impresainungiorno (per esempio via PEC
      all'ufficio ambiente) non sono ricevibili dal 1° giugno 2024.
    status: verified
    source: avviso-nulla-osta
  - text: >-
      Le dichiarazioni semplificate (art. 4 D.P.R. 227/2011) per attività con emissioni di musica
      nelle aree del centro storico della delibera di Giunta n. 246/2023 sono irricevibili: lì
      serve l'istanza di nulla osta con la relazione tecnica.
    status: verified
    source: avviso-nulla-osta
  - text: >-
      L'avviso non dice espressamente se fuori da quelle aree la dichiarazione semplificata sia
      accettata in luogo del nulla osta, e non è stato verificato se le aree della delibera n.
      246/2023 coincidano con le zone A e B del Piano del 2026. Chiedere al SUAP.
    status: unverified
  - text: >-
      La documentazione che attesta emissioni superiori ai limiti della classificazione acustica
      deve indicare le misure di riduzione ed essere predisposta da un tecnico competente in
      acustica (D.P.R. 227/2011, art. 4, c. 3).
    status: verified
    source: dpr227-art4
  - text: >-
      La professione di tecnico competente in acustica si può svolgere solo dopo l'iscrizione
      nell'elenco nazionale dei tecnici competenti in acustica, tenuto dal Ministero dell'ambiente
      con ISPRA (L. 447/1995, art. 2, c. 7; d.lgs. 42/2017, art. 21). Controllare l'iscrizione del
      tecnico prima di incaricarlo.
    status: verified
    source: l447-art2
  - text: >-
      L'elenco nazionale (ENTECA) si consulta sulla piattaforma ISPRA enteca.isprambiente.it; la
      pagina è dinamica e non è stata letta.
    status: unverified
  - text: >-
      In Campania le istanze di iscrizione e aggiornamento nell'ENTECA si presentano alla Regione
      (modelli sulla pagina regionale "Tecnici Competenti in Acustica").
    status: verified
    source: regione-campania-tca
  - text: >-
      Le norme del piano di zonizzazione (1998–2001) sono in parte superate: indicano come
      ufficio competente il "Servizio Progettazione e Valutazione Ambientale", rinviano alla L.
      15/1968 per la dichiarazione ed esprimono le sanzioni in lire (art. 21, che punisce anche la
      mancata presentazione della relazione di impatto acustico). Prevedono inoltre che, dopo una
      diffida non rispettata, il Sindaco possa sospendere l'attività fino a 6 mesi e poi ordinarne
      la chiusura (art. 20).
    status: verified
    source: pza-norme
  - text: >-
      Oggi i pareri obbligatori di conformità acustica per le attività li esprime il Servizio
      Tutela dell'Ambiente, della Salute e del Paesaggio, secondo la L. 447/1995 e il piano di
      zonizzazione vigente.
    status: verified
    source: rumore-ambientale
  - text: >-
      Le attività a maggiore impatto acustico non dovrebbero insediarsi, per quanto possibile, in
      edifici prevalentemente residenziali; quelle notturne ad alto impatto (per esempio dancing)
      in edifici con poche funzioni residenziali e con parcheggi (norme del piano, art. 6).
    status: verified
    source: pza-norme
  - text: >-
      Anche senza lavori edilizi, chi cambia destinazione d'uso di un'unità immobiliare deve
      dichiarare che la nuova attività non peggiora le emissioni rumorose; se è previsto un
      aumento della rumorosità serve la relazione di impatto acustico (norme del piano, art. 7).
    status: verified
    source: pza-norme
  - text: >-
      Piano-bar, serate musicali, karaoke e simili all'aperto, a supporto dell'attività
      principale, sono attività rumorose temporanee: gli strumenti e gli amplificatori vanno
      spenti entro le 24:00 e vanno rispettati i limiti dell'art. 13; oltre 3 giorni, anche non
      consecutivi, in un bimestre serve un'autorizzazione formale con relazione di impatto
      acustico (norme del piano, art. 13).
    status: verified
    source: pza-norme
  - text: >-
      Valori limite di emissione (Leq in dBA, diurno 6–22 / notturno 22–6) riportati dalle norme
      del piano dal D.P.C.M. 14 novembre 1997: classe I 45/35, II 50/40, III 55/45, IV 60/50, V
      65/55, VI 65/65. La classe del locale si legge nelle tavole del piano.
    status: verified
    source: pza-norme
  - text: >-
      Nel punteggio del Piano delle somministrazioni (zone A e B) l'insonorizzazione dei locali
      certificata da un tecnico iscritto all'albo, con emissioni all'esterno e negli ambienti
      confinanti inferiori al 10% dei limiti di legge, vale 30 punti (art. 9).
    status: verified
    source: piano-2026
  - text: >-
      Le due pagine del Comune riportano numeri di telefono diversi per l'ufficio acustica:
      081.7956756/7959565 ("Rumore ambientale", aggiornata il 13/05/2025) e 081 7959656 / 081
      7959565 (pagina dell'ufficio, aggiornata il 16/07/2026).
    status: disputed
    source: servizio-tutela-ambiente
  - text: >-
      L'avviso sul nulla osta non ha una data di pubblicazione propria: la pagina indica solo
      l'ultimo aggiornamento (04/06/2025), mentre il testo fissa l'obbligo dal 01/06/2024.
    status: verified
    source: avviso-nulla-osta
  - text: >-
      L'Allegato B del D.P.R. 227/2011 (elenco delle attività a bassa rumorosità) su Normattiva è
      solo in formato grafico e non è stato letto: per sapere se un'attività senza musica vi
      rientra, chiedere al tecnico.
    status: unverified
