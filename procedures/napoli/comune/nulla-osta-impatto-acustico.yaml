schema_version: 0
id: napoli/comune/nulla-osta-impatto-acustico
title: Nulla osta di impatto acustico e documentazione di impatto acustico per le attività (Comune di Napoli)
updated: 2026-10-25
summary: >-
  Un'attività che a Napoli usa impianti di diffusione sonora o macchinari rumorosi (bar, ristoranti
  e pizzerie con musica, locali di intrattenimento, officine, tipografie…) deve allegare alla
  pratica SUAP la documentazione di impatto acustico preparata da un tecnico competente in
  acustica e ottenere il nulla osta di impatto acustico del Comune. La richiesta si fa solo dentro
  la pratica su impresainungiorno; nel centro storico (zone A e B) chi apre un bar o un ristorante
  deve chiederlo in ogni caso, anche senza musica.
ente:
  name: Comune di Napoli
  office: Area Ambiente – Servizio Tutela dell'Ambiente, della Salute e del Paesaggio (tramite il SUAP)
  ipa: c_f839
applies_to:
  events: [open, events]
  audience: [business]
  sectors:
    - somministrazione di alimenti e bevande con musica o impianti di diffusione sonora
    - attività di spettacolo e intrattenimento, discoteche, circoli
    - stabilimenti balneari, palestre e altre attività con impianti rumorosi
    - officine di autoriparazione, tipografie e litografie
  conditions:
    - text: >-
        Le domande di licenza o di autorizzazione all'esercizio di attività produttive, e quelle
        per i provvedimenti che abilitano all'uso di immobili per attività produttive, sportive e
        ricreative, devono contenere una documentazione di previsione di impatto acustico (L.
        447/1995, art. 8, c. 4).
      status: verified
      source: l447-art8
    - text: >-
        Per discoteche e per circoli privati e pubblici esercizi in cui sono installati macchinari
        o impianti rumorosi, la documentazione di impatto acustico va predisposta anche su
        richiesta dei comuni (art. 8, c. 2, lett. c e d).
      status: verified
      source: l447-art8
    - text: >-
        Le attività a bassa rumorosità dell'Allegato B al D.P.R. 227/2011 sono escluse dalla
        documentazione, tranne ristoranti, pizzerie, trattorie, bar, mense, attività ricreative,
        agrituristiche, culturali e di spettacolo, sale da gioco, palestre e stabilimenti balneari
        che usano impianti di diffusione sonora o fanno eventi con musica o strumenti musicali:
        per loro la documentazione di previsione di impatto acustico è obbligatoria (D.P.R.
        227/2011, art. 4, c. 1).
      status: verified
      source: dpr227-art4
    - text: >-
        Le semplificazioni del D.P.R. 227/2011 valgono per le categorie di imprese dell'art. 2 del
        D.M. 18 aprile 2005, che lo attestano con una dichiarazione sostitutiva di certificazione
        (art. 46 D.P.R. 445/2000) (D.P.R. 227/2011, art. 1).
      status: verified
      source: dpr227-art1
    - text: >-
        Le categorie del D.M. 18 aprile 2005 sono le micro, piccole e medie imprese (il decreto
        ministeriale non è stato letto).
      status: unverified
    - text: >-
        A Napoli la musica riservata ai clienti di un bar o ristorante non richiede licenza né
        SCIA, purché non diventi pubblico spettacolo, ma resta necessario il nulla osta di impatto
        acustico, da chiedere al servizio controlli ambientali.
      status: verified
      source: esercizi-pubblici
    - text: >-
        Nelle zone A (centro storico UNESCO) e B (buffer zone) del Piano approvato con la delibera
        di Consiglio comunale n. 79/2026, ogni nuova attività di somministrazione deve presentare
        la richiesta di nulla osta di impatto acustico (art. 8 L. 447/1995) come requisito
        strutturale minimo, asseverato da un tecnico abilitato (Piano, art. 7, c. 3).
      status: verified
      source: piano-2026
    - text: >-
        Il piano di zonizzazione acustica del Comune subordina al nulla osta l'esercizio delle
        attività produttive, sportive e ricreative (discoteche, circoli privati e pubblici
        esercizi) e dei servizi commerciali polifunzionali per cui serve la relazione di impatto
        acustico (norme di attuazione, art. 7).
      status: verified
      source: pza-norme
legal_basis:
  - text: >-
      Legge 26 ottobre 1995, n. 447 (legge quadro sull'inquinamento acustico): art. 8, commi 2, 4,
      5 e 6 (documentazione di impatto acustico e nulla osta del comune).
    status: verified
    source: l447-art8
  - text: >-
      L. 447/1995, art. 8, c. 6: se l'attività può superare i valori limite di emissione, la
      domanda deve indicare le misure previste per ridurre o eliminare le emissioni, ai fini del
      rilascio del nulla osta da parte del comune.
    status: verified
    source: l447-art8
  - text: >-
      D.P.R. 19 ottobre 2011, n. 227, artt. 1 e 4 (semplificazione della documentazione di impatto
      acustico per le imprese).
    status: verified
    source: dpr227-art4
  - text: >-
      L. 447/1995, art. 2, commi 6 e 7, e d.lgs. 17 febbraio 2017, n. 42, artt. 21 e 22 (tecnico
      competente in acustica ed elenco nazionale).
    status: verified
    source: dlgs42-art21
  - text: >-
      Piano di zonizzazione acustica del Comune di Napoli, approvato con deliberazione del
      Consiglio comunale n. 204 del 21 dicembre 2001; integra il piano regolatore generale.
    status: verified
    source: pza-pagina
  - text: >-
      Norme di attuazione del Piano di zonizzazione acustica: art. 6 (attività a maggiore impatto
      acustico), art. 7 (relazione di impatto acustico e nulla osta), art. 13 (manifestazioni e
      musica all'aperto), art. 21 (sanzioni).
    status: verified
    source: pza-norme
  - text: >-
      Avviso del Comune: le istanze vanno inserite nella SCIA unica o condizionata ai sensi del
      d.lgs. 25 novembre 2016, n. 222, dell'art. 8, c. 4, L. 447/1995 e dell'art. 7 del Piano di
      zonizzazione acustica.
    status: verified
    source: avviso-nulla-osta
  - text: >-
      Deliberazione di Giunta comunale n. 246 del 18 luglio 2023 (aree del centro storico UNESCO e
      di alcune buffer zone con limitazioni all'avvio di nuove attività), citata dall'avviso del
      Comune; il testo della delibera non è stato letto.
    status: verified
    source: avviso-nulla-osta
  - text: >-
      Piano per le aperture degli esercizi di somministrazione nel centro storico UNESCO e nella
      buffer zone (delibera C.C. n. 79 del 29 giugno 2026), art. 7.
    status: verified
    source: piano-2026
deadline:
  rules:
    - text: >-
        Dal 1° giugno 2024 l'istanza di nulla osta (anche per voltura per cambio di gestore e
        subentro) è ricevibile solo se contenuta nella SCIA o domanda di autorizzazione di inizio
        attività trasmessa al SUAP su impresainungiorno: va quindi presentata insieme alla pratica
        di apertura, prima di iniziare.
      status: verified
      source: avviso-nulla-osta
    - text: >-
        Se l'attività è già aperta con un titolo valido e vuole poi usare impianti
        elettroacustici, presenta l'istanza di nulla osta su impresainungiorno indicando gli
        estremi del titolo (SCIA di somministrazione, autorizzazione ecc.).
      status: verified
      source: avviso-nulla-osta
    - text: >-
        Il nulla osta viene rilasciato solo dopo la conclusione positiva, da parte del SUAP, della
        pratica di inizio attività, voltura o subentro.
      status: verified
      source: avviso-nulla-osta
    - text: >-
        Il piano di zonizzazione subordina l'esercizio dell'attività al rilascio del nulla osta,
        sulla base della documentazione presentata e dei controlli finali (norme, art. 7).
      status: verified
      source: pza-norme
    - text: >-
        Le fonti consultate non indicano un termine per il rilascio del nulla osta: chiederlo al
        SUAP o al Servizio Tutela dell'Ambiente.
      status: unverified
  lateness:
    text: >-
      La L. 447/1995 punisce chi supera i valori limite di emissione o immissione con una sanzione
      amministrativa da 1.000 a 10.000 euro (art. 10, c. 2) e la violazione delle disposizioni
      dei comuni attuative della legge da 500 a 20.000 euro (art. 10, c. 3). L'importo in
      concreto lo stabilisce l'ufficio che accerta la violazione.
    status: verified
    source: l447-art10
