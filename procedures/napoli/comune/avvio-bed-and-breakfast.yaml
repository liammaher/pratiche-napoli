verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: letti il documento operativo del SUAP di Napoli sulle strutture extralberghiere e le
    locazioni brevi, la pagina contatti SUAP, la tabella diritti SUAP 2026 (S94-S96, S209-S210),
    la pagina dell'elenco CUSR; i testi vigenti della L.R. 5/2001 e della L.R. 17/2001 sul sito
    della Regione; la guida regionale del 29/10/2025; su Normattiva l'art. 13-ter D.L. 145/2023 e
    l'art. 19 L. 241/1990; il portale Alloggiati Web, la pagina e il modulo della Questura di
    Napoli; l'art. 14 del Regolamento TARI; la pagina della variante del centro storico e il
    testo della DCC 129/2026; la relazione della proposta di legge regionale sul turismo.
  notes: >-
    Non letti il testo della L.R. 16/2019 (art. 13, CUSR), della L.R. 16/2014 e delle DGR 64/2021
    e 552/2023: le relative affermazioni vengono dalla guida regionale. Non verificati il
    percorso del procedimento su impresainungiorno e la pubblicazione della variante sul BURC.
