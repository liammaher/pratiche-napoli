schema_version: 0
id: napoli/comune/avvio-bed-and-breakfast
title: Aprire un Bed and Breakfast a Napoli (SCIA al SUAP, CUSR, CIN, Alloggiati Web)
headline: "Come aprire un B&B a Napoli: SCIA al SUAP, codice CUSR e CIN"
aka:
  - bed & breakfast
  - B and B
  - camere con colazione
  - struttura ricettiva extralberghiera
updated: 2026-10-26
summary: >-
  Chi vuole ospitare turisti a Napoli offrendo alloggio e prima colazione in una parte della casa
  in cui vive (al massimo 4 camere e 8 posti letto) apre un Bed and Breakfast secondo la L.R.
  Campania 5/2001: presenta una SCIA al SUAP del Comune su impresainungiorno, riceve dal Comune
  il codice regionale CUSR, chiede il CIN nazionale e si abilita ad Alloggiati Web. La scheda
  spiega anche in cosa il B&B è diverso dalla casa vacanze e dalla locazione breve.
ente:
  name: Comune di Napoli
  office: Area Sviluppo Economico – Servizio Sportello Unico Attività Produttive (SUAP)
  ipa: c_f839
applies_to:
  events: [open]
  audience: [business]
  sectors: [strutture ricettive extralberghiere, bed and breakfast]
  conditions:
    - text: >-
        Bed and Breakfast (L.R. Campania 5/2001, art. 1): offerta di alloggio e prima colazione
        esercitata da un nucleo familiare usando parte della propria abitazione, per non più di
        quattro camere e otto posti letto. Il titolare deve avere residenza o stabile domicilio
        nell'abitazione; l'attività non costituisce cambio di destinazione d'uso.
      status: verified
      source: lr-5-2001
    - text: >-
        Il B&B può essere in forma non imprenditoriale (non professionale, a integrazione del
        reddito familiare) o imprenditoriale (professionale, con iscrizione al Registro delle
        imprese del titolare, componente del nucleo familiare).
      status: verified
      source: lr-5-2001
    - text: >-
        Secondo il SUAP di Napoli la legge esclude la gestione del B&B in forma societaria, e
        l'attività si svolge solo in immobili a destinazione abitativa/residenziale con
        soggiorno/cucina, almeno una camera riservata al titolare, camere per gli ospiti e bagni.
      status: verified
      source: napoli-indicazioni
    - text: >-
        Diverso dal B&B – casa e appartamento per vacanze (L.R. 17/2001, art. 3): casa o
        appartamento dato in locazione ai turisti senza alcun servizio di tipo alberghiero, con
        obbligo di recapito referente ospiti e permanenza massima di 90 giorni. In forma non
        imprenditoriale solo per proprietari con al massimo tre unità abitative in Campania, senza
        organizzazione d'impresa né promozione pubblicitaria. Anche questa si apre con SCIA al
        SUAP, ma non è oggetto di questa scheda.
      status: verified
      source: lr-17-2001
    - text: >-
        Per il SUAP di Napoli nella casa vacanze l'intero appartamento è destinato agli ospiti e
        la somministrazione di alimenti e bevande non è prevista; la forma non imprenditoriale
        può essere svolta solo dal proprietario dell'immobile.
      status: verified
      source: napoli-indicazioni
    - text: >-
        Diverso dal B&B – locazione breve/turistica senza attività d'impresa (art. 4 D.L.
        50/2017): contratti di locazione di immobili a uso abitativo fino a 30 giorni, stipulati
        da persone fisiche fuori dall'attività d'impresa, con al massimo biancheria e pulizia. A
        Napoli si presenta una Comunicazione (non una SCIA) al SUAP su impresainungiorno; niente
        prima colazione né somministrazione. Non è oggetto di questa scheda.
      status: verified
      source: napoli-indicazioni
    - text: >-
        Dal periodo d'imposta 2026, con più di due appartamenti destinati a locazione breve
        l'attività si presume imprenditoriale (art. 1, c. 595, L. 178/2020, come modificato dalla
        legge di bilancio 2026) e serve una SCIA al SUAP. La guida regionale del 29/10/2025 indica
        ancora "più di quattro": è superata.
      status: verified
      source: l178-c595
    - text: >-
        Nel centro storico la variante urbanistica approvata con la delibera C.C. 129 del 15
        settembre 2026 classifica il B&B della L.R. 5/2001 nella sottocategoria a.2 (abitazioni
        assimilabili a strutture ricettive extralberghiere). Nell'area di regolamentazione della
        tavola 7a il passaggio da a.1 (abitazione ordinaria) ad a.2, da ottenere con idoneo titolo
        abilitativo, è limitato da una soglia minima di residenzialità ordinaria del 70% della
        superficie catastale dell'intero edificio. Il meccanismo di verifica è rinviato a un
        provvedimento di Giunta.
      status: verified
      source: variante-dcc-129
    - text: >-
        La variante riguarda un'area del centro storico all'intersezione tra la zona A del Prg e
        la Buffer Zone UNESCO, escludendo i quartieri a bassa pressione turistica.
      status: verified
      source: variante-pagina
    - text: >-
        La variante è efficace dal giorno dopo la pubblicazione sul BURC. Non è stato controllato
        se la pubblicazione sia già avvenuta, né se la Giunta abbia già fissato il meccanismo di
        verifica: chiedere al SUAP o al Servizio Pianificazione urbanistica prima di presentare la
        SCIA per un immobile nel centro storico.
      status: unverified
legal_basis:
  - text: >-
      L.R. Campania 10 maggio 2001, n. 5 (Disciplina dell'attività di Bed and Breakfast), testo
      vigente con le modifiche fino alla L.R. 11/2023: art. 1 (definizione e requisiti), art. 4
      (sospensione e cessazione), art. 6 (tabella delle tariffe), art. 9 (alloggiati e dati
      statistici), art. 9-bis (marchio), art. 10 (sanzioni).
    status: verified
    source: lr-5-2001
  - text: >-
      L.R. Campania 24 novembre 2001, n. 17 (strutture ricettive extralberghiere: affittacamere,
      case e appartamenti per vacanze, ecc.), per le altre tipologie.
    status: verified
    source: lr-17-2001
  - text: >-
      L.R. Campania 7 agosto 2014, n. 16 (classificazione e SCIA delle strutture ricettive) e L.R.
      Campania 7 agosto 2019, n. 16, art. 13 (Codice Unico Strutture Ricettive – CUSR), con le DGR
      64/2021 e 552/2023 sulle modalità di rilascio da parte dei Comuni.
    status: verified
    source: guida-regione-2025
  - text: >-
      D.L. 145/2023, art. 13-ter, convertito dalla L. 191/2023: codice identificativo nazionale
      (CIN) per le strutture turistico-ricettive extralberghiere, obbligo di esporlo e di
      indicarlo negli annunci, sanzioni.
    status: verified
    source: dl-145-art13ter
  - text: >-
      Art. 109 TULPS e D.M. Interno 7 gennaio 2013 (comunicazione delle persone alloggiate alla
      Questura tramite Alloggiati Web).
    status: verified
    source: alloggiati-portale
  - text: "Legge 241/1990, art. 19 (SCIA: avvio dalla presentazione, controlli entro 60 giorni)."
    status: verified
    source: l241-art19
  - text: >-
      D.M. Sanità 5 luglio 1975 (requisiti igienico-sanitari dei locali di abitazione), richiamato
      dal SUAP di Napoli per gli aspetti non regolati dalla L.R. 5/2001.
    status: verified
    source: napoli-indicazioni
deadline:
  rules:
    - text: >-
        La SCIA va presentata prima di iniziare: l'attività può iniziare dalla data di
        presentazione. Entro 60 giorni il Comune, se mancano requisiti, vieta la prosecuzione o
        invita a conformarsi.
      status: verified
      source: l241-art19
    - text: >-
        Le generalità degli ospiti vanno comunicate su Alloggiati Web entro 24 ore dall'arrivo.
      status: verified
      source: questura-napoli
    - text: >-
        Soggiorni inferiori a 24 ore: la Questura di Napoli indica entro 6 ore (citando il D.M.
        16 settembre 2021), mentre la home page di Alloggiati Web dice che le generalità vanno
        inviate all'arrivo stesso (citando il D.M. 7 gennaio 2013).
      status: disputed
      source: questura-napoli
    - text: >-
        Comunicazione dei prezzi alla Regione su Sinfonia Turismo SMART entro il 1° ottobre per le
        tariffe dal 1° gennaio successivo, anche se invariate; eventuali modifiche applicabili dal
        1° giugno vanno comunicate entro il 1° marzo. La guida regionale lo indica per le
        strutture ricettive in genere (esclusi agriturismi e locazioni brevi/turistiche).
      status: verified
      source: guida-regione-2025
    - text: Il soggiorno massimo consentito in un B&B non può superare i trenta giorni consecutivi.
      status: verified
      source: lr-5-2001
    - text: >-
        Sospensione temporanea o cessazione: avviso preventivo al Comune (o contestuale, se non è
        possibile prima). Dopo sei mesi di sospensione volontaria si presume la rinuncia.
      status: verified
      source: lr-5-2001
  lateness:
    text: >-
      La L.R. 5/2001, art. 10, prevede per chi esercita senza SCIA una sanzione da euro 1.550,00 a
      euro 4.130,00, e altre sanzioni per la tabella delle tariffe non esposta, per prezzi superiori
      a quelli esposti e per il superamento della capacità ricettiva. Per l'importo nel caso
      concreto chiedere al SUAP o alla Polizia locale.
    status: verified
    source: lr-5-2001
cost:
  text: >-
    Diritti d'istruttoria SUAP: 200 euro, 220 con la notifica sanitaria (colazione con prodotti
    preparati), 240 con anche la prevenzione incendi (righe S94–S96), pagati con pagoPA nella
    pratica. Le fonti non indicano marche da bollo; a parte c'è il compenso del tecnico che firma
    la planimetria.
  status: verified
  source: tabella-2026
duration:
  text: >-
    Con la SCIA si può iniziare dalla data di presentazione; entro 60 giorni il Comune, se mancano
    i requisiti, vieta la prosecuzione o chiede di conformarsi. Per gli annunci serve però il CIN,
    che si chiede dopo aver ricevuto il CUSR dal Comune, in tempi che le fonti non indicano.
  status: verified
  source: l241-art19
appointment:
  text: >-
    Non serve: la SCIA si presenta solo online su impresainungiorno. Lo sportello SUAP di Piazza
    Cavour 42 (II piano) riceve dal 18 maggio 2026 solo su prenotazione online, con il pulsante
    "Prenota appuntamento" della pagina "Avviare, variare, chiudere un'attività produttiva".
  status: verified
  source: suap-contatti
channels:
  - type: portal
    name: impresainungiorno – SUAP di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: suap-contatti
    notes: >-
      Unico canale telematico per la SCIA del B&B (lo conferma anche il documento operativo del
      SUAP). Servono firma digitale e PEC. Il percorso esatto nel portale non è stato verificato.
  - type: pec
    address: suap@pec.comune.napoli.it
    receipt: legal
    source: suap-contatti
    notes: Solo per comunicare con l'ufficio; le pratiche inviate via PEC o email ordinaria non vengono istruite.
  - type: email
    address: suaponline@comune.napoli.it
    receipt: informal
    source: suap-contatti
    notes: Solo per informazioni.
  - type: desk
    name: Servizio SUAP
    address: Piazza Cavour 42, II piano, Napoli
    booking: >-
      Dal 18 maggio 2026 solo su prenotazione online (pulsante "Prenota appuntamento" della
      pagina "Avviare, variare, chiudere un'attività produttiva").
    source: suap-contatti
  - type: phone
    address: 081 7953051
    source: suap-contatti
    notes: Referente SUAP indicato per strutture ricettive extralberghiere e Bed & breakfast.
  - type: portal
    name: BDSR – Banca dati strutture ricettive del Ministero del Turismo (CIN)
    url: https://bdsr.ministeroturismo.gov.it/
    auth: [spid, cie]
    source: guida-regione-2025
    notes: Si usa dopo aver ricevuto il CUSR dal Comune ("Ottieni CIN").
  - type: portal
    name: Sinfonia Turismo SMART – Regione Campania (movimento ospiti e prezzi)
    url: https://turismo.regione.campania.it/turismoweb/fe-portale-turismo/login
    auth: [spid, cie, cns]
    source: guida-regione-2025
    notes: Assistenza supporto.strutturericettive@regione.campania.it.
  - type: portal
    name: Alloggiati Web – Polizia di Stato
    url: https://alloggiatiweb.poliziadistato.it/
    receipt: informal
    source: questura-napoli
    notes: >-
      Le credenziali si chiedono al Commissariato di P.S. competente per l'indirizzo della
      struttura (modulo della Questura di Napoli). Le ricevute vanno scaricate (restano
      disponibili 30 giorni) e conservate 5 anni.
  - type: desk
    name: Questura di Napoli
    address: Via Medina 75, 80133 Napoli
    source: questura-napoli
    notes: Per le credenziali Alloggiati Web la Questura rinvia al Commissariato territorialmente competente.
payment:
  method: pagopa
  notes:
    - text: >-
        Diritti d'istruttoria SUAP 2026, colonna apertura: strutture ricettive 200,00 euro (S94);
        con notifica sanitaria 220,00 euro (S95); con notifica sanitaria e prevenzione incendi
        240,00 euro (S96). Il documento operativo del SUAP per le extralberghiere indica 200
        euro.
      status: verified
      source: tabella-2026
    - text: >-
        Si pagano con pagoPA dentro la pratica su impresainungiorno; la ricevuta si allega alla
        SCIA.
      status: verified
      source: napoli-indicazioni
    - text: >-
        La richiesta del CUSR al Comune e del CIN al Ministero non risultano a pagamento nelle
        fonti lette.
      status: unverified
documents:
  - name: SCIA per l'avvio del Bed and Breakfast, compilata su impresainungiorno e firmata digitalmente
    required: true
  - name: >-
      Planimetria dello stato attuale dell'abitazione firmata da un tecnico abilitato, con dati
      catastali, altezze, superfici e destinazione d'uso di tutti i vani e numero di posti letto
      in ogni camera per gli ospiti
    required: true
  - name: >-
      Dichiarazione sostitutiva del tecnico che ha firmato la planimetria sull'avvenuto pagamento
      del compenso (L.R. 59/2018), con suo documento d'identità
    required: true
  - name: Documento d'identità in corso di validità del titolare
    required: true
  - name: Ricevuta pagoPA dei diritti d'istruttoria
    required: true
  - name: Procura speciale
    required: false
    notes: Solo se la SCIA è firmata e inviata da un altro soggetto o tecnico incaricato.
  - name: Notifica sanitaria ai fini della registrazione (Reg. CE 852/2004), come SCIA unica
    required: false
    notes: >-
      Secondo il SUAP serve solo se la colazione è con prodotti "preparati"; con prodotti
      confezionati non serve.
  - name: >-
      Documentazione sulla prevenzione del rischio legionellosi (Ordinanza sindacale n. 224 del 6
      febbraio 2007)
    required: true
    notes: Non si allega; va tenuta e mostrata agli organi di vigilanza durante i controlli.
  - name: Iscrizione del titolare al Registro delle imprese
    required: false
    notes: Solo per il B&B in forma imprenditoriale.
