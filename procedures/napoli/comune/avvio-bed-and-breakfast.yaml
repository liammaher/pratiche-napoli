steps:
  - do: >-
      Scegliere la tipologia giusta: B&B (si vive nell'abitazione, al massimo 4 camere e 8 posti
      letto, colazione obbligatoria), casa vacanze (appartamento intero ai turisti, nessun servizio
      alberghiero) o locazione breve (contratto fino a 30 giorni, nessuna colazione)
    who: anyone
  - do: >-
      Controllare i requisiti: residenza o stabile domicilio nell'abitazione, immobile a
      destinazione abitativa, superfici minime per camera (9, 12, 18, 24 mq per 1-4 posti letto),
      un bagno ulteriore oltre i due ospiti, soggiorno di almeno 14 mq con angolo cottura o cucina,
      requisiti del D.M. 5 luglio 1975 e adeguamento alle norme di sicurezza
    who: professional
  - do: >-
      Se l'immobile è nel centro storico, verificare sulla tavola 7a della variante se è
      nell'area di regolamentazione e chiedere al SUAP se la soglia del 70% è già applicata
    who: anyone
  - do: >-
      Decidere la forma: non imprenditoriale, oppure imprenditoriale con iscrizione del titolare
      al Registro delle imprese (non come società)
    who: owner
  - do: Iscrivere il titolare al Registro delle imprese, solo per la forma imprenditoriale
    who: owner
    human_only: true
  - do: >-
      Farsi preparare dal tecnico la planimetria dello stato attuale e la sua dichiarazione
      sull'avvenuto pagamento del compenso
    who: professional
  - do: >-
      Tenere pronta la documentazione sulla prevenzione della legionellosi (Ordinanza sindacale
      224/2007)
    who: owner
  - do: Procurarsi firma digitale, PEC e accesso SPID, CIE o CNS; oppure affidare la pratica a un procuratore
    who: owner
  - do: Se si usa un procuratore, firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Compilare la SCIA per il Bed and Breakfast su impresainungiorno (SUAP di Napoli),
      aggiungendo la notifica sanitaria se la colazione è con prodotti preparati
    who: facilitator
  - do: Pagare i diritti d'istruttoria (200 euro, 220 con notifica sanitaria) con pagoPA dalla pratica
    who: owner
    human_only: true
  - do: Firmare digitalmente la SCIA e inviarla al SUAP dal portale
    who: owner
    human_only: true
  - do: Attendere il CUSR, che il Comune trasmette via email o PEC dopo i controlli e pubblica nell'elenco CUSR
    who: office
  - do: Chiedere il CIN sulla BDSR con SPID o CIE, scegliendo "Ottieni CIN" e inserendo il CUSR
    who: owner
    human_only: true
  - do: >-
      Esporre il CIN all'esterno dello stabile e indicarlo in ogni annuncio; esporre in modo
      visibile la tabella delle tariffe praticate
    who: owner
  - do: Chiedere le credenziali Alloggiati Web al Commissariato competente con il modulo della Questura
    who: owner
    human_only: true
  - do: >-
      Accedere a Sinfonia Turismo SMART per comunicare il movimento degli ospiti e i prezzi
      (entro il 1° ottobre di ogni anno)
    who: owner
  - do: >-
      Registrarsi su GEIS Portal per l'imposta di soggiorno (procedura separata:
      napoli/comune/imposta-di-soggiorno-gestori)
    who: owner
after:
  - Conservare la ricevuta di avvio pratica SUAP, la ricevuta pagoPA e copia di quanto inviato.
  - Annotare CUSR e CIN; controllare che compaiano nell'elenco CUSR del Comune.
  - >-
    Comunicare su Alloggiati Web ogni ospite entro 24 ore dall'arrivo; scaricare le ricevute
    (restano disponibili 30 giorni) e conservarle 5 anni.
  - >-
    TARI: per il B&B non imprenditoriale nella propria abitazione di residenza resta l'utenza
    domestica, con numero di occupanti fissato in sei, oppure (con dichiarazione) gli occupanti
    del nucleo più due per ogni camera del B&B (Regolamento TARI, art. 14, c. 7). Dichiarare la
    variazione al Servizio IMU e TARI.
  - >-
    L'imposta di soggiorno (registrazione su GEIS Portal, dichiarazioni e versamenti) è una procedura
    separata del Comune (napoli/comune/imposta-di-soggiorno-gestori).
  - >-
    Variazioni (camere, posti letto, titolare), sospensione e cessazione si comunicano al Comune
    tramite SUAP; per cambiare i dati legati al CUSR rivolgersi al Comune, non alla Regione.
pitfalls:
  - text: >-
      In Campania il CIN non sostituisce il CUSR ma si aggiunge: senza CUSR rilasciato dal Comune
      non si ottiene il CIN. La Regione non rilascia direttamente il CUSR. Se il CUSR non compare
      sulla BDSR, inviare copia della SCIA a supporto.strutturericettive@regione.campania.it.
    status: verified
    source: guida-regione-2025
  - text: >-
      Le pratiche SUAP inviate via PEC o email ordinaria non vengono istruite: l'unico canale è
      impresainungiorno.
    status: verified
    source: suap-contatti
  - text: >-
      La colazione è obbligatoria. Secondo il SUAP, che riporta un chiarimento regionale, sono
      ammessi servizi superiori ai cibi confezionati previsti dalla legge, ma devono essere svolti
      dalla struttura e non affidati all'esterno.
    status: verified
    source: napoli-indicazioni
  - text: >-
      L'obbligo di rilevatori di gas e monossido di carbonio ed estintori dell'art. 13-ter, c. 7,
      D.L. 145/2023 è scritto per le unità abitative date in locazione turistica o breve, e la
      guida regionale lo riferisce alle locazioni. Nelle fonti lette non è detto che valga per i
      B&B, che devono comunque essere adeguati alle norme di sicurezza vigenti (L.R. 5/2001, art.
      1, c. 3): chiedere al SUAP.
    status: verified
    source: dl-145-art13ter
  - text: >-
      La guida regionale attribuisce gli obblighi antincendio al comma 8 dell'art. 13-ter; nel
      testo vigente su Normattiva sono al comma 7 (il comma 8 riguarda la SCIA per le locazioni
      in forma imprenditoriale).
    status: verified
    source: dl-145-art13ter
  - text: >-
      La L.R. 5/2001 (art. 9, c. 2) chiede di comunicare ogni quattro mesi i dati del movimento
      all'"Ente Provinciale per il Turismo", ente non più esistente; la guida regionale indica la
      piattaforma Sinfonia Turismo SMART senza dare una frequenza per i B&B. Chiedere a
      supporto.strutturericettive@regione.campania.it.
    status: disputed
    source: lr-5-2001
  - text: >-
      La L.R. 5/2001 prevede un marchio regionale del B&B da affiggere all'esterno a spese del
      titolare (art. 9-bis). Non è stato controllato se la Giunta l'abbia già approvato.
    status: unverified
  - text: >-
      La variante del centro storico (art. 21 come approvato) mette il B&B nella sottocategoria
      a.2 e lega il passaggio da a.1 ad a.2 a un titolo abilitativo e alla soglia del 70%; la
      L.R. 5/2001 (art. 1, c. 5) dice che il B&B non costituisce cambio di destinazione d'uso.
      Chiedere al SUAP come le due norme si applicano insieme.
    status: disputed
    source: variante-dcc-129
  - text: >-
      Il Regolamento TARI descrive ancora il B&B "con carattere saltuario e non professionale" e
      per "otto ospiti" (formula della legge del 2001); non dice come si tassa il B&B in forma
      imprenditoriale: chiedere al Servizio IMU e TARI.
    status: verified
    source: tari-regolamento
  - text: >-
      La SCIA del B&B si compila solo online: non esiste un modello scaricabile del SUAP di
      Napoli. Il modulo online non è stato mappato in questa scheda.
    status: unverified
  - text: >-
      Il documento operativo del SUAP (creato a marzo 2024) dice che per la Comunicazione di
      locazione breve non ci sono diritti d'istruttoria, mentre la tabella diritti SUAP 2026
      indica 50 euro per le locazioni brevi non imprenditoriali (S210).
    status: disputed
    source: tabella-2026
  - text: >-
      Struttura priva di CIN: sanzione da 800 a 8.000 euro; mancata esposizione o indicazione del
      CIN: da 500 a 5.000 euro per ciascuna struttura, con rimozione immediata dell'annuncio (art.
      13-ter, c. 9). Per l'importo nel caso concreto chiedere alla Polizia locale.
    status: verified
    source: dl-145-art13ter
  - text: >-
      Chi non usa il CUSR o lo riporta in modo errato o ingannevole rischia una sanzione del Comune
      da 500,00 a 1.000,00 euro per ogni attività promossa, commercializzata o comunicata.
    status: verified
    source: guida-regione-2025
  - text: >-
      Il Comune pubblica l'elenco dei CUSR rilasciati dal SUAP di Napoli (report aggiornato
      periodicamente): utile per controllare il proprio codice.
    status: verified
    source: elenco-cusr
  - text: >-
      Il Consiglio regionale della Campania (XII legislatura) ha una proposta di legge "Sistema
      Turismo Campania" di 101 articoli che riordinerebbe la normativa regionale sul turismo, con
      una sezione sui B&B, una norma sul CUSR e l'abrogazione delle leggi riordinate.
    status: verified
    source: proposta-legge-turismo
  - text: >-
      Lo stato dell'iter della proposta non è stato verificato; al 25 ottobre 2026 la pagina della
      Regione con il testo vigente della L.R. 5/2001 non indica abrogazioni. Ricontrollare prima di
      usare questa scheda.
    status: unverified
