steps:
  - do: Incaricare un tecnico abilitato e firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Stabilire con il tecnico che l'intervento rientra nell'art. 23 c. 01 e scegliere tra SCIA
      alternativa e permesso di costruire; verificare stato legittimo, vincoli e strutture
    who: professional
  - do: Pagare i diritti di segreteria del SUE e allegarne la ricevuta
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      della SCIA alternativa al permesso di costruire, compilare, allegare i documenti firmati
      digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
  - do: Iniziare i lavori non prima di trenta giorni dalla presentazione, pagando il contributo di costruzione come previsto
    who: owner
