schema_version: 0
id: napoli/comune/scia-alternativa-pdc
title: SCIA alternativa al permesso di costruire (art. 23 DPR 380/2001) – SUE del Comune di Napoli
headline: "SCIA alternativa al permesso di costruire a Napoli: quando si può usare"
aka:
  - super scia
  - scia in alternativa al permesso
  - dia alternativa
updated: 2026-10-29
summary: >-
  Per alcuni interventi che chiederebbero il permesso di costruire la legge consente, in
  alternativa, una SCIA: le ristrutturazioni edilizie "pesanti" dell'art. 10 c. 1 c e le nuove
  costruzioni o ristrutturazioni urbanistiche disciplinate da piani con precise disposizioni
  plano-volumetriche. La presenta un tecnico abilitato allo Sportello Unico per l'Edilizia (SUE) di
  Napoli sul portale "Impresa in un giorno", almeno trenta giorni prima dell'inizio dei lavori; il
  contributo di costruzione è dovuto. Resta sempre possibile chiedere il permesso di costruire.
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        In alternativa al permesso di costruire si possono realizzare con SCIA (art. 23 c. 01 DPR
        380/2001): a) le ristrutturazioni dell'art. 10 c. 1 c; b) le nuove costruzioni o
        ristrutturazioni urbanistiche disciplinate da piani attuativi con precise disposizioni
        plano-volumetriche, tipologiche, formali e costruttive dichiarate dal Comune; c) le nuove
        costruzioni in diretta esecuzione di strumenti urbanistici generali con precise disposizioni
        plano-volumetriche. Questi interventi sono soggetti al contributo di costruzione.
      status: verified
      source: dpr380-art23
    - text: >-
        La segnalazione si presenta allo sportello unico almeno trenta giorni prima dell'effettivo
        inizio dei lavori, con una relazione del progettista abilitato che asseveri la conformità
        delle opere (art. 23 c. 1).
      status: verified
      source: dpr380-art23
    - text: >-
        Con la SCIA alternativa si può chiedere al Comune di acquisire gli atti di assenso necessari
        (SCIA condizionata, quadro b.3 del modulo): i lavori iniziano dopo la comunicazione del loro
        rilascio.
      status: verified
      source: sciapdc-modulo
    - text: >-
        A Napoli la Delibera di Giunta comunale n. 454 del 6 giugno 2014 esclude "la SCIA" per la
        demolizione e ricostruzione in zona A della Variante generale al PRG o della Variante
        occidentale; la pagina del Comune che lo riporta riguarda la SCIA edilizia.
      status: verified
      source: scia-pagina
    - text: >-
        In Campania sono soggetti a SCIA alternativa al permesso di costruire, oltre agli interventi
        dell'art. 23 c. 01 DPR 380/2001, le modifiche della destinazione d'uso urbanisticamente
        rilevanti, con opere e senza opere, e il recupero abitativo dei sottotetti (art. 2 c. 6 L.R.
        13/2022).
      status: verified
      source: lr13-2022
    - text: >-
        La circolare regionale CI/2025/3 applica la SCIA alternativa al mutamento d'uso di un intero
        immobile, nella stessa categoria o tra categorie diverse, salvi i casi a permesso di
        costruire dell'art. 2 c. 6-8 L.R. 19/2001.
      status: verified
      source: circolare-salva-casa-campania
    - text: >-
        Per una demolizione e ricostruzione in zona A le fonti non concordano: l'art. 2 c. 8 L.R.
        Campania 13/2022 sottopone a SCIA alternativa al permesso di costruire, nelle zone omogenee A
        e sugli immobili tutelati, la demolizione e ricostruzione che non mantiene sagoma, prospetti,
        sedime e caratteristiche planivolumetriche o aumenta la volumetria, "fatte salve le più
        restrittive previsioni degli strumenti urbanistici comunali"; la pagina del Comune sulla SCIA
        riporta che la DGC 454/2014 esclude "la SCIA" per la demolizione e ricostruzione in zona A.
        Va chiesto al SUE, o si chiede il permesso di costruire.
      status: disputed
      source: lr13-2022
