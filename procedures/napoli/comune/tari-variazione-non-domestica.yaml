steps:
  - do: >-
      Stabilire quale quadro del Mod. 6 si applica (A voltura, B trasferimento interno, C
      superficie) e la data esatta della variazione
    who: anyone
  - do: >-
      Procurarsi la visura catastale dei locali e la planimetria richiesta (con misure e
      destinazioni per la voltura, asseverata per la variazione di superficie)
    who: anyone
  - { do: Compilare il Mod. 6 (dati dalla tabella dei campi), who: anyone }
  - { do: Firmare il modulo, who: owner, human_only: true }
  - do: >-
      Inviare entro 90 giorni dalla variazione il modulo firmato, la copia del documento
      d'identità e la planimetria, preferibilmente via PEC
    who: owner
    human_only: true
  - { do: Ricalcolare la tassa con il simulatore del Comune, who: anyone }
  - { do: Pagare l'F24 alle scadenze, who: owner, human_only: true }
after:
  - Conservare la ricevuta della PEC e una copia di tutto quanto inviato.
  - Annotare data e protocollo della dichiarazione di variazione.
  - >-
    Quando arriva l'avviso successivo, controllare che superficie e categoria tassate e la data
    di decorrenza corrispondano a quanto dichiarato; le differenze sono di regola conteggiate a
    conguaglio.
  - Se l'attività cessa del tutto, presentare il Mod. 8 (cessazione uso non abitativo).
pitfalls:
  - text: >-
      Una diminuzione (meno superficie, categoria più bassa) dichiarata dopo i 90 giorni vale solo
      dalla data di presentazione: per il periodo precedente si continua a pagare la tassa piena
      (art. 12, c. 5).
    status: verified
    source: regolamento-2023
  - text: >-
      L'art. 12, c. 3, cita il termine di 90 giorni solo per le variazioni da cui consegue un
      tributo maggiore, mentre l'art. 25, cc. 5 e 6, lo applica a ogni variazione che cambia
      l'importo: conviene sempre rispettare i 90 giorni.
    status: verified
    source: regolamento-2023
  - text: >-
      Il Mod. 6 non ha una casella apposita per un cambio della sola destinazione d'uso o
      dell'attività (codice ATECO) negli stessi locali, né per la data della variazione di
      superficie: indicarli nelle note e, se possibile, farsi confermare dall'ufficio che il modulo
      è quello giusto.
    status: unverified
  - text: >-
      Il quadro B (trasferimento interno) chiede solo dati catastali, superficie e destinazione
      d'uso, senza l'indirizzo dei locali: conviene aggiungere l'indirizzo dei nuovi locali nelle
      note.
    status: unverified
  - text: >-
      Il titolo stampato sul modulo è "Mod. 6 TARI – VOLTURA USO NON ABITATIVO", mentre la pagina
      della modulistica lo chiama "Variazione uso non abitativo"; l'oggetto del modulo è comunque la
      denuncia di variazione.
    status: disputed
    source: mod-6
  - text: >-
      Detassazione dei rifiuti speciali: il Mod. 6 dice di presentare ogni anno entro il 30 giugno
      il "modello 10", ma nella modulistica del Comune il Mod. 10 è l'istanza di rimborso o
      compensazione e la richiesta di detassazione è il Mod. 9 (come indica anche il Mod. 5).
      Usare il Mod. 9 e, nel dubbio, chiedere all'ufficio.
    status: disputed
    source: modulistica
  - text: >-
      Il regolamento (art. 7, c. 4) richiede per la detassazione, oltre alla dichiarazione, la
      comunicazione annuale entro il 30 giugno dell'anno successivo dei rifiuti prodotti, pena la
      decadenza dal beneficio.
    status: verified
    source: regolamento-2023
  - text: >-
      Il regolamento (art. 26) indica ancora il portale "Linkmate" per presentare le
      dichiarazioni, mentre la pagina della modulistica indica il portale POTESs (Servizi
      Tributari).
    status: disputed
    source: modulistica
  - text: >-
      La dichiarazione si può presentare anche tramite CAF, associazioni di categoria o iscritti
      agli ordini professionali, se convenzionati con il Comune e con delega del contribuente.
    status: verified
    source: regolamento-2023
