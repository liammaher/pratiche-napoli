schema_version: 0
id: napoli/comune/tari-variazione-non-domestica
title: TARI – variazione per uso non abitativo (Comune di Napoli)
headline: "TARI di un'attività a Napoli: come comunicare cambio di superficie, locali o voltura"
aka:
  - tassa sulla spazzatura
  - tassa rifiuti
  - voltura TARI
  - cambio superficie TARI
  - Mod. 6 TARI
updated: 2026-10-26
summary: >-
  Un'impresa, un professionista o un'associazione già iscritti alla TARI a Napoli per locali a uso
  non abitativo devono comunicare con il Mod. 6, entro 90 giorni, ogni cambiamento che modifica la
  tassa: superficie diversa, trasferimento in altri locali dentro Napoli o subentro (voltura) in
  un'utenza intestata a un'altra ditta. Se la tassa diminuisce, dichiararlo in tempo serve ad
  avere la riduzione dal giorno del cambiamento.
ente:
  name: Comune di Napoli
  office: Area Entrate – Servizio IMU e TARI
  ipa: c_f839
applies_to:
  events: [change, move]
  audience: [business]
  conditions:
    - text: >-
        Voltura: la ditta subentra in un'utenza TARI non abitativa intestata in precedenza a
        un'altra ditta (per esempio per cessione d'azienda o di ramo d'azienda) – quadro A del
        Mod. 6.
      status: verified
      source: mod-6
    - text: >-
        Trasferimento interno: la ditta passa da uno o più immobili a uno o più altri immobili
        sempre nel Comune di Napoli – quadro B del Mod. 6.
      status: verified
      source: mod-6
    - text: >-
        Variazione della superficie dei locali o delle aree già dichiarati – quadro C del Mod. 6.
      status: verified
      source: mod-6
    - text: >-
        Più in generale va dichiarata ogni variazione dei dati dichiarati da cui consegua un diverso
        ammontare del tributo, comprese le variazioni di destinazione d'uso dei locali e delle aree
        (artt. 12, c. 5, e 25, cc. 1 e 6).
      status: verified
      source: regolamento-2023
    - text: >-
        La dichiarazione spetta al soggetto legalmente responsabile dell'attività (art. 25, c. 3);
        se riguarda più immobili, va presentata solo per quelli in cui è cambiato qualcosa
        (art. 25, c. 6).
      status: verified
      source: regolamento-2023
legal_basis:
  - text: >-
      Regolamento TARI del Comune di Napoli, artt. 12 (periodi di applicazione e decorrenza delle
      variazioni), 25 (obbligo di dichiarazione) e 26 (contenuto e presentazione).
    status: verified
    source: regolamento-2023
deadline:
  summary:
    text: >-
      Entro 90 giorni dalla variazione. Gli aumenti valgono dal giorno della variazione; le
      riduzioni anche, ma solo se si dichiara entro i 90 giorni, altrimenti dalla data di
      presentazione.
    status: verified
    source: regolamento-2023
  rules:
    - text: >-
        Entro 90 giorni dalla data in cui si è verificata la variazione (art. 25, cc. 5 e 6).
      status: verified
      source: regolamento-2023
    - text: >-
        Le variazioni che fanno aumentare la tariffa producono effetti dal giorno dell'effettiva
        variazione. Anche quelle che la fanno diminuire decorrono dal giorno della variazione, ma
        solo se la dichiarazione è presentata entro i 90 giorni; altrimenti decorrono dalla data di
        presentazione (art. 12, c. 5). Le differenze sono di regola conteggiate a conguaglio.
      status: verified
      source: regolamento-2023
  lateness:
    text: >-
      Per l'omessa dichiarazione di variazione il regolamento prevede una sanzione sul primo anno
      d'imposta dal 100% (un anno) al 200% (più di due anni) del tributo, minimo 50 euro
      (art. 35, c. 3); per la dichiarazione infedele o incompleta dal 50% al 100%, minimo 50 euro
      (art. 35, c. 4). Se la variazione riduce la tassa, il ritardo fa perdere la riduzione per il
      periodo prima della presentazione (art. 12, c. 5). Farsi calcolare gli importi dall'ufficio:
      norme nazionali successive possono averli modificati.
    status: verified
    source: regolamento-2023
cost:
  text: >-
    Nessun costo indicato: come dichiarazione tributaria è esente dall'imposta di bollo (D.P.R.
    642/1972, tabella B, art. 5, testo in vigore fino al 31/12/2026) e né il modulo né la pagina
    della modulistica chiedono diritti. La TARI si paga a parte, con F24.
  status: verified
  source: dpr642-tabella-b
duration:
  text: >-
    La variazione vale dal giorno in cui è avvenuta; se fa diminuire la tassa, solo se dichiarata
    entro 90 giorni, altrimenti dalla data di presentazione (art. 12, c. 5). Le differenze sono di
    regola conteggiate a conguaglio; il regolamento non fissa un termine di risposta dell'ufficio.
  status: verified
  source: regolamento-2023
appointment:
  text: >-
    Non serve: la dichiarazione si presenta online sui Servizi Tributari (POTESs, con SPID, CIE o
    CNS), via PEC, email o raccomandata A/R, senza andare allo sportello.
  status: verified
  source: modulistica
channels:
  - type: pec
    purpose: procedure
    address: entrate.tari-tares-tarsu@pec.comune.napoli.it
    receipt: legal
    preferred: true
    source: mod-6
    notes: Dà una ricevuta con valore legale; un'impresa ha comunque l'obbligo di avere una PEC.
  - type: portal
    purpose: procedure
    name: POTESs – Servizi Tributari
    url: https://servizionline.comune.napoli.it/web/napoli/servizi-tributari
    auth: [spid, cie, cns]
    source: modulistica
  - type: email
    purpose: procedure
    address: entrate.tari-tares-tarsu@comune.napoli.it
    receipt: informal
    source: mod-6
  - type: post
    purpose: procedure
    address: Comune di Napoli, Area Entrate, Servizio IMU e TARI, Via Diocleziano 330, 80125 Napoli
    source: mod-6
    notes: Raccomandata (A/R secondo la pagina della modulistica).
  - type: desk
    purpose: procedure
    name: Sportello Unico Attività Produttive (SUAP)
    source: modulistica
    notes: Per le utenze non domestiche; la pagina non indica l'indirizzo.
  - type: desk
    purpose: info
    name: Sportello TARI
    address: Via Diocleziano 330, 80125 Napoli
    hours: lunedì–venerdì 8:30–12:30
    source: mod-6
  - type: phone
    purpose: info
    address: 081 795 3711
    hours: tutti i giorni 9:00–13:00 (orario indicato sul modulo)
    source: mod-6
    notes: >-
      Il modulo indica anche 081 795 3891 e 081 795 3856 (mercoledì e venerdì, 9–13) e
      081 795 3734 (giovedì e venerdì, 9–13).
payment:
  method: f24
  codice_ente: F839
  codici_tributo: ["3944", "TEFA"]
  status: unverified
  calculator_url: https://portaletributi.comune.napoli.it/?ente=NAPO
  schedule:
    - { label: Acconto 2026 – rata 1, due: 2026-09-30, source: tari-2026, status: verified }
    - { label: Acconto 2026 – unica soluzione, due: 2026-10-15, source: tari-2026, status: verified }
    - { label: Acconto 2026 – rata 2, due: 2026-10-30, source: tari-2026, status: verified }
    - { label: Acconto 2026 – rata 3, due: 2026-11-30, source: tari-2026, status: verified }
    - { label: Saldo 2026 (nuovo avviso del Comune), due: 2027-02-16, source: tari-2026, status: verified }
  notes:
    - text: >-
        Il pagamento è in autoliquidazione: è dovuto alle scadenze anche se l'avviso non arriva.
        Se l'avviso non tiene conto della variazione, calcolare la tassa con il simulatore e
        comunicare le variazioni all'ufficio.
      status: verified
      source: mod-6
    - text: Le variazioni di tariffa sono di regola conteggiate a conguaglio (art. 12, c. 5).
      status: verified
      source: regolamento-2023
    - text: >-
        Codice ente F839 (codice catastale di Napoli) e codici tributo 3944 (TARI) e TEFA: non
        riportati nella pagina TARI 2026; controllarli sull'avviso o con il simulatore del Comune.
      status: unverified
