        notes: Solo per cittadini non UE.
      - label: scadenza (del documento di soggiorno)
        map: { direct: permesso_soggiorno.data_scadenza }
        notes: Solo per cittadini non UE.
      - { label: residente in, map: { direct: residenza.comune } }
      - { label: prov. (di residenza), map: { direct: residenza.provincia } }
      - { label: Stato (di residenza), map: { direct: residenza.stato }, notes: "Vuoto nel vault vuol dire Italia: scrivere Italia." }
      - { label: indirizzo, map: { direct: residenza.indirizzo } }
      - { label: n., map: { direct: residenza.civico } }
      - { label: C.A.P., map: { direct: residenza.cap } }
      - { label: PEC / posta elettronica, map: { fallback: [identity.pec, identity.email] } }
      - { label: Telefono fisso / cellulare, map: { direct: identity.phone } }
      - label: in qualità di (Titolare / Legale rappresentante / Altro)
        map: { fallback: [business.qualita_dichiarante, ruolo.tipo] }
        notes: Se il ruolo è diverso da titolare o legale rappresentante, chiedere e scriverlo in "Altro".
      # 2 – Dati della ditta/società/impresa
      - label: "2 – Dati della ditta/società/impresa: Denominazione"
        map: { direct: business.denominazione }
      - { label: Forma giuridica, map: { direct: business.forma_giuridica } }
      - label: codice fiscale / p. IVA
        map: { fallback: [business.codice_fiscale, business.partita_iva] }
      - label: iscritta alla C.C.I.A.A. di ... prov.
        map: { direct: business.cciaa }
