  - id: scia-acconciatore-estetista-campania-2019
    name: >-
      Segnalazione certificata di inizio attività per l'esercizio dell'attività di acconciatore e/o
      estetista, con Allegati A, B e C (modulistica unificata e standardizzata, Regione Campania,
      versione 2019)
    url: https://surap.regione.campania.it/Allegati/ModulisticaUnificata/Commercio/pdf/SCIA%20per%20l'esercizio%20dell'attivit%C3%A0%20di%20acconciatore%20e_o%20estetista%202019.pdf
    source: modello-scia-campania
    sha256: 6f61dd59b80f037d1910a8004fae2419ab68e3eb0673b43ade3a7ba6e36a0181
    signature_required: true
    fields:
      # Intestazione
      - label: "Al SUAP del Comune di – Indirizzo – PEC / Posta elettronica"
        map: { blank_with_reason: "SUAP del Comune di Napoli; nel modulo online è precompilato dal portale." }
      - label: Pratica / del / Protocollo
        map: { blank_with_reason: Compilato a cura del SUAP. }
      - label: "SCIA: Apertura / Trasferimento di sede; SCIA UNICA: + altre segnalazioni; SCIA CONDIZIONATA: + altre domande per acquisire atti d'assenso"
        map: { ask: "Si presentano insieme alla SCIA altre segnalazioni (es. insegna) o domande (es. AUA per lo scarico delle acque)?" }
        notes: >-
          Apertura senza altro: SCIA Apertura. Con la SCIA per l'insegna: SCIA UNICA. Con la domanda
          di AUA o di autorizzazione per l'insegna: SCIA CONDIZIONATA (non si apre fino agli atti di
          assenso).
