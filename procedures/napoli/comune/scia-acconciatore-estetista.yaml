  method: >-
    Desk: letto per intero il regolamento comunale per acconciatori, estetisti, tatuaggio e piercing
    (testo integrato DCC 18/2018 e 6/2021); le pagine SUAP del Comune di Napoli (servizio, contatti,
    unità organizzativa, diritti d'istruttoria), la tabella diritti SUAP 2026 e la guida pagoPA; i
    moduli regionali SURAP (SCIA acconciatore e/o estetista 2019 con Allegati A, B, C e Scheda
    anagrafica) e l'archivio moduli comunale del 2012; su Normattiva L. 174/2005 artt. 2, 3, 5, 6, L.
    1/1990 artt. 1, 3, 4, 8, 9, 12, D.L. 7/2007 art. 10, L. 443/1985 art. 5, L. 241/1990 art. 19.
  notes: >-
    Non aperta la scheda del procedimento su impresainungiorno (sezione protetta da captcha). Non
    letti il testo della L.R. Campania 11/2015, la Tabella A del D.Lgs. 222/2016 (riportata dal
    modello regionale) e l'ordinanza sindacale sugli orari.
