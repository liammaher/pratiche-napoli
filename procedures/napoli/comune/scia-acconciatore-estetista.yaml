steps:
  - do: >-
      Verificare che il titolare (o un socio) o un responsabile tecnico abbia l'abilitazione di
      acconciatore o la qualificazione di estetista; serve un responsabile tecnico diverso per ogni
      sede e per ogni attività
    who: owner
  - do: >-
      Far controllare il locale rispetto al regolamento comunale (art. 26: superficie minima, altezza
      3 m, pareti lavabili fino a 1,80 m, aeroilluminazione, lavandini, servizi igienici interni con
      antibagno, spogliatoio) e alle norme edilizie e di destinazione d'uso; per locali interrati o
      seminterrati chiedere prima la deroga all'ASL
    who: professional
  - do: >-
      Solo acconciatore: stimare il consumo d'acqua nel momento di massima attività; oltre 1 mc al
      giorno serve la domanda di AUA (SCIA condizionata)
    who: professional
  - do: Far preparare la planimetria quotata in scala 1:100 e la relazione descrittiva dei locali
    who: professional
  - do: >-
      Iscrivere l'impresa al Registro delle imprese (Comunicazione Unica) in modo che il responsabile
      tecnico risulti al REA insieme alla SCIA
    who: facilitator
  - do: Procurarsi firma digitale, PEC e accesso SPID, CIE o CNS; oppure affidare la pratica a un procuratore
    who: owner
  - do: Se si usa un procuratore, firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Compilare la pratica su impresainungiorno (SUAP di Napoli), aggiungendo SCIA per l'insegna o
      domanda di AUA se servono, e allegare planimetria, relazione e Allegati A, B o C
    who: facilitator
  - do: Calcolare i diritti d'istruttoria con la tabella SUAP 2026, sommando i procedimenti della pratica
    who: anyone
  - do: Pagare i diritti con pagoPA dalla sezione pagamenti della pratica
    who: owner
    human_only: true
  - do: Firmare digitalmente SCIA e allegati (dichiarante, soci, responsabile tecnico)
    who: owner
    human_only: true
  - do: Inviare la pratica al SUAP dal portale
    who: owner
    human_only: true
  - do: >-
      Aprire dopo aver ricevuto la ricevuta di avvio pratica (con AUA: solo dopo il rilascio), e
      comunque entro 60 giorni dalla SCIA
    who: owner
    human_only: true
  - do: Rispondere entro il termine indicato a eventuali richieste di conformazione del SUAP nei 60 giorni
    who: owner
after:
  - >-
    Tenere nel locale copia della SCIA presentata, esporre la tabella delle tariffe vicino alla cassa
    e il cartello con l'orario, visibile anche da fuori (art. 16 del regolamento).
  - >-
    Tenere ed esibire su richiesta la certificazione di idoneità sanitaria del personale (art. 29 del
    regolamento).
  - Conservare la ricevuta di avvio pratica, la ricevuta pagoPA e copia di quanto inviato; annotare l'ID pratica.
  - Presentare la dichiarazione TARI per uso non abitativo (napoli/comune/tari-iscrizione-non-domestica).
  - Per l'insegna esterna serve una SCIA per l'insegna di esercizio (napoli/comune/insegna-esercizio).
  - >-
    Comunicare al SUAP ogni variazione (per esempio il cambio del responsabile tecnico) entro 30
    giorni: la mancata comunicazione è un caso di particolare gravità per il regolamento (art. 32).
  - >-
    Affido di poltrona o di cabina, sospensione oltre 30 giorni, trasferimento, subingresso e
    cessazione si comunicano al SUAP con le pratiche apposite (artt. 9-15 e 18-21 del regolamento).
pitfalls:
  - text: >-
      Le pratiche SUAP inviate via PEC o email ordinaria non vengono istruite: l'unico canale è
      impresainungiorno. I moduli in PDF della Regione servono solo per preparare i dati.
    status: verified
    source: suap-contatti
  - text: >-
      Il Comune pubblica ancora un archivio di moduli SUAP del 2012 per acconciatori ed estetisti e una
      scheda del servizio del 2020: citano TARSU, ICI, COSAP, l'Albo delle imprese artigiane, la
      Commissione provinciale per l'artigianato, una vecchia pagina web e un orario di ricevimento non
      più validi. Non usarli.
    status: verified
    source: moduli-2012
  - text: >-
      Locali (art. 26 del regolamento): almeno 10 mq per un solo posto di lavoro di acconciatore, più 4
      mq per ogni posto in più, con almeno 1,50 m tra le postazioni; per l'estetista sala d'attesa
      apposita e superficie minima di 14 mq; sono esclusi ingresso, attesa, servizi e ripostigli. I
      servizi igienici devono essere interni (quelli esterni al locale non contano); negli esercizi
      misti uomo/donna servono servizi distinti per sesso.
    status: verified
    source: regolamento-napoli
  - text: >-
      Il responsabile tecnico deve essere presente durante l'attività (titolare, socio partecipante,
      familiare coadiuvante o dipendente). Lavorare senza responsabile tecnico è un caso di
      particolare gravità che comporta la sospensione dell'attività (art. 32 del regolamento).
    status: verified
    source: regolamento-napoli
  - text: >-
      Un acconciatore può far fare a familiari e dipendenti solo prestazioni semplici di manicure e
      pedicure estetico; per altri trattamenti estetici serve una SCIA da estetista con il suo
      responsabile tecnico.
    status: verified
    source: l174-art2
  - text: >-
      Iscrizione alla Camera di Commercio: il regolamento di Napoli vieta l'esercizio a chi non è
      iscritto al Registro delle imprese (art. 12, c. 4) e le leggi nazionali vogliono il responsabile
      tecnico iscritto al REA insieme alla SCIA; la Scheda anagrafica regionale invece ricorda che
      l'iscrizione va fatta entro 30 giorni dall'avvio. Per sicurezza iscriversi prima o insieme alla
      SCIA.
    status: disputed
    source: regolamento-napoli
  - text: >-
      Se l'impresa ha i requisiti di impresa artigiana (L. 443/1985), la qualifica si chiede alla Camera
      di Commercio con la Comunicazione Unica. Secondo le Camere di commercio campane, dal 2016 in
      Campania l'Albo delle imprese artigiane è sostituito dalla sezione speciale del Registro delle
      imprese (L.R. Campania 11/2015): non controllato sul testo della legge né con la CCIAA di Napoli.
    status: unverified
  - text: >-
      Gli orari li fissa il Sindaco con ordinanza (art. 17 del regolamento); la legge nazionale vieta di
      subordinare l'attività all'obbligo di chiusura infrasettimanale (D.L. 7/2007, art. 10).
      L'ordinanza in vigore non è stata controllata.
    status: verified
    source: dl7-art10
  - text: >-
      Il modulo online di impresainungiorno è la versione del SUAP di Napoli del modello regionale
      2019: possono esserci campi diversi. La mappatura qui segue il modello regionale.
    status: unverified
  - text: >-
      Non è stato controllato se il SUAP o l'ASL Napoli 1 chiedano altri documenti sanitari (il vecchio
      elenco allegati del 2011 citava un "certificato igienico sanitario"): il modello regionale 2019
      non lo prevede. In caso di dubbio chiedere al SUAP.
    status: unverified
