          La sigla della provincia (per esempio NA) indica la Camera di Commercio e la provincia.
          Se manca, è la sigla davanti al numero REA (business.rea, per esempio NA-123456): solo la
          sigla, mai il numero.
      - { label: n. REA, map: { direct: business.rea } }
      - label: non ancora iscritta / non necessita di iscrizione al R.I.
        map: { ask: "L'impresa non è ancora iscritta al Registro delle imprese?" }
