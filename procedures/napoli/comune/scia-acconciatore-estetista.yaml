schema_version: 0
id: napoli/comune/scia-acconciatore-estetista
title: SCIA per aprire un'attività di acconciatore (parrucchiere, barbiere) o di estetista – SUAP del Comune di Napoli
headline: "Aprire un parrucchiere, un barbiere o un centro estetico a Napoli: la SCIA"
aka:
  - licenza parrucchiere
  - licenza barbiere
  - aprire un salone di bellezza
  - licenza estetista
  - pratica SUAP
updated: 2026-10-26
summary: >-
  Chi vuole aprire a Napoli un salone di acconciatore (parrucchiere o barbiere) o un centro di
  estetica presenta una SCIA al SUAP del Comune, solo online su impresainungiorno. Serve un
  responsabile tecnico con l'abilitazione o la qualificazione professionale e locali conformi al
  regolamento comunale. Si può aprire dal giorno in cui la SCIA è presentata, salvo il caso del
  salone che consuma molta acqua (serve prima l'AUA).
ente:
  name: Comune di Napoli
  office: Area Sviluppo Economico – Servizio Sportello Unico Attività Produttive (SUAP)
  ipa: c_f839
applies_to:
  events: [open]
  audience: [business]
  sectors: [acconciatore, parrucchiere, barbiere, estetista, servizi alla persona]
  conditions:
    - text: >-
        Apertura di un nuovo esercizio di acconciatore e/o estetista nel Comune di Napoli. Il
        regolamento comunale si applica a ogni forma di esercizio, dovunque e da chiunque sia svolta,
        anche a titolo gratuito (art. 3). La SCIA serve anche per trasferimento di sede e
        subingresso (art. 8); questa scheda descrive l'apertura.
      status: verified
      source: regolamento-napoli
    - text: >-
        Il Servizio SUAP del Comune è competente per acconciatori e per centri estetici e abbronzanti.
      status: verified
      source: suap-uo
    - text: >-
        Acconciatore: trattamenti e servizi per l'aspetto estetico dei capelli, compresi i trattamenti
        tricologici complementari non sanitari, il taglio e il trattamento estetico della barba (art. 2
        L. 174/2005). Le attività di barbiere e parrucchiere per uomo e donna hanno preso il nome di
        "attività di acconciatore" (art. 6).
      status: verified
      source: l174-art2
    - text: >-
        Estetista: prestazioni e trattamenti sulla superficie del corpo per mantenerlo in perfette
        condizioni o migliorarne l'aspetto, con tecniche manuali, apparecchi elettromeccanici
        dell'elenco allegato alla legge e cosmetici; escluse le prestazioni a finalità terapeutica (art. 1
        L. 1/1990). Per il regolamento di Napoli truccatore, visagista, massaggiatore facciale,
        depilatore, manicure e pedicure estetico sono attività di estetista (art. 4).
      status: verified
      source: regolamento-napoli
    - text: >-
        Tatuaggio e piercing hanno requisiti propri (attestati e corso ASL, art. 6bis del regolamento)
        e un diritto d'istruttoria a parte: non sono coperti da questa scheda.
      status: verified
      source: regolamento-napoli
    - text: >-
        L'attività si può svolgere anche presso il domicilio dell'esercente, con locali in regola,
        indipendenti dall'abitazione, con ingresso separato e servizi igienici propri, consentendo i
        controlli; ai piani superiori serve una targa visibile dalla strada (artt. 13 e 26). Non è
        ammessa in forma itinerante o di posteggio.
      status: verified
      source: regolamento-napoli
legal_basis:
  - text: "L. 17 agosto 2005, n. 174, artt. 2 e 3 (acconciatore: SCIA al SUAP, abilitazione, responsabile tecnico)."
    status: verified
    source: l174-art3
  - text: "L. 4 gennaio 1990, n. 1, artt. 1, 3 e 8 (estetista: definizione, qualificazione, responsabile tecnico)."
    status: verified
    source: l1-art3
  - text: >-
      D.L. 31 gennaio 2007, n. 7, art. 10, c. 2 (conv. L. 40/2007): niente distanze minime, limiti
      numerici od obbligo di chiusura infrasettimanale; restano qualificazione professionale e
      conformità urbanistica e igienico-sanitaria dei locali.
    status: verified
    source: dl7-art10
  - text: >-
      Regolamento comunale per l'esercizio delle attività di acconciatore, estetista, tatuaggio e
      piercing (DCC n. 18 del 16/04/2018, modificato con DCC n. 6 del 23/03/2021).
    status: verified
    source: regolamento-napoli
  - text: "D.Lgs. 222/2016, Tabella A, Sezione I (regime amministrativo: SCIA), come indicato nel modello regionale."
    status: verified
    source: modello-scia-campania
  - text: "Legge 241/1990, art. 19 (SCIA: avvio dalla presentazione, controlli entro 60 giorni)."
    status: verified
    source: l241-art19
deadline:
  summary:
    text: >-
      Prima di aprire: si apre appena arriva la ricevuta della SCIA, ma l'acconciatore che consuma
      più di 1 mc d'acqua al giorno deve aspettare il rilascio dell'AUA; il salone va aperto entro 60
      giorni dalla SCIA, salvo proroga. Entro 60 giorni il Comune può vietare l'attività o chiedere
      di mettersi in regola, dando almeno 30 giorni.
    status: verified
    source: suap-servizio
  rules:
    - text: >-
        La SCIA va presentata prima di aprire: l'attività può iniziare dalla data di inoltro (art. 8,
        c. 2 del regolamento). A Napoli l'avvio è possibile appena arriva la ricevuta di avvio pratica
        telematica del SUAP.
      status: verified
      source: suap-servizio
    - text: >-
        Acconciatore con consumo d'acqua giornaliero superiore a 1 mc nel momento di massima attività:
        serve una SCIA condizionata con la domanda di AUA (Autorizzazione Unica Ambientale) e non si può
        iniziare fino al rilascio dell'AUA (art. 8, cc. 3-4).
      status: verified
      source: regolamento-napoli
    - text: >-
        Si decade dal diritto di esercitare se l'esercizio non è attivato entro 60 giorni dalla
        presentazione della SCIA, salvo proroga (art. 33, c. 1, lett. a).
      status: verified
      source: regolamento-napoli
    - text: >-
        Entro 60 giorni dal ricevimento l'amministrazione, se mancano requisiti o presupposti, vieta la
        prosecuzione dell'attività o, se si può rimediare, invita a conformarsi entro un termine di
        almeno 30 giorni.
      status: verified
      source: l241-art19
  lateness:
    text: >-
      Il regolamento comunale (art. 31) prevede, previa contestazione, la cessazione immediata
      dell'attività e una sanzione: per l'acconciatore senza SCIA o senza requisiti da 250,00 a
      5.000,00 euro; per l'estetista senza SCIA da 516,46 a 1.032,91 euro e senza requisiti
      professionali da 516,46 a 2.582,28 euro. L'importo concreto lo stabilisce l'autorità che
      contesta la violazione.
    status: verified
    source: regolamento-napoli
cost:
  text: >-
    Diritti d'istruttoria SUAP (tabella 2026), con pagoPA nella pratica: 100 euro per un salone di
    acconciatore, 100 euro per un centro di estetista (si sommano se si aprono entrambe le
    attività), 200 euro per l'acconciatore che chiede anche l'AUA per lo scarico delle acque. La
    SCIA per l'insegna costa altri 100 euro. L'imposta di bollo è dovuta solo con la SCIA
    condizionata (per esempio con l'AUA).
  status: verified
  source: tabella-2026
duration:
  text: >-
    Si apre il giorno stesso, appena arriva la ricevuta di avvio pratica del SUAP, e il SUAP ha 60
    giorni per i controlli. Se l'acconciatore consuma più di 1 mc d'acqua al giorno nel momento di
    massima attività serve prima l'AUA e si apre solo dopo il rilascio. Il salone va comunque
    aperto entro 60 giorni dalla SCIA, salvo proroga, altrimenti si decade.
  status: verified
  source: regolamento-napoli
appointment:
  text: >-
    Non serve: la SCIA si presenta solo online su impresainungiorno. Per informazioni e assistenza
    il SUAP (Piazza Cavour 42) riceve solo su prenotazione online, con il pulsante "Prenota
    appuntamento" della pagina "Avviare, variare, chiudere un'attività produttiva" del Comune.
  status: verified
  source: suap-contatti
channels:
  - type: portal
    purpose: procedure
    name: impresainungiorno – SUAP di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: suap-servizio
    notes: >-
      Unico canale per le pratiche SUAP di Napoli. Servono email, PEC, kit di firma digitale e
      accesso con SPID, CIE, CNS (o eIDAS, Telemaco). Il percorso nel portale non è stato
      controllato: la sezione informativa richiede un captcha.
  - type: pec
    purpose: info
    address: suap@pec.comune.napoli.it
    receipt: legal
    source: suap-contatti
    notes: >-
      Solo per comunicare con l'ufficio: le pratiche trasmesse via PEC o email ordinaria non vengono
      istruite.
  - type: email
    purpose: info
    address: suaponline@comune.napoli.it
    receipt: informal
    source: suap-contatti
    notes: Solo per informazioni; non per presentare la SCIA.
  - type: desk
    purpose: info
    name: Servizio SUAP
    address: Piazza Cavour 42, II piano, Napoli
    booking: >-
      Dal 18 maggio 2026 solo su prenotazione online (pulsante "Prenota appuntamento" della pagina
      "Avviare, variare, chiudere un'attività produttiva").
    source: suap-contatti
    notes: >-
      Informazioni e assistenza; la SCIA si presenta comunque online. La pagina contatti elenca un
      gruppo di referenti per acconciatori, centri estetici e abbronzanti, tatuatori e piercing.
  - type: phone
    purpose: info
    address: 081 7953054
    source: suap-servizio
payment:
  method: pagopa
  notes:
    - text: >-
        Dall'11 giugno 2026 le pratiche telematiche SUAP pagano i diritti d'istruttoria della nuova
        tabella approvata con la DGC n. 239 del 28 maggio 2026.
      status: verified
      source: diritti
    - text: >-
        Diritti d'istruttoria SUAP 2026, apertura:
        attività di acconciatore (parrucchiere e barbiere) 100,00 euro (riga S150); acconciatore + AUA
        per scarico acque 200,00 euro (S151); attività di estetista 100,00 euro (S152). Importi
        "invariati" rispetto alla tabella precedente.
      status: verified
      source: tabella-2026
    - text: >-
        Si pagano con pagoPA dentro la pratica su impresainungiorno. Se la pratica unisce più
        procedimenti (SCIA unica o condizionata) si sommano gli importi dei singoli procedimenti
        (logica del carrello): per esempio acconciatore ed estetista nella stessa pratica, o insieme
        alla SCIA per l'insegna (100,00 euro, riga S204).
      status: verified
      source: guida-pagopa
    - text: >-
        Imposta di bollo: secondo il modello regionale è obbligatoria solo quando con la SCIA si
        presenta una domanda (SCIA condizionata, per esempio con l'AUA).
      status: verified
      source: modello-scia-campania
documents:
  - name: Scheda anagrafica + SCIA per l'esercizio dell'attività di acconciatore e/o estetista, compilate sul portale e firmate digitalmente
    required: true
  - name: Planimetria quotata dei locali in scala minima 1:100, con layout di superfici, attrezzature e arredi
    required: true
    notes: Sempre obbligatoria secondo il modello regionale, tranne nell'affitto di poltrona.
  - name: Relazione descrittiva delle caratteristiche dei locali, della loro localizzazione e dell'attrezzatura utilizzata
    required: true
    notes: Sempre obbligatoria secondo il modello regionale, tranne nell'affitto di poltrona.
  - name: Allegato B (acconciatore) o Allegato C (estetista) – dichiarazione del responsabile tecnico sui requisiti, con documento d'identità
    required: false
    notes: Se il responsabile tecnico è una persona diversa dal dichiarante.
  - name: Dichiarazione di accettazione del responsabile tecnico, con documento d'identità
    required: false
    notes: Se il responsabile tecnico è una persona diversa dal dichiarante.
  - name: Allegato A – dichiarazione antimafia degli altri soci, con documento d'identità
    required: false
    notes: Sempre, se nella società ci sono soggetti diversi dal dichiarante.
  - name: Procura speciale/delega
    required: false
    notes: Se la pratica è presentata da un procuratore o da un'agenzia per le imprese.
  - name: Copia del documento d'identità del titolare
    required: false
    notes: Solo se la SCIA non è firmata digitalmente e non c'è procura.
  - name: Documentazione per l'AUA (scarico delle acque)
    required: false
    notes: Solo per l'acconciatore con consumo d'acqua oltre 1 mc al giorno nel momento di massima attività (SCIA condizionata).
  - name: SCIA (o domanda di autorizzazione) per l'insegna di esercizio
    required: false
    notes: Se è prevista un'insegna esterna (procedura napoli/comune/insegna-esercizio).
  - name: Ricevuta pagoPA dei diritti d'istruttoria SUAP
    required: true
    notes: Il portale la genera dentro la pratica.
