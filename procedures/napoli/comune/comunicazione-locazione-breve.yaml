schema_version: 0
id: napoli/comune/comunicazione-locazione-breve
title: Locazione breve turistica a Napoli senza impresa (Comunicazione al SUAP, CUSR, CIN, Alloggiati Web)
headline: "Affitti brevi a Napoli senza partita IVA: comunicazione al SUAP, CUSR e CIN"
aka:
  - affitto turistico
  - Airbnb
  - locazione turistica
  - codice identificativo nazionale
updated: 2026-10-26
summary: >-
  Chi, come persona fisica e senza fare impresa, affitta a Napoli un appartamento a uso abitativo
  per soggiorni fino a 30 giorni (locazione breve, art. 4 D.L. 50/2017) presenta prima di iniziare
  una Comunicazione al SUAP del Comune su impresainungiorno, riceve dal Comune il codice regionale
  CUSR, chiede il CIN nazionale e lo espone, comunica gli ospiti su Alloggiati Web e riscuote
  l'imposta di soggiorno. Dal periodo d'imposta 2026 chi destina alla locazione breve più di due
  appartamenti è considerato un'impresa e deve presentare invece una SCIA.
ente:
  name: Comune di Napoli
  office: Area Sviluppo Economico – Servizio Sportello Unico Attività Produttive (SUAP)
  ipa: c_f839
applies_to:
  events: [open]
  audience: [resident]
  sectors: [locazioni brevi, affitti turistici fino a 30 giorni]
  conditions:
    - text: >-
        Locazioni brevi (art. 4, c. 1, D.L. 50/2017): contratti di locazione di immobili a uso
        abitativo di durata non superiore a 30 giorni, compresi quelli con fornitura di biancheria e
        pulizia dei locali, stipulati da persone fisiche fuori dall'esercizio di attività d'impresa,
        direttamente o tramite intermediari immobiliari o portali telematici.
      status: verified
      source: dl-50-art4
    - text: >-
        Per il SUAP di Napoli la locazione breve senza impresa si avvia con una Comunicazione (non
        una SCIA) su impresainungiorno; può presentarla anche chi non è proprietario ma ha un valido
        titolo di disponibilità dell'immobile. L'immobile deve avere destinazione d'uso
        abitativa/residenziale.
      status: verified
      source: indicazioni-rev2
    - text: >-
        Secondo il SUAP non sono ammessi servizi accessori come la prima colazione né la
        somministrazione di alimenti e bevande: gli unici servizi consentiti sono la fornitura di
        biancheria e asciugamani al check-in e la pulizia al check-out. Con la colazione si tratta
        di un B&B (procedura separata).
      status: verified
      source: indicazioni-rev2
    - text: >-
        Numero di appartamenti (art. 1, c. 595, L. 178/2020, testo in vigore dal 1° gennaio 2026):
        il regime fiscale delle locazioni brevi, con effetto dal periodo d'imposta 2026, è
        riconosciuto solo se si destinano alla locazione breve non più di due appartamenti per
        ciascun periodo d'imposta. Negli altri casi l'attività, da chiunque esercitata, si presume
        svolta in forma imprenditoriale ai sensi dell'art. 2082 del codice civile; vale anche per i
        contratti conclusi tramite intermediari o portali. Fino al periodo d'imposta 2025 il limite
        era di quattro appartamenti.
      status: verified
      source: l178-c595
    - text: >-
        Chi esercita la locazione breve in forma imprenditoriale, anche per effetto del c. 595,
        deve presentare una SCIA al SUAP del Comune (art. 13-ter, c. 8, D.L. 145/2023); se
        l'attività è svolta tramite società, la SCIA la presenta il legale rappresentante. A Napoli
        la SCIA per la locazione breve imprenditoriale richiede planimetria del tecnico e diritti di
        200 euro: non è oggetto di questa scheda.
      status: verified
      source: dl-145-art13ter
    - text: >-
        Secondo il SUAP, sentiti uffici ed enti competenti, nella locazione breve si arriva al
        massimo a 6 camere (se con bagno interno), senza limite fissato di posti letto. Valgono i
        requisiti igienico-sanitari del D.M. Sanità 5 luglio 1975: soggiorno/cucina di almeno 14 mq,
        camere di 9 mq (singola) e 14 mq (doppia), più 8 mq per ogni posto letto in più (anche nel
        soggiorno, oltre i 14 mq minimi); monolocale di almeno 28 mq per una persona e 38 mq per due.
      status: verified
      source: indicazioni-rev2
    - text: >-
        Centro storico: la variante urbanistica approvata con la delibera C.C. 129 del 15 settembre
        2026 mette le locazioni brevi che conservano i requisiti delle residenze e non sono gestite
        in forma imprenditoriale nella sottocategoria a.2 (abitazioni assimilabili a strutture
        ricettive extralberghiere); quelle senza i requisiti delle residenze o gestite in forma
        imprenditoriale vanno nella sottocategoria c.2 (attività ricettive).
      status: verified
      source: variante-dcc-129
    - text: >-
        L'area di regolamentazione (tavola 7a) è una parte del centro storico all'intersezione tra la
        zona A del Prg e la Buffer Zone UNESCO, esclusi i quartieri a bassa pressione turistica.
      status: verified
      source: variante-pagina
    - text: >-
        Nell'area di regolamentazione della tavola 7a il mutamento di destinazione d'uso da a.1 (abitazione ordinaria) ad a.2,
        da conseguire con idoneo titolo abilitativo, è limitato da una soglia minima di residenzialità
        ordinaria che in prima applicazione è il 70% della superficie catastale dell'intero edificio.
        Il meccanismo di verifica e le modalità applicative sono rinviati a un provvedimento di
        Giunta.
      status: verified
      source: variante-dcc-129
    - text: >-
        Le fonti lette non dicono quale titolo abilitativo serva per passare da a.1 ad a.2, se la
        Comunicazione al SUAP sia già vincolata alla soglia, se la variante sia stata pubblicata sul
        BURC (è efficace dal giorno dopo) né se la Giunta abbia fissato il meccanismo di verifica:
        per un appartamento nel centro storico chiedere al SUAP o al Servizio Pianificazione
        urbanistica prima di iniziare.
      status: unverified
legal_basis:
  - text: >-
      D.L. 24 aprile 2017, n. 50, art. 4 (regime fiscale delle locazioni brevi: definizione,
      cedolare secca, obblighi degli intermediari, responsabilità per l'imposta di soggiorno), testo
      in vigore fino al 31 dicembre 2026.
    status: verified
    source: dl-50-art4
  - text: >-
      L. 30 dicembre 2020, n. 178, art. 1, c. 595 (limite di appartamenti e presunzione di attività
      d'impresa), testo in vigore fino al 31 dicembre 2026.
    status: verified
    source: l178-c595
  - text: >-
      Dal 1° gennaio 2027 queste norme sono abrogate e il loro contenuto passa agli artt. 207
      (regime fiscale, limite di due appartamenti) e 208 (intermediari e imposta di soggiorno) del
      Testo unico delle imposte sui redditi approvato con D.Lgs. 19 giugno 2026, n. 117 (art. 377:
      si applica dal 1° gennaio 2027).
    status: verified
    source: dlgs-117-2026
  - text: >-
      D.L. 18 ottobre 2023, n. 145, art. 13-ter, convertito dalla L. 191/2023: CIN, obbligo di
      esporlo e di indicarlo negli annunci (c. 6), dispositivi di sicurezza (c. 7), SCIA per la
      forma imprenditoriale (c. 8), sanzioni (c. 9), controlli del Comune tramite la polizia locale
      (c. 11).
    status: verified
    source: dl-145-art13ter
  - text: >-
      L.R. Campania 7 agosto 2019, n. 16, art. 13, come modificata dalla L.R. 5 luglio 2023, n. 11
      (comunicazione al Comune, CUSR, movimento turistico), con le DGR 64/2021 e 552/2023. Il testo
      della legge non è stato letto: gli obblighi sono riportati dalla guida regionale.
    status: verified
    source: guida-regione-2025
  - text: >-
      Art. 109 TULPS e D.M. Interno 7 gennaio 2013, modificato dal D.M. 16 settembre 2021
      (comunicazione degli ospiti alla Questura tramite Alloggiati Web).
    status: verified
    source: questura-napoli
  - text: >-
      D.M. Sanità 5 luglio 1975 (requisiti igienico-sanitari dei locali di abitazione), richiamato
      dal SUAP di Napoli per le locazioni brevi.
    status: verified
    source: indicazioni-rev2
deadline:
  summary:
    text: >-
      Prima di iniziare: comunicazione al SUAP e, prima di pubblicare annunci e affittare, il CIN
      (che si chiede dopo il CUSR). Poi: ospiti su Alloggiati Web entro 24 ore dall'arrivo (per
      soggiorni sotto le 24 ore le fonti non concordano), movimento turistico alla Regione ogni
      mese, imposta di soggiorno con iscrizione su GEIS all'inizio dell'attività e dichiarazione e
      versamento entro il 15 del mese dopo ogni trimestre.
    status: disputed
    source: guida-regione-2025
  rules:
    - text: >-
        La comunicazione al Comune va fatta prima dell'inizio dell'attività di locazione, insieme
        alla dichiarazione sul rispetto dei requisiti igienico-sanitari e di sicurezza dell'alloggio,
        che il Comune può verificare.
      status: verified
      source: guida-regione-2025
    - text: >-
        Il CIN va indicato in ogni annuncio ovunque pubblicato e comunicato ed esposto all'esterno
        dello stabile: va quindi ottenuto prima di pubblicare annunci e di affittare. In Campania si
        chiede solo dopo aver ricevuto il CUSR dal Comune.
      status: verified
      source: dl-145-art13ter
    - text: Le generalità degli ospiti vanno comunicate su Alloggiati Web entro 24 ore dall'arrivo.
      status: verified
      source: questura-napoli
    - text: >-
        Soggiorni inferiori a 24 ore: la Questura di Napoli indica entro 6 ore (citando il D.M. 16
        settembre 2021), mentre la home page di Alloggiati Web dice che le generalità vanno inviate
        all'arrivo stesso (citando il D.M. 7 gennaio 2013).
      status: disputed
      source: questura-napoli
    - text: >-
        Movimento turistico: comunicazione mensile, con specifica giornaliera, alla Regione (la
        legge parla di "Rilevatore Turistico Regionale"; la guida indica la piattaforma Sinfonia
        Turismo SMART). Le locazioni brevi non hanno l'obbligo di comunicare i prezzi.
      status: verified
      source: guida-regione-2025
    - text: >-
        Imposta di soggiorno: iscrizione su GEIS all'inizio dell'attività, dichiarazione e
        versamento trimestrali entro il 15 del mese successivo alla fine di ogni trimestre (dettagli
        nella procedura napoli/comune/imposta-di-soggiorno-gestori).
      status: verified
      source: avviso-2026
  lateness:
    text: >-
      La mancata comunicazione al Comune dell'avvio della locazione breve comporta una sanzione del
      Comune da 500,00 a 2.000,00 euro (guida regionale). L'unità priva di CIN è punita con una
      sanzione da 800 a 8.000 euro in relazione alle dimensioni dell'immobile (art. 13-ter, c. 9).
      Per l'importo nel caso concreto chiedere al SUAP o alla Polizia locale.
    status: verified
    source: guida-regione-2025
cost:
  text: >-
    Secondo la tabella dei diritti SUAP in vigore dall'11 giugno 2026 la Comunicazione costa 50
    euro di diritti d'istruttoria (riga S210), da pagare con pagoPA nella pratica. Le indicazioni
    operative del SUAP e la pagina del Comune, precedenti, dicono invece che non sono previsti né
    diritti né marche da bollo: pagare l'importo che chiede il portale.
  status: disputed
  source: tabella-2026
duration:
  text: >-
    La Comunicazione va presentata prima di iniziare, ma per pubblicare annunci serve il CIN, che
    in Campania si chiede solo dopo aver ricevuto il CUSR, trasmesso dal Comune via email o PEC.
    Le fonti lette non dicono in quanto tempo il Comune assegna il CUSR.
  status: verified
  source: guida-regione-2025
appointment:
  text: >-
    Non serve: la Comunicazione si presenta solo online su impresainungiorno. Lo sportello SUAP di
    Piazza Cavour 42 (II piano) riceve dal 18 maggio 2026 solo su prenotazione online, con il
    pulsante "Prenota appuntamento" della pagina "Avviare, variare, chiudere un'attività
    produttiva".
  status: verified
  source: suap-contatti
channels:
  - type: portal
    purpose: procedure
    name: impresainungiorno – SUAP di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: suap-contatti
    notes: >-
      Unico canale telematico per le pratiche SUAP, compresa la Comunicazione di locazione breve.
      Serve la firma digitale del titolare o di un procuratore. Il percorso esatto nel portale non è
      stato verificato.
  - type: pec
    purpose: info
    address: suap@pec.comune.napoli.it
    receipt: legal
    source: suap-contatti
    notes: Solo per comunicare con l'ufficio; le pratiche inviate via PEC o email ordinaria non vengono istruite.
  - type: email
    purpose: info
    address: suaponline@comune.napoli.it
    receipt: informal
    source: suap-contatti
    notes: Solo per informazioni.
  - type: phone
    purpose: info
    address: 081 7953052
    hours: martedì, mercoledì e venerdì 14:00–15:00
    source: suap-contatti
    notes: Referente SUAP indicato per le locazioni brevi.
  - type: desk
    purpose: info
    name: Servizio SUAP
    address: Piazza Cavour 42, II piano, Napoli
    booking: >-
      Dal 18 maggio 2026 solo su prenotazione online (pulsante "Prenota appuntamento" della pagina
      "Avviare, variare, chiudere un'attività produttiva").
    source: suap-contatti
  - type: portal
    purpose: related
    name: BDSR – Banca dati strutture ricettive del Ministero del Turismo (CIN)
    url: https://bdsr.ministeroturismo.gov.it/
    auth: [spid, cie]
    source: guida-regione-2025
    notes: Si usa dopo aver ricevuto il CUSR dal Comune ("Ottieni CIN", inserendo il CUSR di 15 caratteri).
  - type: portal
    purpose: related
    name: Alloggiati Web – Polizia di Stato
    url: https://alloggiatiweb.poliziadistato.it/
    receipt: informal
    source: questura-napoli
    notes: >-
      Le credenziali si chiedono al Commissariato di P.S. competente per l'indirizzo dell'alloggio
      (modulo della Questura di Napoli). Le ricevute vanno scaricate e conservate 5 anni.
  - type: portal
    purpose: related
    name: Sinfonia Turismo SMART – Regione Campania (movimento ospiti)
    url: https://turismo.regione.campania.it/turismoweb/fe-portale-turismo/login
    auth: [spid, cie, cns]
    source: guida-regione-2025
    notes: Assistenza supporto.strutturericettive@regione.campania.it.
  - type: portal
    purpose: related
    name: GEIS Portal – imposta di soggiorno (Comune di Napoli)
    url: https://cizrm.municipia.eng.it/?ente=NAPO
    source: geis-iscrizione
    notes: >-
      Nuovi gestori: "Domande Online" → "Procedimenti Tributi Comune di Napoli" → "Nuovo gestore
      struttura". Procedura separata (napoli/comune/imposta-di-soggiorno-gestori).
payment:
  method: pagopa
  notes:
    - text: >-
        Tabella dei diritti d'istruttoria SUAP in vigore dall'11 giugno 2026 (DGC 239/2026), riga
        S210 "Locazioni brevi non imprenditoriali": 50,00 euro in apertura, 40,00 euro nella colonna
        VCA (variazioni come subentro o cambio di sede, 80% dell'importo pieno secondo la delibera),
        nessun importo nella colonna VPF. La riga S209 "Locazioni brevi imprenditoriali" indica
        200,00 euro in apertura.
      status: verified
      source: tabella-2026
    - text: >-
        Secondo la delibera non pagano diritti le mere comunicazioni di cessazione; la tabella si
        applica alle pratiche dall'11 giugno 2026.
      status: verified
      source: dgc-239-2026
    - text: >-
        Le indicazioni operative del SUAP (anche la revisione del 20 maggio 2026) e la pagina del
        Comune sulle locazioni brevi dicono invece che per la Comunicazione non sono previsti diritti
        d'istruttoria né marche da bollo. Sono anteriori alla tabella in vigore dall'11 giugno 2026:
        controllare l'importo che il portale chiede nella pratica o chiedere al SUAP (081 7953052).
      status: disputed
      source: indicazioni-rev2
    - text: >-
        La pagina dei diritti SUAP pubblica avvisi sui rimborsi di diritti versati per errore nel
        2024 e nel 2025 "sia per comunicazioni di locazione breve che per le altre pratiche".
      status: verified
      source: diritti
    - text: >-
        I diritti SUAP si pagano con pagoPA dentro la pratica su impresainungiorno. La richiesta del
        CUSR al Comune e del CIN al Ministero non risultano a pagamento nelle fonti lette.
      status: unverified
documents:
  - name: Comunicazione di locazione breve compilata su impresainungiorno e firmata digitalmente
    required: true
  - name: Documento di riconoscimento in corso di validità del titolare dell'attività
    required: true
  - name: >-
      Planimetria dell'immobile in scala 1:50 con superfici, altezze, destinazioni d'uso di tutti i
      locali e numero di posti letto per vano, timbrata e firmata in calce (con documento del
      tecnico) o firmata digitalmente da un tecnico iscritto all'albo
    required: true
    notes: >-
      Richiesta dalle indicazioni operative del SUAP rev. 2 (maggio 2026); la pagina del Comune
      aggiornata il 22/05/2026 e le indicazioni del 2024 non la elencano.
  - name: >-
      Dichiarazione sul rispetto dei requisiti igienico-sanitari e di sicurezza dell'alloggio
    required: true
    notes: >-
      Prevista dalla legge regionale secondo la guida regionale; non è chiaro se sia una casella del
      modulo online o un allegato.
  - name: Dichiarazione sul rispetto dell'art. 2 del D.M. 5 luglio 1975 per la parte abitabile destinata agli ospiti
    required: false
    notes: >-
      Secondo la pagina del Comune solo in caso di locazione parziale; per un monolocale va allegata
      una dichiarazione o indicato "monolocale" nella descrizione.
  - name: Procura speciale firmata dal locatore
    required: false
    notes: >-
      Solo se la Comunicazione è firmata e inviata da un altro soggetto o tecnico; non deve essere
      incompleta, non firmata o con anomalie nella firma.
  - name: Ricevuta pagoPA dei diritti d'istruttoria
    required: false
    notes: Se il portale chiede i 50 euro della riga S210 (vedi pagamento).
