steps:
  - do: >-
      Controllare che sia davvero una locazione breve senza impresa: persona fisica, immobile a uso
      abitativo, contratti fino a 30 giorni, nessun servizio oltre biancheria e pulizia, e al
      massimo due appartamenti in locazione breve nel periodo d'imposta (dal 2026). Con più
      appartamenti, con una società o con la colazione servono altre procedure (SCIA per la
      locazione imprenditoriale, B&B)
    who: anyone
  - do: >-
      Controllare con un tecnico che l'appartamento rispetti i requisiti del D.M. 5 luglio 1975
      indicati dal SUAP (altezze, superfici di camere e soggiorno, finestre apribili, bagno completo)
    who: professional
  - do: >-
      Se l'appartamento è nel centro storico, controllare sulla tavola 7a della variante se è
      nell'area di regolamentazione e chiedere al SUAP o al Servizio Pianificazione urbanistica come
      si applica la soglia del 70%
    who: anyone
  - do: >-
      Installare rilevatori funzionanti di gas combustibili e di monossido di carbonio ed estintori
      portatili a norma (uno ogni 200 mq di pavimento o frazione, almeno uno per piano, in posizioni
      accessibili e visibili vicino agli accessi e alle aree di maggior pericolo)
    who: owner
    human_only: true
  - do: Farsi preparare dal tecnico la planimetria in scala 1:50 firmata
    who: professional
  - do: Procurarsi firma digitale e accesso SPID, CIE o CNS; oppure affidare la pratica a un procuratore
    who: owner
  - do: Se si usa un procuratore, firmare la procura speciale
    who: owner
    human_only: true
  - do: Compilare la Comunicazione di locazione breve su impresainungiorno (SUAP di Napoli) e allegare i documenti
    who: facilitator
  - do: Se il portale chiede i diritti d'istruttoria (50 euro, riga S210), pagarli con pagoPA dalla pratica
    who: owner
    human_only: true
  - do: Firmare digitalmente la Comunicazione e inviarla al SUAP dal portale, prima di iniziare
    who: owner
    human_only: true
  - do: Attendere il CUSR, che il Comune trasmette via email o PEC e pubblica nell'elenco CUSR
    who: office
  - do: Chiedere il CIN sulla BDSR con SPID o CIE, scegliendo "Ottieni CIN" e inserendo il CUSR
    who: owner
    human_only: true
  - do: Esporre il CIN all'esterno dello stabile (rispettando eventuali vincoli) e indicarlo in ogni annuncio
    who: owner
  - do: Chiedere le credenziali Alloggiati Web al Commissariato competente con il modulo della Questura
    who: owner
    human_only: true
  - do: >-
      Iscriversi su GEIS come nuovo gestore per l'imposta di soggiorno (procedura
      napoli/comune/imposta-di-soggiorno-gestori)
    who: owner
    human_only: true
  - do: Accedere a Sinfonia Turismo SMART per la comunicazione mensile del movimento degli ospiti
    who: owner
  - do: >-
      Presentare o aggiornare la dichiarazione TARI dell'appartamento (procedura
      napoli/comune/tari-iscrizione-uso-abitativo), indicando se si vuole il numero massimo
      potenziale di occupanti invece dei 6 convenzionali
    who: owner
    human_only: true
  - do: >-
      Decidere con il professionista se optare per la cedolare secca nella dichiarazione dei
      redditi e quale unità indicare per l'aliquota del 21%
    who: professional
after:
  - Conservare la ricevuta della pratica SUAP, l'eventuale ricevuta pagoPA e copia di quanto inviato.
  - Annotare CUSR e CIN; controllare che compaiano nell'elenco CUSR pubblicato dal Comune.
  - >-
    Comunicare su Alloggiati Web ogni ospite entro 24 ore dall'arrivo; scaricare le ricevute e
    conservarle 5 anni.
  - Comunicare ogni mese alla Regione il movimento degli ospiti, con il dettaglio giornaliero.
  - >-
    Imposta di soggiorno: dichiarazione e versamento trimestrali su GEIS entro il 15 del mese
    successivo; dichiarazione annuale nazionale (napoli/comune/imposta-di-soggiorno-gestori).
  - >-
    Variazioni (per esempio del titolare) e cessazione si comunicano al Comune tramite SUAP; per i
    dati legati al CUSR rivolgersi al Comune, non alla Regione.
  - >-
    Se nel periodo d'imposta si destina alla locazione breve un terzo appartamento, l'attività si
    presume imprenditoriale: serve la SCIA al SUAP (e i relativi adempimenti d'impresa).
pitfalls:
  - text: >-
      Diritti d'istruttoria: le indicazioni del SUAP dicono "non sono previsti diritti", ma la
      tabella in vigore dall'11 giugno 2026 indica 50 euro per le locazioni brevi non
      imprenditoriali (S210). Usare l'importo che il portale calcola e conservare la ricevuta.
    status: disputed
    source: tabella-2026
  - text: >-
      La guida regionale (29/10/2025) parla ancora di presunzione d'impresa dalla quinta attività
      ("più di quattro unità immobiliari"); il testo dell'art. 1, c. 595, L. 178/2020 in vigore dal
      1° gennaio 2026 fissa il limite a due appartamenti con effetto dal periodo d'imposta 2026. Vale
      il testo di legge.
    status: disputed
    source: l178-c595
  - text: >-
      La guida regionale dice che servono nuovi CUSR (e quindi nuovi CIN) quando le attività
      diventano imprenditoriali e si presenta la SCIA, anche per ognuna di quelle già avviate.
    status: verified
    source: guida-regione-2025
  - text: >-
      L'obbligo di rilevatori di gas e monossido di carbonio ed estintori riguarda tutte le unità
      date in locazione breve o turistica, anche senza impresa (art. 13-ter, c. 7, secondo periodo);
      i requisiti di sicurezza degli impianti del primo periodo sono scritti per le forme
      imprenditoriali. Senza rilevatori ed estintori la sanzione è da 600 a 6.000 euro per ciascuna
      violazione (c. 9).
    status: verified
    source: dl-145-art13ter
  - text: >-
      La guida regionale attribuisce gli obblighi antincendio al comma 8 dell'art. 13-ter e li
      estende alla sicurezza degli impianti anche per la forma non imprenditoriale; nel testo vigente
      su Normattiva sono al comma 7 e la sicurezza degli impianti è legata alla forma imprenditoriale.
    status: disputed
    source: dl-145-art13ter
  - text: >-
      Mancata esposizione o indicazione del CIN: sanzione da 500 a 5.000 euro per ciascuna unità,
      con rimozione immediata dell'annuncio (art. 13-ter, c. 9). I controlli e le sanzioni spettano
      al Comune tramite la polizia locale (c. 11).
    status: verified
    source: dl-145-art13ter
  - text: >-
      In Campania il CIN non sostituisce il CUSR ma si aggiunge: senza CUSR rilasciato dal Comune non
      si ottiene il CIN. Se il CUSR non compare sulla BDSR, inviare copia della Comunicazione a
      supporto.strutturericettive@regione.campania.it.
    status: verified
    source: guida-regione-2025
  - text: >-
      Chi non usa il CUSR o lo riporta in modo errato o ingannevole rischia una sanzione del Comune
      da 500 a 1.000 euro per ogni attività promossa, commercializzata o comunicata.
    status: verified
    source: guida-regione-2025
  - text: >-
      Le pratiche SUAP inviate via PEC o email ordinaria non vengono istruite: l'unico canale è
      impresainungiorno.
    status: verified
    source: suap-contatti
  - text: >-
      La pagina del Comune sulle locazioni brevi (aggiornata il 22/05/2026) e le indicazioni del 2024
      non chiedono la planimetria e parlano ancora del portale "TouristTax"; le indicazioni rev. 2
      allegate all'avviso SUAP del 20/05/2026 chiedono la planimetria 1:50 e rinviano a GEIS.
    status: disputed
    source: indicazioni-rev2
  - text: >-
      Cedolare secca sulle locazioni brevi: aliquota del 26%, ridotta al 21% per i redditi di una
      sola unità immobiliare scelta dal contribuente nella dichiarazione dei redditi (art. 4, c. 2,
      D.L. 50/2017). Le stesse regole valgono per sublocazioni e contratti onerosi del comodatario
      (c. 3).
    status: verified
    source: dl-50-art4
  - text: >-
      Se un intermediario o un portale residente incassa i canoni, trattiene una ritenuta d'acconto
      del 21% (art. 4, c. 5); chi incassa il canone o interviene nel pagamento è responsabile del
      pagamento dell'imposta di soggiorno e della dichiarazione (c. 5-ter).
    status: verified
    source: dl-50-art4
  - text: >-
      TARI: per le unità a uso abitativo destinate anche solo temporaneamente alle locazioni brevi si
      applica la tariffa dei nuclei di 6 componenti a uso continuativo, salvo diversa dichiarazione
      sul numero potenziale massimo di occupanti (Regolamento TARI, art. 14, c. 8).
    status: verified
    source: tari-regolamento
  - text: >-
      Dal 1° gennaio 2027 il limite dei due appartamenti è nell'art. 207, c. 4, del nuovo Testo
      unico delle imposte sui redditi, mentre l'art. 13-ter, c. 8, D.L. 145/2023 rinvia ancora al
      c. 595 della L. 178/2020, che da quella data è abrogato. Il contenuto della regola non cambia;
      non è stato verificato come verrà letto il rinvio.
    status: unverified
  - text: >-
      La Comunicazione si compila solo online: non esiste un modello scaricabile del SUAP di Napoli e
      il modulo online non è stato mappato in questa scheda.
    status: unverified
