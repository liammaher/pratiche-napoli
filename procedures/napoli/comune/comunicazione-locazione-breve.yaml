verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: letti le indicazioni operative del SUAP di Napoli (versione 2024 e revisione 2 del maggio
    2026), l'avviso SUAP del 20/05/2026, la pagina del Comune sulle locazioni brevi, la pagina
    contatti SUAP, la pagina dei diritti SUAP, la tabella diritti 2026 (S209-S210) e il testo OCR
    della DGC 239/2026, la pagina dell'elenco CUSR, la pagina di iscrizione a GEIS; la guida
    regionale del 29/10/2025; su Normattiva l'art. 4 D.L. 50/2017, l'art. 1 c. 595 L. 178/2020
    (versioni dal 2025 al 2027), gli artt. 207, 208 e 377 del Testo unico del D.Lgs. 117/2026 e
    l'art. 13-ter D.L. 145/2023; la pagina della Questura di Napoli, la home di Alloggiati Web e il
    modulo credenziali; l'art. 14 del Regolamento TARI; la pagina della variante del centro storico e
    il testo della DCC 129/2026.
  notes: >-
    Non letti il testo della L.R. 16/2019 come modificata dalla L.R. 11/2023 né le DGR 64/2021 e
    552/2023: gli obblighi regionali vengono dalla guida regionale. Non verificati il modulo e il
    percorso della Comunicazione su impresainungiorno, la pubblicazione della variante sul BURC e
    quale legge ha modificato il c. 595 dal 2026.
