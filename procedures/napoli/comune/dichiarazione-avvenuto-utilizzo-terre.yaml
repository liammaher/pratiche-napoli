schema_version: 0
id: napoli/comune/dichiarazione-avvenuto-utilizzo-terre
title: Dichiarazione di avvenuto utilizzo delle terre e rocce da scavo (D.A.U., art. 7 D.P.R. 120/2017) – Comune di Napoli e ARPAC, sul SUE
headline: "Terre e rocce da scavo a Napoli: la dichiarazione di avvenuto utilizzo, a utilizzo finito"
aka:
  - DAU terre e rocce
  - dichiarazione di avvenuto utilizzo
  - allegato 8 DPR 120/2017
updated: 2026-11-03
summary: >-
  Finito l'utilizzo delle terre e rocce da scavo come sottoprodotti, secondo il piano di utilizzo o
  la dichiarazione di utilizzo, l'esecutore o il produttore lo attesta con la dichiarazione di
  avvenuto utilizzo, entro il termine di validità del piano o della dichiarazione. Va all'autorità
  e all'ARPA del sito di destinazione e ai Comuni del sito di produzione e di destinazione. A Napoli
  si presenta sul portale "Impresa in un giorno". Senza, le terre e rocce perdono subito la qualifica
  di sottoprodotto.
ente:
  name: Comune di Napoli
  office: Sportello Unico Edilizia (istanze sul SUE), con ARPA Campania, Dipartimento Provinciale di Napoli
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata, ambiente]
  conditions:
    - text: >-
        L'utilizzo delle terre e rocce da scavo in conformità al piano di utilizzo o alla
        dichiarazione dell'art. 21 è attestato all'autorità competente con la dichiarazione di
        avvenuto utilizzo (art. 7 c. 1 D.P.R. 120/2017).
      status: verified
      source: dpr120-art7
    - text: >-
        La rende l'esecutore o il produttore con il modulo dell'Allegato 8, anche solo per via
        telematica, all'autorità e all'Agenzia di protezione ambientale del sito di destinazione e
        ai Comuni del sito di produzione e del sito di destinazione; la conserva per cinque anni (art.
        7 c. 2).
      status: verified
      source: dpr120-art7
    - text: >-
        Sul SUE di Napoli l'operazione "Dichiarazione di avvenuto utilizzo (D.A.U.) ai sensi
        dell'art. 7 del DPR n. 120/2017" è nel gruppo Terre e rocce da scavo e genera due
        adempimenti, agli uffici del Comune di Napoli - SUE e ad ARPA Campania, Dipartimento
        Provinciale di Napoli.
      status: verified
      source: portale-sue-operazioni
legal_basis:
  - text: "D.P.R. 13 giugno 2017, n. 120, art. 7 e Allegato 8."
    status: verified
    source: dpr120-art7
deadline:
  summary:
    text: >-
      Entro il termine di validità del piano di utilizzo o della dichiarazione dell'art. 21: dopo, le
      terre e rocce perdono con effetto immediato la qualifica di sottoprodotto (art. 7 c. 3).
    status: verified
    source: dpr120-art7
