steps:
  - do: Raccogliere dal cantiere le quantità effettivamente portate a ciascun sito di destinazione e le date
    who: professional
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione,
      compilare, allegare la dichiarazione (Allegato 8), firmare e inviare entro la validità del
      piano o della dichiarazione di utilizzo; conservare la ricevuta per cinque anni
    who: professional
    human_only: true
    channel: [portal]
