schema_version: 0
id: napoli/comune/permesso-in-sanatoria
title: Permesso di costruire in sanatoria – lavori già eseguiti senza permesso o in difformità (SUE del Comune di Napoli)
headline: "Permesso in sanatoria a Napoli: lavori già fatti che chiedevano il permesso di costruire"
aka:
  - accertamento di conformità
  - sanatoria edilizia
  - condono
  - veranda abusiva
  - salva casa
updated: 2026-10-30
summary: >-
  Chi ha eseguito senza permesso di costruire (o senza SCIA alternativa), o in totale difformità,
  lavori che ne avevano bisogno, li regolarizza con il permesso in sanatoria se sono conformi alla
  disciplina urbanistica ed edilizia sia di quando sono stati fatti sia di oggi (art. 36 DPR
  380/2001), pagando un'oblazione pari al doppio del contributo di costruzione. Per i lavori in
  parziale difformità dal permesso o con variazioni essenziali vale l'art. 36-bis. A Napoli si
  chiede allo Sportello Unico per l'Edilizia sul portale "Impresa in un giorno", rispondendo sì
  alla domanda sulla sanatoria del permesso di costruire.
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Per gli interventi realizzati in assenza di permesso di costruire o in totale difformità, il
        responsabile dell'abuso o l'attuale proprietario possono ottenere il permesso in sanatoria
        se l'intervento è conforme alla disciplina urbanistica ed edilizia vigente sia al momento
        della realizzazione sia al momento della presentazione della domanda (art. 36 c. 1 DPR
        380/2001).
      status: verified
      source: dpr380-art36
    - text: >-
        Il rilascio è subordinato al pagamento, a titolo di oblazione, del contributo di costruzione
        in misura doppia, o in caso di gratuità di una somma pari a quella dell'art. 16; sulla
        domanda il Comune si pronuncia entro sessanta giorni, decorsi i quali la richiesta si
        intende rifiutata (art. 36 c. 2-3).
      status: verified
      source: dpr380-art36
    - text: >-
        Per gli interventi in parziale difformità dal permesso di costruire, il responsabile o il
        proprietario possono ottenere il permesso in sanatoria se l'intervento è conforme alla
        disciplina urbanistica vigente al momento della presentazione della domanda e ai requisiti
        della disciplina edilizia vigente al momento della realizzazione (art. 36-bis c. 1).
      status: verified
      source: dpr380-art36bis
    - text: >-
        Sul SUE di Napoli la domanda del permesso di costruire "Le opere ricadono nell'ambito della
        Sanatoria?" aggiunge il quadro della sanatoria: in assenza o totale difformità (art. 36),
        o in parziale difformità o con variazioni essenziali (art. 36-bis). Nel caso dell'art.
        36-bis le due prese d'atto (l'oblazione e gli interventi a cui lo Sportello può
        subordinare il rilascio) si escludono a vicenda sul portale, e così nell'asseverazione
        della relazione tecnica i documenti allegati, la datazione dell'intervento e la proposta
        di interventi: il caso non si può dichiarare per intero (rilevato il 30/10/2026).
      status: verified
      source: portale-sue-operazioni
legal_basis:
  - text: "D.P.R. 380/2001, art. 36 (accertamento di conformità in assenza di titolo) e art. 36-bis, nel testo in vigore dal 28/07/2024."
    status: verified
    source: dpr380-art36
cost:
  text: >-
    Diritti di segreteria per gli accertamenti di conformità (artt. 36 e 36-bis): almeno 441,00 euro
    all'atto della presentazione (riga SUE 16), poi l'importo secondo lo scaglione; per l'art.
    36-bis c. 5 lett. b le righe SUE 17 e 18. A parte l'oblazione (il doppio del contributo di
    costruzione) e il compenso del tecnico.
  status: verified
  source: tabella-diritti
