    notes: Operazione del permesso di costruire, rispondendo sì alla domanda sulla sanatoria nelle scelte eventuali.
    use:
      ways: [web_form, upload]
      status: verified
      source: dd-501-2026
      notes: Si compila online; elaborati e allegati firmati digitalmente.
steps:
  - do: Incaricare un tecnico abilitato e firmare la procura speciale
    who: owner
    human_only: true
  - do: >-
      Stabilire con il tecnico lo stato legittimo, le difformità, se vale l'art. 36 o l'art. 36-bis,
      la data di realizzazione e il contributo di costruzione
    who: professional
  - do: Pagare i diritti di segreteria
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere il permesso di
      costruire e rispondere sì alla domanda sulla sanatoria, compilare, allegare i documenti
      firmati digitalmente e inviare
    who: professional
    human_only: true
    channel: [portal]
  - do: Pagare l'oblazione che lo Sportello determina, per il rilascio del permesso in sanatoria
    who: owner
    human_only: true
