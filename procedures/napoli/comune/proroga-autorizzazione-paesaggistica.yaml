    use:
      ways: [web_form, upload]
      status: verified
      source: dd-501-2026
      notes: Si compila online; gli allegati si firmano digitalmente.
steps:
  - do: Firmare la procura speciale se la comunicazione la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Verificare con il tecnico la data di scadenza dell'efficacia dell'autorizzazione (cinque anni
      dall'efficacia del titolo edilizio), che non sia già passata e che non siano sopravvenuti
      piani o provvedimenti di tutela in contrasto; calcolare la nuova scadenza
    who: professional
  - do: Se il titolare non è esclusivo, raccogliere la dichiarazione di assenso dei terzi titolari di diritti
    who: owner
    human_only: true
  - do: >-
      Prima della scadenza, accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli),
      scegliere l'operazione della proroga dell'autorizzazione paesaggistica, compilare, allegare i
      documenti firmati digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
