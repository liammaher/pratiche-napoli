schema_version: 0
id: napoli/comune/proroga-autorizzazione-paesaggistica
title: Comunicazione di proroga dell'efficacia dell'autorizzazione paesaggistica (art. 10-septies D.L. 21/2022) – Comune di Napoli, sul SUE
headline: "Autorizzazione paesaggistica in scadenza: la proroga straordinaria a Napoli"
aka:
  - proroga paesaggistica
  - proroga autorizzazione paesaggistica
  - proroga 10 septies paesaggistica
updated: 2026-11-04
summary: >-
  L'autorizzazione paesaggistica vale cinque anni, più un anno per finire i lavori iniziati nel
  quinquennio. La proroga straordinaria dell'art. 10-septies, oggi di quarantotto mesi, vale anche
  per i termini delle autorizzazioni paesaggistiche: chi vuole avvalersene lo comunica al Comune
  prima della scadenza, se il progetto non contrasta con piani o provvedimenti di tutela del
  paesaggio sopravvenuti. A Napoli la comunicazione si presenta sul portale "Impresa in un giorno".
  Un'autorizzazione già scaduta da meno di un anno si rinnova invece con l'art. 7 D.P.R. 31/2017.
ente:
  name: Comune di Napoli
  office: Sportello Unico Edilizia (istanze sul SUE)
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata, paesaggio]
  conditions:
    - text: >-
        L'autorizzazione paesaggistica è efficace per cinque anni, scaduti i quali i lavori vanno
        sottoposti a nuova autorizzazione; i lavori iniziati nel quinquennio possono essere conclusi
        entro l'anno successivo; il termine decorre dal giorno in cui diventa efficace il titolo
        edilizio necessario, salvo ritardi imputabili all'interessato (art. 146 c. 4 D.Lgs.
        42/2004).
      status: verified
      source: dlgs42-art146
    - text: >-
        L'art. 10-septies c. 1 a D.L. 21/2022 proroga di quarantotto mesi i termini dei permessi di
        costruire rilasciati o formatisi fino al 31 dicembre 2025, se non già decorsi al momento
        della comunicazione dell'interessato e salvo contrasto con nuovi strumenti urbanistici o
        con piani o provvedimenti di tutela dei beni culturali o del paesaggio, e applica la stessa
        disposizione "anche ai termini relativi ... delle autorizzazioni paesaggistiche".
      status: verified
      source: dl21-art10septies
    - text: >-
        Sul SUE di Napoli l'operazione "Proroga autorizzazione paesaggistica (art. 10 septies, Legge
        51/2022 - Comune)" (gruppo Beni Paesaggistici) è la "Comunicazione di proroga dell'efficacia
        dell'autorizzazione paesaggistica": chiede numero (P.G.) e data dell'autorizzazione,
        l'oggetto, l'intestatario, la data in cui l'efficacia dovrebbe scadere e quella prevista; una
        scelta aggiunge la dichiarazione di assenso dei terzi titolari di altri diritti reali o
        obbligatori, se il titolare non è esclusivo.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        Il testo dell'operazione sul portale ("comunica la proroga di due anni prevista dall'art. 10
        septies") non segue il testo vigente dell'art. 10-septies, che dà quarantotto mesi (D.L.
        200/2025, convertito dalla L. 26/2026).
      status: disputed
      source: portale-sue-operazioni
    - text: >-
        Che per l'autorizzazione paesaggistica valgano lo stesso limite del 31/12/2025 e la stessa
        durata dei permessi di costruire è la lettura del rinvio dell'art. 10-septies, non un testo
        esplicito.
      status: unverified
      source: dl21-art10septies
legal_basis:
  - text: "D.L. 21 marzo 2022, n. 21, art. 10-septies c. 1 a (convertito dalla L. 51/2022), nel testo modificato da ultimo dal D.L. 200/2025 (L. 26/2026); D.Lgs. 42/2004, art. 146 c. 4."
    status: verified
    source: dl21-art10septies
deadline:
  summary:
    text: >-
      Prima che l'autorizzazione scada: la proroga non opera per i termini già decorsi al momento
      della comunicazione.
    status: verified
    source: dl21-art10septies
pitfalls:
  - text: >-
      La proroga non opera se, al momento della comunicazione, l'intervento contrasta con piani o
      provvedimenti di tutela del paesaggio o dei beni culturali sopravvenuti.
    status: verified
    source: dl21-art10septies
  - text: >-
      Un'autorizzazione già scaduta non si proroga: se è scaduta da non più di un anno e i lavori non
      sono stati eseguiti, o solo in parte, si chiede il rinnovo (art. 7 D.P.R. 31/2017).
    status: verified
    source: dpr31-art7
