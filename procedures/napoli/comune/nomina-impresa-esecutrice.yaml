schema_version: 0
id: napoli/comune/nomina-impresa-esecutrice
title: Comunicazione di nomina dell'impresa esecutrice – SUE del Comune di Napoli
headline: "Impresa scelta dopo la pratica edilizia: come comunicarla al SUE di Napoli"
aka:
  - nomina impresa
  - impresa esecutrice
  - DURC impresa
  - notifica preliminare
updated: 2026-11-04
summary: >-
  Chi presenta una SCIA o chiede un permesso di costruire può indicare l'impresa che eseguirà i
  lavori più tardi, purché prima che inizino. Allora il committente comunica allo Sportello Unico
  per l'Edilizia i dati dell'impresa e, quando i lavori ricadono nella sicurezza dei cantieri,
  trasmette il DURC, la notifica preliminare e la dichiarazione di aver verificato l'idoneità
  dell'impresa: senza, il titolo edilizio è sospeso. La stessa operazione serve per aggiungere
  un'impresa a quella già nominata. A Napoli si presenta sul portale "Impresa in un giorno".
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Il committente o il responsabile dei lavori, anche quando affida i lavori a un'unica impresa
        o a un lavoratore autonomo, ne verifica l'idoneità tecnico-professionale (visura camerale,
        DURC e autocertificazione sotto i 200 uomini-giorno senza rischi particolari), chiede la
        dichiarazione dell'organico medio annuo e del contratto collettivo, verifica la patente
        dell'art. 27, e prima dell'inizio dei lavori oggetto del permesso di costruire o della
        denuncia di inizio attività trasmette all'amministrazione concedente la notifica preliminare
        dell'art. 99, il DURC e una dichiarazione di aver fatto queste verifiche (art. 90 c. 9 D.Lgs.
        81/2008).
      status: verified
      source: dlgs81-art90
    - text: >-
        In assenza del piano di sicurezza e coordinamento o del fascicolo quando previsti, della
        notifica preliminare quando prevista o del DURC delle imprese o dei lavoratori autonomi,
        l'efficacia del titolo abilitativo è sospesa (art. 90 c. 10).
      status: verified
      source: dlgs81-art90
    - text: >-
        La notifica preliminare va trasmessa prima dell'inizio dei lavori all'ASL e alla direzione
        provinciale del lavoro per i cantieri con più imprese, anche non contemporanee, e per quelli
        con un'unica impresa di almeno duecento uomini-giorno (art. 99 c. 1 D.Lgs. 81/2008).
      status: verified
      source: dlgs81-art99
    - text: >-
        I moduli del permesso di costruire e della SCIA del Comune consentono di dichiarare che
        l'impresa esecutrice sarà individuata prima dell'inizio dei lavori, e di riservarsi le
        dichiarazioni sulla sicurezza fino ad allora (PdC i.2 e l.2, SCIA l.2 e m).
      status: verified
      source: pdc-modulo
    - text: >-
        Sul SUE di Napoli l'operazione "Comunicazione al Comune di nomina impresa esecutrice" (gruppo
        Altri adempimenti edilizi) chiede tipo, numero e anno del titolo edilizio, i dati
        dell'impresa (denominazione, codice fiscale o partita IVA, sede legale, Camera di Commercio e
        numero REA) e se è la prima nomina o un'impresa in aggiunta alla precedente; se la
        precedente impresa cessa si usa la comunicazione di cambio dell'impresa. Tra gli allegati ci
        sono la dichiarazione sostitutiva sulle verifiche dell'art. 90 c. 9 e la copia della
        notifica preliminare.
      status: verified
      source: portale-sue-operazioni
legal_basis:
  - text: "D.Lgs. 81/2008, art. 90 c. 9-10 (obblighi del committente) e art. 99 (notifica preliminare)."
    status: verified
    source: dlgs81-art90
deadline:
  summary:
    text: Prima dell'inizio dei lavori affidati all'impresa.
    status: verified
    source: dlgs81-art90
