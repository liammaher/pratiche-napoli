steps:
  - do: Firmare la procura speciale se la comunicazione la presenta il tecnico
    who: owner
    human_only: true
  - do: >-
      Verificare l'impresa (visura camerale, DURC, organico medio, contratto collettivo, patente
      dell'art. 27 D.Lgs. 81/2008) e firmare la dichiarazione sostitutiva di averlo fatto
    who: owner
    human_only: true
  - do: Se il cantiere vi è soggetto, trasmettere la notifica preliminare all'ASL e alla direzione provinciale del lavoro
    who: owner
    human_only: true
  - do: >-
      Prima che l'impresa inizi, accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di
      Napoli), scegliere l'operazione "Comunicazione al Comune di nomina impresa esecutrice",
      compilare, allegare i documenti firmati digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
