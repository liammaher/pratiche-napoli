  method: >-
    Desk: su Normattiva D.Lgs. 81/2008 artt. 90 e 99; i moduli PDC e SCIA del Comune del
    23/06/2025; la DD 501/2026; l'operazione del portale letta in una bozza di prova.
  notes: >-
    L'art. 90 c. 9 c nomina il permesso di costruire e la denuncia di inizio attività: che valga
    allo stesso modo per CILA e SCIA è la lettura dei moduli del Comune, non verificata su una norma.
    La tabella dei diritti SUE 2026 non ha una riga per questa comunicazione.
