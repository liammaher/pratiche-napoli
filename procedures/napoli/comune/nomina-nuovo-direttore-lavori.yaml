steps:
  - do: Incaricare il nuovo direttore dei lavori e firmare la procura speciale se la comunicazione la presenta lui
    who: owner
    human_only: true
  - do: Farsi dare dal precedente direttore la dichiarazione di rinuncia firmata, se c'è
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      "Comunicazione al Comune di nomina del nuovo direttore dei lavori", compilare, allegare i
      documenti firmati digitalmente e inviare; conservare la ricevuta
    who: professional
    human_only: true
    channel: [portal]
