schema_version: 0
id: napoli/comune/nomina-nuovo-direttore-lavori
title: Comunicazione di nomina del nuovo direttore dei lavori – SUE del Comune di Napoli
headline: "Cambio del direttore dei lavori a Napoli: come comunicarlo al SUE"
aka:
  - nuovo direttore dei lavori
  - sostituzione direttore lavori
  - nomina direttore lavori
  - rinuncia direttore lavori
updated: 2026-11-04
summary: >-
  Il direttore dei lavori risponde, con il titolare e l'impresa, della conformità delle opere al
  titolo edilizio. Quando non era stato indicato nella domanda, o quando il direttore rinuncia o
  viene sostituito mentre i lavori sono in corso, il nome del nuovo direttore si comunica allo
  Sportello Unico per l'Edilizia, con la data da cui assume l'incarico e, se c'è, la rinuncia del
  precedente. A Napoli si presenta sul portale "Impresa in un giorno", per un permesso di
  costruire, una SCIA, una CILA, una DIA o una variante.
ente:
  name: Comune di Napoli
  office: Area Urbanistica – Servizio Sportello Unico Edilizia
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata]
  conditions:
    - text: >-
        Il titolare del permesso di costruire, il committente e il costruttore rispondono della
        conformità delle opere alla normativa urbanistica e al piano e, insieme al direttore dei
        lavori, al permesso e alle sue modalità esecutive (art. 29 c. 1 DPR 380/2001).
      status: verified
      source: dpr380-art29
    - text: >-
        Il direttore dei lavori non risponde se ha contestato agli altri soggetti la violazione delle
        prescrizioni del permesso dandone contemporanea e motivata comunicazione al dirigente; nei
        casi di totale difformità o variazione essenziale deve anche rinunziare all'incarico
        contestualmente alla comunicazione, altrimenti è passibile di sospensione dall'albo da tre
        mesi a due anni (art. 29 c. 2).
      status: verified
      source: dpr380-art29
    - text: >-
        I moduli del permesso di costruire e della SCIA del Comune consentono di dichiarare che il
        direttore dei lavori e gli altri tecnici saranno individuati prima dell'inizio dei lavori
        (PdC h.2, SCIA i.2).
      status: verified
      source: pdc-modulo
    - text: >-
        Sul SUE di Napoli l'operazione "Comunicazione al Comune di nomina del nuovo direttore dei
        lavori" (gruppo Altri adempimenti edilizi) chiede i dati del nuovo direttore (albo
        professionale e numero d'iscrizione: architetto, geometra, ingegnere, perito o altro), la
        data da cui assume l'incarico e il titolo dei lavori (permesso di costruire, DIA, SCIA,
        CILA o variante) con l'identificativo della pratica; tra gli allegati c'è la dichiarazione
        di rinuncia del precedente direttore.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        Un obbligo di comunicare al Comune la sostituzione del direttore dei lavori, e il suo
        termine, non è stato trovato in una fonte ufficiale letta (il Regolamento edilizio di Napoli
        non è stato letto).
      status: unverified
legal_basis:
  - text: "D.P.R. 380/2001, art. 29 (responsabilità del titolare, del committente, del costruttore e del direttore dei lavori)."
    status: verified
    source: dpr380-art29
deadline:
  summary:
    text: >-
      Per una prima nomina rinviata nella domanda, prima dell'inizio dei lavori; per una
      sostituzione nessun termine trovato.
    status: verified
    source: pdc-modulo
