schema_version: 0
id: napoli/comune/accertamento-compatibilita-paesaggistica
title: Accertamento di compatibilità paesaggistica (artt. 167 e 181 D.Lgs. 42/2004) – Comune di Napoli, sul SUE
headline: "Accertamento di compatibilità paesaggistica a Napoli: lavori già fatti in area vincolata"
aka:
  - sanatoria paesaggistica
  - compatibilità paesaggistica
  - abuso paesaggistico
  - autorizzazione paesaggistica in sanatoria
updated: 2026-10-30
summary: >-
  Chi ha eseguito in un'area o su un immobile sotto tutela paesaggistica lavori che chiedevano
  l'autorizzazione paesaggistica, senza averla o in difformità, chiede al Comune di accertarne la
  compatibilità (art. 167 c. 4-5 e art. 181 c. 1-quater D.Lgs. 42/2004). Si può solo per i lavori
  che non hanno creato superfici utili o volumi, per i materiali diversi da quelli autorizzati e
  per la manutenzione ordinaria o straordinaria. A Napoli si chiede sul portale "Impresa in un
  giorno"; decide il Comune entro 180 giorni, con il parere vincolante della Soprintendenza, e se
  la compatibilità è accertata si paga una somma pari al maggiore tra il danno e il profitto.
ente:
  name: Comune di Napoli
  office: Sportello Unico Edilizia (istanze sul SUE)
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata, paesaggio]
  conditions:
    - text: >-
        L'autorità competente accerta la compatibilità paesaggistica per i lavori realizzati in
        assenza o difformità dall'autorizzazione paesaggistica che non abbiano determinato creazione
        di superfici utili o volumi ovvero aumento di quelli legittimamente realizzati, per l'impiego
        di materiali in difformità dall'autorizzazione, e per i lavori configurabili come
        manutenzione ordinaria o straordinaria (art. 167 c. 4 D.Lgs. 42/2004).
      status: verified
      source: dlgs42-art167
    - text: >-
        Il proprietario, possessore o detentore presenta domanda all'autorità preposta alla gestione
        del vincolo, che si pronuncia entro il termine perentorio di 180 giorni, previo parere
        vincolante della soprintendenza da rendersi entro 90 giorni; se la compatibilità è accertata
        si paga una somma equivalente al maggiore importo tra il danno arrecato e il profitto
        conseguito; se la domanda è respinta si applica la rimessione in pristino del comma 1 (art.
        167 c. 5).
      status: verified
      source: dlgs42-art167
    - text: >-
        Se l'autorità accerta la compatibilità paesaggistica, il reato dell'art. 181 c. 1 non si
        applica, ferme le sanzioni amministrative (art. 181 c. 1-ter e 1-quater).
      status: verified
      source: dlgs42-art181
    - text: >-
        Sul SUE di Napoli l'operazione "Accertamento di compatibilità paesaggistica (artt. 167-181
        D.Lgs. 42/2004 - Comune)" è nel gruppo Beni Paesaggistici; la pratica chiede la descrizione
        delle opere e dei loro effetti, i professionisti incaricati, la presa visione dell'art. 181,
        la data dell'abuso e l'imposta di bollo.
      status: verified
      source: portale-sue-operazioni
legal_basis:
  - text: "D.Lgs. 42/2004, art. 167 c. 4-5 (testo in vigore dal 24/04/2008) e art. 181 c. 1-ter e 1-quater (dal 31/03/2016)."
    status: verified
    source: dlgs42-art167
cost:
  text: >-
    Diritti di segreteria di 441,00 euro per le autorizzazioni paesaggistiche in sanatoria quando
    sono oggetto di autonoma istanza (riga SUE 3 della tabella), l'imposta di bollo, poi la somma
    dell'art. 167 c. 5 se la compatibilità è accertata. A parte il compenso del tecnico.
  status: verified
  source: tabella-diritti
