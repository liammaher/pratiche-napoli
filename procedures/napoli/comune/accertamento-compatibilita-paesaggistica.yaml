steps:
  - do: >-
      Stabilire con il tecnico se i lavori rientrano nell'art. 167 c. 4 (niente nuove superfici utili
      o volumi, materiali diversi, manutenzione) e da quando sono stati eseguiti
    who: professional
  - do: Preparare la relazione paesaggistica, gli elaborati dello stato attuale e le fotografie
    who: professional
  - do: Pagare i diritti di segreteria e l'imposta di bollo
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      dell'accertamento di compatibilità paesaggistica, compilare, allegare i documenti firmati
      digitalmente e inviare
    who: professional
    human_only: true
    channel: [portal]
  - do: Se la compatibilità è accertata, pagare la somma dell'art. 167 c. 5 che il Comune determina
    who: owner
    human_only: true
