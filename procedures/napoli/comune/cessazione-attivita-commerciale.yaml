      - label: 4 – Dati dell'attività/intervento
        map: { blank_with_reason: "Differenziato per procedimento: per la cessazione sono i quadri del modulo di cessazione." }
  - id: comunicazione-cessazione
    name: Comunicazione di cessazione o sospensione temporanea di attività – modulistica unificata Regione Campania (DD 119/2021)
    url: https://surap.regione.campania.it/Allegati/ModulisticaUnificata/Commercio/pdf/Comunicazione_di_cessazione_o_sospensione_temporanea_di_attivit%C3%A0.pdf
    source: modulo-cessazione
    sha256: 4b6fde24b144eec957fe4dc8415e61abdfbda7a697c080b812d95eb257054291
    signature_required: true
    fields:
      - label: "Al SUAP del Comune di – Indirizzo – PEC / Posta elettronica"
        map: { blank_with_reason: "Precompilato dal portale: SUAP del Comune di Napoli." }
      - label: "Compilato a cura del SUAP: Pratica / del / Protocollo"
        map: { blank_with_reason: Spazio riservato al SUAP. }
      - label: "COMUNICAZIONE: Cessazione di attività / Sospensione temporanea di attività"
        map: { blank_with_reason: "Si barra Cessazione di attività: è l'oggetto di questa procedura." }
      - label: "Indirizzo dell'attività: Via/piazza"
        map: { direct: locale.indirizzo }
