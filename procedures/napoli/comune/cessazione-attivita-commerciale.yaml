steps:
  - do: >-
      Fissare la data di chiusura e usarla uguale per tutti gli enti: la data di cessazione
      comunicata al Registro Imprese deve coincidere con quella dichiarata all'Agenzia delle Entrate
    who: owner
  - do: >-
      Se si vende la merce in liquidazione, comunicarlo al Comune almeno quindici giorni prima
      (motivi, data d'inizio e durata, al massimo tredici settimane)
    who: owner
    human_only: true
  - do: >-
      Se c'è un dehors, comunicare la rinuncia alla concessione al Servizio concessorio e al
      Servizio responsabile dell'entrata (entrate.cosap@pec.comune.napoli.it): la cessazione vale
      solo dalla presa d'atto e il canone dell'anno resta dovuto per intero (vedi
      napoli/comune/concessione-suolo-pubblico-dehors)
    who: owner
    human_only: true
  - do: >-
      Togliere l'insegna e presentare al SUAP la cessazione del mezzo pubblicitario; per non pagare
      il canone dell'anno dopo la rinuncia va presentata entro il 31 gennaio per i mezzi tolti entro
      il 31 dicembre (vedi napoli/comune/insegna-esercizio)
    who: owner
    human_only: true
  - do: >-
      Compilare su impresainungiorno la comunicazione di cessazione (Scheda anagrafica + modulo,
      dati dalla tabella dei campi); per bar, ristoranti e negozi alimentari aggiungere la cessazione
      della registrazione sanitaria (riquadro 4 della notifica)
    who: facilitator
  - do: Chiedere al SUAP se per la cessazione va allegata una ricevuta di pagamento (le fonti non concordano)
    who: anyone
  - do: >-
      Preparare in DIRE la Comunicazione Unica di cancellazione della ditta dal Registro Imprese,
      con la data di effettiva cessazione e la causale; la stessa pratica chiude partita IVA, INPS
      e INAIL e può portare con sé la comunicazione per il SUAP
    who: facilitator
  - do: Firmare digitalmente le pratiche (o la procura, se firma un intermediario)
    who: owner
    human_only: true
  - do: >-
      Inviare la Comunicazione Unica entro 30 giorni dalla cessazione (bollo 17,50 euro addebitato
      sul conto Telemaco) e la comunicazione al SUAP da impresainungiorno
    who: owner
    human_only: true
  - do: >-
      Solo per chi non è iscritto al Registro Imprese o al REA: chiudere la partita IVA con il
      modello AA9/12 entro 30 giorni
    who: owner
    human_only: true
  - do: >-
      Restituire i locali, chiudere contratto e utenze e presentare il Mod. 8 TARI entro 90 giorni
      dalla fine dell'occupazione, con le prove della data (vedi napoli/comune/tari-cessazione-non-domestica)
    who: owner
    human_only: true
  - do: >-
      Pagare quanto resta dovuto: TARI fino alla data di cessazione, canoni dell'anno, diritto
      annuale dell'anno in corso se non ancora pagato
    who: owner
    human_only: true
after:
  - >-
    Conservare le ricevute del SUAP e del Registro Imprese, la ricevuta di cessazione della partita
    IVA e la PEC di invio del Mod. 8 TARI.
  - >-
    Controllare la PEC: esiti degli altri enti (Agenzia delle Entrate, INPS, INAIL) ed eventuali
    richieste di integrazione del Registro Imprese. L'INAIL rilascia il certificato di cessazione
    entro 30 giorni dalla denuncia.
  - >-
    Se l'impresa era artigiana (per esempio un acconciatore), non serve una pratica separata per
    l'Albo: la cancellazione dal Registro Imprese cancella anche l'annotazione artigiana.
  - >-
    Controllare che i successivi avvisi TARI e del canone tengano conto della chiusura; per i
    rimborsi TARI c'è il Mod. 10.
  - >-
    Dopo la cessazione l'Agenzia delle Entrate richiede ancora gli adempimenti della liquidazione:
    versamento dell'imposta, fatture, registrazioni e ultima dichiarazione annuale (art. 35, c. 4
    D.P.R. 633/1972).
pitfalls:
  - text: >-
      Le pratiche SUAP inviate per PEC o email ordinaria non vengono istruite: anche la cessazione si
      presenta solo su impresainungiorno.
    status: verified
    source: suap-contatti
  - text: >-
      Le schede di impresainungiorno per la cessazione di vicinato e somministrazione chiedono
      come allegato obbligatorio la "copia attestazione versamento oneri, diritti e spese", mentre la
      tabella dei diritti del Comune indica 0,00 euro per la cessazione e la tabella 2026 non la
      prevede.
    status: disputed
    source: iiug-napoli
  - text: >-
      La pagina del servizio "Avviare, variare, chiudere un'attività produttiva" (aggiornata al 7
      ottobre 2025) collega come "nuova tabella dei diritti" un file creato nel giugno 2021; la
      tabella in vigore dall'11 giugno 2026 è sulla pagina "Diritti d'istruttoria SUAP".
    status: verified
    source: suap-servizio
  - text: >-
      La data di cessazione denunciata al Registro Imprese deve coincidere con quella dichiarata
      all'Agenzia delle Entrate.
    status: verified
    source: sari-cancellazione
  - text: >-
      Per le imprese (anche artigiane) la partita IVA non si chiude con il modello AA9/12 ma con la
      Comunicazione Unica al Registro Imprese; l'AA9/12 è per chi non è obbligato all'iscrizione al
      Registro Imprese o al REA.
    status: verified
    source: ade-che-cose
  - text: >-
      Per la Gestione Commercianti INPS la Comunicazione Unica è obbligatoria anche per la
      cancellazione dell'impresa e la cessazione dell'attività (quadro AC).
    status: verified
    source: inps-commercianti
  - text: >-
      La pagina INAIL descrive la denuncia di cessazione per le imprese con dipendenti. Non è stato
      controllato come l'INAIL chiude la posizione di un artigiano senza dipendenti: verificare gli
      esiti INAIL nella PEC dopo la Comunicazione Unica.
    status: unverified
  - text: >-
      Dehors: il canone dell'anno in corso resta dovuto per intero anche con la rinuncia, e senza la
      presa d'atto del Servizio concessorio resta dovuto fino alla scadenza naturale della
      concessione. Conviene comunicare la rinuncia appena si decide di chiudere.
    status: verified
    source: regolamento-cup
  - text: >-
      L'art. 30 del regolamento del canone parla di autorizzazioni; per l'insegna presentata con
      SCIA la pagina "Esposizioni pubblicitarie" chiede di presentare al SUAP cessazioni e rinunce.
      Chiedere all'Ufficio CUP Pubblicità se il termine del 31 gennaio vale anche per le insegne a
      SCIA.
    status: unverified
  - text: >-
      La pagina della Camera sui soggetti esonerati dal diritto annuale è ancora scritta per il 2010
      (domanda di cancellazione entro il 30/01/2011).
    status: verified
    source: na-esonerati
  - text: >-
      Una chiusura temporanea non è una cessazione: per i bar la mancata riapertura entro 12 mesi fa
      decadere il titolo, per il vicinato porta alla chiusura dell'esercizio (nota del modulo
      regionale).
    status: verified
    source: modulo-cessazione
  - text: >-
      TARI: se la cessazione è dichiarata in ritardo e senza documenti che provino la data
      effettiva, si presume avvenuta alla data di presentazione, e la tassa resta dovuta fino a quel
      giorno (art. 12, c. 4 del regolamento).
    status: verified
    source: regolamento-tari
  - text: >-
      Anche dopo la chiusura i locali con utenze, arredi o titoli autorizzativi restano tassabili ai
      fini TARI: chiudere le utenze e lasciare i locali prima di dichiarare la cessazione (vedi
      napoli/comune/tari-cessazione-non-domestica).
    status: unverified
