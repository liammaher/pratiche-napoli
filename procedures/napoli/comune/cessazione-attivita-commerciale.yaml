    url: https://surap.regione.campania.it/Allegati/ModulisticaUnificata/Commercio/pdf/Scheda_anagrafica.pdf
    source: modulo-scheda-anagrafica
    sha256: aef5908e61b8ad9001275c84d9dd0fe9f70b0c35ad1814396ba4f3b223440d57
    signature_required: false
    fields:
      # 1 – Dati del dichiarante
