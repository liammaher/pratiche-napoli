schema_version: 0
id: napoli/comune/cessazione-attivita-commerciale
title: Chiudere un negozio, un bar, un ristorante o un salone a Napoli – lista dei passaggi
headline: "Come chiudere un'attività commerciale a Napoli: SUAP, Camera di Commercio e TARI"
aka:
  - cessazione attività
  - chiusura partita IVA
  - cancellazione ditta individuale
  - chiudere la licenza
  - comunicazione di cessazione
updated: 2026-10-26
summary: >-
  Chi chiude a Napoli un esercizio di vicinato, un bar o ristorante o un salone di acconciatore
  o estetista deve comunicare la cessazione al SUAP del Comune su impresainungiorno e poi chiudere
  le posizioni collegate: registrazione sanitaria ASL, canone unico per dehors e insegna, Registro
  Imprese e REA (entro 30 giorni, con la Comunicazione Unica che chiude anche partita IVA, INPS e
  INAIL) e TARI (Mod. 8 entro 90 giorni). Questa scheda è la lista in ordine; per ogni passaggio
  rimanda alla procedura dettagliata. Riguarda le ditte individuali.
ente:
  name: Comune di Napoli
  office: Area Sviluppo Economico – Servizio Sportello Unico Attività Produttive (SUAP)
  ipa: c_f839
applies_to:
  events: [close]
  audience: [business]
  sectors:
    - esercizio di vicinato (negozio)
    - bar, ristoranti e altri esercizi di somministrazione di alimenti e bevande
    - acconciatore ed estetista
  conditions:
    - text: >-
        In Campania la cessazione di un esercizio di vicinato si fa con una Comunicazione al SUAP
        (Allegato A del Testo unico regionale sul commercio, quadro 1.1).
      status: verified
      source: lr7-pdf
    - text: >-
        Anche la cessazione di un esercizio di somministrazione di alimenti e bevande (bar,
        ristorante), in zona tutelata o no, si fa con una Comunicazione al SUAP (Allegato A,
        quadro 5.1).
      status: verified
      source: lr7-pdf
    - text: >-
        Acconciatori ed estetisti: in caso di cessazione il titolare fa un'apposita comunicazione
        al SUAP, in via telematica, indicando la data della cessazione; se il titolare muore,
        l'obbligo passa agli eredi (regolamento comunale, artt. 7 e 15).
      status: verified
      source: regolamento-acconciatori
    - text: >-
        Se l'attività non chiude ma passa a un'altra impresa (cessione o affitto d'azienda), per la
        parte sanitaria non si fa la cessazione: chi subentra presenta il subingresso.
      status: verified
      source: dd117
    - text: >-
        Questa lista segue la chiusura di una ditta individuale. Le società (s.n.c., s.a.s., s.r.l.)
        hanno passaggi diversi al Registro Imprese (scioglimento, liquidazione, cancellazione), non
        descritti qui.
      status: unverified
legal_basis:
  - text: >-
      D.Lgs. 114/1998, art. 26, c. 5: la cessazione dell'attività di vicinato è soggetta alla sola
      comunicazione al comune competente.
    status: verified
    source: dlgs-114-art26
  - text: >-
      L.R. Campania 7/2020 (Testo unico sul commercio), artt. 26, c. 2 (vicinato) e 91, c. 1
      (somministrazione): la cessazione segue i regimi della Tabella dell'Allegato A, con la
      modulistica unificata.
    status: verified
    source: lr-campania-7-2020
  - text: >-
      Regolamento comunale acconciatore, estetista, tatuaggio e piercing (DCC 18/2018, modificato
      con DCC 6/2021), art. 15.
    status: verified
    source: regolamento-acconciatori
  - text: >-
      Regione Campania, DD 117/2020, allegato, par. 2.9.5: cessazione o sospensione di uno
      stabilimento alimentare registrato, comunicata al SUAP.
    status: verified
    source: dd117
  - text: Art. 2196, c. 3 c.c. e art. 18, c. 3 D.P.R. 581/1995 (cancellazione dal Registro Imprese).
    status: verified
    source: sari-cancellazione
  - text: >-
      D.P.R. 633/1972, art. 35, cc. 3 e 4 (dichiarazione di cessazione ai fini IVA entro 30 giorni
      dalla fine delle operazioni di liquidazione dell'azienda) e c. 8 (presentazione tramite il
      Registro Imprese per chi vi è iscritto).
    status: verified
    source: dpr633-art35
  - text: Regolamento TARI del Comune di Napoli (DCC 37/2023), artt. 12 e 25.
    status: verified
    source: regolamento-tari
  - text: >-
      Regolamento del canone unico patrimoniale (DCC 16/2022), art. 10, c. 3 (rinuncia alla
      concessione di suolo) e art. 30, c. 2 (rinuncia all'autorizzazione pubblicitaria).
    status: verified
    source: regolamento-cup
deadline:
  summary:
    text: >-
      La comunicazione al SUAP non ha un termine; entro 30 giorni dalla cessazione si cancella la
      ditta dal Registro Imprese (la Comunicazione Unica chiude anche partita IVA e INAIL) ed entro
      90 giorni si presenta il Mod. 8 TARI. La rinuncia all'insegna va entro il 31 gennaio dell'anno
      dopo, la cancellazione entro il 30 gennaio evita il diritto annuale dell'anno dopo e la vendita
      di liquidazione si comunica almeno 15 giorni prima.
    status: verified
    source: sari-cancellazione
  rules:
    - text: >-
        Comunicazione di cessazione al SUAP: né il D.Lgs. 114/1998 né il modulo regionale fissano un
        termine. Il modulo permette di indicare una cessazione "contestuale alla comunicazione" o con
        decorrenza da una data scelta.
      status: verified
      source: modulo-cessazione
    - text: >-
        Cancellazione della ditta individuale dal Registro Imprese: entro 30 giorni dalla cessazione
        dell'attività.
      status: verified
      source: sari-cancellazione
    - text: >-
        I 30 giorni si contano dal giorno dopo l'evento; se l'ultimo giorno è sabato o festivo, la
        domanda presentata il primo giorno lavorativo successivo è tempestiva.
      status: verified
      source: na-sanzioni
    - text: >-
        Chiusura della partita IVA: entro 30 giorni dalla cessazione; per l'Agenzia delle Entrate il
        termine decorre dalla fine delle operazioni di liquidazione dell'azienda (art. 35, c. 4).
      status: verified
      source: dpr633-art35
    - text: >-
        INAIL: chi chiude un'attività con dipendenti lo comunica entro 30 giorni dalla cessazione,
        con la Comunicazione Unica.
      status: verified
      source: inail-cessazione
    - text: >-
        TARI: dichiarazione di cessazione (Mod. 8) entro 90 giorni dal giorno in cui è cessata
        l'occupazione dei locali.
      status: verified
      source: regolamento-tari
    - text: >-
        Insegne e altri mezzi pubblicitari autorizzati: la rinuncia va presentata entro il 31
        gennaio per i mezzi rimossi entro il 31 dicembre dell'anno prima; altrimenti l'autorizzazione
        resta valida ed è dovuto il canone annuale (art. 30, c. 2).
      status: verified
      source: regolamento-cup
    - text: >-
        Diritto annuale: secondo la Camera di Commercio di Napoli, l'impresa individuale che cessa
        l'attività in un anno e presenta la domanda di cancellazione entro il 30 gennaio dell'anno
        successivo non paga il diritto dell'anno successivo (art. 4 D.M. 359/2001). La pagina è
        ancora scritta con gli anni 2010/2011.
      status: verified
      source: na-esonerati
    - text: >-
        Per una chiusura nel 2026 la data da rispettare sarebbe quindi il 30 gennaio 2027 (data
        calcolata dalla regola, non pubblicata dalla Camera): confermarla con l'Ufficio Diritto
        Annuale.
      status: unverified
    - text: >-
        Vendita di liquidazione per cessazione (negozi): al massimo tredici settimane, comunicando al
        comune motivi, data d'inizio e durata almeno quindici giorni prima dell'inizio (L.R. 7/2020,
        art. 42).
      status: verified
      source: lr-campania-7-2020
  lateness:
    text: >-
      Registro Imprese: per le cessazioni tardive delle imprese individuali (art. 2196 c.c.) la
      pagina "Sanzioni" della Camera indica una sanzione di 20,00 euro, da pagare con F23 (codice
      tributo 741T) entro 60 giorni dalla notifica, più le spese di procedimento e notifica indicate
      nel verbale; fa fede il verbale. Per gli altri passaggi (TARI, canoni, diritto annuale) le
      conseguenze del ritardo sono nelle avvertenze qui sotto e nelle procedure collegate: non
      stimarle, chiedere all'ufficio.
    status: verified
    source: na-sanzioni
cost:
  text: >-
    La comunicazione di cessazione al SUAP risulta gratuita nella tabella dei diritti linkata dal
    Comune (0 euro), ma la tabella 2026 non la elenca e impresainungiorno chiede comunque la
    ricevuta di un versamento: chiedere al SUAP prima di inviare. La cancellazione della ditta
    individuale dal Registro Imprese costa 17,50 euro di imposta di bollo, senza diritti di
    segreteria; la cessazione della registrazione sanitaria non ha diritti ASL né bollo. Restano
    da pagare TARI, canoni e diritto annuale dovuti fino alla chiusura.
  status: disputed
  source: tabella-2021
duration:
  text: >-
    La cessazione vale dalla data scelta nel modulo: il giorno stesso dell'invio della
    comunicazione al SUAP oppure una data indicata, che deve coincidere con quella comunicata al
    Registro Imprese e all'Agenzia delle Entrate.
  status: verified
  source: modulo-cessazione
appointment:
  text: >-
    Non serve: la comunicazione al SUAP si presenta solo online su impresainungiorno e la
    cancellazione dal Registro Imprese con la Comunicazione Unica su DIRE. Per informazioni il SUAP
    (Piazza Cavour 42) riceve solo su prenotazione online, con il pulsante "Prenota appuntamento"
    della pagina "Avviare, variare, chiudere un'attività produttiva".
  status: verified
  source: suap-contatti
channels:
  - type: portal
    purpose: procedure
    name: impresainungiorno – SUAP di Napoli
    url: https://www.impresainungiorno.gov.it/web/guest/comune?codCatastale=F839
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: suap-contatti
    notes: >-
      Unico canale per la comunicazione di cessazione al SUAP: le pratiche inviate per PEC o email
      ordinaria non vengono istruite. Percorso verificato per il vicinato non alimentare: Commercio >
      Commercio al Dettaglio in area Privata > Esercizio di vicinato > settore > Avvio, gestione,
      cessazione attività > Cessare l'attività. Per i bar: Strutture Ricettive e Ristorazione >
      Ristorazione e Somministrazione > zona tutelata o non tutelata > Cessare l'attività. Servono
      firma digitale e PEC.
  - type: portal
    purpose: procedure
    name: DIRE – Depositi e Istanze al Registro imprese (Comunicazione Unica)
    url: https://dire.registroimprese.it
    receipt: legal
    source: sari-cancellazione
    notes: >-
      Per la cancellazione dal Registro Imprese (categoria "Cancellazione", tipo "Cancellazione dal
      Registro Imprese"). Dalla stessa pratica si può aprire impresainungiorno con il pulsante SUAP e
      importare la comunicazione di cessazione per il SUAP, inviando tutto insieme.
  - type: desk
    purpose: info
    name: Servizio SUAP
    address: Piazza Cavour 42, II piano, Napoli
    booking: >-
      Dal 18 maggio 2026 solo su prenotazione online (pulsante "Prenota appuntamento" della pagina
      "Avviare, variare, chiudere un'attività produttiva").
    source: suap-contatti
    notes: Informazioni e assistenza; la comunicazione si presenta comunque online.
  - type: pec
    purpose: info
    address: suap@pec.comune.napoli.it
    receipt: legal
    source: suap-contatti
    notes: Solo per comunicare con l'ufficio, non per presentare la pratica.
  - type: phone
    purpose: info
    name: SUAP
    address: 081 7953054
    source: suap-servizio
  - type: pec
    purpose: related
    name: Agenzia delle Entrate – qualunque Direzione Provinciale (solo modello AA9/12)
    receipt: legal
    source: ade-chiudere
    notes: >-
      Solo per chi non è iscritto al Registro Imprese o al REA (professionisti, lavoratori autonomi):
      modello AA9/12 con oggetto "Cessazione attività". Si può anche consegnare in ufficio su
      appuntamento, spedire per raccomandata o inviare dall'area riservata con il software
      dell'Agenzia.
payment:
  method: none
  notes:
    - text: >-
        Comunicazione di cessazione al SUAP: la tabella dei diritti linkata dalla pagina del servizio
        (file del 2021) indica 0,00 euro per la cessazione di vicinato, somministrazione e delle altre
        attività commerciali e spiega che la cessazione spesso non compare "perché non assoggettata a
        diritti". La tabella 2026 (DGC 239/2026, in vigore dall'11 giugno 2026) ha solo le colonne
        apertura, variazioni del ciclo di vita aziendale e variazioni delle persone fisiche, e la
        cessazione non è tra gli eventi elencati. Le schede di impresainungiorno per la cessazione
        (vicinato non alimentare e somministrazione) indicano però come allegato obbligatorio la
        "copia attestazione versamento oneri, diritti e spese". Chiedere al SUAP prima di inviare.
      status: disputed
      source: tabella-2021
    - text: >-
        Parte sanitaria: per la cessazione o la sospensione di uno stabilimento registrato non si
        pagano diritti sanitari all'ASL né alla Regione, né imposta di bollo.
      status: verified
      source: dd117
    - text: >-
        Cancellazione della ditta individuale dal Registro Imprese: imposta di bollo 17,50 euro;
        diritti di segreteria non dovuti. Gli importi sono calcolati in DIRE e addebitati sul conto
        Telemaco.
      status: verified
      source: sari-cancellazione
    - text: >-
        Il diritto annuale non è frazionabile: è dovuto per intero da chi risulta iscritto al Registro
        Imprese anche solo per una parte dell'anno (vedi napoli/camera-di-commercio/diritto-annuale).
      status: verified
      source: na-diritto-annuale
    - text: >-
        Dehors: in caso di rinuncia o cessazione anticipata resta dovuto l'intero canone dell'anno in
        corso, per le occupazioni permanenti e temporanee.
      status: verified
      source: cup-occupazione
    - text: >-
        Insegne: con la rinuncia e la rimozione nel corso dell'anno non si rimborsa il canone già
        versato, salvo forza maggiore documentata (art. 30, c. 2).
      status: verified
      source: regolamento-cup
    - text: >-
        TARI: la tassa è dovuta per i giorni dell'anno in cui i locali sono stati occupati, fino al
        giorno della cessazione se dichiarata nei termini (vedi napoli/comune/tari-cessazione-non-domestica).
      status: verified
      source: regolamento-tari
documents:
  - name: Comunicazione di cessazione (con Scheda anagrafica), compilata su impresainungiorno e firmata digitalmente
    required: true
  - name: Estremi del titolo dell'attività (protocollo e data della SCIA, DIA o autorizzazione)
    required: true
    notes: Richiesti dal modulo di cessazione.
  - name: Procura/delega, con documento d'identità di chi la conferisce
    required: false
    notes: Solo se la pratica è firmata e inviata da un intermediario.
  - name: Copia del documento d'identità del titolare
    required: false
    notes: Solo se la comunicazione non è firmata digitalmente e non c'è procura.
  - name: Aggiornamento della registrazione sanitaria – cessazione (riquadro 4 della notifica)
    required: false
    notes: >-
      Per bar, ristoranti e negozi alimentari. Nella scheda di impresainungiorno per la cessazione
      della somministrazione compare già come procedimento collegato.
  - name: Ricevuta della cessazione della partita IVA e prove della data di chiusura (contratto, utenze)
    required: false
    notes: Da allegare al Mod. 8 TARI.
  - name: Firma digitale, PEC dell'impresa e conto Telemaco con credito
    required: true
    notes: Per la Comunicazione Unica di cancellazione.
dichiarante:
  ruolo: [titolare, legale_rappresentante]
