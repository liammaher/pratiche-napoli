steps:
  - do: >-
      Stabilire con il tecnico se l'immobile è tutelato (artt. 136, 142) e se i lavori sono
      nell'Allegato A (nessuna autorizzazione), nell'Allegato B (semplificata) o fuori (ordinaria)
    who: professional
  - do: Preparare la relazione paesaggistica semplificata e gli elaborati
    who: professional
  - do: Pagare l'imposta di bollo e i diritti dovuti
    who: owner
    human_only: true
  - do: >-
      Accedere con SPID, CIE o CNS a Impresa in un giorno (SUE di Napoli), scegliere l'operazione
      dell'autorizzazione paesaggistica semplificata (da sola o con la CILA o la SCIA), compilare,
      allegare i documenti firmati digitalmente e inviare
    who: professional
    human_only: true
    channel: [portal]
  - do: Iniziare i lavori solo dopo il rilascio dell'autorizzazione
    who: owner
