schema_version: 0
id: napoli/comune/autorizzazione-paesaggistica-semplificata
title: Autorizzazione paesaggistica semplificata (D.P.R. 31/2017) – Comune di Napoli, sul SUE
headline: "Autorizzazione paesaggistica semplificata a Napoli per lavori di lieve entità"
aka:
  - paesaggistica semplificata
  - vincolo paesaggistico
  - allegato B DPR 31/2017
updated: 2026-10-29
summary: >-
  Chi fa lavori di lieve entità in un'area o su un immobile sotto tutela paesaggistica (artt. 136
  e 142 del D.Lgs. 42/2004) che alterano i luoghi o l'aspetto esteriore degli edifici, e che sono
  nell'Allegato B del D.P.R. 31/2017, chiede l'autorizzazione paesaggistica semplificata. A Napoli
  la rilascia il Comune e si chiede sul portale "Impresa in un giorno", da sola o nella stessa
  pratica del titolo edilizio (con la CILA o con la SCIA). I lavori dell'Allegato A non la
  richiedono; gli altri chiedono l'autorizzazione ordinaria.
ente:
  name: Comune di Napoli
  office: Sportello Unico Edilizia (istanze sul SUE)
  ipa: c_f839
applies_to:
  events: [renovate]
  audience: [business, resident]
  sectors: [edilizia privata, paesaggio]
  conditions:
    - text: >-
        Chi possiede o detiene immobili e aree di interesse paesaggistico tutelati per legge (art.
        142) o in base alla legge (art. 136 e seguenti) presenta il progetto degli interventi e non
        avvia i lavori finché non ha ottenuto l'autorizzazione (art. 146 c. 1-2 D.Lgs. 42/2004).
      status: verified
      source: dlgs42-art146
    - text: >-
        Non sono soggetti ad autorizzazione paesaggistica gli interventi dell'Allegato A del D.P.R.
        31/2017 e quelli dell'art. 4 (art. 2 D.P.R. 31/2017).
      status: verified
      source: dpr31-art2
    - text: >-
        Non richiedono l'autorizzazione la manutenzione ordinaria, straordinaria, il consolidamento
        statico e il restauro conservativo che non alterano lo stato dei luoghi e l'aspetto
        esteriore degli edifici (art. 149 c. 1 a D.Lgs. 42/2004).
      status: verified
      source: dlgs42-art149
    - text: >-
        Sono soggetti al procedimento autorizzatorio semplificato gli interventi e le opere di lieve
        entità elencati nell'Allegato B (art. 3 D.P.R. 31/2017).
      status: verified
      source: dpr31-art3
    - text: >-
        Sul SUE di Napoli l'operazione "Autorizzazione paesaggistica semplificata (DPR 31/2017 -
        Comune)" è un adempimento degli uffici del Comune di Napoli, e si può scegliere insieme alla
        CILA o alla SCIA nella stessa pratica.
      status: verified
      source: portale-sue-operazioni
    - text: >-
        Con la SCIA l'autorizzazione semplificata si chiede contestualmente (SCIA condizionata,
        quadro 17.3.1 del modulo, con la relazione paesaggistica semplificata): i lavori iniziano dopo
        il suo rilascio.
      status: verified
      source: scia-modulo
    - text: >-
        Fuori dei casi dell'art. 167 c. 4 e 5, l'autorizzazione non può essere rilasciata in
        sanatoria dopo la realizzazione, anche parziale, degli interventi (art. 146 c. 4); per i
        lavori già fatti c'è l'accertamento di compatibilità paesaggistica, un'altra pratica.
      status: verified
      source: dlgs42-art146
legal_basis:
  - text: "D.P.R. 13 febbraio 2017, n. 31, artt. 2-3 e Allegati A e B; D.Lgs. 42/2004, artt. 136, 142, 146, 149."
    status: verified
    source: dpr31-art3
