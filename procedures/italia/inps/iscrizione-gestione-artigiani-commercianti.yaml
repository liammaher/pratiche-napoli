verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: letta per intero la circolare INPS n. 14/2026 (PDF); lette le schede INPS Iscrizione
    Gestione Commercianti, Iscrizione Gestione Artigiani, Aliquote e contributi artigiani e
    commercianti, F24 per artigiani e commercianti, Cassetto previdenziale artigiani e commercianti,
    Riduzione contributiva (over 65), le notizie INPS sui contributi 2026, sull'app INPS Mobile e
    sulla riduzione per i nuovi iscritti 2025, il punto della circolare n. 35/2016 sul regime
    agevolato, e su Normattiva gli artt. 240-243 e 377 del D.Lgs. 117/2026 e lo stato dei commi
    77-84 della L. 190/2014.
  notes: >-
    Nessun modulo da mappare: l'iscrizione passa dai quadri AC/AA della Comunicazione Unica (vedi
    procedura della Camera di Commercio) e l'adesione al regime agevolato è un'istanza online del
    Cassetto.
