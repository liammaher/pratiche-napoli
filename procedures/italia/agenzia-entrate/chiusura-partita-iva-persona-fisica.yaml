verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: letti il modello AA9/12 e le istruzioni 2024 (PDF scaricati, sha256 uguali a quelli della
    scheda di apertura), le pagine AdE "Che cos'è", "Come variare o chiudere la Partita Iva", "La
    chiusura d'ufficio della partita Iva", "Modello e istruzioni", "Software di compilazione",
    "Normativa e prassi" e l'elenco PEC delle Direzioni Provinciali; i provvedimenti del 3/12/2019 e
    del 12/10/2026 sulle partite IVA inattive, le Risoluzioni 232/E del 2009 e 93/E del 2011 e la
    Risposta a interpello 118 del 2025 (PDF scaricati); su Normattiva gli artt. 2 e 35 del D.P.R.
    633/1972, l'art. 68 del Testo unico IVA, gli artt. 5 e 11 del D.Lgs. 471/1997, l'art. 7-quater
    del D.L. 193/2016, l'art. 8 del D.P.R. 322/1998, l'art. 1, comma 59, della L. 190/2014 e l'art.
    9 del D.L. 7/2007.
  notes: >-
    Non verificati: se per la cessazione vadano ripetuti tutti i dati dei quadri B e C (le istruzioni
    lo impongono solo per la variazione), l'assenza di costi, i termini e il contenuto della
    dichiarazione dei redditi dell'anno di cessazione, la chiusura delle posizioni INPS e la pratica
    ComUnica (fuori da questa scheda).
