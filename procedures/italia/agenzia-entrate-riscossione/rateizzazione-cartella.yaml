      - label: Luogo e data
        map: { ask: "Luogo e data della firma" }
      - label: Firma
        map: { blank_with_reason: "Firma del richiedente, a mano o digitale: la appone solo la persona." }
      - label: Delega alla presentazione – Io sottoscritto/a
        map: { concat: [identity.last_name, identity.first_name] }
        notes: Da compilare solo se la richiesta viene consegnata o inviata da un'altra persona.
      - label: Delega – in proprio
        map: { ask: "Il delegante agisce in proprio? (barrare questa casella oppure quella successiva)" }
      - label: Delega – in qualità di
        map: { fallback: [business.qualita_dichiarante, ruolo.tipo] }
        notes: Solo se c'è una delega e il delegante agisce per una ditta, società o ente (riga precedente); per un tutelato, a mano; altrimenti vuoto.
      - label: Delega – del/della
        map: { direct: business.denominazione }
        notes: Solo se c'è una delega e il delegante agisce per una ditta, società o ente; per un tutelato, a mano; altrimenti vuoto.
      - label: Delega – delego il/la Sig./Sig.ra
        map: { ask: "Nome e cognome della persona delegata" }
      - label: Delega – a consegnare / a modificare / a ritirare comunicazioni e provvedimenti (caselle)
        map: { ask: "Per quali attività si delega (consegna già barrata; modifica; ritiro di comunicazioni e provvedimenti)?" }
      - label: Delega – Luogo e data
        map: { ask: "Luogo e data della firma della delega" }
      - label: Delega – Firma del delegante
        map: { blank_with_reason: "Firma del delegante: la appone solo la persona." }
      - label: Spazio riservato al personale
        map: { blank_with_reason: "Lo compila l'operatore ADER allo sportello." }
steps:
  - do: >-
      Verificare che la comunicazione sia autentica: entrare nell'area riservata ADER (Situazione
      debitoria – consulta e paga) e controllare che la cartella risulti lì, senza usare link o
      allegati arrivati per e-mail
    who: owner
  - do: >-
      Controllare l'importo residuo, l'ente creditore e se ci sono altri debiti o piani in corso nella
      Situazione debitoria; se l'importo sembra sbagliato, chiedere chiarimenti all'ente creditore (la
      rateizzazione non corregge gli errori)
    who: anyone
  - do: >-
      Controllare che l'ente creditore abbia autorizzato ADER a rateizzare e che il tributo non sia
      nell'elenco dei non rateizzabili
    who: anyone
  - do: >-
      Scegliere il canale: "Rateizza adesso" nell'area riservata o nell'app (fino a 120.000 euro e 84
      rate, nessun documento), oppure modello RS via PEC o allo sportello; RDF/RDG per oltre 84 rate o
      oltre 120.000 euro
    who: anyone
  - do: >-
      Online: accedere con la propria identità digitale e completare "Rateizza adesso"
    who: owner
    human_only: true
  - do: In alternativa, compilare il modello RS con i dati della tabella dei campi
    who: anyone
  - { do: Firmare il modello RS (ed eventualmente la delega), who: owner, human_only: true }
  - do: >-
      Inviare il modello firmato con copia del documento d'identità alla PEC rateazioni.na (cartelle
      emesse per la provincia di Napoli), oppure consegnarlo allo sportello su appuntamento
    who: owner
    human_only: true
  - do: >-
      Se arriva un preavviso di rigetto, rispondere entro 10 giorni sanando quanto richiesto
    who: owner
    human_only: true
  - do: >-
      Ricevuto il provvedimento di accoglimento, pagare la prima rata entro la scadenza del piano e le
      successive ogni mese (o attivare l'addebito SDD)
    who: owner
    human_only: true
after:
  - Conservare il provvedimento di accoglimento, il piano di ammortamento e le ricevute di ogni rata.
  - >-
    Annotare il numero e la data del provvedimento: servono per richiedere online i moduli di
    pagamento delle rate successive.
  - >-
    Con il pagamento della prima rata ADER sospende un eventuale fermo amministrativo, se tutti i
    debiti del fermo sono nel piano (il veicolo si può usare ma non vendere né rottamare), ed
    estingue i pignoramenti in corso se non si è ancora alla fase di vendita o assegnazione.
  - >-
    Con l'accoglimento si può ottenere il DURC regolare, se non ci sono altri debiti previdenziali
    scaduti e non rateizzati.
  - >-
    Se la situazione economica peggiora, si può chiedere una sola volta la proroga del piano
    (modello RDP), purché non si sia già decaduti.
  - >-
    Non lasciare scadere 8 rate (anche non consecutive): dopo la decadenza quei debiti non sono più
    rateizzabili.
pitfalls:
  - text: >-
      Per sapere quanto si deve davvero, il servizio "Situazione debitoria – consulta e paga"
      nell'area riservata (SPID, CIE, CNS; imprese e professionisti anche credenziali dell'Agenzia
      delle Entrate) elenca i documenti da saldare e saldati dal 2000, con ente creditore, data di
      notifica, residuo, interessi, procedure attive e piani di rateizzazione; si può scaricare un
      prospetto. Gli sportelli territoriali offrono la stessa consultazione su appuntamento.
    status: verified
    source: ader-situazione-debitoria
  - text: >-
      Dalla presentazione della richiesta, e finché si pagano le rate, ADER non iscrive nuovi fermi o
      ipoteche e non avvia nuove procedure esecutive. Fermi e ipoteche già iscritti però restano, le
      procedure esecutive in corso proseguono fino al pagamento della prima rata e restano possibili
      le azioni revocatorie e gli interventi in procedure promosse da altri.
    status: verified
    source: vademecum
  - text: >-
      La richiesta non blocca i pignoramenti di crediti verso la PA già segnalati per inadempienza
      (art. 48-bis DPR 602/1973): la rateizzazione è concessa al netto di quelle somme.
    status: verified
    source: ader-effetti
  - text: >-
      I debiti scaduti non inseriti nella richiesta possono essere oggetto di azioni cautelari ed
      esecutive in qualsiasi momento: inserire tutte le cartelle che si vogliono proteggere.
    status: verified
    source: mod-rs
  - text: >-
      L'ipoteca iscritta prima della richiesta non viene cancellata dalla rateizzazione: dopo aver
      pagato parte del debito si può chiederne la riduzione o restrizione, a proprie spese e a certe
      condizioni.
    status: verified
    source: vademecum
  - text: >-
      Il modello RS va alla casella PEC dell'area territoriale della provincia che ha emesso la
      cartella (rateazioni.na per Napoli); i modelli RDF e RDG vanno invece alla casella regionale
      (CAM.rateazioni per la Campania).
    status: verified
    source: mod-rdf
  - text: >-
      Le regole con massimo 72 rate valgono solo per le richieste presentate fino al 31 dicembre 2024;
      dal 2025 i modelli sono RS, RDF, RDG e RDP (datati 01/01/2025).
    status: verified
    source: vademecum
  - text: >-
      ADER segnala e-mail false a suo nome (per esempio "Avviso Raccomandata", "Notifica cartella di
      pagamento", "Rateizzazione del debito") con link o allegati Excel. ADER precisa che le
      notifiche di cartelle via PEC e l'accoglimento delle rateizzazioni non arrivano con file Excel
      allegati: non cliccare link, non inserire credenziali, eliminare gli allegati.
    status: verified
    source: ader-phishing
  - text: >-
      Per notificare le cartelle via PEC le Direzioni regionali di ADER usano indirizzi PEC specifici,
      pubblicati in un elenco sul sito; quegli indirizzi non servono per inviare istanze.
    status: verified
    source: ader-pec-notifica
  - text: >-
      L'avviso anti-phishing di ADER dice che all'area riservata si accede solo con SPID, CIE o CNS;
      la pagina di accesso e il modello RS ammettono anche le credenziali dell'Agenzia delle Entrate
      (per professionisti e imprese).
    status: disputed
    source: ader-phishing
  - text: >-
      Rottamazione-quinquies degli enti territoriali: domande di adesione aperte fino al 15 dicembre
      2026, solo online, per i debiti degli enti che hanno adottato il provvedimento. Prima di
      scegliere tra rottamazione e rateizzazione si può richiedere il prospetto informativo dei debiti
      rottamabili.
    status: verified
    source: ader-rottamazione-et
  - text: >-
      La Rottamazione-quinquies degli enti territoriali riguarda i carichi affidati ad ADER dal 1°
      gennaio 2000 al 31 dicembre 2023. Nell'elenco degli enti che l'hanno adottata compaiono Regione
      Campania e Comune di Napoli (con "S.A.P.NA. per il Comune di Napoli").
    status: verified
    source: elenco-enti-rottamazione
  - text: >-
      La rottamazione degli enti territoriali vale solo per i carichi affidati ad ADER, non per i
      tributi locali riscossi direttamente dall'ente o da concessionari privati.
    status: verified
    source: comunicato-15102026
  - text: >-
      Se la Rottamazione-quinquies diventa inefficace (rate non pagate), quei carichi non sono più
      rateizzabili con l'art. 19.
    status: verified
    source: ader-quinquies
  - text: >-
      Per la Rottamazione-quinquies dei carichi statali (Legge 199/2025) il sito ADER parla ormai solo
      dei pagamenti delle rate: la finestra per le nuove domande sembra chiusa.
    status: unverified
  - text: >-
      Rateizzare non serve a contestare il debito: per un pagamento già fatto, uno sgravio, la
      prescrizione o una sentenza favorevole si può chiedere la sospensione entro 60 giorni dalla
      notifica (modello SL1 o area riservata).
    status: verified
    source: ader-cartella
