verification:
  level: L1
  date: 2026-10-25
  by: claude
  method: >-
    Desk: lette le pagine ADER sulla rateizzazione (regole dal 2025, semplice richiesta, documentate,
    simulatore, proroga, effetti, decadenza, enti autorizzati e non, con l'elenco xlsx al 16/09/2026),
    il modello RS (mappato), le parti rilevanti dei modelli RDF e RDG, la guida ADER di gennaio 2025,
    la pagina sulla cartella, la guida alla Situazione debitoria (aprile 2026), le pagine su
    prenotazione sportelli, contact center, notifiche PEC e phishing (27/03/2026), l'avviso sullo
    sportello di Napoli - Vomero e le pagine e i documenti sulla Rottamazione-quinquies. L'art. 19
    DPR 602/1973 su Normattiva è stato letto tramite un estratto.
