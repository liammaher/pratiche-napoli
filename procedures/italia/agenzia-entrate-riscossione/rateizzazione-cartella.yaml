schema_version: 0
id: italia/agenzia-entrate-riscossione/rateizzazione-cartella
title: Rateizzazione di cartelle e avvisi di Agenzia delle entrate-Riscossione
headline: "Come rateizzare una cartella esattoriale con l'Agenzia delle entrate-Riscossione"
aka:
  - rateizzazione Equitalia
  - dilazione cartelle
  - Rateizza adesso
  - piano di rateizzazione
  - rate ADER
updated: 2026-10-26
summary: >-
  Chi ha ricevuto una cartella di pagamento (o un avviso di accertamento esecutivo o un avviso di
  addebito INPS) affidato ad Agenzia delle entrate-Riscossione e non riesce a pagare tutto subito
  può chiedere di pagare a rate. Fino a 120.000 euro per richiesta basta dichiarare una temporanea
  difficoltà economica e si ottengono fino a 84 rate mensili (richieste del 2025 e del 2026), anche
  online con "Rateizza adesso". Vale per persone fisiche, ditte individuali e società.
ente:
  name: Agenzia delle entrate-Riscossione
  office: Per la provincia di Napoli, area territoriale di Napoli (richieste su modello RS)
applies_to:
  events: [letter]
  audience: [business, resident]
  conditions:
    - text: >-
        Si possono rateizzare le somme iscritte a ruolo indicate in cartelle di pagamento, avvisi di
        accertamento esecutivi dell'Agenzia delle Entrate o delle Dogane e Monopoli e avvisi di
        addebito dell'INPS.
      status: verified
      source: mod-rs
    - text: >-
        "A semplice richiesta" (senza documenti): somme iscritte a ruolo di importo inferiore o pari a
        120.000 euro comprese in ciascuna richiesta, fino a un massimo di 84 rate mensili per le
        richieste presentate negli anni 2025 e 2026 (96 nel 2027 e 2028, 108 dal 1° gennaio 2029).
        Basta dichiarare di versare in una temporanea situazione di obiettiva difficoltà
        economico-finanziaria.
      status: verified
      source: ader-rateizzazione
    - text: >-
        La soglia di 120.000 euro è calcolata sulla somma degli importi residui delle sole
        cartelle/avvisi inseriti nella richiesta.
      status: verified
      source: mod-rs
    - text: >-
        Richiesta "documentata" (modelli RDF o RDG, con ISEE o indici di bilancio): obbligatoria oltre
        120.000 euro (fino a 120 rate), oppure fino a 120.000 euro se si vogliono da 85 a 120 rate
        (richieste del 2025 e 2026). Se l'esame dei documenti non giustifica più di 84 rate, ADER
        concede comunque fino a 84 rate.
      status: verified
      source: vademecum
    - text: >-
        In ogni caso ciascuna rata non può essere inferiore a 50 euro.
      status: verified
      source: ader-rateizzazione
    - text: >-
        Non sono rateizzabili da ADER: i debiti di enti che non l'hanno autorizzata (bisogna rivolgersi
        all'ente), i tributi e tipi di imposta nell'elenco dei "non rateizzabili", i debiti di una
        rateizzazione decaduta chiesta dal 16 luglio 2022 in poi, e certi debiti di Rottamazione-ter o
        "saldo e stralcio" diventati inefficaci.
      status: verified
      source: vademecum
    - text: >-
        Nell'elenco degli enti che hanno autorizzato ADER a rateizzare (aggiornato al 16 settembre 2026)
        compaiono "Comune di Napoli" e "S.A.P.NA. per il Comune di Napoli". Controllare comunque l'ente
        indicato sulla cartella negli elenchi aggiornati.
      status: verified
      source: enti-autorizzati-xlsx
    - text: >-
        Non può chiedere la rateizzazione chi ha depositato un accordo di ristrutturazione, una
        transazione fiscale, una domanda di concordato preventivo o una proposta per la crisi da
        sovraindebitamento (D.Lgs. 14/2019): il modello RS fa dichiarare il contrario.
      status: verified
      source: mod-rs
legal_basis:
  - text: >-
      Art. 19 del DPR 602/1973, come modificato dall'art. 13 del D.Lgs. 110/2024, per le richieste
      presentate dal 1° gennaio 2025. Alle richieste fino al 31 dicembre 2024 si applica il testo
      precedente (massimo 72 rate a semplice richiesta).
    status: verified
    source: ader-rateizzazione
  - text: >-
      Decreto del Vice Ministro dell'economia e delle finanze del 27 dicembre 2024: parametri (ISEE,
      Indice di liquidità, Indice Alfa, Indice Beta) per le richieste documentate e le proroghe.
    status: verified
    source: ader-rateizzazione
  - text: >-
      Su Normattiva il testo dell'art. 19 consultato risulta vigente fino al 31 dicembre 2026: dal 2027
      la norma potrebbe cambiare. Ricontrollare prima di usare questa scheda nel 2027.
    status: unverified
deadline:
  summary:
    text: >-
      Non c'è un termine per chiedere le rate, ma se non si paga e non le si chiede in tempo ADER
      avvia il recupero: la cartella indica 60 giorni dalla notifica. A un preavviso di rigetto si
      risponde entro 10 giorni; la prima rata scade almeno 8 giorni lavorativi dopo l'accoglimento e
      non pagando 8 rate (o meno, se tra queste c'è l'ultima) si decade e il residuo è dovuto tutto
      insieme.
    status: unverified
    source: ader-cartella
  rules:
    - text: >-
        Le fonti consultate non fissano un termine per chiedere la rateizzazione. La cartella va però
        pagata nei termini che decorrono dalla notifica: se non si paga e non si chiede in tempo la
        rateizzazione o la sospensione, ADER avvia le procedure cautelari o esecutive.
      status: verified
      source: ader-cartella
    - text: >-
        Il termine di pagamento indicato sulle cartelle è di 60 giorni dalla notifica (la pagina ADER
        lo cita a proposito di aggio e sospensione; il termine generale non è stato letto nella norma).
      status: unverified
    - text: >-
        Decadenza: per le rateizzazioni chieste dal 16 luglio 2022 si decade se non si pagano 8 rate,
        anche non consecutive. Se tra le rate non pagate c'è l'ultima, si decade anche con meno rate
        non pagate.
      status: verified
      source: vademecum
    - text: >-
        Dopo la decadenza il residuo è dovuto tutto in una volta, il recupero riprende subito e, per le
        richieste presentate dal 16 luglio 2022, quegli stessi debiti non sono più rateizzabili. La
        decadenza non impedisce di rateizzare debiti diversi.
      status: verified
      source: ader-decadenza
    - text: >-
        Se ADER invia un preavviso di rigetto, il contribuente ha 10 giorni per rispondere e sanare.
      status: verified
      source: vademecum
    - text: >-
        La prima rata scade non prima di 8 giorni lavorativi dall'emissione del provvedimento di
        accoglimento.
      status: verified
      source: vademecum
  lateness:
    text: >-
      Pagando una rata dopo la scadenza si devono anche gli interessi di mora per i giorni di ritardo
      (e, per i carichi affidati fino al 31 dicembre 2021, l'eventuale aggio). Non stimare gli importi:
      chiedere il calcolo ad ADER (060101, sportello o area riservata).
    status: verified
    source: vademecum
duration:
  text: >-
    Con "Rateizza adesso" (area riservata o app Equiclick) o allo sportello, se ci sono i
    requisiti, il piano di rateizzazione si ottiene subito. Con il modello inviato via PEC
    ADER avvia il procedimento e poi manda il provvedimento con il piano e i moduli delle
    prime 12 rate; la guida ADER non dice entro quanti giorni. La prima rata scade non prima
    di 8 giorni lavorativi dall'accoglimento.
  status: verified
  source: vademecum
appointment:
  text: >-
    Non serve per chiedere le rate online ("Rateizza adesso") o via PEC. Per andare allo
    sportello ADER si prenota un appuntamento online con "Trova lo sportello e prenota"
    oppure tramite operatore al numero 06 01 01.
  status: verified
  source: ader-prenota
channels:
  - type: portal
    purpose: procedure
    name: Area riservata ADER – servizio "Rateizza adesso" (sezione "Rateizza il debito")
    url: https://servizi.agenziaentrateriscossione.gov.it/equitaliaServiziWeb/home/login.do
    auth: [spid, cie, cns]
    receipt: legal
    preferred: true
    source: vademecum
    notes: >-
      Solo per la semplice richiesta (fino a 120.000 euro e 84 rate), senza allegare documenti; se
      ci sono i requisiti il piano si ottiene subito. Imprese e professionisti possono entrare anche
      con le credenziali dell'Agenzia delle Entrate. Lo possono usare anche una persona di fiducia o
      un intermediario fiscale delegati.
  - type: app
    purpose: procedure
    name: App Equiclick
    auth: [spid, cie, cns]
    source: vademecum
    notes: Offre lo stesso servizio "Rateizza adesso".
  - type: pec
    purpose: procedure
    name: Casella rateazioni dell'area territoriale di Napoli (solo modello RS)
    address: rateazioni.na@pec.agenziariscossione.gov.it
    receipt: legal
    source: mod-rs
    notes: >-
      Va usata la casella della provincia che ha emesso la cartella/avviso, non quella di residenza.
      Allegare copia del documento d'identità.
  - type: pec
    purpose: procedure
    name: Casella rateazioni della Campania (modelli RDF e RDG, richieste documentate)
    address: CAM.rateazioni@pec.agenziariscossione.gov.it
    receipt: legal
    source: mod-rdf
  - type: desk
    purpose: procedure
    name: Sportelli territoriali ADER (su appuntamento)
    url: https://www.agenziaentrateriscossione.gov.it/it/servizi/prenota-un-appuntamento/prenota-un-appuntamento-allo-sportello-territoriale/?idServizio=S3
    booking: >-
      Online con "Trova lo sportello e prenota" (giornata in corso e 9 lavorative successive) o tramite
      operatore al 060101.
    source: ader-prenota
    notes: >-
      Giorni e orari vanno controllati sulla pagina del singolo sportello; per l'elenco degli sportelli
      di Napoli usare il servizio di ricerca.
  - type: desk
    purpose: procedure
    name: Sportello ADER di Napoli – Vomero
    address: Via San Gennaro al Vomero 12, Napoli
    source: ader-vomero
    notes: >-
      Indirizzo citato in un avviso ADER del 21/10/2026 (sportello chiuso dal 22 al 26 ottobre 2026);
      orari non indicati. Solo su appuntamento. Altri sportelli napoletani non sono stati verificati.
  - type: desk
    purpose: info
    name: Sportello online (videochiamata)
    url: https://www.agenziaentrateriscossione.gov.it/it/servizi/prenota-un-appuntamento/
    auth: [spid, cie]
    source: ader-prenota
  - type: phone
    purpose: info
    name: Contact center ADER (informazioni e prenotazioni)
    address: 06 01 01
    hours: operatore lunedì–venerdì 8:00–18:00; risponditore automatico negli altri orari
    source: ader-contatti
payment:
  method: pagopa
  rateazione: >-
    Fino a 84 rate mensili a semplice richiesta (richieste 2025–2026), fino a 120 con richiesta
    documentata; rata minima 50 euro; rate costanti o crescenti anno per anno.
  calculator_url: https://servizi.agenziaentrateriscossione.gov.it/bollettini/simulazione-rate/home
  notes:
    - text: >-
        Con il provvedimento di accoglimento arrivano il piano di ammortamento e i moduli pagoPA delle
        prime 12 rate; i successivi vengono spediti al domicilio indicato o si richiedono con il servizio
        "Rateizzazione – Richiedi i moduli di pagamento" o dall'area riservata.
      status: verified
      source: vademecum
    - text: >-
        Le rate si pagano con i moduli pagoPA (area riservata, app, banche, Poste, tabaccai e altri PSP),
        con addebito diretto SDD attivato nell'area riservata o allo sportello (addebito dalla rata che
        scade dopo 30 giorni dal mandato), oppure agli sportelli ADER.
      status: verified
      source: vademecum
    - text: >-
        La rata comprende il residuo del carico, gli interessi di mora maturati alla data della
        richiesta, l'aggio (solo carichi affidati fino al 31/12/2021) e gli interessi di rateizzazione;
        diritti di notifica e spese per azioni cautelari o esecutive già fatte vanno tutti sulla prima
        rata.
      status: verified
      source: vademecum
    - text: >-
        Interessi di rateizzazione indicati da ADER: 4,5% annuo per i debiti erariali (art. 21 DPR
        602/1973), 4,65% annuo per quelli previdenziali e assistenziali; per gli altri il tasso dell'art.
        21 salvo diversa determinazione dell'ente creditore (elenco degli enti con i loro tassi). Non
        calcolare da sé gli interessi: li riporta il piano di ammortamento.
      status: verified
      source: ader-enti-autorizzati
    - text: >-
        Il simulatore indicato serve solo per le richieste documentate (oltre 84 rate o oltre 120.000
        euro): con ISEE o indici di bilancio stima il numero massimo di rate e l'importo indicativo
        della rata.
      status: verified
      source: ader-simulatore
documents:
  - name: Modello RS compilato e firmato (solo se non si usa "Rateizza adesso")
    required: false
  - name: Copia del documento d'identità del richiedente
    required: false
    notes: >-
      Obbligatoria se il modello RS si invia via PEC; non serve se si firma allo sportello. Senza
      documento l'istanza non viene lavorata.
  - name: Copia dei documenti d'identità di delegante e delegato
    required: false
    notes: Solo se la richiesta è presentata da un'altra persona (riquadro "Delega alla presentazione").
  - name: Certificazione ISEE del nucleo familiare (modello RDF) o prospetti e bilancio (modello RDG)
    required: false
    notes: Solo per la richiesta documentata (oltre 84 rate o oltre 120.000 euro).
dichiarante:
  ruolo: [titolare, legale_rappresentante]
forms:
  - id: mod-rs
    name: Mod. RS – Richiesta di rateizzazione per importi fino a 120.000 euro (fino a 84 rate) – Tutti i soggetti
    url: https://www.agenziaentrateriscossione.gov.it/export/.files/it/modulistica/RS.pdf
    source: mod-rs
    sha256: 28ff54ebe9b9c903620b85306ff182f69f21484cf95e9a31973cc39cccd16db8
    signature_required: true
    fields:
      - label: Il/La sottoscritto/a
        map: { concat: [identity.last_name, identity.first_name] }
      - { label: nato/a il, map: { direct: identity.date_of_birth } }
      - label: a (luogo di nascita)
        map: { fallback: [identity.birth_comune, identity.birth_country] }
      - { label: (Prov) di nascita, map: { direct: identity.birth_province } }
      - { label: codice fiscale, map: { direct: identity.codice_fiscale } }
      - label: in proprio (persone fisiche)
        map: { ask: "La richiesta riguarda debiti propri come persona fisica, quelli di una ditta, società, associazione o ente per cui firma, o quelli di una persona di cui è tutore, curatore o amministratore di sostegno? (in proprio: questa casella; altrimenti quella successiva)" }
        notes: >-
          Va chiesto anche quando l'archivio ha i dati di un'impresa: una cartella personale di chi
          ha un'impresa non è dell'impresa, e nemmeno quella di una persona tutelata. Le righe
          "in qualità di", "del/della" e "codice fiscale (del/della)" si compilano dai dati
          dell'impresa solo per una ditta, società, associazione o ente; per un tutelato, con i suoi
          dati, a mano.
      - label: in qualità di (titolare di ditta individuale / legale rappresentante / tutore / curatore / altro)
        map: { fallback: [business.qualita_dichiarante, ruolo.tipo] }
        notes: >-
          Solo per una ditta, società, associazione o ente (riga precedente); per un tutore,
          curatore o amministratore di sostegno la qualità si scrive a mano; in proprio, vuoto.
      - label: del/della
        map: { direct: business.denominazione }
        notes: Solo per una ditta, società, associazione o ente; per un tutelato il suo nome, a mano; in proprio, vuoto.
      - label: codice fiscale (del/della)
        map: { fallback: [business.codice_fiscale, business.partita_iva] }
        notes: Solo per una ditta, società, associazione o ente; per un tutelato il suo codice fiscale, a mano; in proprio, vuoto.
      - label: Domicilio per la richiesta – Comune
        map: { direct: residenza.comune }
        notes: >-
          È l'indirizzo dove ADER manda comunicazioni e moduli di pagamento: se si preferisce un altro
          domicilio (per esempio la sede dell'impresa), indicare quello in tutte le righe del domicilio.
      - { label: Domicilio – (Prov), map: { direct: residenza.provincia } }
      - label: Domicilio – Indirizzo
        map: { concat: [residenza.indirizzo, residenza.civico] }
      - { label: Domicilio – CAP, map: { direct: residenza.cap } }
      - label: presso (eventuale domiciliatario)
        map: { ask: "Le comunicazioni vanno inviate presso qualcuno (per esempio un commercialista)? Se no, lasciare vuoto" }
      - label: e-mail/PEC
        map: { fallback: [identity.pec, identity.email] }
        notes: >-
          Dove ADER risponde. Per una ditta, società o ente si può indicare la sua PEC
          (business.pec); quella di un'impresa per una cartella personale no.
      - { label: tel, map: { direct: identity.phone } }
      - label: CHIEDE – la dilazione delle somme indicate nei seguenti avvisi/cartelle (casella)
        map: { ask: "Barrare la casella: si chiede la dilazione" }
      - label: n. (sei spazi per i numeri di cartelle/avvisi)
        map: { ask: "Numeri delle cartelle o degli avvisi da rateizzare (dalla cartella o dalla Situazione debitoria)" }
      - label: per un importo complessivo di euro
        map: { ask: "Importo complessivo residuo delle cartelle/avvisi indicati (dalla Situazione debitoria)" }
      - label: secondo un piano di rateizzazione in … rate
        map: { ask: "Numero di rate richieste (massimo 84; ogni rata almeno 50 euro)" }
      - label: rate di importo costante / variabile crescente anno per anno (barrare una sola casella)
        map: { ask: "Rate costanti o crescenti anno per anno?" }
      - label: DICHIARA – di trovarsi in una temporanea situazione di obiettiva difficoltà economico-finanziaria
        map: { blank_with_reason: "Casella già barrata sul modulo." }
      - label: DICHIARA ALTRESÌ – che non è stato depositato un accordo di ristrutturazione, una transazione, un concordato o una proposta per il sovraindebitamento
        map: { blank_with_reason: "Casella già barrata sul modulo; se una di queste procedure è stata depositata, la richiesta non va firmata." }
      - label: di essere … della ditta/società/associazione/ente/soggetto sopra indicato/a (casella e qualità)
        map: { fallback: [business.qualita_dichiarante, ruolo.tipo] }
        notes: >-
          Solo se non è in proprio (righe in alto): per una ditta, società, associazione o ente la
          qualità di chi firma; per un tutore, curatore o amministratore di sostegno, a mano;
